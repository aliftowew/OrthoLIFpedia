um anteroinferior adalah prosedur standar","Capsular shift, kapsulorafi, transfer otot/tendon, transfer tulang untuk kasus refrakter"],ref:I(205),tatalaksana:"stabilisasi"},{id:"nonop",nama:{id:"Rehabilitasi & penguatan",en:"Rehabilitation and strengthening"},gambar:"sling",utama:["Instabilitas atraumatik/volunter atau multidireksional dengan laksitas — konseling dan penguatan","Pasien tua dengan risiko rekurensi rendah"],ref:[I(203),I(208)],tatalaksana:"pascareduksi"}]},"lesi-tulang":{intro:"Fragmen tepi glenoid > 5 mm dan tuberositas mayor yang tetap bergeser > 5 mm ke superior setelah reduksi adalah indikasi operasi.",ref:I(205),opsi:[{id:"op",nama:{id:"Stabilisasi operatif ± fiksasi fragmen",en:"Operative stabilization ± fragment fixation"},gambar:"dislokasi-bahu:bankart-repair",utama:["Fragmen tepi glenoid > 5 mm (bony Bankart)","Transfer tulang untuk kasus refrakter"],ref:I(205),tatalaksana:"stabilisasi"},{id:"nonop",nama:{id:"Reduksi + imobilisasi + rehabilitasi",en:"Reduction + immobilization + rehabilitation"},gambar:"sling",utama:["Hill-Sachs tanpa instabilitas berulang","Fragmen glenoid kecil"],ref:I(205),tatalaksana:"pascareduksi"}]},posterior:{intro:"Reduksi tertutup butuh relaksasi otot penuh, sedasi, dan analgesia — nyerinya melebihi dislokasi anterior dan sering memerlukan anestesi umum. Jangan memaksa rotasi eksternal bila impaksi terkunci di tepi glenoid.",ref:I(208),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup — traksi aduksi + angkat kaput",en:"Closed reduction — adduction traction + lift the head"},gambar:"dislokasi-bahu:reduksi-posterior",utama:["Telentang; traksi lengan aduksi searah deformitas, kaput diangkat lembut ke fossa","Impaksi terkunci: tambah traksi lateral pada lengan atas"],ref:I(208),tatalaksana:"reduksi-posterior"},{id:"op",nama:{id:"Stabilisasi operatif",en:"Operative stabilization"},gambar:"dislokasi-bahu:mclaughlin",utama:["Tuberositas minor bergeser besar; fragmen glenoid posterior besar","Tak tereduksi / impaksi menghalangi reduksi; dislokasi terbuka","Subluksasi/redislokasi dalam sling-and-swathe; instabilitas rekuren"],ref:I(208),tatalaksana:"op-posterior"}]},"reverse-hs":{intro:"Besarnya defek anteromedial kaput (CT) menentukan: 20–40% → transfer tuberositas minor (McLaughlin modifikasi); > 40% → hemiartroplasti dengan versi netral.",ref:I(208),opsi:[{id:"mclaughlin",nama:{id:"McLaughlin modifikasi (transfer tuberositas minor)",en:"Modified McLaughlin (lesser tuberosity transfer)"},gambar:"dislokasi-bahu:mclaughlin",utama:["Keterlibatan kaput 20–40%","Tuberositas minor + subskapularis dipindahkan ke dalam defek"],ref:I(208),tatalaksana:"op-posterior"},{id:"hemi",nama:{id:"Hemiartroplasti (versi netral)",en:"Hemiarthroplasty (neutral version)"},gambar:"dislokasi-bahu:hemiartroplasti",utama:["Keterlibatan kaput > 40%"],ref:I(208),tatalaksana:"op-posterior"},{id:"nonop",nama:{id:"Reduksi + imobilisasi rotasi eksternal",en:"Reduction + external-rotation immobilization"},gambar:"sling",utama:["Defek kecil yang stabil setelah reduksi","Defek anteromedial besar: imobilisasi dalam rotasi eksternal lebih stabil"],ref:I(208),tatalaksana:"reduksi-posterior"}]},inferior:{intro:"Reduksi dengan traksi–kontratraksi searah posisi humerus (superolateral) sambil abduksi diturunkan bertahap; kaput yang 'terjerat' (buttonhole) di kapsul inferior memerlukan reduksi terbuka.",ref:I(210),opsi:[{id:"reduksi",nama:{id:"Traksi superolateral + kontratraksi kain",en:"Superolateral traction + sheet countertraction"},gambar:"dislokasi-bahu:reduksi-inferior",utama:["Traksi aksial searah humerus, abduksi dikurangi bertahap","Sling 3–6 minggu (lebih singkat pada lansia)"],ref:I(210),tatalaksana:"reduksi-jarang"},{id:"terbuka",nama:{id:"Reduksi terbuka",en:"Open reduction"},gambar:"dislokasi-bahu:inferior",utama:["Kaput buttonhole lewat kapsul inferior — lebarkan defek kapsul, perbaiki struktur yang rusak"],ref:I(210),tatalaksana:"reduksi-jarang"}]},superior:{intro:"Reduksi tertutup dengan analgesia dan sedasi: traksi aksial ke inferior dengan kontratraksi, ditambah traksi lateral pada lengan atas; cedera jaringan lunak dan fraktur penyerta sering — yang tak tereduksi perlu reduksi terbuka.",ref:I(211),opsi:[{id:"reduksi",nama:{id:"Traksi inferior + traksi lateral",en:"Inferior traction + lateral traction"},gambar:"dislokasi-bahu:superior",utama:["Analgesia dan sedasi","Cari fraktur akromion/klavikula/korakoid/tuberositas"],ref:[I(210),I(211)],tatalaksana:"reduksi-jarang"}]}},tatalaksana:{"reduksi-anterior":{nama:{id:"Reduksi tertutup dislokasi anterior",en:"Closed reduction of anterior dislocation"},bab:[{judul:"Persiapan",isi:"Evaluasi klinis dan neurovaskular lengkap, foto sebelum reduksi (dislokasi pertama, > 40 tahun, energi tinggi), lalu analgesik, blok intraartikular, dan/atau sedasi.",ref:[I(199),I(203)]},{judul:"Teknik",isi:"**Traksi–kontratraksi** dengan kain di dada. **Hippocrates**: satu operator, kaki di lipatan aksila ke dinding dada, traksi aksial dengan rotasi internal–eksternal lembut. **Stimson**: tengkurap, lengan menggantung dengan traksi manual atau beban 5 lb, reduksi dalam 15–20 menit. **Manipulasi skapula**: posisi Stimson, ujung inferior skapula didorong ke medial-inferior sementara skapula superomedial ditahan. **Milch**: telentang, abduksi dan rotasi eksternal, ibu jari mendorong kaput. **Kocher** (mengungkit kaput pada glenoid anterior) tidak dianjurkan karena risiko fraktur.",ref:[I(203),I(204),I(205)]},{judul:"Tak tereduksi",isi:"Dislokasi anterior akut yang tak tereduksi (jarang) biasanya karena interposisi jaringan lunak dan memerlukan reduksi terbuka.",ref:I(205)}]},pascareduksi:{nama:{id:"Pascareduksi & rehabilitasi",en:"Post-reduction care and rehabilitation"},bab:[{judul:"Imobilisasi",isi:"2–5 minggu. Lebih singkat pada > 40 tahun karena kekakuan tangan–pergelangan–siku–bahu menyulitkan; lebih lama pada pasien muda dengan riwayat rekurensi. Velpeau tidak lebih baik daripada sling sederhana dalam mencegah rekurensi; rotasi internal vs eksternal masih diperdebatkan.",ref:I(205)},{judul:"Terapi",isi:"Setelah imobilisasi: rotasi eksternal, fleksi, abduksi bertahap, dengan gerak aktif penuh tangan, pergelangan, siku sejak awal.",ref:I(205)},{judul:"Rekurensi",isi:"Komplikasi tersering: usia 20 tahun 80–92% (lebih rendah pada non-atlet), 30 tahun 60%, 40 tahun 10–15%; kebanyakan dalam 2 tahun pertama, lebih sering laki-laki. Prognosis ditentukan usia saat dislokasi pertama dan aktivitas — tidak oleh jenis/lama imobilisasi.",ref:[I(205),I(206)]},{judul:"Komplikasi lain",isi:"Lesi tulang (Hill-Sachs, bony Bankart, tuberositas mayor, akromion/korakoid, degeneratif); jaringan lunak (robekan cuff pada lansia, kapsul/subskapularis); vaskular (lansia aterosklerotik, a. aksilaris, saat reduksi); saraf — muskulokutaneus dan aksilaris, neurapraksia hampir selalu pulih; menetap > 3 bulan → evaluasi lanjut dan kemungkinan eksplorasi.",ref:I(206)},{judul:"Instabilitas atraumatik",isi:"Pasien dengan dislokasi volunter ditangani nonoperatif: konseling dan latihan penguatan.",ref:I(208)}]},stabilisasi:{nama:{id:"Stabilisasi operatif anterior",en:"Operative anterior stabilization"},bab:[{judul:"Indikasi",isi:"Dislokasi pertama pada laki-laki muda aktif; interposisi jaringan lunak; fraktur tuberositas mayor yang tetap bergeser > 5 mm ke superior setelah reduksi; fragmen tepi glenoid > 5 mm.",ref:I(205)},{judul:"Prosedur",isi:"Umumnya perbaikan ligamen/labrum anteroinferior secara artroskopik (lesi Bankart). Capsular shift, kapsulorafi, transfer otot/tendon, dan transfer tulang dicadangkan untuk kasus refrakter.",ref:I(205)},{judul:"Pascaoperasi",isi:"Sling/immobilizer hingga 3 minggu (< 30 tahun), 2 minggu (30–40 tahun), 1–2 minggu (> 50 tahun) menurut jenis stabilisasi; dilepas 2–4 kali sehari untuk latihan gerak bahu, pergelangan, tangan; terapi menuju gerak aktif-pasif dan kekuatan.",ref:I(205)}]},"reduksi-posterior":{nama:{id:"Reduksi tertutup dislokasi posterior",en:"Closed reduction of posterior dislocation"},bab:[{judul:"Teknik",isi:"Relaksasi otot penuh, sedasi, analgesia — sering anestesi umum. Telentang: traksi pada lengan aduksi searah deformitas sambil kaput diangkat lembut ke fossa. Jangan paksa rotasi eksternal (fraktur kaput bila impaksi terkunci di tepi glenoid posterior); bila terkunci, tambahkan traksi lateral pada lengan atas.",ref:I(208)},{judul:"Pascareduksi",isi:"Sling-and-swathe bila stabil; bila subluksasi/redislokasi dalam sling-and-swathe, pertimbangkan stabilisasi bedah. Defek anteromedial besar: imobilisasi rotasi eksternal lebih stabil. Selama imobilisasi: isometrik rotasi eksternal dan deltoid; setelahnya program penguatan rotator internal–eksternal yang agresif.",ref:I(208)},{judul:"Komplikasi",isi:"Fraktur tepi glenoid posterior, batang humerus, tuberositas, kaput; rekurensi (atraumatik, defek kaput besar, fragmen glenoid besar); cedera neurovaskular lebih jarang daripada anterior (n. aksilaris di ruang kuadrangular, cabang n. supraskapular ke infraspinatus di takik spinoglenoid); subluksasi anterior akibat penjahitan posterior terlalu ketat.",ref:[I(208),I(209)]}]},"op-posterior":{nama:{id:"Tatalaksana operatif dislokasi posterior",en:"Operative treatment of posterior dislocation"},bab:[{judul:"Indikasi",isi:"Pergeseran besar fraktur tuberositas minor; fragmen glenoid posterior besar; tak tereduksi atau impaksi yang menghalangi reduksi; dislokasi terbuka; impaksi anteromedial (reverse Hill-Sachs) 20–40% → transfer tuberositas minor dengan subskapularis ke defek (McLaughlin modifikasi), > 40% → hemiartroplasti versi netral; instabilitas rekuren.",ref:I(208)},{judul:"Pilihan prosedur",isi:"Reduksi terbuka, plikasi infraspinatus (reverse Putti-Platt), transfer tendon biseps kaput longum ke tepi glenoid posterior (Boyd-Sisk), osteotomi humerus/glenoid, kapsulorafi.",ref:I(208)}]},"reduksi-jarang":{nama:{id:"Reduksi dislokasi inferior & superior",en:"Reduction of inferior and superior dislocations"},bab:[{judul:"Luxatio erecta",isi:"Traksi aksial searah posisi humerus (superolateral) dengan kontratraksi kain melingkari tubuh, abduksi diturunkan bertahap. Sling 3–6 minggu, lebih singkat pada lansia. Kaput yang menerobos kapsul inferior (buttonhole) → reduksi terbuka: defek kapsul dilebarkan dan struktur rusak diperbaiki. Gangguan neurovaskular hampir selalu ada tetapi biasanya pulih setelah reduksi.",ref:I(210)},{judul:"Superior",isi:"Traksi aksial ke inferior dengan kontratraksi, ditambah traksi lateral lengan atas, dengan analgesia dan sedasi. Cedera jaringan lunak (cuff, kapsul, biseps) dan fraktur penyerta sering; yang tak tereduksi memerlukan reduksi terbuka. Komplikasi neurovaskular biasanya cedera traksi yang pulih setelah reduksi.",ref:[I(210),I(211)]}]}}}});var Rs={};Oa(Rs,{default:()=>$t});var _,ka,$t,Bs=ga(()=>{_=a=>({buku:"HoF",bab:"15",hlm:a}),ka=a=>({buku:"AO",bab:"6.2.1",hlm:a}),$t={id:"humerus-proksimal",nama:{id:"Humerus proksimal",en:"Proximal humerus"},sumber:[{buku:"HoF",bab:"15",hlm:{awal:212,akhir:220}},{buku:"AO",bab:"6.2.1",hlm:{awal:587,akhir:605}}],gambar:"humerus-proksimal:utuh",intro:{id:"Fraktur humerus tersering dan fraktur fragilitas khas lansia; empat bagian Neer (kepala, dua tuberositas, batang) ditarik otot ke arah berbeda — itulah yang menentukan pergeseran dan terapi.",en:"The most common humerus fracture and a typical fragility fracture; Neer's four parts are pulled apart by muscle forces that dictate displacement and treatment."},pemeriksaan:{klinis:[{teks:"Lengan dirapatkan ke dada dan ditopang tangan sebelahnya; ekimosis proksimal humerus bisa muncul terlambat, dan ekimosis dinding dada/pinggang harus dibedakan dari cedera toraks.",ref:_(214)},{teks:"Periksa **n. aksilaris**: sensasi kulit lateral lengan atas di atas deltoid; motorik biasanya belum bisa diuji karena nyeri. Translasi inferior fragmen distal akibat atoni deltoid bukan dislokasi sejati dan biasanya pulih dalam **4 minggu** — bila menetap, curigai cedera n. aksilaris.",ref:_(214)},{teks:"Cedera vaskular 5–6% (a. aksilaris tersering) dan pleksus brakialis 6%; sirkulasi kolateral yang kaya dapat menyamarkan cedera arteri.",ref:_(219)}],radiologis:[{teks:"Seri bahu: AP dan lateral (Y) pada bidang skapula plus **aksilar** — pandangan terbaik untuk glenoid dan reduksi sendi; bila nyeri, pakai aksilar Velpeau (pasien tetap dengan sling, condong 45° ke belakang).",ref:_(214)},{teks:"CT untuk keterlibatan sendi, derajat pergeseran, fraktur impresi, dan tepi glenoid; MRI bukan untuk fraktur, kecuali menilai rotator cuff.",ref:_(214)}],mekanisme:[{teks:"Jatuh pada lengan terentang dari posisi berdiri pada perempuan tua (fraktur fragilitas); pada pasien muda energi tinggi dengan cedera jaringan lunak dan dislokasi yang lebih berat.",ref:_(213)},{teks:"Gaya deformasi: supraspinatus & rotator eksternal menarik tuberositas mayor ke superior-posterior; subskapularis menarik tuberositas minor ke medial; pektoralis mayor menarik batang ke medial; deltoid mengabduksi fragmen proksimal.",ref:_(213)},{teks:"Vaskularisasi kepala terutama dari a. arkuata (cabang a. sirkumfleksa humeri anterior) lewat alur bisipital; fraktur kolum anatomikum berprognosis buruk karena suplai yang rentan.",ref:_(213)}],epidemiologi:[{teks:"**4–5%** semua fraktur dan 45% fraktur humerus; 85% tidak bergeser; perempuan : laki-laki 2 : 1 karena osteoporosis.",ref:_(212)}]},klasifikasi:[{nama:"Neer",teks:"Empat bagian: kepala, tuberositas mayor, tuberositas minor, batang. Satu bagian disebut **bergeser** bila > 1 cm atau angulasi > 45°. Satu-bagian (tak bergeser berapa pun garis frakturnya), dua-bagian (kolum anatomikum / kolum chirurgicum / tuberositas mayor / minor), tiga-bagian (kolum chirurgicum + salah satu tuberositas), empat-bagian, fraktur-dislokasi, fraktur permukaan sendi.",ref:_(215)},{nama:"AO/OTA 11",teks:"11A ekstraartikular unifokal (dua-bagian, kolum chirurgicum); 11B ekstraartikular bifokal (tiga-bagian); 11C artikular / empat-bagian (kolum anatomikum). Keparahan dan risiko vaskular kepala naik dari A1 ke C3.",ref:ka(592)},{nama:"LEGO (Hertel)",teks:"Menekankan letak garis fraktur di antara keempat bagian dan kombinasinya; panjang ekstensi metafisis dorsomedial dan keutuhan engsel medial memprediksi vaskularisasi kepala.",ref:[ka(592),ka(605)]}],kelompok:[{id:"satu",nama:{id:"Satu-bagian (tak bergeser)",en:"One-part (undisplaced)"},kode:"Neer 1 · 85% kasus",jenis:[{id:"1-bagian",nama:{id:"Tak bergeser / terimpaksi",en:"Undisplaced / impacted"},kode:"Neer 1 · AO 11A1",gambar:"humerus-proksimal:1-bagian",ringkas:"Berapa pun jumlah garis fraktur, tidak ada bagian yang bergeser > 1 cm atau berangulasi > 45°.",ref:_(215),indikasi:"satu"}]},{id:"dua",nama:{id:"Dua-bagian",en:"Two-part"},kode:"Neer 2 · AO 11A",jenis:[{id:"collum-chirurgicum",nama:{id:"Kolum chirurgicum",en:"Surgical neck"},kode:"Neer 2 · AO 11A",gambar:"humerus-proksimal:collum-chirurgicum",ringkas:"Batang tertarik ke medial oleh pektoralis mayor; korteks medial (kalkar) yang hancur membuat fraktur tidak stabil.",ref:[_(216),ka(601)],indikasi:"collum-chirurgicum"},{id:"tuberositas-mayor",nama:{id:"Tuberositas mayor",en:"Greater tuberosity"},kode:"Neer 2",gambar:"humerus-proksimal:tuberositas-mayor",ringkas:"Fragmen tertarik ke superior-posterior oleh rotator cuff; pergeseran > 5–10 mm (5 mm untuk translasi superior) → nonunion & impingement subakromial.",ref:_(216),indikasi:"tuberositas-mayor"},{id:"tuberositas-minor",nama:{id:"Tuberositas minor",en:"Lesser tuberosity"},kode:"Neer 2",gambar:"humerus-proksimal:tuberositas-minor",ringkas:"Jarang; singkirkan dislokasi posterior yang menyertai. Operasi bila fragmen menghalangi rotasi internal.",ref:_(216),indikasi:"tuberositas-minor"},{id:"collum-anatomicum",nama:{id:"Kolum anatomikum",en:"Anatomical neck"},kode:"Neer 2 · AO 11C",gambar:"humerus-proksimal:collum-anatomicum",ringkas:"Jarang, sulit direduksi tertutup, dan risiko osteonekrosis kepala tinggi karena suplai darah terputus.",ref:_(216),indikasi:"collum-anatomicum"}]},{id:"tiga-empat",nama:{id:"Tiga- & empat-bagian",en:"Three- and four-part"},kode:"Neer 3–4 · AO 11B–C",jenis:[{id:"3-bagian",nama:{id:"Tiga-bagian",en:"Three-part"},kode:"Neer 3 · AO 11B",gambar:"humerus-proksimal:3-bagian",ringkas:"Kolum chirurgicum + satu tuberositas; gaya otot yang berlawanan membuatnya tidak stabil sehingga reduksi tertutup sulit dipertahankan.",ref:_(216),indikasi:"3-bagian"},{id:"4-bagian",nama:{id:"Empat-bagian",en:"Four-part"},kode:"Neer 4 · AO 11C",gambar:"humerus-proksimal:4-bagian",ringkas:"Kepala terlepas dari kedua tuberositas dan batang; osteonekrosis **4–35%**.",ref:_(217),indikasi:"4-bagian"},{id:"valgus-impaksi",nama:{id:"Empat-bagian valgus-terimpaksi",en:"Valgus-impacted four-part"},kode:"Neer 4 (varian)",gambar:"humerus-proksimal:valgus-impaksi",ringkas:"Kepala terdorong ke valgus di antara tuberositas dengan engsel medial sering utuh — osteonekrosis lebih rendah, hasil ORIF sangat baik.",ref:_(217),indikasi:"valgus-impaksi"}]},{id:"dislokasi-artikular",nama:{id:"Fraktur-dislokasi & permukaan sendi",en:"Fracture-dislocation & articular surface"},kode:"Neer · AO 11C",jenis:[{id:"fraktur-dislokasi",nama:{id:"Fraktur-dislokasi",en:"Fracture-dislocation"},kode:"Neer",gambar:"humerus-proksimal:fraktur-dislokasi",ringkas:"Kepala keluar dari glenoid; pleksus brakialis dan a. aksilaris dekat fragmen kepala pada dislokasi anterior; manipulasi berulang memicu miositis osifikans.",ref:_(217),indikasi:"fraktur-dislokasi"},{id:"head-split",nama:{id:"Fraktur permukaan sendi (head-split, Hill-Sachs)",en:"Articular surface (head-split, Hill-Sachs)"},kode:"AO 11C",gambar:"humerus-proksimal:head-split",ringkas:"Paling sering menyertai dislokasi posterior; keterlibatan kepala > 40% mungkin perlu prostesis, ORIF dipertimbangkan dulu pada < 40 tahun.",ref:_(218),indikasi:"head-split"}]}],indikasi:{satu:{intro:"Tak bergeser atau terimpaksi: sling dan gerak dini. Hasil akhir mendekati gerak penuh dalam 1 tahun.",ref:_(216),opsi:[{id:"nonop",nama:{id:"Sling + gerak dini",en:"Sling + early motion"},gambar:"sling",utama:["Satu-bagian / terimpaksi","Pasien > 75 tahun osteoporotik dengan tuntutan rendah meski bergeser (AO)"],ref:[_(215),ka(592)],tatalaksana:"nonop"}]},"collum-chirurgicum":{intro:"Nonoperatif jarang diindikasikan kecuali fraktur berangulasi yang stabil (bergerak sebagai satu unit) pada pasien tuntutan rendah atau yang tidak toleran operasi.",opsi:[{id:"nonop",nama:{id:"Sling (± reduksi tertutup)",en:"Sling (± closed reduction)"},gambar:"sling",utama:["Stabil, bergerak sebagai satu unit","Pasien lemah / kontraindikasi bedah / > 75 tahun tuntutan rendah"],ref:[_(216),ka(592)],tatalaksana:"nonop"},{id:"pin",nama:{id:"Reduksi tertutup + pin/sekrup perkutan",en:"Closed reduction + percutaneous pins/screws"},gambar:"humerus-proksimal:pin-perkutan",utama:["Pasien muda, tulang baik, pola simpel","Bukan untuk head-split, fraktur-dislokasi, atau kalkar medial yang hancur"],ref:[_(216),ka(603)],tatalaksana:"pin"},{id:"plat",nama:{id:"ORIF plat locking",en:"ORIF locking plate"},gambar:"humerus-proksimal:plat-locking",utama:["Pilihan utama fraktur kolum chirurgicum bergeser","Pergeseran bermakna, varus/valgus berlebihan"],ref:[_(216),ka(603)],tatalaksana:"plat"},{id:"nail",nama:{id:"Nail intramedular",en:"Intramedullary nail"},gambar:"humerus-proksimal:nail-humerus",utama:["Dua-bagian kolum chirurgicum bergeser total, termasuk lansia","Cincin proksimal relatif utuh tetapi kepala tidak stabil terhadap batang"],ref:ka(603),tatalaksana:"nail"},{id:"artroplasti",nama:{id:"Prostesis (hemi / reverse)",en:"Arthroplasty (hemi / reverse)"},gambar:"humerus-proksimal:reverse",utama:["Osteopenia ekstrem dengan fiksasi tak mungkin"],ref:_(216),tatalaksana:"artroplasti"}]},"tuberositas-mayor":{intro:"Pergeseran > 5–10 mm (5 mm superior) berarti nonunion dan impingement subakromial bila dibiarkan.",ref:_(216),opsi:[{id:"nonop",nama:{id:"Sling",en:"Sling"},gambar:"sling",utama:["Pergeseran < 5 mm","Tereduksi setelah reduksi dislokasi anterior"],ref:_(216),tatalaksana:"nonop"},{id:"jahit",nama:{id:"Fiksasi jahitan / anchor ± perbaikan rotator cuff",en:"Suture/anchor fixation ± cuff repair"},gambar:"humerus-proksimal:jahitan-anchor",utama:["Fragmen tuberositas terisolasi — jahitan lebih andal daripada sekrup","Tulang baik: sekrup lag masih bisa"],ref:[_(216),ka(600)],tatalaksana:"jahit"}]},"tuberositas-minor":{intro:"Umumnya tertutup; operasi bila fragmen menghalangi rotasi internal.",opsi:[{id:"nonop",nama:{id:"Sling",en:"Sling"},gambar:"sling",utama:["Tanpa hambatan rotasi internal","Singkirkan dislokasi posterior"],ref:_(216),tatalaksana:"nonop"},{id:"jahit",nama:{id:"Fiksasi jahitan / sekrup",en:"Suture / screw fixation"},gambar:"humerus-proksimal:jahitan-anchor",utama:["Fragmen bergeser menghalangi rotasi internal"],ref:_(216),tatalaksana:"jahit"}]},"collum-anatomicum":{intro:"Jarang dan tidak bisa direduksi tertutup; osteonekrosis sering.",opsi:[{id:"plat",nama:{id:"ORIF (pasien muda)",en:"ORIF (younger patients)"},gambar:"humerus-proksimal:plat-locking",utama:["Pasien muda"],ref:_(216),tatalaksana:"plat"},{id:"artroplasti",nama:{id:"Prostesis (lansia)",en:"Arthroplasty (older patients)"},gambar:"humerus-proksimal:hemiartroplasti",utama:["Lansia","Fraktur-dislokasi kolum anatomikum (osteonekrosis tinggi)"],ref:[_(216),_(217)],tatalaksana:"artroplasti"}]},"3-bagian":{intro:"Bergeser → operatif, kecuali pasien sangat lemah; pertahankan suplai darah dengan diseksi minimal.",opsi:[{id:"plat",nama:{id:"ORIF plat locking",en:"ORIF locking plate"},gambar:"humerus-proksimal:plat-locking",utama:["Pasien muda — upaya pertama","Lansia: plat locking memperluas indikasi, tetapi siapkan prostesis"],ref:[_(217),ka(603)],tatalaksana:"plat"},{id:"nail",nama:{id:"Nail intramedular (multilock)",en:"Multilock IM nail"},gambar:"humerus-proksimal:nail-humerus",utama:["Tipe 3-bagian tertentu dengan cincin proksimal relatif utuh"],ref:ka(601),tatalaksana:"nail"},{id:"artroplasti",nama:{id:"Prostesis (hemi / reverse)",en:"Arthroplasty"},gambar:"humerus-proksimal:reverse",utama:["Lansia bila fiksasi tidak memungkinkan","Reverse makin dipilih karena penyembuhan tuberositas pada hemiartroplasti tidak terprediksi"],ref:_(217),tatalaksana:"artroplasti"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Pasien sangat lemah / tidak toleran operasi"],ref:_(217),tatalaksana:"nonop"}]},"4-bagian":{intro:"Osteonekrosis 4–35%; ORIF bila tulang baik, kepala masih di glenoid, dan jaringan lunak kontinu — selebihnya prostesis pada lansia.",ref:_(217),opsi:[{id:"plat",nama:{id:"ORIF plat locking (+ jahitan/wire)",en:"ORIF locking plate (+ sutures/wires)"},gambar:"humerus-proksimal:plat-locking",utama:["Tulang baik, kepala di dalam glenoid, jaringan lunak kontinu","Sebagian besar 4-bagian pada pasien muda (AO)"],ref:[_(217),ka(603)],tatalaksana:"plat"},{id:"artroplasti",nama:{id:"Reverse total shoulder (lansia)",en:"Reverse total shoulder (elderly)"},gambar:"humerus-proksimal:reverse",utama:["Prostesis primer pada lansia","Fraktur-dislokasi berat atau rotator cuff defisien"],ref:[_(217),ka(603)],tatalaksana:"artroplasti"},{id:"hemi",nama:{id:"Hemiartroplasti",en:"Hemiarthroplasty"},gambar:"humerus-proksimal:hemiartroplasti",utama:["Pasien paruh baya dengan fraktur-dislokasi 3–4 bagian berat","Bukan untuk lansia dengan tuberositas kominutif osteoporotik"],ref:ka(603),tatalaksana:"artroplasti"}]},"valgus-impaksi":{intro:"Varian dengan osteonekrosis lebih rendah; hasil ORIF sangat baik.",opsi:[{id:"pin",nama:{id:"Reduksi + pin perkutan",en:"Reduction + percutaneous pins"},gambar:"humerus-proksimal:pin-perkutan",utama:["Pola valgus-terimpaksi dengan tulang baik"],ref:ka(603),tatalaksana:"pin"},{id:"plat",nama:{id:"ORIF plat locking",en:"ORIF locking plate"},gambar:"humerus-proksimal:plat-locking",utama:["Reduksi kepala dari valgus dengan elevator/bone tamp, lalu plat"],ref:[_(217),ka(598)],tatalaksana:"plat"}]},"fraktur-dislokasi":{intro:"Reduksi dini wajib; dengan fraktur kolum, reduksi memerlukan anestesi umum dan relaksasi otot.",opsi:[{id:"reduksi",nama:{id:"Reduksi sendi lalu sling (2-bagian)",en:"Joint reduction then sling (2-part)"},gambar:"sling",utama:["Dua-bagian yang fragmennya tereduksi setelah reduksi sendi"],ref:_(217),tatalaksana:"reduksi-dislokasi"},{id:"plat",nama:{id:"ORIF (pasien muda)",en:"ORIF (younger)"},gambar:"humerus-proksimal:plat-locking",utama:["Tiga/empat-bagian pada pasien muda"],ref:_(217),tatalaksana:"plat"},{id:"artroplasti",nama:{id:"Prostesis (lansia)",en:"Arthroplasty (elderly)"},gambar:"humerus-proksimal:reverse",utama:["Lansia, tergantung lama dislokasi","Fraktur-dislokasi kolum anatomikum"],ref:_(217),tatalaksana:"artroplasti"}]},"head-split":{intro:"Kerusakan permukaan sendi menentukan: < 40% dan usia < 40 tahun → coba ORIF; lebih dari itu → prostesis.",ref:_(218),opsi:[{id:"plat",nama:{id:"ORIF",en:"ORIF"},gambar:"humerus-proksimal:plat-locking",utama:["Usia < 40 tahun, keterlibatan kepala terbatas"],ref:_(218),tatalaksana:"plat"},{id:"artroplasti",nama:{id:"Prostesis",en:"Arthroplasty"},gambar:"humerus-proksimal:reverse",utama:["Keterlibatan kepala > 40%","Head-split pada lansia"],ref:[_(218),ka(603)],tatalaksana:"artroplasti"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif: sling dan rehabilitasi bertahap",en:"Nonoperative: sling and staged rehabilitation"},bab:[{judul:"Imobilisasi & mobilisasi dini",isi:"Sling/swathe untuk kenyamanan; gerak bahu dimulai pada **7–10 hari** (pendulum dan gerak pasif). Foto ulang dini untuk mendeteksi kehilangan reduksi. Gerak aktif pada **6 minggu**, latihan tahanan pada 6–12 minggu; gerak dan fungsi mendekati penuh diharapkan pada 1 tahun.",ref:_(215)},{judul:"Protokol AO",isi:"Protokol yang sama untuk nonoperatif dan operatif, dimulai 10–14 hari: fase 1 (0–6 minggu) pendulum dan gerak pasif, hindari gerak aktif; fase 2 (6–10 minggu) sling 2–3 minggu lagi, bila fragmen bergerak sebagai satu unit tanpa pergeseran pada foto → gerak aktif-asistif, pemakaian fungsional parsial minggu 6–8, gerak aktif dan isometrik minggu 8; fase 3 (> 10 minggu) terapi manual dan penguatan isotonik bila kaku.",ref:ka(604)},{judul:"Reduksi tertutup",isi:"Bila perlu, reduksi tertutup di bawah pencitraan; bila aligment tercapai dan stabil, lengan diimobilisasi dengan sling.",ref:ka(592)},{judul:"Komplikasi",isi:"Kekakuan bahu (cegah dengan fisioterapi terawasi yang agresif); nonunion terutama kolum chirurgicum bergeser dengan interposisi jaringan lunak; malunion → impingement tuberositas mayor pada akromion.",ref:_(220)}]},pin:{nama:{id:"Reduksi tertutup dan fiksasi pin/sekrup perkutan",en:"Closed reduction and percutaneous pin/screw fixation"},bab:[{judul:"Indikasi & batas",isi:"Pasien muda dengan tulang baik dan pola simpel, tuberositas mayor terisolasi, atau pola valgus-terimpaksi. Tidak untuk head-split, fraktur-dislokasi, atau kalkar medial yang terfragmentasi. Pin berulir ujung/sekrup kanulasi dipakai; masalah fiksasi pin multipel: cedera n. aksilaris, pin longgar/migrasi, dan lengan tak bisa digerakkan.",ref:[_(216),ka(603)]},{judul:"Teknik",isi:"Reduksi tertutup di bawah pencitraan; bila reduksi tercapai dan dipertahankan, teknik invasif minimal (pin perkutan, MIPO, atau nail) meminimalkan gangguan suplai darah di lokasi fraktur.",ref:ka(593)}]},plat:{nama:{id:"Reduksi terbuka dan plat locking",en:"Open reduction and locking plate"},bab:[{judul:"Posisi & pendekatan",isi:"Telentang atau beach chair (berat lengan membantu reduksi). **Deltopektoral** adalah pendekatan utama: insisi dari prosesus korakoid tepat di anterior deltoid ke tengah-distal deltoid; v. sefalika diretraksi; fasia klavipektoral dibuka. Kelebihan: deltoid terlindung, kapsul inferior terlihat, risiko n. aksilaris rendah; kekurangan: pemasangan plat lateral sulit dan tuberositas posterior kurang terlihat. **Deltoid split** (dari sudut anterolateral akromion, maksimal **5 cm** ke distal) untuk tuberositas mayor, MIPO, atau nail — jahitan penahan 5 cm di bawah akromion melindungi n. aksilaris.",ref:[_(218),ka(594),ka(596)]},{judul:"Reduksi",isi:"Jahitan traksi pada pertemuan tendon–tulang rotator cuff (subskapularis, supraspinatus, infraspinatus) mengendalikan tuberositas tanpa fragmentasi lebih lanjut. Pada dua-bagian kolum chirurgicum, reduksi korteks medial penting terutama tipe varus; pada 3–4 bagian, pulihkan sudut leher–batang dengan *joystick* atau elevator/bone tamp; K-wire sementara dari atas kepala ke batang menahan reduksi tanpa mengganggu plat; tuberositas diikat dengan jahitan (reduksi tidak langsung) untuk melindungi suplai darahnya.",ref:[ka(597),ka(598)]},{judul:"Plat & sekrup kalkar",isi:"Plat locking dipasang lateral dari alur bisipital, **5–8 mm** distal dari puncak tuberositas mayor, sejajar sumbu batang, 2–4 mm posterior alur bisipital; K-wire lewat lubang proksimal pemandu harus bertumpu di puncak kepala. **Sekrup kalkar** (dua sekrup tangensial terhadap lengkung medial kolum chirurgicum) menahan penopang medial dan mencegah kolaps varus — krusial pada varus dengan kominusi medial. Sekrup saja tidak dianjurkan karena cengkeraman di metafisis buruk; jahitan tambahan ke plat wajib untuk stabilitas, terutama tulang osteoporotik. Bila reduksi anatomis tak mungkin pada tulang osteoporotik, impaksikan korteks medial batang ke dalam kepala.",ref:[ka(600),ka(601),ka(605)]},{judul:"MIPO",isi:"Menghindari diseksi berlebihan dan menurunkan nonunion/infeksi: reduksi tertutup di bawah pencitraan, jendela proksimal deltoid-split dan distal pada insersi deltoid, plat diselipkan dekat tulang di bawah n. aksilaris. Terbatas untuk fraktur kompleks; bila reduksi tertutup gagal, beralih ke reduksi terbuka.",ref:ka(602)},{judul:"Pascaoperasi",isi:"Konstruk harus cukup stabil untuk gerak pasif segera; protokol rehabilitasi dimulai 10–14 hari (lihat protokol AO pada opsi nonoperatif).",ref:ka(604)},{judul:"Komplikasi",isi:"**Penetrasi sekrup** ke sendi adalah komplikasi tersering (kesalahan teknik atau kolaps varus — sekrup sudut tetap tidak bisa mundur; pantau dengan pencitraan di semua posisi). Kehilangan reduksi terutama pada osteoporosis dengan kominusi medial. Osteonekrosis keseluruhan mendekati **35%** (lebih tinggi dengan plat karena diseksi), tetapi sering asimtomatik: 77% tetap baik–sangat baik. Osteonekrosis HoF: 3–14% pada tiga-bagian, 4–34% empat-bagian. Malunion dengan hilangnya penopang medial → varus. Cedera n. aksilaris saat reduksi atau pendekatan deltoid split.",ref:[_(220),ka(604),ka(605)]}]},nail:{nama:{id:"Nail intramedular proksimal humerus",en:"Proximal humeral intramedullary nail"},bab:[{judul:"Kapan",isi:"Dua-bagian kolum chirurgicum (termasuk lansia dengan pergeseran total) dan tipe 3–4 bagian tertentu dengan struktur cincin proksimal relatif utuh. Tidak untuk 3–4 bagian bergeser dan head-split.",ref:[ka(601),ka(603)]},{judul:"Teknik",isi:"Sejajarkan batang dengan kepala di bawah pencitraan **sebelum** memasukkan nail; nail lurus dimasukkan lewat kawat pemandu dengan titik masuk pada kepala humerus (bukan tapak rotator cuff) — hindari insisi tusuk. Nail multilock memungkinkan fiksasi tuberositas dan jahitan rotator cuff; tahanan terhadap bending dan rotasi lebih baik daripada plat, tetapi dapat menimbulkan fraktur tuberositas mayor iatrogenik dan cedera rotator cuff dengan gejala menetap.",ref:ka(601)},{judul:"Pascaoperasi",isi:"Protokol rehabilitasi bahu yang sama (mulai 10–14 hari).",ref:ka(604)}]},jahit:{nama:{id:"Fiksasi jahitan/anchor untuk tuberositas",en:"Suture/anchor fixation of the tuberosity"},bab:[{judul:"Prinsip",isi:"Pada fraktur tuberositas terisolasi, jahitan lebih andal daripada sekrup; dengan anchor, teknik *double-pulley* memberi reduksi dan kekuatan fiksasi lebih baik. Sekrup lag hanya pada tulang baik. ORIF ± perbaikan rotator cuff diindikasikan bila tuberositas mayor bergeser > 5–10 mm.",ref:[_(216),ka(600)]},{judul:"Pendekatan",isi:"Deltoid split memberi visualisasi kedua tuberositas; lindungi n. aksilaris (jahitan penahan 5 cm di bawah akromion).",ref:ka(596)}]},artroplasti:{nama:{id:"Prostesis: hemiartroplasti atau reverse total shoulder",en:"Arthroplasty: hemi or reverse total shoulder"},bab:[{judul:"Memilih",isi:"Hemiartroplasti: pasien paruh baya dengan fraktur-dislokasi 3–4 bagian berat; hindari pada lansia dengan tuberositas kominutif osteoporotik, pola yang masih bisa difiksasi, atau patologi rotator cuff. **Reverse**: lansia dengan fraktur-dislokasi berat atau rotator cuff defisien; hindari pada pasien muda dengan pola yang bisa diselamatkan. Studi banding menunjukkan reverse lebih terprediksi dan fungsinya lebih tinggi daripada hemiartroplasti, meski daya tahan implan masih dipertanyakan.",ref:[ka(593),ka(603)]},{judul:"Mengapa hemiartroplasti ditinggalkan pada lansia",isi:"Pereda nyeri terprediksi tetapi fungsi tidak, karena penyatuan tuberositas sulit; reverse memberi hasil setara ORIF yang berhasil dan lebih baik daripada hemiartroplasti untuk fraktur, dengan komplikasi khasnya sendiri. Prostesis dikerjakan dalam posisi beach chair.",ref:[_(217),_(218)]},{judul:"Pascaoperasi",isi:"Rehabilitasi sama dengan fiksasi: mulai 10–14 hari, pendulum dan gerak pasif 6 minggu pertama.",ref:ka(604)}]},"reduksi-dislokasi":{nama:{id:"Reduksi fraktur-dislokasi",en:"Reduction of a fracture-dislocation"},bab:[{judul:"Prinsip",isi:"Reduksi dini wajib; dengan fraktur kolum humerus, reduksi memerlukan anestesi umum dan relaksasi otot. Reduksi terbuka darurat bila cedera saraf berkembang dengan dislokasi yang tak bisa direduksi tertutup. Dua-bagian dapat dirawat tertutup setelah reduksi bila fragmen tidak lagi bergeser; manipulasi berulang menaikkan risiko miositis osifikans; dislokasi berulang jarang setelah fraktur menyatu.",ref:[_(217),ka(605)]},{judul:"Waspada",isi:"Dislokasi intratoraks dapat terjadi pada fraktur-dislokasi kolum chirurgicum — singkirkan pneumotoraks/hemotoraks. Cedera n. aksilaris sangat rentan pada fraktur-dislokasi anterior; yang tidak membaik dalam 2–3 bulan memerlukan EMG dan eksplorasi.",ref:_(219)}]}}}});var Os={};Oa(Os,{default:()=>xt});var Y,Aa,xt,Hs=ga(()=>{Y=a=>({buku:"HoF",bab:"16",hlm:a}),Aa=a=>({buku:"AO",bab:"6.2.2",hlm:a}),xt={id:"humerus-diafisis",nama:{id:"Diafisis humerus",en:"Humeral shaft"},sumber:[{buku:"HoF",bab:"16",hlm:{awal:221,akhir:230}},{buku:"AO",bab:"6.2.2",hlm:{awal:607,akhir:621}}],gambar:"humerus-diafisis:utuh",intro:{id:"Lebih dari 90% sembuh tanpa operasi dengan brace fungsional; yang harus selalu diperiksa adalah n. radialis — sebelum reduksi, saat reduksi, dan saat operasi.",en:"More than 90% heal without surgery in a functional brace; the radial nerve must be examined at presentation, after reduction, and at surgery."},introRef:[Y(224),Aa(620)],pemeriksaan:{klinis:[{teks:"Nyeri, bengkak, deformitas, pemendekan; gerak kasar dengan krepitasi pada manipulasi lembut. Periksa **n. radialis** dengan cermat; pada bengkak hebat, pemeriksaan serial dan pertimbangkan tekanan kompartemen.",ref:Y(223)},{teks:"Bedakan abrasi/laserasi kecil dari fraktur terbuka; ekstensi intraartikular fraktur terbuka diuji dengan injeksi salin intraartikular jauh dari luka.",ref:Y(223)},{teks:"N. radialis teraba 14–15 cm proksimal epikondilus lateral atau 20–21 cm proksimal epikondilus medial.",ref:Y(222)}],radiologis:[{teks:"AP dan lateral humerus termasuk sendi bahu dan siku; untuk dua proyeksi tegak lurus, putar **pasien**, bukan lengannya (lateral transtorakal) — memutar lengan hanya memutar fragmen distal.",ref:Y(223)},{teks:"Foto traksi membantu pada fraktur sangat bergeser/kominutif; CT, bone scan, MRI jarang kecuali curiga fraktur patologis.",ref:Y(223)}],mekanisme:[{teks:"Langsung (tersering): pukulan/kecelakaan → transversal atau kominutif. Tidak langsung: jatuh pada lengan terentang (lansia) → transversal/oblik; lempar atau panco → spiral.",ref:Y(223)},{teks:"Pola menurut gaya: kompresi → proksimal/distal; bending → transversal; torsi → spiral; torsi + bending → oblik dengan fragmen kupu-kupu.",ref:Y(223)},{teks:"Pergeseran menurut letak: di atas insersi pektoralis mayor fragmen proksimal abduksi-rotasi eksternal; antara pektoralis dan tuberositas deltoid fragmen proksimal tertarik medial; distal tuberositas deltoid fragmen proksimal abduksi, distal tertarik medial-proksimal oleh biseps/triseps.",ref:Y(222)}],epidemiologi:[{teks:"**3–5%** semua fraktur; 2–10% terbuka; sepertiga tengah 60%, proksimal 30%, distal 10%; bimodal (laki-laki dekade ke-3, perempuan dekade ke-7/8).",ref:Y(221)}]},klasifikasi:[{nama:"AO/OTA 12",teks:"Tulang 1 segmen 2: 12A simpel (spiral/oblik/transversal), 12B wedge, 12C multifragmentari; keparahan naik dari 12A1 (spiral simpel, kontak luas) ke 12C3.",ref:Aa(609)},{nama:"Deskriptif",teks:"Terbuka/tertutup; sepertiga proksimal/tengah/distal; bergeser/tidak; transversal, oblik, spiral, segmental, kominutif; tulang normal/osteopenik/patologis; ekstensi artikular.",ref:[Y(223),Y(224)]},{nama:"Eponim",teks:"Holstein-Lewis: spiral rendah sepertiga distal yang sering disertai lesi n. radialis saat menembus septum intermuskular.",ref:[Aa(609),Y(230)]}],kelompok:[{id:"simpel",nama:{id:"Simpel",en:"Simple"},kode:"AO/OTA 12A",jenis:[{id:"spiral",nama:{id:"Spiral",en:"Spiral"},kode:"12A1",gambar:"humerus-diafisis:spiral",ringkas:"Gaya torsi (lempar, panco); area kontak luas — cocok untuk brace, atau hanging cast bila memendek.",ref:[Y(223),Y(224)],indikasi:"umum"},{id:"oblik",nama:{id:"Oblik",en:"Oblique"},kode:"12A2",gambar:"humerus-diafisis:oblik",ringkas:"Torsi + bending; oblik pendek berisiko terdistraksi dengan hanging cast → splint koaptasi lebih tepat.",ref:Y(224),indikasi:"umum"},{id:"transversal",nama:{id:"Transversal",en:"Transverse"},kode:"12A3",gambar:"humerus-diafisis:transversal",ringkas:"Gaya bending; indikasi relatif operasi karena risiko distraksi dan nonunion lebih tinggi.",ref:[Y(223),Y(230),Aa(609)],indikasi:"transversal"}]},{id:"wedge-multi",nama:{id:"Wedge & multifragmentari",en:"Wedge and multifragmentary"},kode:"AO/OTA 12B–C",jenis:[{id:"wedge",nama:{id:"Wedge (kupu-kupu)",en:"Wedge (butterfly)"},kode:"12B",gambar:"humerus-diafisis:wedge",ringkas:"Oblik dengan fragmen kupu-kupu; perlekatan jaringan lunak fragmen harus dipertahankan bila dioperasi.",ref:[Y(223),Y(227)],indikasi:"umum"},{id:"multifragmentari",nama:{id:"Multifragmentari",en:"Multifragmentary"},kode:"12C",gambar:"humerus-diafisis:multifragmentari",ringkas:"Kominusi berat; bila dioperasi, plat jembatan tanpa diseksi di zona fraktur — sembuh lewat kalus.",ref:Y(227),indikasi:"umum"},{id:"segmental",nama:{id:"Segmental",en:"Segmental"},kode:"12C2",gambar:"humerus-diafisis:segmental",ringkas:"Dua tingkat fraktur; indikasi operasi — nail bila plat memerlukan diseksi jaringan lunak yang luas.",ref:[Y(226),Y(228)],indikasi:"segmental"}]},{id:"khusus",nama:{id:"Situasi khusus",en:"Special situations"},kode:"",jenis:[{id:"holstein-lewis",nama:{id:"Holstein-Lewis (spiral distal + n. radialis)",en:"Holstein-Lewis (distal spiral + radial nerve)"},kode:"12A1 distal",gambar:"humerus-diafisis:holstein-lewis",ringkas:"Saraf dapat terjepit atau terlaserasi di septum intermuskular; paresis radialis hingga **22%** pada fraktur diafisis, tersering di sepertiga tengah.",ref:Y(230),indikasi:"radialis"},{id:"terbuka",nama:{id:"Fraktur terbuka",en:"Open fracture"},kode:"",gambar:"humerus-diafisis:terbuka",ringkas:"Indikasi absolut operasi; paresis radialis pada luka terbuka perlu eksplorasi karena laserasi sering.",ref:[Y(226),Aa(620)],indikasi:"terbuka"}]}],indikasi:{umum:{intro:"Lebih dari 90% sembuh nonoperatif. Angulasi anterior 10°, varus 25°/valgus 10°, dan aposisi bayonet hingga 3 cm masih dapat diterima — melebihi itu pun hanya memengaruhi kosmetik.",ref:Y(224),opsi:[{id:"brace",nama:{id:"Brace fungsional (Sarmiento)",en:"Functional brace"},gambar:"humerus-diafisis:brace-fungsional",utama:["Standar nonoperatif: dipasang 1–2 minggu setelah hanging cast/splint koaptasi","Pasien tegak & kooperatif, otot lengan atas berfungsi (pleksus utuh)"],ref:[Y(224),Y(225),Aa(609)],tatalaksana:"brace"},{id:"koaptasi",nama:{id:"Splint koaptasi / hanging cast (akut)",en:"Coaptation splint / hanging cast (acute)"},gambar:"humerus-diafisis:coaptation",utama:["Koaptasi: pemendekan minimal, oblik pendek/transversal","Hanging cast: tengah bergeser & memendek, spiral/oblik — kontraindikasi relatif transversal"],ref:Y(224),tatalaksana:"koaptasi"},{id:"plat",nama:{id:"ORIF plat",en:"Plate fixation"},gambar:"humerus-diafisis:plat-dcp",utama:["Absolut: terbuka, floating shoulder/elbow, cedera vaskular, bilateral/politrauma, paresis radialis sekunder","Relatif: segmental, reduksi tak dapat dipertahankan, transversal, obesitas, patologis, nonunion, defisit neurologis (mis. Parkinson), cedera pleksus"],ref:[Y(226),Aa(609)],tatalaksana:"plat"},{id:"nail",nama:{id:"Nail intramedular terkunci",en:"Locked intramedullary nail"},gambar:"humerus-diafisis:nail-antegrade",utama:["Segmental yang plat-nya butuh diseksi luas","Tulang sangat osteopenik","Fraktur patologis / impending (pilihan terbaik menurut AO)"],ref:[Y(228),Aa(609)],tatalaksana:"nail"}]},transversal:{intro:"Transversal adalah indikasi relatif operasi: cenderung terdistraksi dan nonunion.",opsi:[{id:"brace",nama:{id:"Splint koaptasi → brace fungsional",en:"Coaptation splint → functional brace"},gambar:"humerus-diafisis:brace-fungsional",utama:["Pasien kooperatif, reduksi dapat diterima","Hindari hanging cast (distraksi)"],ref:Y(224),tatalaksana:"brace"},{id:"plat",nama:{id:"ORIF plat kompresi",en:"Compression plating"},gambar:"humerus-diafisis:plat-dcp",utama:["Transversal (indikasi relatif)","Kompresi aksial lewat lubang DCP / alat tensioning"],ref:[Aa(609),Aa(619)],tatalaksana:"plat"},{id:"nail",nama:{id:"Nail terkunci + kompresi",en:"Locked nail with compression"},gambar:"humerus-diafisis:nail-antegrade",utama:["Alat kompresi khusus menambah kompresi antarfragmen pada transversal/oblik pendek"],ref:Aa(619),tatalaksana:"nail"}]},segmental:{intro:"Segmental termasuk indikasi (relatif) operasi.",opsi:[{id:"nail",nama:{id:"Nail intramedular terkunci",en:"Locked IM nail"},gambar:"humerus-diafisis:nail-antegrade",utama:["Plat akan memerlukan diseksi jaringan lunak luas"],ref:Y(228),tatalaksana:"nail"},{id:"plat",nama:{id:"Plat panjang (jembatan)",en:"Long bridging plate"},gambar:"humerus-diafisis:plat-dcp",utama:["Plat ≥ 8 lubang, lengan momen panjang"],ref:Aa(610),tatalaksana:"plat"}]},radialis:{intro:"Paresis radialis pada cedera tertutup hampir selalu neurapraksia: > 95% pulih spontan. Eksplorasi primer bila luka terbuka atau paresis muncul setelah prosedur tanpa saraf terlihat sepanjang jalurnya.",ref:Aa(620),opsi:[{id:"brace",nama:{id:"Nonoperatif + observasi saraf",en:"Nonoperative + nerve observation"},gambar:"humerus-diafisis:brace-fungsional",utama:["Cedera tertutup dengan paresis primer","Eksplorasi tertunda bila tanpa pemulihan (EMG/NCV) pada 3–4 bulan"],ref:[Y(230),Aa(620)],tatalaksana:"brace"},{id:"plat",nama:{id:"ORIF + eksplorasi n. radialis",en:"ORIF + radial nerve exploration"},gambar:"humerus-diafisis:plat-dcp",utama:["Luka terbuka / trauma tembus (laserasi sering)","Paresis sekunder setelah manipulasi (indikasi absolut menurut AO; HoF: kontroversial)"],ref:[Y(226),Aa(609),Aa(620)],tatalaksana:"plat"}]},terbuka:{intro:"Fraktur terbuka ditangani segera; stabilisasi dipilih menurut jaringan lunak.",opsi:[{id:"plat",nama:{id:"ORIF plat (± eksplorasi saraf)",en:"Plate fixation (± nerve exploration)"},gambar:"humerus-diafisis:plat-dcp",utama:["Luka memungkinkan debridement dan fiksasi definitif"],ref:[Y(226),Aa(610)],tatalaksana:"plat"},{id:"eksfiks",nama:{id:"Fiksator eksternal",en:"External fixator"},gambar:"humerus-diafisis:eksfiks",utama:["Kehilangan jaringan lunak luas, luka bakar, nonunion terinfeksi","Stabilisasi sementara sebelum perbaikan vaskular"],ref:[Y(229),Aa(619)],tatalaksana:"eksfiks"}]}},tatalaksana:{brace:{nama:{id:"Brace fungsional",en:"Functional bracing"},bab:[{judul:"Prinsip",isi:"Kompresi hidrostatik jaringan lunak menjaga aligment sambil membiarkan sendi tetangga bergerak. Dipasang 1–2 minggu setelah cedera, sesudah hanging cast/splint koaptasi dan nyeri-bengkak mereda; terdiri atas cangkang anterior–posterior (atau medial–lateral) dengan tali Velcro.",ref:Y(225)},{judul:"Syarat & kontraindikasi",isi:"Keberhasilan butuh pasien tegak, brace dikencangkan setiap hari, dan otot lengan atas berfungsi. Kontraindikasi: cedera jaringan lunak masif, pasien tidak dapat diandalkan, reduksi tak dapat dicapai/dipertahankan. Lengan bawah ditopang collar-and-cuff — sling dapat menimbulkan angulasi varus.",ref:Y(225)},{judul:"Durasi & hasil",isi:"Dipakai minimal **8 minggu** atau sampai ada tanda union radiologis. Union 95% dengan hasil baik–sangat baik; angulasi anterior < 20°, varus < 30°, rotasi < 40°, pemendekan < 3 cm ditoleransi secara fungsional, meski pasien makin tidak menerima deformitas kosmetik (varus, pemendekan).",ref:[Y(225),Aa(609)]},{judul:"Komplikasi",isi:"Nonunion hingga **15%** (risiko: sepertiga proksimal/distal, transversal, distraksi, interposisi jaringan lunak, stabilisasi tak memadai) → ORIF + cangkok tulang. Malunion sering tidak berdampak fungsional karena bahu, siku, dan batang tubuh mengompensasi. Celah fraktur, merokok, dan jenis kelamin perempuan memperlama penyembuhan.",ref:[Y(230),Aa(620)]}]},koaptasi:{nama:{id:"Splint koaptasi dan hanging cast",en:"Coaptation splint and hanging cast"},bab:[{judul:"Hanging cast",isi:"Traksi dependen oleh berat gips dan lengan untuk mereduksi fraktur. Indikasi: fraktur tengah bergeser dengan pemendekan, terutama spiral/oblik; transversal/oblik pendek adalah kontraindikasi relatif karena distraksi. Jarang dipakai sebab pasien harus selalu tegak/setengah tegak; diganti brace fungsional begitu kalus dini terbentuk; union > 95%.",ref:Y(224)},{judul:"Splint koaptasi",isi:"Traksi dependen plus tekanan hidrostatik dengan stabilisasi lebih baik dan distraksi lebih sedikit; lengan bawah digantung collar-and-cuff. Untuk fraktur akut dengan pemendekan minimal dan pola oblik pendek/transversal; kekurangan: iritasi aksila dan splint melorot; diganti brace 1–2 minggu.",ref:[Y(224),Y(225)]},{judul:"Velpeau",isi:"Imobilisasi torakobrakial hanya untuk lansia/anak yang tidak toleran cara lain dan kenyamanan menjadi tujuan utama — fraktur tak bergeser/minimal; pendulum 1–2 minggu, lalu brace.",ref:Y(225)}]},plat:{nama:{id:"Reduksi terbuka dan fiksasi plat",en:"Open reduction and plate fixation"},bab:[{judul:"Mengapa plat",isi:"Hasil fungsional terbaik: reduksi langsung dan fiksasi stabil tanpa melukai rotator cuff; cocok untuk hampir semua fraktur dan pilihan terbaik untuk sepertiga proksimal/distal terutama dengan ekstensi artikular. Union 92–98% dari 600 plating; infeksi < 1%; paresis radialis iatrogenik 3%; > 97% fungsi baik.",ref:[Y(227),Aa(609),Aa(620)]},{judul:"Pendekatan",isi:"**Anterolateral** untuk sepertiga proksimal (n. radialis dikenali di interval brakialis–brakioradialis dan ditelusuri ke proksimal; brakialis dibelah; dapat diperluas ke bahu). **Anterior** di interval biseps–brakialis. **Posterior** untuk sebagian besar humerus termasuk siku, tidak bisa diperluas ke bahu; interval kaput lateral–longum triseps, kaput medial dibelah; n. radialis dikenali di alur spiral di pertengahan lengan. Posisi: telentang meja radiolusen (anterior/anterolateral), beach chair, lateral/tengkurap (posterior).",ref:Y(226)},{judul:"Implan & teknik",isi:"DCP/LCP 4.5 untuk pasien besar, LCP 3.5 untuk kebanyakan; selalu **≥ 8 lubang** karena eksursi rotasi lengan yang besar memerlukan lengan momen panjang. Sekrup mengait **6–8 korteks** di atas dan di bawah fraktur; kompresi antarfragmen dengan lag screw (idealnya lewat plat) atau prabeban aksial lewat lubang DCP/alat tensioning. Reduksi atraumatik: traksi; oblik/spiral ditahan klem runcing atau cerclage; transversal direduksi dengan plat. Plat ekstraperiosteal, tanpa pengupasan periosteum; pertahankan jaringan lunak fragmen kupu-kupu; pada kominusi berat gunakan plat jembatan (sembuh lewat kalus). Pastikan n. radialis **tidak terjepit di bawah ujung plat** dengan melihat langsung.",ref:[Y(227),Aa(610),Aa(619)]},{judul:"Pascaoperasi",isi:"Gerak tangan dan pergelangan segera; bahu dan siku begitu nyeri mereda — gerak aktif-asistif sampai insisi sembuh, lalu aktif; dengan rekonstruksi stabil pasien boleh memakai alat bantu jalan tanpa batasan.",ref:[Y(229),Aa(620)]},{judul:"Komplikasi",isi:"Paresis radialis (cedera awal, reduksi tertutup, atau operasi), delayed union, malunion, infeksi; kegagalan implan terutama pada osteoporosis. Nonunion didorong fiksasi tak memadai, penanganan jaringan lunak buruk, dan diseksi periosteal sirkumferensial.",ref:Aa(620)}]},nail:{nama:{id:"Nail intramedular terkunci",en:"Locked intramedullary nailing"},bab:[{judul:"Indikasi",isi:"Segmental (plat butuh diseksi luas), tulang sangat osteopenik, fraktur patologis — nail adalah pilihan terbaik untuk patologis/impending. Dua uji acak plat vs nail: union serupa, komplikasi lebih tinggi pada nail; nail antegrade sering menimbulkan gejala bahu.",ref:[Y(228),Aa(609),Aa(621)]},{judul:"Teknik antegrade",isi:"Pendekatan anterolateral akromial; titik masuk menghindari insersi rotator cuff; nail dimasukkan tanpa paksaan di bawah pencitraan — bila tahanan besar: perbesar titik masuk, ream kanal, atau pilih nail lebih kecil; dimajukan dengan gerakan rotasi tanpa palu setelah reduksi. Kunci ganda proksimal dan distal; alat kompresi untuk transversal/oblik pendek (bukan untuk fraktur tak stabil longitudinal). Proksimal nail ditenggelamkan agar tidak impingement subakromial.",ref:[Y(228),Y(229),Aa(619)]},{judul:"Bahaya saraf",isi:"Sekrup kunci proksimal mengancam **n. aksilaris** — insisi kecil, diseksi tumpul ke tulang, kanula pelindung; sekrup tidak boleh menonjol > 2 mm dari korteks jauh; hindari sekrup anterior–posterior. Kunci distal biasanya bidang AP dengan teknik terbuka; sekrup lateral–medial mengancam n. kutaneus antebrakial lateral dan n. radialis.",ref:[Y(228),Y(229),Aa(620)]},{judul:"Pascaoperasi",isi:"Latihan bahu dan siku dapat dimulai segera, tetapi gerak rotasi melawan tahanan diminimalkan.",ref:Aa(620)}]},eksfiks:{nama:{id:"Fiksasi eksternal",en:"External fixation"},bab:[{judul:"Kapan",isi:"Jarang: nonunion terinfeksi, pasien luka bakar, fraktur terbuka dengan kehilangan jaringan lunak luas; juga stabilisasi sementara sebelum perbaikan vaskular. Komplikasi: infeksi jalur pin, cedera neurovaskular, nonunion.",ref:Y(229)},{judul:"Teknik",isi:"Kerangka unilateral half-pin cukup; karena jalur saraf dan pembuluh bervariasi, pin dipasang **terbuka terbatas**: insisi kecil, diseksi tumpul ke tulang, pemandu lewat insisi; Schanz paling distal di distal fossa olekranon.",ref:Aa(619)}]}}}});var Es={};Oa(Es,{default:()=>At});var B,D,At,Ks=ga(()=>{B=a=>({buku:"HoF",bab:"17",hlm:a}),D=a=>({buku:"AO",bab:"6.2.3",hlm:a}),At={id:"humerus-distal",nama:{id:"Humerus distal",en:"Distal humerus"},sumber:[{buku:"HoF",bab:"17",hlm:{awal:231,akhir:245}},{buku:"AO",bab:"6.2.3",hlm:{awal:623,akhir:636}}],gambar:"humerus-distal:utuh",intro:{id:"Segitiga tulang dari dua kolom dan troklea di tengah: prinsipnya reduksi anatomis sendi, dua plat yang kuat, dan siku digerakkan dalam hitungan hari — karena siku dewasa cepat kaku. Pada lansia osteoporotik dengan fraktur C3, artroplasti siku total mengalahkan ORIF dalam uji acak.",en:"A bony triangle of two columns and a central trochlea: the principles are anatomic joint reduction, two strong plates, and elbow motion within days — adult elbows stiffen fast. In osteoporotic elderly patients with C3 fractures, total elbow arthroplasty beat ORIF in a randomized trial."},introRef:[D(624),D(631),D(635)],pemeriksaan:{klinis:[{teks:"Bengkak sering hebat sehingga landmark sulit diraba; hubungan olekranon–epikondilus medial–lateral tetap membentuk segitiga sama sisi. Jangan memancing krepitasi/instabilitas — berisiko cedera neurovaskular.",ref:B(232)},{teks:"Ujung tajam fragmen proksimal dapat menusuk/memar a. brakialis, n. medianus, n. radialis; periksa **ketiga saraf** yang menyilang siku. Luka terbuka biasanya posterior (hiperekstensi). Denyut dapat teraba meski a. brakialis cedera karena kolateral longitudinal yang baik.",ref:[B(233),D(623)]},{teks:"Bengkak fossa kubiti → pemantauan serial ± tekanan kompartemen (iskemia Volkmann); nyeri hebat dan tak tahan ekstensi jari (aktif/pasif) menandai sindrom kompartemen, terutama bila ada cedera lengan bawah/pergelangan.",ref:[B(233),D(623)]}],radiologis:[{teks:"AP dan lateral siku; oblik membantu. Foto traksi (setelah anestesi) memperjelas pola untuk perencanaan. Fat pad sign anterior/posterior pada fraktur tak bergeser; sudut kondilus–batang normal 40° berkurang pada pergeseran minimal.",ref:[B(233),D(623)]},{teks:"Karena interkondiler hampir sesering suprakondiler pada dewasa, cari **split vertikal** interkondiler pada AP/oblik. CT (3-D, dengan radius–ulna 'dihapus') untuk kominusi dan ekstensi artikular.",ref:[B(233),D(623)]}],mekanisme:[{teks:"Energi rendah: jatuh sederhana pada perempuan paruh baya/lansia — siku terbentur langsung atau beban aksial pada tangan terentang. Muda: kecelakaan kendaraan dan olahraga, sering politrauma.",ref:[B(232),D(623)]},{teks:"Interkondiler: gaya pada aspek posterior siku yang fleksi > 90° mendorong ulna ke troklea; fragmen diputar oleh tarikan massa fleksor (medial) dan ekstensor (lateral).",ref:B(237)},{teks:"Anatomi: permukaan sendi menonjol ke distal-anterior 40–45° (AO: 25°); sumbu troklea valgus 4–8° dan rotasi internal 3–8°; kanal medular berakhir 2–3 cm di atas fossa olekranon; kolom medial segaris batang, kolom lateral melengkung ke anterior — plat lurus posterolateral berisiko 'meluruskan' humerus distal.",ref:[B(232),D(624)]}],epidemiologi:[{teks:"≈ 2% semua fraktur dan 33% fraktur humerus; 5,7/100.000/tahun; bimodal (laki-laki 12–19 tahun, perempuan ≥ 80); > 60% pada lansia dari energi rendah.",ref:B(231)},{teks:"Ekstraartikular 40% dan bikondiler intraartikular 37% adalah pola tersering (HoF); AO: kebanyakan intraartikular dua kolom (tipe C) atau artikular parsial kapitulum/troklea (tipe B).",ref:[B(231),D(623)]}]},klasifikasi:[{nama:"AO/OTA 13",teks:"13A ekstraartikular (A1 avulsi epikondilus, A2 metafisis simpel, A3 metafisis multifragmentari); 13B artikular parsial (B1 kolom lateral, B2 kolom medial, B3 frontal/koronal — kapitulum/troklea); 13C artikular komplet (C1 simpel–simpel, C2 artikular simpel + metafisis multifragmentari, C3 artikular multifragmentari).",ref:[D(624),D(625)]},{nama:"Deskriptif (HoF)",teks:"Suprakondiler (ekstensi/fleksi), transkondiler, interkondiler, kondiler, kapitulum, troklea, epikondilus lateral/medial, prosesus suprakondiler.",ref:B(233)},{nama:"Milch (kondilus)",teks:"Kuncinya *lateral trochlear ridge*: tipe I tetap pada kondilus yang utuh (stabil); tipe II ikut fragmen kondilus (medial atau lateral) — kurang stabil, radius–ulna dapat bertranslokasi bila kapsuloligamen sisi kontralateral robek. Jupiter: rendah/tinggi menurut ekstensi ke suprakondiler.",ref:[B(239),B(240)]},{nama:"Kapitulum",teks:"I Hahn-Steinthal (fragmen tulang besar ± troklea); II Kocher-Lorenz (rawan dengan sedikit tulang subkondral — 'uncapping'); III kominutif (Morrey); IV meluas ke troklea (McKee).",ref:B(242)}],kelompok:[{id:"ekstra",nama:{id:"Ekstraartikular",en:"Extra-articular"},kode:"13A",jenis:[{id:"suprakondiler",nama:{id:"Suprakondiler",en:"Supracondylar"},kode:"13A2–A3",gambar:"humerus-distal:suprakondiler",ringkas:"Jatuh pada tangan terentang ± abduksi/aduksi; sebagian besar tipe ekstensi; 40% fraktur humerus distal.",ref:[B(231),B(234)],indikasi:"suprakondiler"},{id:"transkondiler",nama:{id:"Transkondiler",en:"Transcondylar"},kode:"rendah",gambar:"humerus-distal:transkondiler",ringkas:"Terutama lansia osteopenik; garis fraktur melewati fossa — fragmen distal pendek, fiksasi sulit.",ref:B(237),indikasi:"transkondiler"},{id:"epikondilus",nama:{id:"Epikondilus medial (avulsi)",en:"Medial epicondyle (avulsion)"},kode:"13A1",gambar:"humerus-distal:epikondilus-medial",ringkas:"Lebih sering daripada lateral; pada dewasa biasanya trauma langsung, dapat menyertai dislokasi; cedera utamanya adalah dislokasi (AO).",ref:[B(244),D(625)],indikasi:"epikondilus"}]},{id:"parsial",nama:{id:"Artikular parsial",en:"Partial articular"},kode:"13B",jenis:[{id:"kondilus-lateral",nama:{id:"Kondilus lateral",en:"Lateral condyle"},kode:"13B1 · Milch I/II",gambar:"humerus-distal:kondilus-lateral",ringkas:"Kapitulum + epikondilus lateral; < 5% fraktur humerus distal adalah kondiler, lateral lebih sering; biasanya simpel (AO).",ref:[B(239),D(624)],indikasi:"kondilus"},{id:"kondilus-medial",nama:{id:"Kondilus medial",en:"Medial condyle"},kode:"13B2",gambar:"humerus-distal:kondilus-medial",ringkas:"Troklea + epikondilus medial; cenderung fragmentasi artikular kompleks dengan impaksi troklea yang 'stabil tapi salah posisi' (AO).",ref:[B(239),D(624),D(625)],indikasi:"kondilus"},{id:"kapitulum",nama:{id:"Kapitulum / troklea (koronal)",en:"Capitellum / trochlea (coronal)"},kode:"13B3",gambar:"humerus-distal:kapitulum-1",ringkas:"< 1% fraktur siku; geser koronal lewat kaput radius; fragmen artikular bebas tanpa perlekatan dapat bergeser ke fossa dan menghambat fleksi.",ref:B(241),indikasi:"kapitulum"}]},{id:"komplet",nama:{id:"Artikular komplet (interkondiler)",en:"Complete articular (intercondylar)"},kode:"13C",jenis:[{id:"interkondiler",nama:{id:"Interkondiler T/Y",en:"T/Y intercondylar"},kode:"13C1–C2",gambar:"humerus-distal:interkondiler",ringkas:"Kedua terbanyak; kominusi lazim; fragmen diputar oleh massa fleksor dan ekstensor.",ref:B(237),indikasi:"interkondiler"},{id:"kominutif",nama:{id:"Kominutif artikular",en:"Comminuted articular"},kode:"13C3",gambar:"humerus-distal:interkondiler-kominutif",ringkas:"Direkonstruksi pada pasien muda energi tinggi; pada lansia osteoporotik pertimbangkan artroplasti siku total.",ref:D(625),indikasi:"kominutif"}]}],indikasi:{suprakondiler:{intro:"Nonoperatif hanya untuk tak bergeser/minimal dan lansia dengan kominusi berat yang fungsinya terbatas; selebihnya ORIF dua plat.",ref:B(234),opsi:[{id:"splint",nama:{id:"Splint posterior → brace engsel",en:"Posterior splint → hinged brace"},gambar:"humerus-distal:splint-posterior",utama:["Tak bergeser / minimal","Lansia kominutif berat dengan kemampuan fungsional terbatas"],ref:B(234),tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF dua plat",en:"Dual-plate ORIF"},gambar:"humerus-distal:plat-paralel",utama:["Bergeser; cedera vaskular; terbuka; reduksi tak dapat dipertahankan","LCP precontoured sangat membantu pada fraktur transversal rendah (A3)"],ref:[B(234),D(625)],tatalaksana:"orif"}]},transkondiler:{intro:"Tulang osteopenik: plat locking precontoured bila dioperasi; artroplasti siku total semikonstrain bila fiksasi tak dapat dicapai pada lansia yang sebelumnya berfungsi baik.",ref:B(237),opsi:[{id:"nonop",nama:{id:"Nonoperatif + gerak dini",en:"Nonoperative + early motion"},gambar:"humerus-distal:bag-of-bones",utama:["Tak bergeser/minimal","Lansia lemah dengan fungsi buruk"],ref:B(237),tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF plat locking precontoured",en:"ORIF with precontoured locking plates"},gambar:"humerus-distal:plat-paralel",utama:["Terbuka, tak stabil, bergeser"],ref:B(237),tatalaksana:"orif"},{id:"tea",nama:{id:"Artroplasti siku total",en:"Total elbow arthroplasty"},gambar:"humerus-distal:tea",utama:["Lansia dengan status fungsional pracedera baik bila fiksasi tak tercapai"],ref:B(237),tatalaksana:"tea"}]},epikondilus:{intro:"Fiksasi jarang diperlukan karena cedera utamanya dislokasi; operasi bila fragmen di dalam sendi.",ref:[B(244),D(625)],opsi:[{id:"nonop",nama:{id:"Splint 10–14 hari",en:"Splint 10–14 days"},gambar:"humerus-distal:splint-posterior",utama:["Tak bergeser/minimal: splint posterior, lengan bawah pronasi, pergelangan dan siku fleksi"],ref:B(244),tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF sekrup / eksisi",en:"Screw ORIF / excision"},gambar:"humerus-distal:plat-paralel",utama:["Absolut: fragmen dalam ruang sendi","Relatif: gejala n. ulnaris, instabilitas valgus, kelemahan fleksor pergelangan, nonunion simtomatik; eksisi bila tak dapat difiksasi/terjepit"],ref:[B(244),D(625)],tatalaksana:"orif"}]},kondilus:{intro:"Pemulihan kongruensi anatomis wajib untuk menjaga busur gerak dan mencegah artritis; nonoperatif hanya bila tak bergeser atau pasien bukan kandidat operasi.",ref:B(241),opsi:[{id:"splint",nama:{id:"Splint posterior 90°",en:"Posterior splint at 90°"},gambar:"humerus-distal:splint-posterior",utama:["Tak bergeser/minimal","Lengan bawah supinasi (kondilus lateral) atau pronasi (medial)"],ref:B(241),tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF sekrup ± perbaikan ligamen kolateral",en:"Screw ORIF ± collateral ligament repair"},gambar:"humerus-distal:plat-paralel",utama:["Terbuka atau bergeser","Kolom lateral: satu plat lateral biasanya cukup; kolom medial: sering perlu osteotomi olekranon dan sekrup headless/K-wire berulir untuk fragmen kecil"],ref:[B(241),D(625)],tatalaksana:"orif"}]},kapitulum:{intro:"Tujuannya restorasi anatomis: ORIF untuk tipe I bergeser; eksisi untuk kominutif berat dan kebanyakan tipe II — hati-hati pada lansia karena sering tipe IV yang akan tidak stabil bila dieksisi.",ref:B(242),opsi:[{id:"splint",nama:{id:"Splint posterior 3 minggu",en:"Posterior splint 3 weeks"},gambar:"humerus-distal:splint-posterior",utama:["Tak bergeser","Lalu latihan gerak siku"],ref:B(242),tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF sekrup headless / posterior→anterior",en:"ORIF with headless or posterior-to-anterior screws"},gambar:"humerus-distal:sekrup-kapitulum",utama:["Tipe I bergeser (Hahn-Steinthal)","Cukup stabil untuk gerak dini"],ref:[B(242),D(625)],tatalaksana:"kapitulum"},{id:"eksisi",nama:{id:"Eksisi fragmen",en:"Fragment excision"},gambar:"humerus-distal:kapitulum-2",utama:["Tipe I kominutif berat, kebanyakan tipe II","Fraktur lama terlewat dengan gerak terbatas"],ref:B(242),tatalaksana:"kapitulum"}]},interkondiler:{intro:"Individualisasi menurut usia, kualitas tulang, kominusi: ORIF untuk fraktur bergeser yang dapat direkonstruksi; artroplasti untuk kominusi berat/osteoporotik; 'bag of bones' untuk yang tak dapat dioperasi.",ref:B(238),opsi:[{id:"orif",nama:{id:"ORIF dua plat (paralel atau 90°)",en:"Dual-plate ORIF (parallel or 90°)"},gambar:"humerus-distal:plat-ortogonal",utama:["Bergeser, dapat direkonstruksi","Sekrup interfragmen + plat medial & posterolateral (90°) atau medial & lateral (180°)"],ref:[B(238),D(631)],tatalaksana:"orif"},{id:"tea",nama:{id:"Artroplasti siku total (semen, semikonstrain)",en:"Total elbow arthroplasty (cemented, semiconstrained)"},gambar:"humerus-distal:tea",utama:["Kominusi berat; tulang osteoporotik","Keputusan berdasarkan faktor pasien (kebutuhan fungsional rendah, artritis siku sebelumnya)"],ref:[B(238),D(625),D(631)],tatalaksana:"tea"},{id:"nonop",nama:{id:"'Bag of bones' (collar-and-cuff)",en:"'Bag of bones' (collar-and-cuff)"},gambar:"humerus-distal:bag-of-bones",utama:["Tak bergeser; lansia osteopenik-kominutif; komorbiditas berat","Gips: 'worst of both worlds' — hanya sedikit pendukung"],ref:[B(238),D(631)],tatalaksana:"nonop"}]},kominutif:{intro:"C3: rekonstruksi pada pasien muda energi tinggi; pada lansia osteoporotik, artroplasti siku total menghasilkan luaran lebih baik daripada ORIF dalam uji acak terkontrol — dengan harga pembatasan aktivitas seumur hidup.",ref:[D(625),D(634),D(635)],opsi:[{id:"orif",nama:{id:"ORIF LCP precontoured (± cangkok struktural)",en:"Precontoured LCP ORIF (± structural graft)"},gambar:"humerus-distal:plat-ortogonal",utama:["Pasien muda","Cangkok struktural bila segmen sentral troklea–kapitulum hilang (jaga lebar interkondiler)"],ref:[D(625),D(634)],tatalaksana:"orif"},{id:"tea",nama:{id:"Artroplasti siku total",en:"Total elbow arthroplasty"},gambar:"humerus-distal:tea",utama:["Lansia osteoporotik dengan kebutuhan fungsional terbatas","Batas angkat 5 kg seumur hidup; prostesis akhirnya gagal"],ref:[D(625),D(634),D(635)],tatalaksana:"tea"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif",en:"Nonoperative treatment"},bab:[{judul:"Splint posterior",isi:"Splint lengan panjang posterior dengan siku fleksi ≥ 90° (bila bengkak dan neurovaskular mengizinkan), lengan bawah netral, 1–2 minggu; lalu latihan gerak dalam brace engsel; dihentikan ± 6 minggu bila ada tanda penyembuhan radiologis. Foto berkala untuk mendeteksi hilangnya reduksi.",ref:B(234)},{judul:"Siapa",isi:"Tak bergeser/minimal; lansia dengan kominusi berat dan fungsi terbatas; pasien lemah/tidak aktif — hasil relatif baik, dan nonunion atau malunion berat dapat diselamatkan dengan artroplasti siku total kemudian. Kondilus: splint 90° dengan lengan bawah supinasi (lateral) atau pronasi (medial); kapitulum/troklea tak bergeser: 3 minggu lalu gerak; epikondilus medial: 10–14 hari.",ref:[B(234),B(241),B(242),B(243),B(244),D(631)]},{judul:"'Bag of bones'",isi:"Setelah upaya reduksi awal, lengan dalam collar-and-cuff dengan fleksi semaksimal mungkin; traksi gravitasi membantu reduksi; tujuannya pseudartrosis tanpa nyeri yang memungkinkan gerak. Imobilisasi gips memiliki sedikit pendukung.",ref:B(238)}]},orif:{nama:{id:"Reduksi terbuka dan fiksasi plat",en:"Open reduction and plate fixation"},bab:[{judul:"Prinsip & waktu",isi:"Reduksi artikular anatomis, fiksasi stabil permukaan sendi, pulihkan sumbu, fiksasi stabil segmen artikular ke metafisis–diafisis, gerak dini. Operasi segera hanya untuk terbuka dan iskemia; selebihnya terencana dengan taktik bedah tertulis (antibiotik, posisi, pendekatan, cangkok).",ref:[B(234),D(625)]},{judul:"Posisi & insisi",isi:"Telentang (lengan di dada), lateral, atau tengkurap; torniket steril tinggi, dikembangkan hanya bila perdarahan mengganggu. Insisi kulit posterior garis tengah mencapai semua bagian siku; n. radialis terancam bila diperluas ke proksimal; insisi lateral langsung untuk kapitulum/troklea terisolasi. **N. ulnaris harus dikenali** pada semua pendekatan; kebanyakan ahli melepas dan memindahkannya sementara — posisinya dicatat (± diagram) untuk operasi berikutnya.",ref:[B(234),B(235),D(626),D(627),D(634)]},{judul:"Pendekatan",isi:"Triceps-split (Campbell) atau paratrisipital/Alonso-Llames untuk ekstraartikular dan artikular simpel — olekranon utuh menjadi templat reduksi; TRAP; Bryan-Morrey (refleksi triseps medial→lateral) untuk artroplasti/konversi; **osteotomi olekranon** chevron apeks distal (gergaji osilasi, diselesaikan dengan osteotom) adalah paparan paling ekstensil tetapi menambah komplikasi osteotomi — difiksasi tension band, sekrup/nail intramedular, atau plat.",ref:[B(235),B(236),D(627),D(628),D(629),D(630)]},{judul:"Reduksi",isi:"Dua strategi: rakit dulu blok artikular dengan sekrup lag (C → A) lalu sambungkan ke batang dengan plat; atau reduksi satu kolom beserta sendinya (C → B), mulai dari kolom yang lebih sederhana — lebih baik untuk fraktur bentuk-λ. Impaksi kolom lateral/troklea posterior harus dikoreksi bila fragmen anterior tidak pas. Fragmen kecil jangan dibuang; difiksasi dengan sekrup 1.5/2.0 countersunk, sekrup headless, atau K-wire berulir.",ref:[D(631),D(632),D(634)]},{judul:"Plat",isi:"Plat rekonstruksi 3.5 mudah dibentuk, LC-DCP lebih kuat, 1/3 tubular terlalu lemah (hanya buttress ulnar + plat kedua); LCP precontoured untuk fraktur rendah, kominusi metafisis, tulang buruk. Konfigurasi **ortogonal** (medial + posterolateral) lazim dan sering disebut terkuat; **paralel** (medial + lateral) unggul biomekanis untuk fraktur rendah/fragmentasi luas — sekrup lateral→medial lebih panjang. Target 2–3 sekrup di atas dan di bawah fraktur per plat; fossa olekranon bebas implan; plat lateral harus precontoured melengkung ke anterior; LCP 90° dipilih pada tulang buruk/kominusi metafisis.",ref:[B(236),D(625),D(631),D(632),D(633)]},{judul:"Pascaoperasi",isi:"Fiksasi stabil → latihan aktif-asistif dan pemakaian ringan dalam beberapa hari (bahkan sehari setelah operasi); fiksasi tenuous → imobilisasi ± 4 minggu, lebih baik kaku daripada kehilangan fiksasi. Peregangan aktif-asistif, hindari manipulasi pasif; latihan tahanan setelah union jelas (≥ 6 minggu); gerak membaik ≥ 1 tahun.",ref:[B(238),D(631),D(634),D(635)]},{judul:"Komplikasi & hasil",isi:"Disfungsi n. ulnaris iatrogenik hingga 1 dari 5 (HoF: cedera saraf ≤ 15%), biasanya sementara; kekakuan (hilang ekstensi dari kalus fossa, fleksi dari kontraktur/osifikasi heterotopik); osifikasi heterotopik (cedera otak, fiksasi tertunda, peregangan paksa); nonunion di level suprakondiler (fiksasi tak memadai, pemakaian berlebih dini, kominusi); kegagalan fiksasi pada osteoporosis; infeksi jarang; nonunion osteotomi 5–15% (HoF) / jarang (AO); kontraktur Volkmann jarang. Hasil baik 75–80%; ≥ 15% sedang/buruk.",ref:[B(236),B(237),B(238),D(635)]}]},kapitulum:{nama:{id:"Kapitulum & troklea",en:"Capitellum and trochlea"},bab:[{judul:"ORIF",isi:"Tipe I bergeser: pendekatan posterolateral/posterior dengan sekrup posterior→anterior, atau sekrup headless anterior→posterior; cukup stabil untuk gerak dini. AO: sekrup headless, sekrup countersunk, K-wire berulir kecil, atau pin resorbable; plat ± cangkok struktural bila kolom lateral posterior terfragmentasi. Telentang dengan meja tangan untuk paparan lateral diperluas.",ref:[B(242),D(625),D(626)]},{judul:"Eksisi",isi:"Jarang: tipe I kominutif berat dan kebanyakan tipe II; hati-hati pada lansia (sering tipe IV → instabilitas bila dieksisi); dapat dianjurkan untuk fraktur lama terlewat dengan gerak terbatas. Troklea (Laugier) bergeser: ORIF K-wire/sekrup; fragmen yang tak dapat difiksasi dieksisi.",ref:[B(242),B(243)]},{judul:"Komplikasi",isi:"Osteonekrosis relatif jarang; artritis pascatrauma (kongruensi gagal, eksisi); kubitus valgus dengan palsi n. ulnaris lambat (eksisi, fraktur kondilus lateral/kaput radius penyerta); hilang fleksi karena fragmen terjebak di fossa koronoid/radial.",ref:B(243)}]},tea:{nama:{id:"Artroplasti siku total",en:"Total elbow arthroplasty"},bab:[{judul:"Indikasi",isi:"Lansia dengan fraktur kominutif yang tak dapat direkonstruksi; keputusan umumnya praoperasi berdasarkan faktor pasien — kebutuhan fungsional terbatas atau artritis siku sebelumnya; dipakai hemat. Uji acak: pada C3 lansia luaran TEA lebih baik daripada ORIF; gerak rerata lebih baik dan pemulihan cepat.",ref:[B(236),D(625),D(631),D(635)]},{judul:"Teknik",isi:"Semikonstrain bersemen; pendekatan medial hemat triseps (Bryan-Morrey/paratrisipital), **bukan osteotomi olekranon**; eksisi fragmen artikular memberi ruang kerja, insersi triseps dibiarkan utuh. Bila ORIF direncanakan dengan TEA sebagai cadangan, hindari osteotomi.",ref:[B(236),D(631)]},{judul:"Harga yang dibayar",isi:"Pembatasan aktivitas seumur hidup (angkat 5 lb/5 kg); prostesis akhirnya longgar/gagal; komplikasi berat yang sulit ditangani (infeksi dalam, osteolisis tahap akhir).",ref:[B(236),D(623),D(634)]}]}}}});var Ds={};Oa(Ds,{default:()=>St});var X,Ba,St,Ns=ga(()=>{X=a=>({buku:"HoF",bab:"18",hlm:a}),Ba=a=>({buku:"AO",bab:"6.3.1",hlm:a}),St={id:"dislokasi-siku",nama:{id:"Dislokasi siku & fraktur-dislokasi",en:"Elbow dislocation and fracture-dislocation"},sumber:[{buku:"HoF",bab:"18",hlm:{awal:246,akhir:257}},{buku:"AO",bab:"6.3.1",hlm:{awal:637,akhir:656}}],gambar:"dislokasi-siku:posterior",intro:{id:"Siku lepas dari lateral ke medial (lingkaran Hori) — ligamen kolateral lateral putus dulu, pita anterior MCL terakhir. Dislokasi simpel: reduksi, cek stabilitas, gerak dini. Fraktur-dislokasi (kaput radius + koronoid = *terrible triad*): rekonstruksi bertahap dari lateral, dan jangan sekali-kali hanya mengeksisi kaput radius.",en:"The elbow fails from lateral to medial (Hori circle) — the lateral collateral ligament tears first, the anterior band of the MCL last. Simple dislocation: reduce, test stability, move early. Fracture-dislocations (radial head + coronoid = 'terrible triad'): stepwise reconstruction from the lateral side, and never excise the radial head alone."},introRef:[X(248),X(254),X(255)],pemeriksaan:{klinis:[{teks:"Lengan dijaga, instabilitas kasar dan bengkak bervariasi. Pemeriksaan neurovaskular **sebelum** foto/manipulasi dan diulang sesudah reduksi; serial bila bengkak antekubiti masif atau berisiko sindrom kompartemen.",ref:X(249)},{teks:"Denyut radialis dapat teraba meski a. brakialis cedera (kolateral); tak ada denyut dengan tangan hangat-perfusi baik kemungkinan spasme arteri. Bila setelah reduksi perfusi tidak pulih → angiografi di kamar operasi (jangan menunda operasi) dan rekonstruksi arteri dengan cangkok vena safena.",ref:X(249)},{teks:"Ekimosis medial (tanda robekan MCL) baru tampak 3–5 hari. Cedera saraf akut jarang: n. ulnaris dan cabang interoseus anterior n. medianus tersering.",ref:X(249)},{teks:"Pergelangan tangan harus diperiksa — bila ada tanda cedera, foto pergelangan untuk memastikan sendi radioulnar distal tidak terlibat (Essex-Lopresti).",ref:Ba(638)}],radiologis:[{teks:"AP dan lateral: nilai kongruensi ulnohumeral dan radiokapitelar; subluksasi ringan pun menandakan instabilitas bermakna. Cari fraktur penyerta (kaput radius, koronoid, epikondilus, kapitulum).",ref:[X(249),Ba(638)]},{teks:"Foto stres valgus pada fleksi 30° dan pronasi penuh (setelah reduksi atau saat operasi) membantu mengenali cedera MCL. CT untuk fragmen yang tak terlihat dan pola kompleks.",ref:X(249)}],mekanisme:[{teks:"Jatuh pada tangan terentang/siku: gaya pengungkit melepaskan olekranon dari troklea + translasi permukaan sendi. Posterior: hiperekstensi + stres valgus + abduksi lengan + supinasi lengan bawah. Anterior: pukulan langsung pada lengan bawah posterior dengan siku fleksi.",ref:X(248)},{teks:"Cedera kapsuloligamen berjalan lateral → medial (lingkaran Hori); siku dapat terdislokasi sempurna dengan pita anterior MCL tetap utuh. Instabilitas rotatori posterolateral dimulai dari putusnya pita ulnar LCL — biasanya avulsi dari humerus lateral; dapat iatrogenik bila pita ulnar LCL dilepas tanpa diperbaiki pada pendekatan lateral.",ref:[X(248),X(251)]},{teks:"Varus–posteromedial: jatuh dengan stres varus, beban aksial, rotasi posteromedial → fraktur faset anteromedial koronoid + cedera LCL / fraktur olekranon / fraktur basis koronoid; **tanpa** fraktur kaput radius sehingga gambaran radiologis halus.",ref:[X(252),X(253)]},{teks:"Stabilitas: MCL (pita anterior) penstabil valgus utama — 30% pada ekstensi penuh, > 50% pada fleksi 90°; pita anterior utuh menjaga valgus bahkan tanpa kaput radius. Dengan ligamen utuh, seluruh ujung olekranon atau hingga 50% ujung koronoid dapat direseksi tanpa mengganggu stabilitas.",ref:[X(247),Ba(639)]}],epidemiologi:[{teks:"**11–28%** cedera siku; posterior 80–90%; 6–8 per 100.000/tahun; puncak 10–20 tahun (olahraga); rekurensi jarang.",ref:X(246)},{teks:"Kompleks (dengan fraktur) sedikit < 50%; fraktur penyerta: kaput radius 5–11%, epikondilus medial/lateral 12–34% (dapat terjepit dan menghalangi reduksi), koronoid 5–10% (avulsi brakialis, tersering pada dislokasi posterior).",ref:[X(246),X(250)]}]},klasifikasi:[{nama:"Simpel vs kompleks; arah",teks:"Simpel (ligamen saja) vs kompleks (dengan fraktur); arah pergeseran ulna terhadap humerus: posterior, posterolateral, posteromedial, lateral, medial, anterior.",ref:X(249)},{nama:"Regan–Morrey (koronoid)",teks:"I avulsi ujung; II fragmen tunggal/kominutif ≤ 50% koronoid; III > 50%. Adams–Morrey (CT): 1 ujung, 2 transversal tengah, 3 basal, 4 oblik anteromedial, 5 oblik anterolateral.",ref:[X(250),Ba(640)]},{nama:"Skala instabilitas Morrey",teks:"I instabilitas rotatori posterolateral (pivot shift +; LUCL putus); II kondilus *perched*, instabilitas varus (LUCL + kapsul anterior-posterior); IIIa dislokasi posterior, instabilitas valgus (+ MCL posterior); IIIb dislokasi posterior sangat tidak stabil (+ MCL anterior dan posterior).",ref:X(253)},{nama:"Pola fraktur-dislokasi",teks:"Dislokasi posterior + kaput radius; + kaput radius + koronoid (*terrible triad*); varus–posteromedial (faset anteromedial koronoid); fraktur-dislokasi olekranon anterior (transolekranon) dan posterior (Monteggia posterior).",ref:[X(251),Ba(651),Ba(652)]}],kelompok:[{id:"simpel",nama:{id:"Dislokasi simpel",en:"Simple dislocation"},kode:"ligamen saja",jenis:[{id:"posterior",nama:{id:"Posterior / posterolateral",en:"Posterior / posterolateral"},kode:"80–90%",gambar:"dislokasi-siku:posterior",ringkas:"Hiperekstensi–valgus–supinasi; reduksi tertutup dengan traksi dan fleksi; stabilitas dinilai sesudahnya.",ref:[X(246),X(248),X(254)],indikasi:"simpel"},{id:"perched",nama:{id:"Perched / subluksasi (Morrey II)",en:"Perched / subluxation (Morrey II)"},kode:"",gambar:"dislokasi-siku:perched",ringkas:"Koronoid bertengger di troklea; LUCL dan kapsul anterior–posterior putus; instabilitas varus.",ref:X(253),indikasi:"simpel"},{id:"anterior",nama:{id:"Anterior",en:"Anterior"},kode:"jarang",gambar:"dislokasi-siku:anterior",ringkas:"Pukulan langsung pada lengan bawah posterior dengan siku fleksi.",ref:X(248),indikasi:"simpel"}]},{id:"kompleks",nama:{id:"Fraktur-dislokasi",en:"Fracture-dislocation"},kode:"< 50%",jenis:[{id:"terrible-triad",nama:{id:"Terrible triad",en:"Terrible triad"},kode:"kaput radius + koronoid",gambar:"dislokasi-siku:terrible-triad",ringkas:"Fraktur koronoid sekecil apa pun ditambah dislokasi + fraktur kaput radius melipatgandakan instabilitas dan komplikasi; koronoidnya hampir selalu tipe I–II.",ref:[X(251),X(255)],indikasi:"triad"},{id:"koronoid",nama:{id:"Fraktur koronoid (Regan–Morrey)",en:"Coronoid fracture (Regan–Morrey)"},kode:"I–III",gambar:"dislokasi-siku:koronoid-2",ringkas:"Avulsi oleh brakialis; koronoid adalah kunci takik troklea — pemulihannya menjadi prinsip utama.",ref:[X(250),X(253)],indikasi:"koronoid"},{id:"anteromedial",nama:{id:"Faset anteromedial (varus–posteromedial)",en:"Anteromedial facet (varus posteromedial)"},kode:"Adams–Morrey 4",gambar:"dislokasi-siku:anteromedial",ringkas:"Tanpa fraktur kaput radius → mudah terlewat; disertai cedera LCL, fraktur olekranon, atau basis koronoid.",ref:[X(251),X(253)],indikasi:"koronoid"},{id:"transolekranon",nama:{id:"Transolekranon (anterior)",en:"Transolecranon (anterior)"},kode:"2U1C3",gambar:"dislokasi-siku:transolekranon",ringkas:"Pukulan energi tinggi pada siku fleksi 90°; radius + ulna bergeser ke anterior dengan sendi radioulnar proksimal utuh — instabilitas dari rusaknya takik troklea, bukan dislokasi.",ref:[X(252),Ba(651)],indikasi:"olekranon-fd"},{id:"monteggia-posterior",nama:{id:"Fraktur-dislokasi olekranon posterior (Monteggia posterior)",en:"Posterior olecranon fracture-dislocation (posterior Monteggia)"},kode:"",gambar:"dislokasi-siku:monteggia-posterior",ringkas:"Mekanisme seperti dislokasi posterior tetapi ulna proksimal yang gagal (fragmen segitiga/kuadrangular ± koronoid); kaput radius biasanya patah dan terdislokasi posterolateral; MCL tetap utuh.",ref:Ba(652),indikasi:"olekranon-fd"}]}],indikasi:{simpel:{intro:"Reduksi tertutup dalam sedasi/analgesia, lalu uji busur gerak yang stabil: stabil → splint 90° 3–5 hari lalu ortosis engsel; tak stabil < 30° fleksi → coba pronasi; tak stabil > 30° fleksi → operasi.",ref:X(254),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup → splint → brace engsel",en:"Closed reduction → splint → hinged brace"},gambar:"dislokasi-siku:reduksi",utama:["Koreksi pergeseran medial/lateral, traksi longitudinal, fleksi","Stabil sepanjang busur gerak: splint 90°, ortosis engsel setelah 3–5 hari, 6 minggu"],ref:X(254),tatalaksana:"reduksi"},{id:"pronasi",nama:{id:"Splint 90° + pronasi → brace engsel pronasi",en:"Splint at 90° in pronation → hinged brace in pronation"},gambar:"dislokasi-siku:brace-engsel",utama:["Tak stabil pada < 30° fleksi tetapi stabil dengan pronasi lengan bawah"],ref:X(254),tatalaksana:"reduksi"},{id:"op",nama:{id:"Reduksi terbuka + perbaikan LCL (± MCL, eksfiks engsel)",en:"Open reduction + LCL repair (± MCL, hinged fixator)"},gambar:"dislokasi-siku:lcl-repair",utama:["Tak stabil pada > 30° fleksi; subluksasi/dislokasi selama terapi; fraktur penyerta tak stabil","LCL dulu (anchor/terowongan tulang
