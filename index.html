:root {
  --ground: #f2f6fa;
  --surface: #ffffff;
  --surface-2: #eaf1f7;
  --sidebar: #ffffff;
  --ink: #0e2233;
  --ink-2: #3d5568;
  --muted: #566d80;
  --line: #dde7f0;
  --line-strong: #c3d4e2;
  --accent: #0b77bd;
  --accent-soft: #e3f0fa;

  --warn: #a8490a;
  --warn-soft: #fdf0d3;
  --crit: #b91c1c;
  --crit-soft: #fde3e0;
  --bayang: 0 1px 3px rgb(14 34 51 / 0.07);
  --bayang-naik: 0 8px 24px rgb(14 34 51 / 0.1);

  /* Warna anatomi (sama dengan Atlas Gerak) + warna implan. */
  --tulang: #f7f2e8;
  --tulang-tepi: #a3957c;
  --tulang-dalam: #e6dcc8;
  --rawan: #d6ebf7;
  --fisis: #bfe3f5;
  --ligamen: #0b77bd;
  --ligamen-soft: #9dcbea;
  --otot: #c2563f;
  --otot-soft: #f1b7ab;
  --saraf: #d9a400;
  --sorot: #0b77bd;
  --bayangan-tubuh: #e4ecf3;
  --implan: #5b6b7a;
  --implan-tepi: #2f3d4a;
  --kalus: #f0c069;
  --fraktur: #b91c1c;
  --kulit: #f6ddc9;
  --luka: #d9705a;

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
code, kbd, .mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main:focus { outline: none; }
.ikon { width: 1em; height: 1em; display: inline-block; vertical-align: middle; flex: none; }
.ikon svg { width: 100%; height: 100%; display: block; }

/* ---------- Kerangka halaman ---------- */
.app {
  height: 100dvh;
  display: grid;
  grid-template-columns: 17rem minmax(0, 1fr);
  transition: grid-template-columns 200ms ease;
}
.app.menu-sembunyi { grid-template-columns: 0 minmax(0, 1fr); }
.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  min-height: 0; overflow: hidden; width: 17rem;
}
.app.menu-sembunyi .sidebar { visibility: hidden; }
.sidebar-isi { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
.merek { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.5rem 0.25rem; text-decoration: none; color: inherit; }
.merek-marka {
  width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;
  background: var(--accent-soft); color: var(--accent-ink);
  display: grid; place-items: center; flex: none;
}
.merek-marka svg { width: 1.6rem; height: 1.6rem; }
.merek-nama { font-size: 1.05rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
.merek-nama b { color: var(--accent-ink); }
.merek-sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.15rem; }

.nav { display: flex; flex-direction: column; gap: 0.7rem; }
.nav-grup { display: flex; flex-direction: column; gap: 0.1rem; }
.nav-label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); padding: 0 0.75rem; margin-bottom: 0.2rem; }
details.nav-grup > summary { cursor: pointer; list-style: none; }
details.nav-grup > summary::-webkit-details-marker { display: none; }
details.nav-grup > summary::after { content: ""; width: 0.45rem; height: 0.45rem; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); margin-left: 0.4rem; transition: transform 150ms; }
details.nav-grup[open] > summary::after { transform: rotate(45deg); }
.nav-label .progres-kecil { margin-left: auto; font-family: var(--font-mono); letter-spacing: 0; font-weight: 500; }
.nav-butir {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.32rem 0.7rem; border-radius: 0.75rem;
  font-size: 0.82rem; font-weight: 500; color: var(--ink-2);
  text-decoration: none; border: 0; background: none; text-align: left; width: 100%;
  transition: background-color 120ms;
}
.nav-butir .teks { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-butir .ikon { font-size: 1.1rem; color: var(--muted); }
.nav-butir:hover { background: var(--surface-2); }
.nav-butir.aktif { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav-butir.aktif .ikon { color: var(--accent-ink); }
.nav-butir.segera { opacity: 0.55; }
.nav-nomor { font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); min-width: 2.1rem; }
.nav-cek { margin-left: auto; font-size: 0.95rem; color: var(--ok); }
.nav-butir .nav-bm { margin-left: auto; font-size: 0.9rem; color: var(--accent-ink); }

.sidebar-kaki { border-top: 1px solid var(--line); padding: 0.75rem; display: flex; flex-direction: column; gap: 0.6rem; }
.chip-sesi { display: flex; align-items: center; gap: 0.5rem; background: var(--surface-2); border-radius: 0.75rem; padding: 0.5rem 0.65rem; }
.chip-sesi .ikon { font-size: 1.1rem; color: var(--muted); }
.chip-sesi-eyebrow { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.chip-sesi-nama { font-size: 0.76rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progres-bar { height: 0.4rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progres-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 300ms; }
.pintasan { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; font-size: 0.68rem; color: var(--muted); }
kbd {
  font-family: var(--font-mono); font-size: 0.62rem;
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 0.35rem;
  padding: 0 0.3rem; background: var(--surface); color: var(--ink-2);
}
.pilih-bahasa { display: inline-flex; border: 1px solid var(--line); border-radius: 0.75rem; overflow: hidden; background: var(--surface-2); padding: 0.15rem; gap: 0.15rem; }
.pilih-bahasa button { border: 0; background: none; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; padding: 0.3rem 0.55rem; border-radius: 0.55rem; color: var(--muted); }
.pilih-bahasa button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--bayang); }
.baris-bahasa { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.label-bahasa { font-size: 0.72rem; color: var(--muted); }

.kanan { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar-atas {
  display: flex; align-items: center; gap: 0.75rem;
  border-bottom: 1px solid var(--line); background: var(--surface);
  padding: 0.6rem 1.5rem; min-height: 3.9rem;
}
.bar-atas .judul { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.kicker { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-atas h1 { margin: 0; font-size: 1.3rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-aksi { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; flex: none; }
.tombol-ikon {
  display: grid; place-items: center; width: 2.5rem; height: 2.5rem;
  border-radius: 0.75rem; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink-2); font-size: 1.15rem; transition: background-color 120ms;
}
.tombol-ikon:hover { background: var(--surface-2); }
.tombol-ikon.aktif { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-soft); }
.tombol-cari { display: inline-flex; align-items: center; gap: 0.5rem; height: 2.5rem; padding: 0 0.8rem; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 0.82rem; }
.tombol-cari .ikon { font-size: 1.05rem; }
.tombol-cari kbd { margin-left: 0.3rem; }
.ikon-terang { display: none; } .ikon-gelap { display: inline-block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ikon-terang { display: inline-block; }
  :root:not([data-theme="light"]) .ikon-gelap { display: none; }
}
:root[data-theme="dark"] .ikon-terang { display: inline-block; }
:root[data-theme="dark"] .ikon-gelap { display: none; }
:root[data-theme="light"] .ikon-terang { display: none; }
:root[data-theme="light"] .ikon-gelap { display: inline-block; }

main { flex: 1; min-height: 0; overflow-y: auto; padding: 1.25rem 1.5rem 2rem; }
main.panggung-mode { display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: 1rem; overflow: hidden; padding-bottom: 1.25rem; }
main.panggung-mode.tanpa-panel { grid-template-columns: minmax(0, 1fr); }

/* ---------- Badge, tombol, chip ---------- */
.lencana {
  display: inline-flex; align-items: center; gap: 0.3rem;
  border-radius: 999px; padding: 0.22rem 0.65rem; font-size: 0.72rem; font-weight: 600; white-space: nowrap;
}
.lencana .ikon { font-size: 0.95rem; }
.lencana.aksen { background: var(--accent-soft); color: var(--accent-ink); }
.lencana.netral { background: var(--surface-2); color: var(--muted); }
.lencana.baik { background: var(--ok-soft); color: var(--ok); }
.lencana.awas { background: var(--warn-soft); color: var(--warn); }
.lencana.buruk { background: var(--crit-soft); color: var(--crit); }
.baris-tombol { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.tombol {
  display: inline-flex; align-items: center; gap: 0.5rem; height: 2.4rem; padding: 0 0.95rem;
  border-radius: 0.75rem; font-size: 0.86rem; font-weight: 600; border: 1px solid transparent;
  text-decoration: none; transition: opacity 120ms, background-color 120ms;
}
.tombol .ikon { font-size: 1.05rem; }
.tombol.utama { background: var(--accent); color: var(--on-accent); box-shadow: var(--bayang); }
.tombol.utama:hover { opacity: 0.9; }
.tombol.garis { border-color: var(--line); background: var(--surface); color: var(--ink-2); }
.tombol.garis:hover { background: var(--surface-2); }
.tombol.garis.aktif { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.tombol.kecil { height: 2rem; padding: 0 0.7rem; font-size: 0.78rem; }
.tombol:disabled { opacity: 0.5; cursor: default; }
.pemindah { display: inline-flex; flex-wrap: wrap; gap: 0.25rem; border-radius: 1rem; border: 1px solid var(--line); background: var(--surface-2); padding: 0.25rem; }
.pemindah button {
  display: inline-flex; align-items: center; gap: 0.4rem; border: 0; background: none;
  border-radius: 0.75rem; padding: 0.4rem 0.85rem; font-size: 0.84rem; font-weight: 500; color: var(--ink-2);
}
.pemindah button .ikon { font-size: 1rem; }
.pemindah button.aktif { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--bayang); }
.chip-baris { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem; border-radius: 999px; padding: 0.3rem 0.75rem;
  font-size: 0.8rem; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  text-decoration: none;
}
.chip:hover { background: var(--surface-2); }
.chip.aktif { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.chip.mono { font-family: var(--font-mono); font-size: 0.76rem; }
.chip .titik { width: 0.6rem; height: 0.6rem; border-radius: 999px; background: var(--ligamen); }
.chip.rujukan { border-style: dashed; color: var(--muted); font-size: 0.72rem; }
.chip.rujukan b { color: var(--ink-2); font-weight: 600; }
.ref { display: inline-flex; align-items: center; margin-left: 0.35rem; font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); white-space: nowrap; vertical-align: baseline; border: 1px dashed var(--line-strong); border-radius: 999px; padding: 0 0.4rem; line-height: 1.5; }

/* ---------- Kartu & teks ---------- */
.kartu {
  border-radius: 1rem; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--bayang);
  padding: 0.95rem 1rem; display: flex; flex-direction: column; gap: 0.7rem;
}
.kartu h2, .kartu h3 { margin: 0; font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.5rem; }
.kartu h2 .ikon, .kartu h3 .ikon { color: var(--muted); font-size: 1.05rem; }
.eyebrow { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.keterangan { font-size: 0.82rem; color: var(--ink-2); margin: 0; }
.keterangan b { color: var(--ink); }
.catatan-kartu {
  display: flex; gap: 0.6rem; border-radius: 1rem 1rem 1rem 0.5rem; border: 1px solid var(--line);
  border-left: 4px solid var(--accent); background: var(--surface); padding: 0.7rem 0.85rem; font-size: 0.82rem; color: var(--ink-2);
}
.catatan-kartu .ikon { color: var(--accent-ink); font-size: 1.05rem; flex: none; margin-top: 0.1rem; }
.catatan-kartu.awas { border-left-color: var(--warn); } .catatan-kartu.awas .ikon { color: var(--warn); }
.catatan-kartu.buruk { border-left-color: var(--crit); } .catatan-kartu.buruk .ikon { color: var(--crit); }
.istilah-link { color: inherit; text-decoration: underline dotted var(--accent); text-underline-offset: 3px; cursor: help; }
.istilah-link:hover { color: var(--accent-ink); }

/* ---------- Beranda ---------- */
.beranda { display: flex; flex-direction: column; gap: 1.5rem; max-width: 76rem; margin: 0 auto; }
.beranda h1 { margin: 0; font-size: 2.2rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; }
.beranda .keterangan-besar { color: var(--ink-2); max-width: 66ch; margin: 0.4rem 0 0; font-size: 0.95rem; }
.sambutan { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; }
.statistik-baris { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.statistik { display: flex; flex-direction: column; gap: 0.5rem; padding: 1rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: var(--bayang); }
.statistik .kotak-ikon { width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; display: grid; place-items: center; font-size: 1.2rem; background: var(--accent-soft); color: var(--accent-ink); }
.statistik .nilai { font-size: 1.7rem; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
.statistik .label { font-size: 0.86rem; font-weight: 500; color: var(--ink-2); }
.statistik .sub { font-size: 0.74rem; color: var(--muted); }
.grid-modul { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.kartu-modul { display: flex; flex-direction: column; gap: 0.8rem; padding: 1.2rem; text-align: left; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: var(--bayang); cursor: pointer; transition: box-shadow 150ms, transform 150ms; text-decoration: none; color: inherit; }
.kartu-modul:hover { box-shadow: var(--bayang-naik); transform: translateY(-2px); }
.kartu-modul .kotak-ikon { width: 2.75rem; height: 2.75rem; border-radius: 0.75rem; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-size: 1.35rem; }
.kartu-modul h2 { margin: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: -0.015em; }
.kartu-modul p { margin: 0; font-size: 0.84rem; color: var(--ink-2); }
.kartu-modul .kaki { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.kartu-modul.segera { opacity: 0.6; }
.grid-alat { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.kartu-alat { display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 1rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: var(--bayang); text-decoration: none; color: inherit; transition: box-shadow 150ms; }
.kartu-alat:hover { box-shadow: var(--bayang-naik); }
.kartu-alat .kotak-ikon { width: 2.4rem; height: 2.4rem; border-radius: 0.75rem; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-size: 1.2rem; flex: none; }
.kartu-alat b { display: block; font-size: 0.9rem; }
.kartu-alat span { font-size: 0.74rem; color: var(--muted); }
.judul-bagian { display: flex; align-items: baseline; gap: 0.75rem; margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -0.015em; }
.judul-bagian small { font-size: 0.74rem; font-weight: 500; color: var(--muted); }

/* ---------- Halaman bab (artikel) ---------- */
.artikel { max-width: 62rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }
.kepala-bab { display: flex; flex-direction: column; gap: 0.6rem; }
.kepala-bab .baris-atas { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.kepala-bab h1 { margin: 0; font-size: 2rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; }
.kepala-bab .judul-en { font-size: 1rem; color: var(--muted); font-weight: 500; }
.kepala-bab .aksi-bab { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.ringkasan { border-left: 4px solid var(--accent); }
.ringkasan p { margin: 0; font-size: 1rem; line-height: 1.55; color: var(--ink); }
.angka-baris { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.75rem; }
.angka { display: flex; flex-direction: column; gap: 0.25rem; padding: 0.85rem 0.95rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: var(--bayang); }
.angka .nilai { font-size: 1.6rem; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.angka .label { font-size: 0.78rem; color: var(--ink-2); }
.daftar-poin { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.55rem; }
.daftar-poin li { display: flex; gap: 0.6rem; align-items: flex-start; font-size: 0.9rem; color: var(--ink-2); line-height: 1.5; }
.daftar-poin li .ikon { color: var(--accent-ink); font-size: 1rem; flex: none; margin-top: 0.2rem; }
.daftar-poin li.penting { background: var(--accent-soft); border-radius: 0.75rem; padding: 0.55rem 0.7rem; color: var(--ink); }
.daftar-poin li.penting .ikon { color: var(--accent-ink); }
.daftar-poin li b { color: var(--ink); }
.tabel-bungkus { overflow-x: auto; }
table.tabel { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
table.tabel th, table.tabel td { text-align: left; padding: 0.5rem 0.65rem; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tabel th { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--surface-2); }
table.tabel tr:last-child td { border-bottom: 0; }
table.tabel td:first-child { font-weight: 600; color: var(--ink); }
.langkah { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: 0.45rem; font-size: 0.88rem; color: var(--ink-2); }
.langkah li::marker { color: var(--accent-ink); font-weight: 700; }
.langkah .cabang { margin: 0.3rem 0 0; padding-left: 1rem; list-style: none; display: flex; flex-direction: column; gap: 0.3rem; border-left: 2px solid var(--line-strong); }
.langkah .cabang li::before { content: "→ "; color: var(--accent-ink); }
.grid-dua { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.kartu-tautan { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.9rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); text-decoration: none; color: inherit; transition: box-shadow 150ms; }
.kartu-tautan:hover { box-shadow: var(--bayang-naik); }
.kartu-tautan .kotak-ikon { width: 2.2rem; height: 2.2rem; border-radius: 0.7rem; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-size: 1.1rem; flex: none; }
.kartu-tautan b { display: block; font-size: 0.86rem; }
.kartu-tautan span { font-size: 0.72rem; color: var(--muted); }
.nav-bab { display: flex; justify-content: space-between; gap: 1rem; margin-top: 0.5rem; }
.nav-bab a { flex: 1; display: flex; flex-direction: column; gap: 0.2rem; padding: 0.8rem 1rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); text-decoration: none; color: inherit; }
.nav-bab a:hover { box-shadow: var(--bayang-naik); }
.nav-bab a.kanan-align { text-align: right; align-items: flex-end; }
.nav-bab .arah { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.nav-bab b { font-size: 0.9rem; }
.segera-kartu { text-align: center; padding: 2rem 1rem; }
.segera-kartu .ikon { font-size: 2.2rem; color: var(--muted); }

/* ---------- Kuis ---------- */
.kuis { display: flex; flex-direction: column; gap: 0.8rem; }
.kuis-kepala { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.kuis-progres { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.kuis-soal { font-size: 1.02rem; font-weight: 600; line-height: 1.5; margin: 0; }
.opsi-daftar { display: flex; flex-direction: column; gap: 0.5rem; }
.opsi { display: flex; gap: 0.7rem; align-items: flex-start; text-align: left; padding: 0.7rem 0.85rem; border: 1px solid var(--line); border-radius: 0.9rem; background: var(--surface); color: var(--ink-2); font-size: 0.9rem; line-height: 1.45; transition: background-color 120ms, border-color 120ms; }
.opsi:hover { background: var(--surface-2); }
.opsi .huruf { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 0.5rem; display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.opsi.benar { border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
.opsi.benar .huruf { background: var(--ok); color: #fff; }
.opsi.salah { border-color: var(--crit); background: var(--crit-soft); color: var(--ink); }
.opsi.salah .huruf { background: var(--crit); color: #fff; }
.opsi:disabled { cursor: default; }
.opsi:disabled:not(.benar):not(.salah) { opacity: 0.6; }
.kuis-umpan { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.75rem 0.9rem; border-radius: 0.9rem; font-size: 0.86rem; line-height: 1.5; }
.kuis-umpan.benar { background: var(--ok-soft); color: var(--ink); }
.kuis-umpan.salah { background: var(--crit-soft); color: var(--ink); }
.kuis-umpan .ikon { font-size: 1.1rem; flex: none; margin-top: 0.15rem; }
.kuis-umpan.benar .ikon { color: var(--ok); } .kuis-umpan.salah .ikon { color: var(--crit); }
.kuis-hasil { text-align: center; display: flex; flex-direction: column; gap: 0.6rem; align-items: center; padding: 1rem 0; }
.kuis-hasil .nilai { font-size: 3rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--accent-ink); }
.kuis-hasil .label { font-size: 0.9rem; color: var(--ink-2); }
.ulasan-daftar { display: flex; flex-direction: column; gap: 0.5rem; }
.ulasan { display: flex; gap: 0.6rem; font-size: 0.82rem; padding: 0.6rem 0.75rem; border-radius: 0.75rem; border: 1px solid var(--line); }
.ulasan .ikon { flex: none; margin-top: 0.15rem; }
.ulasan.benar .ikon { color: var(--ok); } .ulasan.salah .ikon { color: var(--crit); }
.tingkat { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Flashcard ---------- */
.flash-area { display: flex; flex-direction: column; gap: 1rem; max-width: 46rem; margin: 0 auto; }
.flash-kartu { position: relative; min-height: 15rem; border-radius: 1.25rem; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--bayang); padding: 1.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 0.6rem; cursor: pointer; }
.flash-kartu .depan { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; }
.flash-kartu .belakang { font-size: 0.98rem; color: var(--ink-2); line-height: 1.55; max-width: 36rem; }
.flash-kartu .padanan { font-size: 1rem; color: var(--accent-ink); font-weight: 600; }
.flash-kartu .petunjuk { position: absolute; bottom: 0.8rem; font-size: 0.7rem; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------- Klasifikasi ---------- */
.klas { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1rem; max-width: 76rem; margin: 0 auto; }
.klas-kiri { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.klas-jenjang { display: flex; flex-direction: column; gap: 0.5rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--line); }
.klas-skema-kartu .klas-jenjang { border-radius: 0; background: none; box-shadow: none; border: 0; border-bottom: 1px solid var(--line); padding: 0 0 0.6rem; }
.klas-tingkat { display: flex; flex-direction: column; gap: 0.3rem; }
.klas-tingkat .eyebrow { padding-left: 0.1rem; }
.klas-skema-kartu { position: relative; min-height: 22rem; }
.klas-skema { width: 100%; height: 100%; min-height: 20rem; }
.klas-skema svg { width: 100%; height: 100%; max-height: 26rem; display: block; }
.klas-kode { position: absolute; bottom: 0.9rem; right: 0.9rem; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 0.1rem; padding: 0.55rem 0.9rem; border-radius: 0.9rem; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--bayang); }
.klas-kode .nilai { font-family: var(--font-mono); font-size: 2.2rem; line-height: 1; font-weight: 700; letter-spacing: -0.02em; color: var(--accent-ink); }
.klas-kode .label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.klas-kanan { display: flex; flex-direction: column; gap: 0.85rem; min-width: 0; }
.klas-kanan .judul-simpul { margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.015em; }
.klas-kanan .judul-simpul small { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); }
.klas-anak { display: flex; flex-direction: column; gap: 0.35rem; }
.klas-anak button { display: flex; align-items: center; gap: 0.6rem; text-align: left; padding: 0.5rem 0.7rem; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 0.82rem; }
.klas-anak button:hover { background: var(--surface-2); }
.klas-anak button .kode { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 600; color: var(--accent-ink); min-width: 3rem; }
.klas-anak button .ikon { margin-left: auto; color: var(--muted); }

/* ---------- Pencarian ---------- */
dialog { border: 0; padding: 0; background: transparent; color: inherit; }
dialog::backdrop { background: rgb(7 21 32 / 0.45); backdrop-filter: blur(2px); }
.dialog-kotak { width: min(42rem, 92vw); border-radius: 1.25rem; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--bayang-naik); overflow: hidden; display: flex; flex-direction: column; max-height: 80vh; }
.cari-input { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
.cari-input .ikon { font-size: 1.2rem; color: var(--muted); }
.cari-input input { flex: 1; border: 0; background: none; font-size: 1.05rem; outline: none; }
.cari-hasil { overflow-y: auto; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
.cari-grup .eyebrow { padding: 0.4rem 0.6rem 0.2rem; }
.cari-butir { display: flex; align-items: center; gap: 0.7rem; width: 100%; text-align: left; padding: 0.55rem 0.7rem; border-radius: 0.75rem; border: 0; background: none; color: var(--ink-2); font-size: 0.86rem; text-decoration: none; }
.cari-butir .ikon { color: var(--muted); font-size: 1.05rem; }
.cari-butir b { color: var(--ink); font-weight: 600; }
.cari-butir small { color: var(--muted); font-size: 0.74rem; margin-left: auto; white-space: nowrap; }
.cari-butir:hover, .cari-butir.aktif { background: var(--accent-soft); color: var(--accent-ink); }
.cari-butir mark { background: var(--warn-soft); color: inherit; border-radius: 0.2rem; }
.cari-kosong { padding: 1.5rem; text-align: center; color: var(--muted); font-size: 0.86rem; }
.dialog-isi { padding: 1.25rem 1.4rem; display: flex; flex-direction: column; gap: 0.8rem; overflow-y: auto; }
.dialog-isi h2 { margin: 0; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.6rem; }
.dialog-isi h2 .tombol-ikon { margin-left: auto; }
.daftar-pintasan { display: grid; grid-template-columns: auto 1fr; gap: 0.45rem 1rem; font-size: 0.86rem; color: var(--ink-2); align-items: center; }
.popover-istilah { position: fixed; z-index: 50; width: min(22rem, 90vw); padding: 0.8rem 0.95rem; border-radius: 1rem; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--bayang-naik); font-size: 0.82rem; color: var(--ink-2); display: flex; flex-direction: column; gap: 0.3rem; }
.popover-istilah b { color: var(--ink); font-size: 0.9rem; }
.popover-istilah .padanan { color: var(--accent-ink); font-weight: 600; font-size: 0.78rem; }
.popover-istilah a { font-size: 0.74rem; }

/* ---------- Glosarium ---------- */
.glosarium { max-width: 62rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.huruf-baris { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.huruf-baris a { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; padding: 0.25rem 0.5rem; border-radius: 0.5rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); text-decoration: none; }
.glos-grup { display: flex; flex-direction: column; gap: 0.5rem; }
.glos-grup h2 { margin: 0.5rem 0 0; font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent-ink); }
.glos-butir { display: grid; grid-template-columns: 14rem 1fr; gap: 0.75rem; padding: 0.6rem 0.9rem; border: 1px solid var(--line); border-radius: 0.9rem; background: var(--surface); font-size: 0.84rem; }
.glos-butir b { font-size: 0.9rem; display: block; }
.glos-butir .padanan { display: block; color: var(--accent-ink); font-size: 0.76rem; font-weight: 600; }
.glos-butir p { margin: 0; color: var(--ink-2); }
.glos-butir .bab-link { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }

/* ---------- Panggung adegan ---------- */
.panggung {
  position: relative;
  border-radius: 1rem; border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--bayang); min-height: 0; overflow: hidden;
  display: flex; flex-direction: column;
}
.panggung-isi { flex: 1; min-height: 0; position: relative; }
.panggung-isi > svg { width: 100%; height: 100%; display: block; }
.panggung-kaki {
  display: flex; align-items: center; gap: 0.75rem;
  border-top: 1px solid var(--line); padding: 0.6rem 1.1rem;
  font-size: 0.86rem; color: var(--ink-2); min-height: 2.9rem;
}
.panggung-kaki .lencana { margin-left: auto; }
.catatan-adegan { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.penanda-tampak {
  position: absolute; top: 0.9rem; left: 0.9rem; z-index: 2;
  display: inline-flex; gap: 0.25rem; padding: 0.25rem; border-radius: 0.75rem;
  background: var(--surface-2); border: 1px solid var(--line);
}
.penanda-tampak button { border: 0; background: none; border-radius: 0.55rem; padding: 0.3rem 0.8rem; font-size: 0.8rem; font-weight: 500; color: var(--ink-2); }
.penanda-tampak button.aktif { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--bayang); }
.sudut-besar {
  position: absolute; top: 0.9rem; right: 0.9rem; z-index: 2;
  display: flex; flex-direction: column; align-items: flex-end; gap: 0.1rem;
  padding: 0.55rem 0.9rem; border-radius: 0.9rem; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--bayang);
}
.sudut-besar .nilai { font-size: 2.1rem; line-height: 1; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.sudut-besar .nilai.awas { color: var(--warn); }
.sudut-besar .nilai.buruk { color: var(--crit); }
.sudut-besar .nilai.baik { color: var(--ok); }
.sudut-besar .label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.panel { display: flex; flex-direction: column; gap: 0.85rem; min-height: 0; overflow-y: auto; padding-right: 0.1rem; }
.geser { display: flex; flex-direction: column; gap: 0.3rem; }
.geser-kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.geser-nama { font-size: 0.86rem; font-weight: 600; color: var(--ink); }
.geser-nilai { font-family: var(--font-mono); font-size: 0.86rem; font-weight: 500; color: var(--accent-ink); }
.geser-nilai.awas { color: var(--warn); }
.geser-rel { position: relative; height: 1.5rem; display: flex; align-items: center; }
.geser-normal { position: absolute; left: 0; right: 0; height: 0.5rem; border-radius: 999px; background: var(--surface-2); }
.geser-normal::after { content: ""; position: absolute; inset: 0; border-radius: 999px; background: var(--accent-soft); left: var(--a, 0%); right: var(--b, 0%); }
input[type="range"].geser-input { position: relative; width: 100%; margin: 0; background: none; -webkit-appearance: none; appearance: none; height: 1.5rem; }
input[type="range"].geser-input::-webkit-slider-runnable-track { height: 0.5rem; background: transparent; }
input[type="range"].geser-input::-webkit-slider-thumb {
  -webkit-appearance: none; width: 1.25rem; height: 1.25rem; margin-top: -0.375rem; border-radius: 999px;
  background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong), var(--bayang);
}
input[type="range"].geser-input::-moz-range-track { height: 0.5rem; background: transparent; }
input[type="range"].geser-input::-moz-range-thumb { width: 1.1rem; height: 1.1rem; border-radius: 999px; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong); }
.geser-kaki { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); }
.saklar { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; font-size: 0.84rem; font-weight: 500; color: var(--ink); }
.saklar .tuas { position: relative; width: 2.6rem; height: 1.45rem; border-radius: 999px; background: var(--line-strong); border: 0; transition: background-color 150ms; flex: none; }
.saklar .tuas::after { content: ""; position: absolute; top: 0.15rem; left: 0.15rem; width: 1.15rem; height: 1.15rem; border-radius: 999px; background: var(--surface); box-shadow: var(--bayang); transition: transform 150ms; }
.saklar .tuas[aria-checked="true"] { background: var(--accent); }
.saklar .tuas[aria-checked="true"]::after { transform: translateX(1.15rem); }
.daftar-fakta { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
.daftar-fakta li { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.82rem; color: var(--ink-2); }
.daftar-fakta li .ikon { color: var(--accent-ink); font-size: 0.95rem; flex: none; position: relative; top: 0.1rem; }
.legenda { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; font-size: 0.74rem; color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; gap: 0.35rem; }
.legenda i { width: 0.8rem; height: 0.8rem; border-radius: 0.25rem; display: inline-block; }
.grid-adegan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; max-width: 76rem; margin: 0 auto; }

/* ---------- Gambar anatomi (SVG) ---------- */
.tulang { fill: var(--tulang); stroke: var(--tulang-tepi); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.tulang-garis { fill: none; stroke: var(--tulang-tepi); stroke-width: 1.6; stroke-linecap: round; opacity: 0.7; }
.tulang-dalam { fill: var(--tulang-dalam); stroke: none; opacity: 0.9; }
.rawan { fill: var(--rawan); stroke: none; }
.fisis { fill: var(--fisis); stroke: var(--ligamen-soft); stroke-width: 1; }
.bayangan-tubuh { fill: var(--bayangan-tubuh); stroke: none; }
.fraktur { fill: none; stroke: var(--fraktur); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.fraktur.tipis { stroke-width: 2; }
.fragmen { fill: var(--tulang); stroke: var(--fraktur); stroke-width: 2.4; stroke-linejoin: round; }
.segmen-sorot { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.9; }
.segmen-redup { fill: none; stroke: var(--line-strong); stroke-width: 1.2; stroke-dasharray: 4 4; }
.implan { fill: var(--implan); stroke: var(--implan-tepi); stroke-width: 1.4; stroke-linejoin: round; }
.implan-garis { fill: none; stroke: var(--implan-tepi); stroke-width: 2; stroke-linecap: round; }
.kalus { fill: var(--kalus); stroke: none; opacity: 0.85; }
.kulit { fill: var(--kulit); stroke: var(--tulang-tepi); stroke-width: 1.5; }
.otot { fill: var(--otot); stroke: var(--surface); stroke-width: 1; opacity: 0.85; }
.otot-soft { fill: var(--otot-soft); stroke: none; }
.luka { fill: var(--luka); stroke: var(--crit); stroke-width: 1.5; }
.sendi-titik { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
.sendi-garis { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; opacity: 0.8; }
.anot-panah { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; }
.anot-panah.awas { stroke: var(--warn); }
.anot-panah.buruk { stroke: var(--crit); }
.anot-ukur { stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 7 5; fill: none; }
.anot-titik { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
.anot-pil rect { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; filter: drop-shadow(0 2px 4px rgb(14 34 51 / 0.12)); }
.anot-pil text { font-family: var(--font-sans); font-size: 14px; font-weight: 600; fill: var(--ink); }
.anot-pil.awas rect { stroke: var(--warn); } .anot-pil.awas text { fill: var(--warn); }
.anot-pil.aksen rect { stroke: var(--accent); } .anot-pil.aksen text { fill: var(--accent-ink); }
.anot-pil.buruk rect { stroke: var(--crit); } .anot-pil.buruk text { fill: var(--crit); }
.anot-pil.ukur text { font-family: var(--font-mono); font-weight: 500; }
.teks-adegan { font-family: var(--font-sans); fill: var(--muted); font-size: 13px; }
.teks-mono { font-family: var(--font-mono); fill: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.teks-label { font-family: var(--font-sans); fill: var(--ink-2); font-size: 13px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.teks-besar { font-family: var(--font-sans); fill: var(--ink); font-size: 18px; font-weight: 800; }
.teks-sudut { font-family: var(--font-sans); fill: var(--accent-ink); font-size: 15px; font-weight: 700; }
.lantai { stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 6 6; }
.denyut { opacity: 0.25; transform-origin: center; animation: denyut 1.4s ease-out infinite; }
@keyframes denyut { 0% { transform: scale(0.5); opacity: 0.6; } 100% { transform: scale(1.25); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .denyut { animation: none; } * { transition-duration: 0ms !important; } }

/* ---------- Mode tayang ---------- */
.app.tayang main { padding: 1.5rem 2rem 2rem; }
.app.tayang .artikel { max-width: 72rem; font-size: 1.08em; }
.app.tayang .teks-adegan { font-size: 16px; } .app.tayang .teks-label { font-size: 16px; }

/* ---------- Responsif ---------- */
.tirai { display: none; }
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .app.menu-sembunyi { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(18rem, 85vw); transform: translateX(-100%); transition: transform 200ms ease; visibility: visible; box-shadow: var(--bayang-naik); }
  .app.menu-sembunyi .sidebar { visibility: visible; }
  .app.laci-terbuka .sidebar { transform: translateX(0); }
  .tirai { display: none; position: fixed; inset: 0; z-index: 39; background: rgb(7 21 32 / 0.45); }
  .app.laci-terbuka .tirai { display: block; }
  .bar-atas { padding: 0.5rem 0.9rem; gap: 0.5rem; }
  .bar-atas h1 { font-size: 1.05rem; }
  .tombol-cari > span:not(.ikon), .tombol-cari kbd { display: none; }
  .tombol-cari { width: 2.5rem; padding: 0; justify-content: center; }
  main { padding: 1rem 0.9rem 2rem; }
  main.panggung-mode { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(16rem, 55vh) auto; overflow-y: auto; }
  .statistik-baris, .grid-alat { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-modul, .grid-adegan, .grid-dua { grid-template-columns: minmax(0, 1fr); }
  .klas { grid-template-columns: minmax(0, 1fr); }
  .glos-butir { grid-template-columns: minmax(0, 1fr); }
  .kepala-bab h1 { font-size: 1.5rem; }
  .beranda h1 { font-size: 1.7rem; }
  .nav-bab { flex-direction: column; }
  .nav-bab a.kanan-align { align-items: flex-start; text-align: left; }
  .sudut-besar .nilai { font-size: 1.5rem; }
  .klas-kode .nilai { font-size: 1.5rem; }
}
@media (max-width: 600px) {
  .statistik-baris, .grid-alat { grid-template-columns: minmax(0, 1fr); }
  .bar-aksi .hanya-lebar { display: none; }
}
@media print {
  body { overflow: visible; }
  .sidebar, .bar-aksi, .nav-bab, .aksi-bab { display: none !important; }
  .app { display: block; height: auto; }
  main { overflow: visible; }
}

/* ---- kerangka utuh & region ---- */
.iga-tepi { fill: none; stroke: var(--tulang-tepi); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.iga { fill: none; stroke: var(--tulang); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
svg.rangka-utuh { width: 100%; height: 100%; display: block; }
svg.rangka-utuh .region { transition: opacity 200ms; }
svg.rangka-utuh.ada-sorot .region:not(.sorot) { opacity: 0.45; }
svg.rangka-utuh .region.sorot .tulang, svg.rangka-utuh .region.sorot .iga { filter: drop-shadow(0 0 6px rgb(14 110 184 / 0.35)); }

/* ---- gambar potongan (kartu diagnosis/indikasi) ---- */
svg.potong { width: 100%; height: 100%; display: block; overflow: visible; }
.pita-tepi { fill: none; stroke: var(--tulang-tepi); stroke-linecap: round; stroke-linejoin: round; }
.pita-tulang { fill: none; stroke: var(--tulang); stroke-linecap: round; stroke-linejoin: round; }
.implan-pita { fill: none; stroke: var(--implan); stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgb(0 0 0 / 0.25)); }
.sekrup { fill: var(--implan-tepi); stroke: var(--surface); stroke-width: 1; }

<script>
/* Tema: terapkan pilihan tersimpan sebelum render supaya tidak berkedip. */
(function(){try{var t=JSON.parse(localStorage.getItem("ortholifpedia.v1.tema")||"null");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);var r=JSON.parse(localStorage.getItem("ortholifpedia.v1.rujukan")||"false");if(r===true)document.documentElement.setAttribute("data-rujukan","tampil");}catch(e){}})();
/* Bahasa tampilan: "id" (bawaan) atau "en"; tombol ID/EN atau ?lang=en. Semua teks UI memilih versinya lewat window.__EN__. */
(function () {
  var lang = "id", simpan = true;
  try {
    var q = new URLSearchParams(location.search).get("lang");
    if (q === "en" || q === "id") { lang = q; localStorage.setItem("ortholifpedia.v1.bahasa", JSON.stringify(q)); }
    else if (localStorage.getItem("ortholifpedia.v1.bahasa") === '"en"') lang = "en";
  } catch (e) { simpan = false; }
  window.__EN__ = lang === "en";
  document.documentElement.lang = lang;
  if (window.__EN__) document.title = "OrthoLIFpedia · Interactive orthopaedic trauma encyclopedia";
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-bahasa]") : null;
    if (!b || b.getAttribute("data-bahasa") === lang) return;
    var pilih = b.getAttribute("data-bahasa"), url = new URL(location.href);
    try { localStorage.setItem("ortholifpedia.v1.bahasa", JSON.stringify(pilih)); } catch (e) { simpan = false; }
    if (url.searchParams.has("lang") || !simpan) {
      if (pilih === "id" && simpan) url.searchParams.delete("lang"); else url.searchParams.set("lang", pilih);
      location.replace(url.href);
    } else location.reload();
  });
})();
</script>

roximal femur"},"femur-prox",Ct,{id:"Pengecualian: segmen = di atas garis batas bawah trokanter minor; A trokanterik, B kolum, C kaput.",en:"Exception: segment = above the inferior border of the lesser trochanter; A trochanteric, B neck, C head."}),va("32",{id:"Femur diafisis (termasuk subtrokanter)",en:"Femoral shaft (including subtrochanteric)"},"diaf",je()),va("33",{id:"Femur distal",en:"Distal femur"},"ujung",Va({id:"Split-depresi / frontal (Hoffa)",en:"Split depression / frontal (Hoffa)"}))]),ge("34",{id:"Patela",en:"Patella"},[va("34",{id:"Patela",en:"Patella"},"patela",St,{id:"Tipe A avulsi kutub, B vertikal (ekstensor utuh), C transversal (ekstensor putus).",en:"Type A pole avulsion, B vertical (extensor intact), C transverse (extensor disrupted)."})]),ge("4",{id:"Tibia",en:"Tibia"},[va("41",{id:"Tibia proksimal (plateau)",en:"Proximal tibia (plateau)"},"ujung",Va({id:"Split-depresi (Schatzker II)",en:"Split depression (Schatzker II)"})),va("42",{id:"Tibia diafisis",en:"Tibial shaft"},"diaf",je()),va("43",{id:"Tibia distal (pilon)",en:"Distal tibia (pilon)"},"ujung",Va()),va("44",{id:"Maleolar",en:"Malleolar"},"maleolar",At,{id:"Pengecualian: diklasifikasi menurut level fraktur fibula terhadap sindesmosis (Danis-Weber).",en:"Exception: classified by the level of the fibular fracture relative to the syndesmosis (Danis-Weber)."})]),ge("4F",{id:"Fibula",en:"Fibula"},[va("4F1",{id:"Fibula proksimal",en:"Proximal fibula"},"ujung",Va()),va("4F2",{id:"Fibula diafisis",en:"Fibular shaft"},"diaf",je()),va("4F3",{id:"Fibula distal (bukan maleolar)",en:"Distal fibula (non-malleolar)"},"ujung",Va())])]}});var Di,Ki,Ni,Zi=ma(()=>{Di={id:"salter-harris",nama:{id:"Salter-Harris — cedera fisis",en:"Salter-Harris — physeal injury"},singkat:"Salter-Harris",deskripsi:{id:"Lima tipe cedera lempeng pertumbuhan menurut jalur garis fraktur terhadap fisis, metafisis, dan epifisis. Prognosis gangguan pertumbuhan memburuk dari tipe I ke V.",en:"Five types of growth-plate injury by the path of the fracture line through physis, metaphysis, and epiphysis. Risk of growth disturbance rises from type I to V."},sumber:[{buku:"AO",bab:"4.4",hlm:{awal:379,akhir:420}},{buku:"HoF",bab:"42",hlm:{awal:542,akhir:548}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Tipe I — melalui fisis saja",en:"Type I — through the physis only"},deskripsi:{id:"Pemisahan epifisis dari metafisis melalui zona hipertrofik fisis tanpa fragmen tulang; sering pada anak kecil. Radiografi bisa normal — diagnosis klinis (nyeri tekan di fisis).",en:"Separation of epiphysis from metaphysis through the hypertrophic zone with no bony fragment; common in young children. Radiographs may be normal — clinical diagnosis (physeal tenderness)."},implikasi:{id:"Reduksi tertutup lembut; imobilisasi; prognosis baik bila suplai darah epifisis utuh.",en:"Gentle closed reduction; immobilization; good prognosis if epiphyseal blood supply is intact."},skema:{jenis:"sh",tipe:1}},{kode:"II",label:{id:"Tipe II — fisis + metafisis",en:"Type II — physis + metaphysis"},deskripsi:{id:"Garis melalui fisis lalu keluar lewat metafisis, menyisakan fragmen metafisis segitiga (Thurston-Holland). Tipe paling sering (≈ 70% cedera fisis).",en:"Line through the physis exiting via the metaphysis, leaving a triangular metaphyseal (Thurston-Holland) fragment. The most common type (≈ 70% of physeal injuries)."},implikasi:{id:"Reduksi tertutup + gips; fiksasi bila tidak stabil (hindari implan melintasi fisis bila mungkin).",en:"Closed reduction and cast; fixation if unstable (avoid implants crossing the physis when possible)."},skema:{jenis:"sh",tipe:2}},{kode:"III",label:{id:"Tipe III — fisis + epifisis (intraartikular)",en:"Type III — physis + epiphysis (intraarticular)"},deskripsi:{id:"Garis melalui fisis lalu keluar lewat epifisis ke permukaan sendi.",en:"Line through the physis exiting through the epiphysis into the joint."},implikasi:{id:"Fraktur artikular: butuh reduksi anatomis, sering operatif (sekrup epifisis sejajar fisis).",en:"Articular fracture: needs anatomic reduction, often operative (epiphyseal screws parallel to the physis)."},skema:{jenis:"sh",tipe:3}},{kode:"IV",label:{id:"Tipe IV — metafisis + fisis + epifisis",en:"Type IV — metaphysis + physis + epiphysis"},deskripsi:{id:"Garis vertikal melintasi metafisis, fisis, dan epifisis ke sendi.",en:"Vertical line crossing metaphysis, physis, and epiphysis into the joint."},implikasi:{id:"Reduksi anatomis dan fiksasi; risiko jembatan tulang (bar) dan gangguan pertumbuhan tinggi.",en:"Anatomic reduction and fixation; high risk of bony bar and growth disturbance."},skema:{jenis:"sh",tipe:4}},{kode:"V",label:{id:"Tipe V — kompresi fisis",en:"Type V — physeal crush"},deskripsi:{id:"Cedera kompresi/remuk pada lempeng pertumbuhan; jarang, sering baru diketahui setelah henti tumbuh.",en:"Crush/compression injury of the growth plate; rare, often recognized only after growth arrest."},implikasi:{id:"Prognosis terburuk; pantau pertumbuhan jangka panjang, beri tahu orang tua.",en:"Worst prognosis; long-term growth follow-up, counsel parents."},skema:{jenis:"sh",tipe:5}}]},Ki={id:"gustilo",nama:{id:"Gustilo-Anderson — fraktur terbuka",en:"Gustilo-Anderson — open fractures"},singkat:"Gustilo",deskripsi:{id:"Derajat fraktur terbuka menurut ukuran luka, kerusakan jaringan lunak, kontaminasi, dan cedera vaskular. Ditetapkan final saat debridemen di kamar operasi, bukan di IGD.",en:"Grades open fractures by wound size, soft-tissue damage, contamination, and vascular injury. Assigned definitively at operative debridement, not in the emergency department."},sumber:[{buku:"AO",bab:"4.2",hlm:{awal:331,akhir:356}},{buku:"HoF",bab:"3",hlm:{awal:68,akhir:76}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Tipe I",en:"Type I"},deskripsi:{id:"Luka < 1 cm, bersih, kerusakan jaringan lunak minimal, pola fraktur sederhana, energi rendah.",en:"Wound < 1 cm, clean, minimal soft-tissue damage, simple fracture pattern, low energy."},skema:{jenis:"gustilo",tipe:"I"}},{kode:"II",label:{id:"Tipe II",en:"Type II"},deskripsi:{id:"Luka 1–10 cm, kerusakan jaringan lunak sedang tanpa flap atau avulsi luas, kominusi ringan–sedang.",en:"Wound 1–10 cm, moderate soft-tissue damage without extensive flaps or avulsion, mild–moderate comminution."},skema:{jenis:"gustilo",tipe:"II"}},{kode:"III",label:{id:"Tipe III",en:"Type III"},deskripsi:{id:"Luka > 10 cm atau kerusakan jaringan lunak luas, energi tinggi, kontaminasi berat; juga fraktur segmental, cedera pertanian, luka tembak kecepatan tinggi, dan fraktur terbuka yang terlambat ditangani.",en:"Wound > 10 cm or extensive soft-tissue damage, high energy, heavy contamination; also segmental fractures, farm injuries, high-velocity gunshot wounds, and delayed-treatment open fractures."},anak:[{kode:"IIIA",label:{id:"IIIA — tulang masih tertutup jaringan lunak",en:"IIIA — bone still covered by soft tissue"},deskripsi:{id:"Meski laserasi luas, periosteum dan jaringan lunak masih cukup menutup tulang.",en:"Despite extensive laceration, periosteum and soft tissue still adequately cover the bone."},implikasi:{id:"Penutupan primer/tunda tanpa flap.",en:"Primary or delayed closure without a flap."},skema:{jenis:"gustilo",tipe:"IIIA"}},{kode:"IIIB",label:{id:"IIIB — butuh flap",en:"IIIB — needs flap coverage"},deskripsi:{id:"Kehilangan jaringan lunak luas dengan periosteum terkelupas dan tulang terpapar; kontaminasi masif.",en:"Extensive soft-tissue loss with periosteal stripping and bone exposure; massive contamination."},implikasi:{id:"Debridemen radikal, fiksasi, penutupan flap lokal/bebas secepatnya (konsep 'fix and flap').",en:"Radical debridement, fixation, early local/free flap coverage ('fix and flap')."},skema:{jenis:"gustilo",tipe:"IIIB"}},{kode:"IIIC",label:{id:"IIIC — cedera arteri",en:"IIIC — arterial injury"},deskripsi:{id:"Disertai cedera arteri yang memerlukan perbaikan agar ekstremitas bertahan.",en:"Associated arterial injury requiring repair for limb survival."},implikasi:{id:"Revaskularisasi segera; pertimbangkan amputasi primer bila tidak layak diselamatkan.",en:"Immediate revascularization; consider primary amputation if the limb is not salvageable."},skema:{jenis:"gustilo",tipe:"IIIC"}}],skema:{jenis:"gustilo",tipe:"III"}}]},Ni={id:"tscherne",nama:{id:"Tscherne — cedera jaringan lunak",en:"Tscherne — soft-tissue injury"},singkat:"Tscherne",deskripsi:{id:"Derajat cedera jaringan lunak yang menyertai fraktur tertutup (C0–C3) dan terbuka (O1–O4) menurut Tscherne & Oestern. Menentukan waktu dan jenis fiksasi.",en:"Grades the soft-tissue injury accompanying closed (C0–C3) and open (O1–O4) fractures after Tscherne & Oestern. Guides timing and type of fixation."},sumber:[{buku:"AO",bab:"1.5",hlm:{awal:51,akhir:70}}],tingkat:[{id:"Jenis",en:"Kind"},{id:"Derajat",en:"Grade"}],akar:[{kode:"C",label:{id:"Fraktur tertutup",en:"Closed fractures"},deskripsi:{id:"Kulit utuh; derajat ditentukan oleh kontusio kulit, otot, dan risiko sindrom kompartemen.",en:"Skin intact; grade set by skin and muscle contusion and compartment-syndrome risk."},anak:[{kode:"C0",label:{id:"C0 — jaringan lunak minimal",en:"C0 — minimal soft-tissue injury"},deskripsi:{id:"Cedera tidak langsung, fraktur sederhana (mis. torsi), tanpa kerusakan jaringan lunak berarti.",en:"Indirect injury, simple fracture (e.g. torsion), no significant soft-tissue damage."},skema:{jenis:"tscherne",derajat:"C0"}},{kode:"C1",label:{id:"C1 — abrasi/kontusio superfisial",en:"C1 — superficial abrasion/contusion"},deskripsi:{id:"Abrasi atau kontusio superfisial akibat tekanan fragmen dari dalam; fraktur ringan–sedang.",en:"Superficial abrasion or contusion from fragment pressure within; mild–moderate fracture."},skema:{jenis:"tscherne",derajat:"C1"}},{kode:"C2",label:{id:"C2 — kontusio dalam, otot terlibat",en:"C2 — deep contusion with muscle involvement"},deskripsi:{id:"Abrasi dalam terkontaminasi, kontusio kulit/otot lokal, sindrom kompartemen mengancam; fraktur berat (energi langsung).",en:"Deep contaminated abrasion, local skin/muscle contusion, impending compartment syndrome; severe (direct-energy) fracture."},skema:{jenis:"tscherne",derajat:"C2"}},{kode:"C3",label:{id:"C3 — kerusakan luas / sindrom kompartemen",en:"C3 — extensive damage / compartment syndrome"},deskripsi:{id:"Kontusio atau remuk kulit luas, kerusakan otot berat, avulsi subkutan (Morel-Lavallée), sindrom kompartemen nyata atau cedera vaskular.",en:"Extensive skin contusion or crush, severe muscle damage, subcutaneous avulsion (Morel-Lavallée), manifest compartment syndrome or vascular injury."},skema:{jenis:"tscherne",derajat:"C3"}}]},{kode:"O",label:{id:"Fraktur terbuka",en:"Open fractures"},deskripsi:{id:"Kulit terbuka; derajat menurut luas luka, kontaminasi, dan cedera neurovaskular.",en:"Skin breached; grade by wound size, contamination, and neurovascular injury."},anak:[{kode:"O1",label:{id:"O1 — tusukan dari dalam",en:"O1 — puncture from within"},deskripsi:{id:"Luka kecil akibat fragmen menembus dari dalam, kontusio kulit minimal.",en:"Small wound from a fragment piercing from within, minimal skin contusion."},skema:{jenis:"tscherne",derajat:"O1"}},{kode:"O2",label:{id:"O2 — laserasi + kontusio sekitar",en:"O2 — laceration with surrounding contusion"},deskripsi:{id:"Laserasi kulit dengan kontusio sirkumferensial, kontaminasi sedang.",en:"Skin laceration with circumferential contusion, moderate contamination."},skema:{jenis:"tscherne",derajat:"O2"}},{kode:"O3",label:{id:"O3 — laserasi luas, kontaminasi berat",en:"O3 — extensive laceration, heavy contamination"},deskripsi:{id:"Kerusakan jaringan lunak luas, sering disertai cedera vaskular/saraf; risiko infeksi tinggi.",en:"Extensive soft-tissue damage, often with vascular/nerve injury; high infection risk."},skema:{jenis:"tscherne",derajat:"O3"}},{kode:"O4",label:{id:"O4 — amputasi subtotal/total",en:"O4 — subtotal/total amputation"},deskripsi:{id:"Ekstremitas hampir atau sama sekali terputus.",en:"Limb nearly or completely severed."},skema:{jenis:"tscherne",derajat:"O4"}}]}]}});var Gi,Vi,qi,zi,_i,Ui=ma(()=>{Gi={id:"gartland",nama:{id:"Gartland — suprakondiler humerus anak",en:"Gartland — pediatric supracondylar humerus"},singkat:"Gartland",deskripsi:{id:"Fraktur suprakondiler tipe ekstensi (98%) dibagi menurut derajat pergeseran fragmen distal; tipe fleksi (2%) dinilai dengan tiga tipe yang sama (korteks anterior sebagai engsel). AO memakai kode pergeseran I–IV (von Laer) pada 13-M/3.",en:"Extension-type supracondylar fractures (98%) graded by displacement of the distal fragment; the flexion type (2%) uses the same three types (anterior cortex as hinge). AO uses displacement grades I–IV (von Laer) on 13-M/3."},sumber:[{buku:"HoF",bab:"44",hlm:{awal:570,akhir:605}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Tipe I — tidak bergeser",en:"Type I — nondisplaced"},deskripsi:{id:"Fraktur tanpa pergeseran; garis humerus anterior masih memotong kapitulum. Sering hanya tampak tanda fat pad posterior.",en:"Nondisplaced fracture; the anterior humeral line still intersects the capitellum. Often only a posterior fat-pad sign is visible."},implikasi:{id:"Gips/splint lengan panjang dengan siku fleksi 60–90° selama 2–3 minggu.",en:"Long-arm cast or splint with the elbow flexed 60–90° for 2–3 weeks."},skema:{jenis:"gartland",tipe:1}},{kode:"II",label:{id:"Tipe II — bergeser, korteks posterior utuh",en:"Type II — displaced, posterior cortex intact"},deskripsi:{id:"Bergeser dengan korteks posterior utuh sebagai engsel; dapat berangulasi atau berotasi; garis humerus anterior lewat di depan kapitulum.",en:"Displaced with an intact posterior cortex as hinge; may be angulated or rotated; the anterior humeral line passes in front of the capitellum."},implikasi:{id:"Biasanya reduksi tertutup + gips; fiksasi K-wire bila tidak stabil, bila ada malrotasi, atau bila reduksi hanya bertahan dengan fleksi berlebihan (risiko neurovaskular).",en:"Usually closed reduction and casting; K-wire fixation if unstable, malrotated, or if reduction holds only in excessive flexion (neurovascular risk)."},skema:{jenis:"gartland",tipe:2}},{kode:"III",label:{id:"Tipe III — bergeser total",en:"Type III — completely displaced"},deskripsi:{id:"Pergeseran total; posteromedial (lebih sering, tangan pronasi) atau posterolateral (tangan supinasi). Cedera saraf 7–10% (n. medianus/interoseus anterior tersering), cedera vaskular 0,5%, sindrom kompartemen < 1%.",en:"Complete displacement; posteromedial (more common, pronated hand) or posterolateral (supinated hand). Nerve injury 7–10% (median/anterior interosseous most common), vascular injury 0.5%, compartment syndrome < 1%."},implikasi:{id:"Reduksi tertutup + pinning perkutan = standar; ORIF untuk yang tidak stabil rotasi, terbuka, atau dengan cedera neurovaskular; eksplorasi a. brakialis hanya untuk tangan pucat tanpa nadi yang menetap setelah reduksi.",en:"Closed reduction and percutaneous pinning is the standard; ORIF for rotationally unstable, open, or neurovascular-injured fractures; brachial artery exploration only for a persistently white pulseless hand after reduction."},skema:{jenis:"gartland",tipe:3}}]},Vi={id:"milch",nama:{id:"Milch & Jakob — kondilus lateral humerus anak",en:"Milch & Jakob — pediatric lateral condyle"},singkat:"Milch",deskripsi:{id:"Menurut hubungan garis fraktur dengan alur troklea (capitulotrochlear groove); menentukan stabilitas siku. Tahap pergeseran dinilai dengan Jakob/Weiss.",en:"By the relation of the fracture line to the capitulotrochlear groove; determines elbow stability. Displacement is staged by Jakob/Weiss."},sumber:[{buku:"HoF",bab:"44",hlm:{awal:570,akhir:605}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Milch I — lateral dari alur troklea",en:"Milch I — lateral to the trochlear groove"},deskripsi:{id:"Garis fraktur keluar lateral terhadap alur troklea (melalui kapitulum): cedera Salter-Harris IV; troklea utuh sehingga siku stabil. Lebih jarang.",en:"Fracture line exits lateral to the trochlear groove (through the capitellum): Salter-Harris IV; trochlea intact so the elbow is stable. Less common."},skema:{jenis:"milch",tipe:1}},{kode:"II",label:{id:"Milch II — melalui alur troklea",en:"Milch II — into the trochlear groove"},deskripsi:{id:"Garis fraktur masuk ke alur troklea (medial): cedera Salter-Harris II; dinding lateral troklea hilang sehingga siku dapat subluksasi lateral. Lebih sering.",en:"Fracture line enters the trochlear groove (medially): Salter-Harris II; lateral trochlear wall lost so the elbow may sublux laterally. More common."},skema:{jenis:"milch",tipe:2}},{kode:"J",label:{id:"Tahap pergeseran (Jakob/Weiss)",en:"Displacement stages (Jakob/Weiss)"},deskripsi:{id:"I: tidak bergeser (< 2 mm), permukaan sendi utuh → imobilisasi 3 minggu (40% kasus). II: pergeseran sedang → coba reduksi tertutup (varus, supinasi, ekstensi) + K-wire perkutan, artrogram untuk memastikan. III: bergeser total & berotasi dengan siku tidak stabil → reduksi terbuka + K-wire. Sebagian besar II–III yang tidak stabil perlu reduksi terbuka (60%).",en:"I: nondisplaced (< 2 mm), articular surface intact → immobilise 3 weeks (40% of cases). II: moderate displacement → attempt closed reduction (varus, supination, extension) plus percutaneous K-wires, arthrogram to confirm. III: complete displacement and rotation with elbow instability → open reduction plus K-wires. Most unstable II–III need open reduction (60%)."},skema:{jenis:"milch",tipe:3}}]},qi={id:"bado",nama:{id:"Bado — lesi Monteggia",en:"Bado — Monteggia lesion"},singkat:"Bado",deskripsi:{id:"Fraktur ulna proksimal/diafisis disertai dislokasi kaput radius; tipe menurut arah dislokasi kaput radius (= arah apeks angulasi ulna). Pada anak, ulna dapat hanya bowing (plastic deformation).",en:"Proximal/shaft ulna fracture with radial head dislocation; type by the direction of radial head dislocation (= direction of the ulnar apex). In children the ulna may only bow (plastic deformation)."},sumber:[{buku:"HoF",bab:"45",hlm:{awal:606,akhir:618}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Tipe I — anterior",en:"Type I — anterior"},deskripsi:{id:"Dislokasi kaput radius ke anterior dengan fraktur ulna berangulasi apeks anterior. Tipe tersering pada anak.",en:"Anterior radial head dislocation with apex-anterior ulnar fracture. The most common type in children."},skema:{jenis:"bado",tipe:1}},{kode:"II",label:{id:"Tipe II — posterior",en:"Type II — posterior"},deskripsi:{id:"Dislokasi kaput radius ke posterior/posterolateral, fraktur ulna apeks posterior; lebih sering pada dewasa.",en:"Posterior/posterolateral radial head dislocation, apex-posterior ulnar fracture; more common in adults."},skema:{jenis:"bado",tipe:2}},{kode:"III",label:{id:"Tipe III — lateral",en:"Type III — lateral"},deskripsi:{id:"Dislokasi kaput radius ke lateral/anterolateral dengan fraktur metafisis ulna proksimal; tipe kedua tersering pada anak.",en:"Lateral/anterolateral radial head dislocation with proximal ulnar metaphyseal fracture; second most common in children."},skema:{jenis:"bado",tipe:3}},{kode:"IV",label:{id:"Tipe IV — anterior + fraktur radius",en:"Type IV — anterior with radial fracture"},deskripsi:{id:"Dislokasi kaput radius ke anterior dengan fraktur diafisis radius dan ulna setinggi sama.",en:"Anterior radial head dislocation with fractures of both radial and ulnar shafts at the same level."},skema:{jenis:"bado",tipe:4}}]},zi={id:"delbet",nama:{id:"Delbet — fraktur panggul anak",en:"Delbet — pediatric hip fractures"},singkat:"Delbet",deskripsi:{id:"Fraktur femur proksimal anak menurut level: risiko nekrosis avaskular tertinggi pada tipe I dan menurun ke tipe IV.",en:"Pediatric proximal femur fractures by level: avascular necrosis risk is highest in type I and falls toward type IV."},sumber:[{buku:"HoF",bab:"47",hlm:{awal:636,akhir:643}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Tipe I — transepifisis",en:"Type I — transepiph r beda usia, fraktur transfiseal bayi.",["E-1","E-3"],["child abuse","NAI"]),Q("critoe","CRITOE","CRITOE","Mnemonik urutan pusat osifikasi siku: Capitellum (6 bln–2 th), Radial head (4 th), Internal/medial epicondyle (6–7 th), Trochlea (8 th), Olecranon (8–10 th), External/lateral epicondyle (12 th).",["E-3"]),Q("baumann","Baumann angle","sudut Baumann","Sudut antara garis fisis kondilus lateral dan sumbu panjang humerus pada foto AP; AO: 70–75° (> 75° = varus), HoF: 15–20° (sudut komplementer); harus sama dengan sisi sehat.",["E-3"]),Q("fat-pad","Fat pad sign","tanda fat pad","Bantalan lemak siku yang terangkat oleh efusi sendi: fat pad posterior (olekranon) spesifik — fraktur ada pada > 70% kasus; fat pad anterior sensitif tetapi kurang spesifik.",["E-3"]),Q("gartland","Gartland classification","klasifikasi Gartland","Fraktur suprakondiler anak menurut pergeseran: I tidak bergeser, II bergeser dengan korteks posterior utuh, III bergeser total; tipe ekstensi 98%.",["E-3"]),Q("milch","Milch classification","klasifikasi Milch","Fraktur kondilus lateral anak: I garis lateral ke alur kapitulotroklear (SH IV, stabil), II ke apeks troklea (SH II, tidak stabil, lebih sering).",["E-3"]),Q("pucker-sign","Pucker sign","tanda pucker (lesung kulit)","Lesung kulit anterior siku karena fragmen proksimal fraktur suprakondiler menembus otot brakialis; pertanda reduksi tertutup mungkin sulit.",["E-3"]),Q("pulled-elbow","Pulled elbow (nursemaid's elbow)","subluksasi kaput radius","Subluksasi kaput radius dari ligamen anular akibat tarikan longitudinal pada siku ekstensi-pronasi; usia 6 bulan–6 th (puncak 2–3 th); direduksi dengan supinasi-fleksi atau hiperpronasi.",["E-3"],["nursemaid's elbow","radial head subluxation"])]});var be={};Da(be,{ISTILAH:()=>gi,istilahBab:()=>Rt,istilahById:()=>Ht});function Ht(a){return gi.find(e=>e.id===a)}function Rt(a){return gi.filter(e=>(e.babIds||[]).includes(a))}var gi,he=ma(()=>{hn();gi=bn});var Cn={};Da(Cn,{default:()=>Nt});var ta,Z,Nt,An=ma(()=>{ta=a=>({buku:"HoF",bab:"11",hlm:a}),Z=a=>({buku:"AO",bab:"6.1.2",hlm:a}),Nt={id:"klavikula",nama:{id:"Klavikula",en:"Clavicle"},sumber:[{buku:"HoF",bab:"11",hlm:{awal:164,akhir:168}},{buku:"AO",bab:"6.1.2",hlm:{awal:573,akhir:585}}],gambar:"klavikula:utuh",intro:{id:"Tulang penopang satu-satunya antara lengan dan batang tubuh; bagian tengah yang tipis dan tepat di bawah kulit paling sering patah.",en:"The only bony strut between the arm and the trunk; the thin, subcutaneous middle third fractures most often."},pemeriksaan:{klinis:[{teks:"Lengan diaduksi ke dada dan ditopang tangan sebelahnya; ujung fragmen proksimal menonjol dan dapat menegangkan kulit (*tenting*) — periksa integritas kulit.",ref:ta(165)},{teks:"Periksa neurovaskular dengan cermat: pleksus brakialis dan pembuluh subklavia terletak di belakang klavikula.",ref:ta(165)},{teks:"Auskultasi dada: takipnea karena nyeri jangan dikacaukan dengan suara napas berkurang akibat pneumotoraks ipsilateral.",ref:ta(165)},{teks:"Hingga **9%** pasien punya fraktur lain (tersering iga); cedera pleksus brakialis umumnya pada fraktur sepertiga proksimal (traksi).",ref:ta(165)}],radiologis:[{teks:"Foto AP biasanya cukup; tilt sefalad **30°** (HoF) / **20°** (AO) menghilangkan tumpang tindih toraks. Ambil dalam posisi tegak agar pergeseran lebih nyata.",ref:[ta(165),Z(574)]},{teks:"Foto toraks untuk membandingkan panjang dengan sisi sehat dan menyingkirkan cedera dada; CT untuk sepertiga proksimal (dislokasi SC vs fisis) dan lateral (keterlibatan sendi).",ref:[ta(165),Z(574)]}],mekanisme:[{teks:"Jatuh pada bahu dengan gaya tekuk: **87%**; benturan langsung 7%; jatuh pada tangan terentang 6%.",ref:ta(164)},{teks:"Deformitas khas: fragmen medial tertarik ke superior-posterior oleh sternokleidomastoid, fragmen lateral turun oleh berat lengan dan berotasi oleh pektoralis; pemendekan oleh trapezius, pektoralis, latisimus.",ref:Z(574)}],epidemiologi:[{teks:"**2,6%** dari semua fraktur dan 44–66% fraktur sekitar bahu; sepertiga tengah **80%**, lateral 15%, medial 5%.",ref:ta(164)},{teks:"Distribusi bimodal: laki-laki < 30 tahun dan puncak kecil > 70 tahun.",ref:Z(573)}]},klasifikasi:[{nama:"AO/OTA",teks:"Tulang **15**: 15.1 proksimal (medial), 15.2 diafisis, 15.3 distal (lateral). Ujung: A ekstraartikular, B parsial artikular, C artikular komplet; diafisis: A simpel, B wedge, C multifragmentari. Nilai terapeutiknya terbatas karena tidak memuat derajat pergeseran.",ref:Z(575)},{nama:"Allman",teks:"Grup I sepertiga tengah (80%), II sepertiga distal (15%; subtipe Neer menurut ligamen korakoklavikular), III sepertiga proksimal (5%).",ref:ta(166)},{nama:"Edinburgh (Robinson)",teks:"Satu-satunya sistem yang memuat pergeseran & kominusi: tipe 2A tak bergeser (2A1) / berangulasi (2A2); 2B tanpa kontak korteks: simpel/wedge (2B1) atau multifragmentari (2B2).",ref:Z(575)}],kelompok:[{id:"tengah",nama:{id:"Sepertiga tengah (diafisis)",en:"Middle third (shaft)"},kode:"AO/OTA 15.2 · Allman I",jenis:[{id:"tengah-stabil",nama:{id:"Simpel, tak bergeser",en:"Simple, undisplaced"},kode:"15.2A · Edinburgh 2A1",gambar:"klavikula:tengah-stabil",ringkas:"Kontak korteks utuh, tanpa pemendekan bermakna; hampir selalu sembuh dengan sling.",ref:Z(575),indikasi:"tengah-stabil"},{id:"tengah-bergeser",nama:{id:"Simpel, bergeser (tanpa kontak korteks)",en:"Simple, displaced"},kode:"15.2A · Edinburgh 2B1",gambar:"klavikula:tengah-bergeser",ringkas:"Fragmen medial naik, lateral turun; pergeseran > 1 lebar klavikula atau pemendekan ≥ 2 cm menaikkan risiko nonunion.",ref:Z(575),indikasi:"tengah-bergeser"},{id:"tengah-wedge",nama:{id:"Wedge (fragmen kupu-kupu)",en:"Wedge (butterfly)"},kode:"15.2B · Edinburgh 2B1",gambar:"klavikula:tengah-wedge",ringkas:"Fragmen ketiga berbentuk baji; fragmen utama masih bisa dikontakkan setelah reduksi.",ref:Z(575),indikasi:"tengah-bergeser"},{id:"tengah-multi",nama:{id:"Multifragmentari (deformitas Z)",en:"Multifragmentary (Z deformity)"},kode:"15.2C · Edinburgh 2B2",gambar:"klavikula:tengah-multi",ringkas:"Kominusi dengan pemendekan; fragmen vertikal intermediet sering mempertahankan perlekatan jaringan lunak.",ref:[ta(167),Z(578)],indikasi:"tengah-bergeser"}]},{id:"lateral",nama:{id:"Sepertiga lateral (distal)",en:"Lateral third (distal)"},kode:"AO/OTA 15.3 · Allman II · Neer",jenis:[{id:"lateral-1",nama:{id:"Neer I — lateral dari ligamen CC, pergeseran minimal",en:"Neer I — lateral to CC ligaments"},kode:"15.3A",gambar:"klavikula:lateral-1",ringkas:"Fraktur interligamen; ligamen konoid–trapezoid utuh sehingga fragmen medial tetap tertambat.",ref:ta(166),indikasi:"lateral-stabil"},{id:"lateral-2a",nama:{id:"Neer IIA — medial dari ligamen CC",en:"Neer IIA — medial to CC ligaments"},kode:"15.3A/B",gambar:"klavikula:lateral-2a",ringkas:"Konoid & trapezoid melekat pada fragmen distal; fragmen medial tanpa tambatan naik ke superior — insidens nonunion tinggi.",ref:ta(166),indikasi:"lateral-2"},{id:"lateral-2b",nama:{id:"Neer IIB — konoid robek",en:"Neer IIB — conoid torn"},kode:"15.3A/B",gambar:"klavikula:lateral-2b",ringkas:"Konoid putus, trapezoid masih melekat pada fragmen distal; fragmen proksimal bergeser.",ref:ta(166),indikasi:"lateral-2"},{id:"lateral-3",nama:{id:"Neer III — ke sendi akromioklavikular",en:"Neer III — into the AC joint"},kode:"15.3B/C",gambar:"klavikula:lateral-3",ringkas:"Permukaan sendi AC terlibat tanpa cedera ligamen; mudah disangka separasi AC derajat I dan menimbulkan artrosis lambat.",ref:ta(166),indikasi:"lateral-stabil"}]},{id:"medial",nama:{id:"Sepertiga medial (proksimal)",en:"Medial third (proximal)"},kode:"AO/OTA 15.1 · Allman III",jenis:[{id:"medial-stabil",nama:{id:"Ekstraartikular, pergeseran minimal",en:"Extraarticular, minimally displaced"},kode:"15.1A",gambar:"klavikula:medial-stabil",ringkas:"Ligamen kostoklavikular utuh menahan fragmen; umumnya sembuh tanpa operasi.",ref:[ta(166),Z(584)],indikasi:"medial-stabil"},{id:"medial-bergeser",nama:{id:"Bergeser (anterior / posterior)",en:"Displaced (anterior / posterior)"},kode:"15.1A",gambar:"klavikula:medial-bergeser",ringkas:"Pergeseran posterior dapat menekan mediastinum superior — pembuluh besar dan trakea; ini kegawatan.",ref:Z(584),indikasi:"medial-bergeser"},{id:"medial-artikular",nama:{id:"Intraartikular / separasi fisis",en:"Intraarticular / physeal separation"},kode:"15.1B–C",gambar:"klavikula:medial-artikular",ringkas:"Fisis medial menutup terakhir (23–25 tahun); banyak cedera medial pada remaja sebenarnya Salter-Harris I/II.",ref:Z(584),indikasi:"medial-stabil"}]}],indikasi:{"tengah-stabil":{intro:"Fraktur tanpa pergeseran berarti: tujuan terapi adalah kenyamanan, lalu gerak dini.",opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling",en:"Nonoperative — sling"},gambar:"sling",utama:["Fraktur tak bergeser / pergeseran minimal","Pasien tanpa indikasi absolut operasi"],ref:ta(167),tatalaksana:"nonop"}]},"tengah-bergeser":{intro:"Pergeseran total, kominusi, atau pemendekan adalah wilayah kontroversi: sebagian besar tetap menyatu tanpa operasi, tetapi nonunion dan malunion simtomatik lebih sering dan fungsi bisa lebih rendah.",opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling",en:"Nonoperative — sling"},gambar:"sling",utama:["Pasien yang menerima risiko deformitas/pemendekan residual","Kontraindikasi bedah","Pergeseran tanpa indikasi absolut"],ref:[ta(167),Z(575)],tatalaksana:"nonop"},{id:"plat",nama:{id:"Reduksi terbuka + plat (superior / anteroinferior)",en:"ORIF — plate"},gambar:"klavikula:plat-superior",utama:["Absolut: fraktur terbuka, kulit terancam tembus, gangguan neurovaskular","Relatif: pemendekan/elevasi > 2,5 cm (AO) atau > 1–2 cm (HoF), pergeseran > 100%, floating shoulder, politrauma, fraktur iga multipel","Kominusi (deformitas Z) — plat bisa dipakai sebagai proteksi/jembatan"],ref:[ta(167),Z(575)],tatalaksana:"plat"},{id:"im",nama:{id:"Fiksasi intramedular (nail elastis titanium)",en:"Intramedullary fixation (TEN)"},gambar:"klavikula:im-nail",utama:["Pola **simpel** transversal/oblik — bukan multifragmentari (tidak bisa dikunci statis)","Menginginkan insisi kecil dan kosmesis lebih baik"],ref:Z(579),tatalaksana:"im"}]},"lateral-stabil":{intro:"Fraktur lateral yang tak bergeser dan ekstraartikular umumnya sembuh tanpa penyulit.",opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling",en:"Nonoperative — sling"},gambar:"sling",utama:["Neer I dan III tanpa pergeseran"],ref:[ta(167),Z(575)],tatalaksana:"nonop"}]},"lateral-2":{intro:"Neer II bergeser: nonunion sekitar **30%**, tetapi nonunion radiologis tidak selalu bergejala — putuskan kasus per kasus.",ref:Z(575),opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling + gerak bertahap",en:"Nonoperative"},gambar:"sling",utama:["Ujung tulang masih berkontak","Pasien tua / tuntutan fungsi rendah"],ref:[ta(167),Z(575)],tatalaksana:"nonop"},{id:"plat-lateral",nama:{id:"Plat lateral anatomis (locking)",en:"Precontoured lateral locking plate"},gambar:"klavikula:plat-lateral",utama:["Fragmen lateral cukup besar untuk ≥ 3 sekrup bikortikal","Ditambah lag screw bila garis fraktur oblik"],ref:Z(580),tatalaksana:"plat-lateral"},{id:"hook",nama:{id:"Hook plate",en:"Hook plate"},gambar:"klavikula:hook-plate",utama:["Fragmen lateral terlalu kecil untuk sekrup","Paling kuat mempertahankan reduksi — tetapi **wajib dilepas** setelah sembuh"],ref:Z(581),tatalaksana:"hook"},{id:"cc",nama:{id:"Fiksasi korakoklavikular (jahitan / sekrup / tightrope)",en:"Coracoclavicular fixation"},gambar:"klavikula:cc-fiksasi",utama:["Sebagai tambahan fiksasi primer atau rekonstruksi utama","Fragmen distal kecil"],ref:[ta(167),Z(577)],tatalaksana:"cc"}]},"medial-stabil":{intro:"Cedera medial jarang; umumnya pergeseran minimal dan ekstraartikular.",opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling",en:"Nonoperative — sling"},gambar:"sling",utama:["Pergeseran minimal","Dislokasi/pergeseran anterior yang menetap (sering kambuh setelah reduksi, jarang mengganggu fungsi)"],ref:Z(584),tatalaksana:"nonop"}]},"medial-bergeser":{intro:"Pergeseran posterior ujung medial dapat mengancam mediastinum superior: cedera vaskular, obstruksi trakea.",opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup segera",en:"Emergent closed reduction"},gambar:"klavikula:reduksi-tertutup",utama:["Pergeseran posterior dengan tanda tekanan mediastinum","Retraksi bahu ipsilateral → bila gagal, klem tulang runcing perkutan / towel clip"],ref:Z(584),tatalaksana:"reduksi-medial"},{id:"orif-medial",nama:{id:"Reduksi terbuka + plat (bersama bedah vaskular)",en:"Open reduction + plate (with vascular surgeon)"},gambar:"klavikula:plat-superior",utama:["Reduksi tertutup gagal","Fragmen medial besar → plat 3.5 konvensional/locking; fragmen kecil → plat menjembatani ke sternum"],ref:Z(584),tatalaksana:"orif-medial"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif dengan sling",en:"Nonoperative treatment with a sling"},bab:[{judul:"Tujuan",isi:"Kenyamanan dan pengurangan nyeri adalah tujuan utama; sling terbukti memberi hasil yang sama dengan perban angka-delapan dengan kenyamanan lebih baik dan masalah kulit lebih sedikit.",ref:ta(167)},{judul:"Prinsip imobilisasi",isi:"Sling menopang gelang bahu sehingga fragmen lateral terangkat ke atas-luar-belakang; perban angka-delapan menekan fragmen medial. Keduanya hanya mempertahankan sebagian reduksi dan membiarkan tangan serta siku tetap dipakai. AO menganjurkan **meninggalkan** perban angka-delapan: tanpa manfaat tambahan, berisiko luka tekan aksila dan nonunion lebih tinggi.",ref:[ta(167),Z(573)]},{judul:"Durasi & latihan",isi:"Imobilisasi umumnya **4–6 minggu** (HoF); AO memulai latihan rentang gerak dan penguatan begitu nyeri mereda, biasanya setelah **2–6 minggu**. Selama imobilisasi, gerak aktif siku, pergelangan tangan, dan tangan tetap dilakukan.",ref:[ta(167),Z(573)]},{judul:"Ekspektasi",isi:"Apa pun metodenya, derajat pemendekan dan deformitas tertentu biasanya tersisa. Semua fraktur bergeser yang dirawat nonoperatif sembuh dengan malunion berbagai derajat; pemendekan gelang bahu plus malrotasi fragmen distal dapat mengurangi kekuatan abdu
