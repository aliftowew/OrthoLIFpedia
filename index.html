duction then sling (2-part)"},gambar:"sling",utama:["Dua-bagian yang fragmennya tereduksi setelah reduksi sendi"],ref:D(217),tatalaksana:"reduksi-dislokasi"},{id:"plat",nama:{id:"ORIF (pasien muda)",en:"ORIF (younger)"},gambar:"humerus-proksimal:plat-locking",utama:["Tiga/empat-bagian pada pasien muda"],ref:D(217),tatalaksana:"plat"},{id:"artroplasti",nama:{id:"Prostesis (lansia)",en:"Arthroplasty (elderly)"},gambar:"humerus-proksimal:reverse",utama:["Lansia, tergantung lama dislokasi","Fraktur-dislokasi kolum anatomikum"],ref:D(217),tatalaksana:"artroplasti"}]},"head-split":{intro:"Kerusakan permukaan sendi menentukan: < 40% dan usia < 40 tahun → coba ORIF; lebih dari itu → prostesis.",ref:D(218),opsi:[{id:"plat",nama:{id:"ORIF",en:"ORIF"},gambar:"humerus-proksimal:plat-locking",utama:["Usia < 40 tahun, keterlibatan kepala terbatas"],ref:D(218),tatalaksana:"plat"},{id:"artroplasti",nama:{id:"Prostesis",en:"Arthroplasty"},gambar:"humerus-proksimal:reverse",utama:["Keterlibatan kepala > 40%","Head-split pada lansia"],ref:[D(218),z(603)],tatalaksana:"artroplasti"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif: sling dan rehabilitasi bertahap",en:"Nonoperative: sling and staged rehabilitation"},bab:[{judul:"Imobilisasi & mobilisasi dini",isi:"Sling/swathe untuk kenyamanan; gerak bahu dimulai pada **7–10 hari** (pendulum dan gerak pasif). Foto ulang dini untuk mendeteksi kehilangan reduksi. Gerak aktif pada **6 minggu**, latihan tahanan pada 6–12 minggu; gerak dan fungsi mendekati penuh diharapkan pada 1 tahun.",ref:D(215)},{judul:"Protokol AO",isi:"Protokol yang sama untuk nonoperatif dan operatif, dimulai 10–14 hari: fase 1 (0–6 minggu) pendulum dan gerak pasif, hindari gerak aktif; fase 2 (6–10 minggu) sling 2–3 minggu lagi, bila fragmen bergerak sebagai satu unit tanpa pergeseran pada foto → gerak aktif-asistif, pemakaian fungsional parsial minggu 6–8, gerak aktif dan isometrik minggu 8; fase 3 (> 10 minggu) terapi manual dan penguatan isotonik bila kaku.",ref:z(604)},{judul:"Reduksi tertutup",isi:"Bila perlu, reduksi tertutup di bawah pencitraan; bila aligment tercapai dan stabil, lengan diimobilisasi dengan sling.",ref:z(592)},{judul:"Komplikasi",isi:"Kekakuan bahu (cegah dengan fisioterapi terawasi yang agresif); nonunion terutama kolum chirurgicum bergeser dengan interposisi jaringan lunak; malunion → impingement tuberositas mayor pada akromion.",ref:D(220)}]},pin:{nama:{id:"Reduksi tertutup dan fiksasi pin/sekrup perkutan",en:"Closed reduction and percutaneous pin/screw fixation"},bab:[{judul:"Indikasi & batas",isi:"Pasien muda dengan tulang baik dan pola simpel, tuberositas mayor terisolasi, atau pola valgus-terimpaksi. Tidak untuk head-split, fraktur-dislokasi, atau kalkar medial yang terfragmentasi. Pin berulir ujung/sekrup kanulasi dipakai; masalah fiksasi pin multipel: cedera n. aksilaris, pin longgar/migrasi, dan lengan tak bisa digerakkan.",ref:[D(216),z(603)]},{judul:"Teknik",isi:"Reduksi tertutup di bawah pencitraan; bila reduksi tercapai dan dipertahankan, teknik invasif minimal (pin perkutan, MIPO, atau nail) meminimalkan gangguan suplai darah di lokasi fraktur.",ref:z(593)}]},plat:{nama:{id:"Reduksi terbuka dan plat locking",en:"Open reduction and locking plate"},bab:[{judul:"Posisi & pendekatan",isi:"Telentang atau beach chair (berat lengan membantu reduksi). **Deltopektoral** adalah pendekatan utama: insisi dari prosesus korakoid tepat di anterior deltoid ke tengah-distal deltoid; v. sefalika diretraksi; fasia klavipektoral dibuka. Kelebihan: deltoid terlindung, kapsul inferior terlihat, risiko n. aksilaris rendah; kekurangan: pemasangan plat lateral sulit dan tuberositas posterior kurang terlihat. **Deltoid split** (dari sudut anterolateral akromion, maksimal **5 cm** ke distal) untuk tuberositas mayor, MIPO, atau nail — jahitan penahan 5 cm di bawah akromion melindungi n. aksilaris.",ref:[D(218),z(594),z(596)]},{judul:"Reduksi",isi:"Jahitan traksi pada pertemuan tendon–tulang rotator cuff (subskapularis, supraspinatus, infraspinatus) mengendalikan tuberositas tanpa fragmentasi lebih lanjut. Pada dua-bagian kolum chirurgicum, reduksi korteks medial penting terutama tipe varus; pada 3–4 bagian, pulihkan sudut leher–batang dengan *joystick* atau elevator/bone tamp; K-wire sementara dari atas kepala ke batang menahan reduksi tanpa mengganggu plat; tuberositas diikat dengan jahitan (reduksi tidak langsung) untuk melindungi suplai darahnya.",ref:[z(597),z(598)]},{judul:"Plat & sekrup kalkar",isi:"Plat locking dipasang lateral dari alur bisipital, **5–8 mm** distal dari puncak tuberositas mayor, sejajar sumbu batang, 2–4 mm posterior alur bisipital; K-wire lewat lubang proksimal pemandu harus bertumpu di puncak kepala. **Sekrup kalkar** (dua sekrup tangensial terhadap lengkung medial kolum chirurgicum) menahan penopang medial dan mencegah kolaps varus — krusial pada varus dengan kominusi medial. Sekrup saja tidak dianjurkan karena cengkeraman di metafisis buruk; jahitan tambahan ke plat wajib untuk stabilitas, terutama tulang osteoporotik. Bila reduksi anatomis tak mungkin pada tulang osteoporotik, impaksikan korteks medial batang ke dalam kepala.",ref:[z(600),z(601),z(605)]},{judul:"MIPO",isi:"Menghindari diseksi berlebihan dan menurunkan nonunion/infeksi: reduksi tertutup di bawah pencitraan, jendela proksimal deltoid-split dan distal pada insersi deltoid, plat diselipkan dekat tulang di bawah n. aksilaris. Terbatas untuk fraktur kompleks; bila reduksi tertutup gagal, beralih ke reduksi terbuka.",ref:z(602)},{judul:"Pascaoperasi",isi:"Konstruk harus cukup stabil untuk gerak pasif segera; protokol rehabilitasi dimulai 10–14 hari (lihat protokol AO pada opsi nonoperatif).",ref:z(604)},{judul:"Komplikasi",isi:"**Penetrasi sekrup** ke sendi adalah komplikasi tersering (kesalahan teknik atau kolaps varus — sekrup sudut tetap tidak bisa mundur; pantau dengan pencitraan di semua posisi). Kehilangan reduksi terutama pada osteoporosis dengan kominusi medial. Osteonekrosis keseluruhan mendekati **35%** (lebih tinggi dengan plat karena diseksi), tetapi sering asimtomatik: 77% tetap baik–sangat baik. Osteonekrosis HoF: 3–14% pada tiga-bagian, 4–34% empat-bagian. Malunion dengan hilangnya penopang medial → varus. Cedera n. aksilaris saat reduksi atau pendekatan deltoid split.",ref:[D(220),z(604),z(605)]}]},nail:{nama:{id:"Nail intramedular proksimal humerus",en:"Proximal humeral intramedullary nail"},bab:[{judul:"Kapan",isi:"Dua-bagian kolum chirurgicum (termasuk lansia dengan pergeseran total) dan tipe 3–4 bagian tertentu dengan struktur cincin proksimal relatif utuh. Tidak untuk 3–4 bagian bergeser dan head-split.",ref:[z(601),z(603)]},{judul:"Teknik",isi:"Sejajarkan batang dengan kepala di bawah pencitraan **sebelum** memasukkan nail; nail lurus dimasukkan lewat kawat pemandu dengan titik masuk pada kepala humerus (bukan tapak rotator cuff) — hindari insisi tusuk. Nail multilock memungkinkan fiksasi tuberositas dan jahitan rotator cuff; tahanan terhadap bending dan rotasi lebih baik daripada plat, tetapi dapat menimbulkan fraktur tuberositas mayor iatrogenik dan cedera rotator cuff dengan gejala menetap.",ref:z(601)},{judul:"Pascaoperasi",isi:"Protokol rehabilitasi bahu yang sama (mulai 10–14 hari).",ref:z(604)}]},jahit:{nama:{id:"Fiksasi jahitan/anchor untuk tuberositas",en:"Suture/anchor fixation of the tuberosity"},bab:[{judul:"Prinsip",isi:"Pada fraktur tuberositas terisolasi, jahitan lebih andal daripada sekrup; dengan anchor, teknik *double-pulley* memberi reduksi dan kekuatan fiksasi lebih baik. Sekrup lag hanya pada tulang baik. ORIF ± perbaikan rotator cuff diindikasikan bila tuberositas mayor bergeser > 5–10 mm.",ref:[D(216),z(600)]},{judul:"Pendekatan",isi:"Deltoid split memberi visualisasi kedua tuberositas; lindungi n. aksilaris (jahitan penahan 5 cm di bawah akromion).",ref:z(596)}]},artroplasti:{nama:{id:"Prostesis: hemiartroplasti atau reverse total shoulder",en:"Arthroplasty: hemi or reverse total shoulder"},bab:[{judul:"Memilih",isi:"Hemiartroplasti: pasien paruh baya dengan fraktur-dislokasi 3–4 bagian berat; hindari pada lansia dengan tuberositas kominutif osteoporotik, pola yang masih bisa difiksasi, atau patologi rotator cuff. **Reverse**: lansia dengan fraktur-dislokasi berat atau rotator cuff defisien; hindari pada pasien muda dengan pola yang bisa diselamatkan. Studi banding menunjukkan reverse lebih terprediksi dan fungsinya lebih tinggi daripada hemiartroplasti, meski daya tahan implan masih dipertanyakan.",ref:[z(593),z(603)]},{judul:"Mengapa hemiartroplasti ditinggalkan pada lansia",isi:"Pereda nyeri terprediksi tetapi fungsi tidak, karena penyatuan tuberositas sulit; reverse memberi hasil setara ORIF yang berhasil dan lebih baik daripada hemiartroplasti untuk fraktur, dengan komplikasi khasnya sendiri. Prostesis dikerjakan dalam posisi beach chair.",ref:[D(217),D(218)]},{judul:"Pascaoperasi",isi:"Rehabilitasi sama dengan fiksasi: mulai 10–14 hari, pendulum dan gerak pasif 6 minggu pertama.",ref:z(604)}]},"reduksi-dislokasi":{nama:{id:"Reduksi fraktur-dislokasi",en:"Reduction of a fracture-dislocation"},bab:[{judul:"Prinsip",isi:"Reduksi dini wajib; dengan fraktur kolum humerus, reduksi memerlukan anestesi umum dan relaksasi otot. Reduksi terbuka darurat bila cedera saraf berkembang dengan dislokasi yang tak bisa direduksi tertutup. Dua-bagian dapat dirawat tertutup setelah reduksi bila fragmen tidak lagi bergeser; manipulasi berulang menaikkan risiko miositis osifikans; dislokasi berulang jarang setelah fraktur menyatu.",ref:[D(217),z(605)]},{judul:"Waspada",isi:"Dislokasi intratoraks dapat terjadi pada fraktur-dislokasi kolum chirurgicum — singkirkan pneumotoraks/hemotoraks. Cedera n. aksilaris sangat rentan pada fraktur-dislokasi anterior; yang tidak membaik dalam 2–3 bulan memerlukan EMG dan eksplorasi.",ref:D(219)}]}}}});var On={};Da(On,{default:()=>zt});var K,na,zt,Dn=ma(()=>{K=a=>({buku:"HoF",bab:"16",hlm:a}),na=a=>({buku:"AO",bab:"6.2.2",hlm:a}),zt={id:"humerus-diafisis",nama:{id:"Diafisis humerus",en:"Humeral shaft"},sumber:[{buku:"HoF",bab:"16",hlm:{awal:221,akhir:230}},{buku:"AO",bab:"6.2.2",hlm:{awal:607,akhir:621}}],gambar:"humerus-diafisis:utuh",intro:{id:"Lebih dari 90% sembuh tanpa operasi dengan brace fungsional; yang harus selalu diperiksa adalah n. radialis — sebelum reduksi, saat reduksi, dan saat operasi.",en:"More than 90% heal without surgery in a functional brace; the radial nerve must be examined at presentation, after reduction, and at surgery."},introRef:[K(224),na(620)],pemeriksaan:{klinis:[{teks:"Nyeri, bengkak, deformitas, pemendekan; gerak kasar dengan krepitasi pada manipulasi lembut. Periksa **n. radialis** dengan cermat; pada bengkak hebat, pemeriksaan serial dan pertimbangkan tekanan kompartemen.",ref:K(223)},{teks:"Bedakan abrasi/laserasi kecil dari fraktur terbuka; ekstensi intraartikular fraktur terbuka diuji dengan injeksi salin intraartikular jauh dari luka.",ref:K(223)},{teks:"N. radialis teraba 14–15 cm proksimal epikondilus lateral atau 20–21 cm proksimal epikondilus medial.",ref:K(222)}],radiologis:[{teks:"AP dan lateral humerus termasuk sendi bahu dan siku; untuk dua proyeksi tegak lurus, putar **pasien**, bukan lengannya (lateral transtorakal) — memutar lengan hanya memutar fragmen distal.",ref:K(223)},{teks:"Foto traksi membantu pada fraktur sangat bergeser/kominutif; CT, bone scan, MRI jarang kecuali curiga fraktur patologis.",ref:K(223)}],mekanisme:[{teks:"Langsung (tersering): pukulan/kecelakaan → transversal atau kominutif. Tidak langsung: jatuh pada lengan terentang (lansia) → transversal/oblik; lempar atau panco → spiral.",ref:K(223)},{teks:"Pola menurut gaya: kompresi → proksimal/distal; bending → transversal; torsi → spiral; torsi + bending → oblik dengan fragmen kupu-kupu.",ref:K(223)},{teks:"Pergeseran menurut letak: di atas insersi pektoralis mayor fragmen proksimal abduksi-rotasi eksternal; antara pektoralis dan tuberositas deltoid fragmen proksimal tertarik medial; distal tuberositas deltoid fragmen proksimal abduksi, distal tertarik medial-proksimal oleh biseps/triseps.",ref:K(222)}],epidemiologi:[{teks:"**3–5%** semua fraktur; 2–10% terbuka; sepertiga tengah 60%, proksimal 30%, distal 10%; bimodal (laki-laki dekade ke-3, perempuan dekade ke-7/8).",ref:K(221)}]},klasifikasi:[{nama:"AO/OTA 12",teks:"Tulang 1 segmen 2: 12A simpel (spiral/oblik/transversal), 12B wedge, 12C multifragmentari; keparahan naik dari 12A1 (spiral simpel, kontak luas) ke 12C3.",ref:na(609)},{nama:"Deskriptif",teks:"Terbuka/tertutup; sepertiga proksimal/tengah/distal; bergeser/tidak; transversal, oblik, spiral, segmental, kominutif; tulang normal/osteopenik/patologis; ekstensi artikular.",ref:[K(223),K(224)]},{nama:"Eponim",teks:"Holstein-Lewis: spiral rendah sepertiga distal yang sering disertai lesi n. radialis saat menembus septum intermuskular.",ref:[na(609),K(230)]}],kelompok:[{id:"simpel",nama:{id:"Simpel",en:"Simple"},kode:"AO/OTA 12A",jenis:[{id:"spiral",nama:{id:"Spiral",en:"Spiral"},kode:"12A1",gambar:"humerus-diafisis:spiral",ringkas:"Gaya torsi (lempar, panco); area kontak luas — cocok untuk brace, atau hanging cast bila memendek.",ref:[K(223),K(224)],indikasi:"umum"},{id:"oblik",nama:{id:"Oblik",en:"Oblique"},kode:"12A2",gambar:"humerus-diafisis:oblik",ringkas:"Torsi + bending; oblik pendek berisiko terdistraksi dengan hanging cast → splint koaptasi lebih tepat.",ref:K(224),indikasi:"umum"},{id:"transversal",nama:{id:"Transversal",en:"Transverse"},kode:"12A3",gambar:"humerus-diafisis:transversal",ringkas:"Gaya bending; indikasi relatif operasi karena risiko distraksi dan nonunion lebih tinggi.",ref:[K(223),K(230),na(609)],indikasi:"transversal"}]},{id:"wedge-multi",nama:{id:"Wedge & multifragmentari",en:"Wedge and multifragmentary"},kode:"AO/OTA 12B–C",jenis:[{id:"wedge",nama:{id:"Wedge (kupu-kupu)",en:"Wedge (butterfly)"},kode:"12B",gambar:"humerus-diafisis:wedge",ringkas:"Oblik dengan fragmen kupu-kupu; perlekatan jaringan lunak fragmen harus dipertahankan bila dioperasi.",ref:[K(223),K(227)],indikasi:"umum"},{id:"multifragmentari",nama:{id:"Multifragmentari",en:"Multifragmentary"},kode:"12C",gambar:"humerus-diafisis:multifragmentari",ringkas:"Kominusi berat; bila dioperasi, plat jembatan tanpa diseksi di zona fraktur — sembuh lewat kalus.",ref:K(227),indikasi:"umum"},{id:"segmental",nama:{id:"Segmental",en:"Segmental"},kode:"12C2",gambar:"humerus-diafisis:segmental",ringkas:"Dua tingkat fraktur; indikasi operasi — nail bila plat memerlukan diseksi jaringan lunak yang luas.",ref:[K(226),K(228)],indikasi:"segmental"}]},{id:"khusus",nama:{id:"Situasi khusus",en:"Special situations"},kode:"",jenis:[{id:"holstein-lewis",nama:{id:"Holstein-Lewis (spiral distal + n. radialis)",en:"Holstein-Lewis (distal spiral + radial nerve)"},kode:"12A1 distal",gambar:"humerus-diafisis:holstein-lewis",ringkas:"Saraf dapat terjepit atau terlaserasi di septum intermuskular; paresis radialis hingga **22%** pada fraktur diafisis, tersering di sepertiga tengah.",ref:K(230),indikasi:"radialis"},{id:"terbuka",nama:{id:"Fraktur terbuka",en:"Open fracture"},kode:"",gambar:"humerus-diafisis:terbuka",ringkas:"Indikasi absolut operasi; paresis radialis pada luka terbuka perlu eksplorasi karena laserasi sering.",ref:[K(226),na(620)],indikasi:"terbuka"}]}],indikasi:{umum:{intro:"Lebih dari 90% sembuh nonoperatif. Angulasi anterior 10°, varus 25°/valgus 10°, dan aposisi bayonet hingga 3 cm masih dapat diterima — melebihi itu pun hanya memengaruhi kosmetik.",ref:K(224),opsi:[{id:"brace",nama:{id:"Brace fungsional (Sarmiento)",en:"Functional brace"},gambar:"humerus-diafisis:brace-fungsional",utama:["Standar nonoperatif: dipasang 1–2 minggu setelah hanging cast/splint koaptasi","Pasien tegak & kooperatif, otot lengan atas berfungsi (pleksus utuh)"],ref:[K(224),K(225),na(609)],tatalaksana:"brace"},{id:"koaptasi",nama:{id:"Splint koaptasi / hanging cast (akut)",en:"Coaptation splint / hanging cast (acute)"},gambar:"humerus-diafisis:coaptation",utama:["Koaptasi: pemendekan minimal, oblik pendek/transversal","Hanging cast: tengah bergeser & memendek, spiral/oblik — kontraindikasi relatif transversal"],ref:K(224),tatalaksana:"koaptasi"},{id:"plat",nama:{id:"ORIF plat",en:"Plate fixation"},gambar:"humerus-diafisis:plat-dcp",utama:["Absolut: terbuka, floating shoulder/elbow, cedera vaskular, bilateral/politrauma, paresis radialis sekunder","Relatif: segmental, reduksi tak dapat dipertahankan, transversal, obesitas, patologis, nonunion, defisit neurologis (mis. Parkinson), cedera pleksus"],ref:[K(226),na(609)],tatalaksana:"plat"},{id:"nail",nama:{id:"Nail intramedular terkunci",en:"Locked intramedullary nail"},gambar:"humerus-diafisis:nail-antegrade",utama:["Segmental yang plat-nya butuh diseksi luas","Tulang sangat osteopenik","Fraktur patologis / impending (pilihan terbaik menurut AO)"],ref:[K(228),na(609)],tatalaksana:"nail"}]},transversal:{intro:"Transversal adalah indikasi relatif operasi: cenderung terdistraksi dan nonunion.",opsi:[{id:"brace",nama:{id:"Splint koaptasi → brace fungsional",en:"Coaptation splint → functional brace"},gambar:"humerus-diafisis:brace-fungsional",utama:["Pasien kooperatif, reduksi dapat diterima","Hindari hanging cast (distraksi)"],ref:K(224),tatalaksana:"brace"},{id:"plat",nama:{id:"ORIF plat kompresi",en:"Compression plating"},gambar:"humerus-diafisis:plat-dcp",utama:["Transversal (indikasi relatif)","Kompresi aksial lewat lubang DCP / alat tensioning"],ref:[na(609),na(619)],tatalaksana:"plat"},{id:"nail",nama:{id:"Nail terkunci + kompresi",en:"Locked nail with compression"},gambar:"humerus-diafisis:nail-antegrade",utama:["Alat kompresi khusus menambah kompresi antarfragmen pada transversal/oblik pendek"],ref:na(619),tatalaksana:"nail"}]},segmental:{intro:"Segmental termasuk indikasi (relatif) operasi.",opsi:[{id:"nail",nama:{id:"Nail intramedular terkunci",en:"Locked IM nail"},gambar:"humerus-diafisis:nail-antegrade",utama:["Plat akan memerlukan diseksi jaringan lunak luas"],ref:K(228),tatalaksana:"nail"},{id:"plat",nama:{id:"Plat panjang (jembatan)",en:"Long bridging plate"},gambar:"humerus-diafisis:plat-dcp",utama:["Plat ≥ 8 lubang, lengan momen panjang"],ref:na(610),tatalaksana:"plat"}]},radialis:{intro:"Paresis radialis pada cedera tertutup hampir selalu neurapraksia: > 95% pulih spontan. Eksplorasi primer bila luka terbuka atau paresis muncul setelah prosedur tanpa saraf terlihat sepanjang jalurnya.",ref:na(620),opsi:[{id:"brace",nama:{id:"Nonoperatif + observasi saraf",en:"Nonoperative + nerve observation"},gambar:"humerus-diafisis:brace-fungsional",utama:["Cedera tertutup dengan paresis primer","Eksplorasi tertunda bila tanpa pemulihan (EMG/NCV) pada 3–4 bulan"],ref:[K(230),na(620)],tatalaksana:"brace"},{id:"plat",nama:{id:"ORIF + eksplorasi n. radialis",en:"ORIF + radial nerve exploration"},gambar:"humerus-diafisis:plat-dcp",utama:["Luka terbuka / trauma tembus (laserasi sering)","Paresis sekunder setelah manipulasi (indikasi absolut menurut AO; HoF: kontroversial)"],ref:[K(226),na(609),na(620)],tatalaksana:"plat"}]},terbuka:{intro:"Fraktur terbuka ditangani segera; stabilisasi dipilih menurut jaringan lunak.",opsi:[{id:"plat",nama:{id:"ORIF plat (± eksplorasi saraf)",en:"Plate fixation (± nerve exploration)"},gambar:"humerus-diafisis:plat-dcp",utama:["Luka memungkinkan debridement dan fiksasi definitif"],ref:[K(226),na(610)],tatalaksana:"plat"},{id:"eksfiks",nama:{id:"Fiksator eksternal",en:"External fixator"},gambar:"humerus-diafisis:eksfiks",utama:["Kehilangan jaringan lunak luas, luka bakar, nonunion terinfeksi","Stabilisasi sementara sebelum perbaikan vaskular"],ref:[K(229),na(619)],tatalaksana:"eksfiks"}]}},tatalaksana:{brace:{nama:{id:"Brace fungsional",en:"Functional bracing"},bab:[{judul:"Prinsip",isi:"Kompresi hidrostatik jaringan lunak menjaga aligment sambil membiarkan sendi tetangga bergerak. Dipasang 1–2 minggu setelah cedera, sesudah hanging cast/splint koaptasi dan nyeri-bengkak mereda; terdiri atas cangkang anterior–posterior (atau medial–lateral) dengan tali Velcro.",ref:K(225)},{judul:"Syarat & kontraindikasi",isi:"Keberhasilan butuh pasien tegak, brace dikencangkan setiap hari, dan otot lengan atas berfungsi. Kontraindikasi: cedera jaringan lunak masif, pasien tidak dapat diandalkan, reduksi tak dapat dicapai/dipertahankan. Lengan bawah ditopang collar-and-cuff — sling dapat menimbulkan angulasi varus.",ref:K(225)},{judul:"Durasi & hasil",isi:"Dipakai minimal **8 minggu** atau sampai ada tanda union radiologis. Union 95% dengan hasil baik–sangat baik; angulasi anterior < 20°, varus < 30°, rotasi < 40°, pemendekan < 3 cm ditoleransi secara fungsional, meski pasien makin tidak menerima deformitas kosmetik (varus, pemendekan).",ref:[K(225),na(609)]},{judul:"Komplikasi",isi:"Nonunion hingga **15%** (risiko: sepertiga proksimal/distal, transversal, distraksi, interposisi jaringan lunak, stabilisasi tak memadai) → ORIF + cangkok tulang. Malunion sering tidak berdampak fungsional karena bahu, siku, dan batang tubuh mengompensasi. Celah fraktur, merokok, dan jenis kelamin perempuan memperlama penyembuhan.",ref:[K(230),na(620)]}]},koaptasi:{nama:{id:"Splint koaptasi dan hanging cast",en:"Coaptation splint and hanging cast"},bab:[{judul:"Hanging cast",isi:"Traksi dependen oleh berat gips dan lengan untuk mereduksi fraktur. Indikasi: fraktur tengah bergeser dengan pemendekan, terutama spiral/oblik; transversal/oblik pendek adalah kontraindikasi relatif karena distraksi. Jarang dipakai sebab pasien harus selalu tegak/setengah tegak; diganti brace fungsional begitu kalus dini terbentuk; union > 95%.",ref:K(224)},{judul:"Splint koaptasi",isi:"Traksi dependen plus tekanan hidrostatik dengan stabilisasi lebih baik dan distraksi lebih sedikit; lengan bawah digantung collar-and-cuff. Untuk fraktur akut dengan pemendekan minimal dan pola oblik pendek/transversal; kekurangan: iritasi aksila dan splint melorot; diganti brace 1–2 minggu.",ref:[K(224),K(225)]},{judul:"Velpeau",isi:"Imobilisasi torakobrakial hanya untuk lansia/anak yang tidak toleran cara lain dan kenyamanan menjadi tujuan utama — fraktur tak bergeser/minimal; pendulum 1–2 minggu, lalu brace.",ref:K(225)}]},plat:{nama:{id:"Reduksi terbuka dan fiksasi plat",en:"Open reduction and plate fixation"},bab:[{judul:"Mengapa plat",isi:"Hasil fungsional terbaik: reduksi langsung dan fiksasi stabil tanpa melukai rotator cuff; cocok untuk hampir semua fraktur dan pilihan terbaik untuk sepertiga proksimal/distal terutama dengan ekstensi artikular. Union 92–98% dari 600 plating; infeksi < 1%; paresis radialis iatrogenik 3%; > 97% fungsi baik.",ref:[K(227),na(609),na(620)]},{judul:"Pendekatan",isi:"**Anterolateral** untuk sepertiga proksimal (n. radialis dikenali di interval brakialis–brakioradialis dan ditelusuri ke proksimal; brakialis dibelah; dapat diperluas ke bahu). **Anterior** di interval biseps–brakialis. **Posterior** untuk sebagian besar humerus termasuk siku, tidak bisa diperluas ke bahu; interval kaput lateral–longum triseps, kaput medial dibelah; n. radialis dikenali di alur spiral di pertengahan lengan. Posisi: telentang meja radiolusen (anterior/anterolateral), beach chair, lateral/tengkurap (posterior).",ref:K(226)},{judul:"Implan & teknik",isi:"DCP/LCP 4.5 untuk pasien besar, LCP 3.5 untuk kebanyakan; selalu **≥ 8 lubang** karena eksursi rotasi lengan yang besar memerlukan lengan momen panjang. Sekrup mengait **6–8 korteks** di atas dan di bawah fraktur; kompresi antarfragmen dengan lag screw (idealnya lewat plat) atau prabeban aksial lewat lubang DCP/alat tensioning. Reduksi atraumatik: traksi; oblik/spiral ditahan klem runcing atau cerclage; transversal direduksi dengan plat. Plat ekstraperiosteal, tanpa pengupasan periosteum; pertahankan jaringan lunak fragmen kupu-kupu; pada kominusi berat gunakan plat jembatan (sembuh lewat kalus). Pastikan n. radialis **tidak terjepit di bawah ujung plat** dengan melihat langsung.",ref:[K(227),na(610),na(619)]},{judul:"Pascaoperasi",isi:"Gerak tangan dan pergelangan segera; bahu dan siku begitu nyeri mereda — gerak aktif-asistif sampai insisi sembuh, lalu aktif; dengan rekonstruksi stabil pasien boleh memakai alat bantu jalan tanpa batasan.",ref:[K(229),na(620)]},{judul:"Komplikasi",isi:"Paresis radialis (cedera awal, reduksi tertutup, atau operasi), delayed union, malunion, infeksi; kegagalan implan terutama pada osteoporosis. Nonunion didorong fiksasi tak memadai, penanganan jaringan lunak buruk, dan diseksi periosteal sirkumferensial.",ref:na(620)}]},nail:{nama:{id:"Nail intramedular terkunci",en:"Locked intramedullary nailing"},bab:[{judul:"Indikasi",isi:"Segmental (plat butuh diseksi luas), tulang sangat osteopenik, fraktur patologis — nail adalah pilihan terbaik untuk patologis/impending. Dua uji acak plat vs nail: union serupa, komplikasi lebih tinggi pada nail; nail antegrade sering menimbulkan gejala bahu.",ref:[K(228),na(609),na(621)]},{judul:"Teknik antegrade",isi:"Pendekatan anterolateral akromial; titik masuk menghindari insersi rotator cuff; nail dimasukkan tanpa paksaan di bawah pencitraan — bila tahanan besar: perbesar titik masuk, ream kanal, atau pilih nail lebih kecil; dimajukan dengan gerakan rotasi tanpa palu setelah reduksi. Kunci ganda proksimal dan distal; alat kompresi untuk transversal/oblik pendek (bukan untuk fraktur tak stabil longitudinal). Proksimal nail ditenggelamkan agar tidak impingement subakromial.",ref:[K(228),K(229),na(619)]},{judul:"Bahaya saraf",isi:"Sekrup kunci proksimal mengancam **n. aksilaris** — insisi kecil, diseksi tumpul ke tulang, kanula pelindung; sekrup tidak boleh menonjol > 2 mm dari korteks jauh; hindari sekrup anterior–posterior. Kunci distal biasanya bidang AP dengan teknik terbuka; sekrup lateral–medial mengancam n. kutaneus antebrakial lateral dan n. radialis.",ref:[K(228),K(229),na(620)]},{judul:"Pascaoperasi",isi:"Latihan bahu dan siku dapat dimulai segera, tetapi gerak rotasi melawan tahanan diminimalkan.",ref:na(620)}]},eksfiks:{nama:{id:"Fiksasi eksternal",en:"External fixation"},bab:[{judul:"Kapan",isi:"Jarang: nonunion terinfeksi, pasien luka bakar, fraktur terbuka dengan kehilangan jaringan lunak luas; juga stabilisasi sementara sebelum perbaikan vaskular. Komplikasi: infeksi jalur pin, cedera neurovaskular, nonunion.",ref:K(229)},{judul:"Teknik",isi:"Kerangka unilateral half-pin cukup; karena jalur saraf dan pembuluh bervariasi, pin dipasang **terbuka terbatas**: insisi kecil, diseksi tumpul ke tulang, pemandu lewat insisi; Schanz paling distal di distal fossa olekranon.",ref:na(619)}]}}}});var Kn={};Da(Kn,{default:()=>_t});var _,_t,Nn=ma(()=>{_=a=>({buku:"HoF",bab:"44",hlm:a}),_t={id:"suprakondiler",nama:{id:"Fraktur suprakondiler humerus",en:"Supracondylar humerus fracture"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:570,akhir:575}}],gambar:"siku-lateral:utuh",intro:{id:"Fraktur siku anak tersering (55–75%); tipe ekstensi hampir semuanya. Yang menentukan hasil: status neurovaskular dan reduksi yang stabil.",en:"The most common pediatric elbow fracture (55–75%); almost all are extension type. Outcome hinges on neurovascular status and a stable reduction."},introRef:_(574),pemeriksaan:{klinis:[{teks:"Deformitas **S** pada tipe ekstensi; **pucker sign** (lesung kulit antekubital) berarti fragmen proksimal menembus m. brakialis — reduksi tertutup mungkin sulit.",ref:_(574)},{teks:"Dokumentasikan n. medianus/interoseus anterior (OK sign), n. radialis (ekstensi ibu jari), n. ulnaris (abduksi jari), nadi radialis, capillary refill dan kehangatan tangan **sebelum dan sesudah** setiap manipulasi.",ref:_(575)},{teks:"Nadi yang hilang tetapi tangan hangat dan perfusi baik dapat diobservasi; yang menentukan adalah perfusi tangan, bukan nadi.",ref:[_(575),_(600)]},{teks:"Cari bengkak antekubital masif (sindrom kompartemen < 1%) dan laserasi (uji injeksi salin intraartikular bila ragu fraktur terbuka).",ref:_(575)}],radiologis:[{teks:"Lateral: **garis humerus anterior** harus memotong sepertiga tengah pusat osifikasi kapitulum; bentuk *teardrop*; sudut diafisis–kondilus 30–45°.",ref:_(572)},{teks:"**Fat pad posterior** hanya terangkat oleh efusi sedang–besar → sangat spesifik untuk fraktur intraartikular (kemungkinan fraktur > 70%); fat pad anterior sensitif tetapi tidak spesifik.",ref:_(572)},{teks:"AP: sudut **Baumann** (fisis kondilus lateral vs sumbu humerus; HoF 15–20°, bandingkan sisi sehat) untuk menilai varus.",ref:_(572)},{teks:"Urutan pusat osifikasi **CRITOE**: kapitulum 6 bulan–2 th, kaput radius 4 th, epikondilus medial 6–7 th, troklea 8 th, olekranon 8–10 th, epikondilus lateral 12 th.",ref:_(570)}],mekanisme:[{teks:"Jatuh pada tangan terentang dengan siku hiperekstensi; tangan pronasi → fragmen distal bergeser posteromedial (lebih sering), supinasi → posterolateral.",ref:_(574)}],epidemiologi:[{teks:"**55–75%** fraktur siku anak; tipe ekstensi **98%**, fleksi 2%; puncak usia 5–8 tahun; sisi kiri/nondominan lebih sering.",ref:_(574)},{teks:"Cedera saraf **7–10%** (medianus/AIN tersering); cedera vaskular 0,5%.",ref:_(575)}]},klasifikasi:[{nama:"Gartland (tipe ekstensi)",teks:"I tak bergeser; II bergeser dengan korteks posterior utuh (boleh berangulasi/berotasi); III bergeser total (posteromedial atau posterolateral).",ref:_(574)},{nama:"Tipe fleksi",teks:"Analog I–III dengan korteks **anterior** sebagai engsel; tipe III biasanya anterolateral dan sering perlu reduksi terbuka; n. ulnaris lebih berisiko.",ref:_(574)}],kelompok:[{id:"ekstensi",nama:{id:"Tipe ekstensi (98%)",en:"Extension type (98%)"},kode:"Gartland",jenis:[{id:"g1",nama:{id:"Gartland I — tak bergeser",en:"Gartland I — undisplaced"},kode:"Gartland I",gambar:"siku-lateral:gartland-1",ringkas:"Garis humerus anterior masih memotong kapitulum; sering hanya fat pad posterior yang terlihat.",ref:_(574),indikasi:"g1"},{id:"g2",nama:{id:"Gartland II — bergeser, korteks posterior utuh",en:"Gartland II — displaced, posterior cortex intact"},kode:"Gartland II",gambar:"siku-lateral:gartland-2",ringkas:"Fragmen distal berangulasi ke posterior dengan engsel korteks posterior; garis humerus anterior lewat di depan kapitulum.",ref:_(574),indikasi:"g2"},{id:"g3",nama:{id:"Gartland III — bergeser total",en:"Gartland III — completely displaced"},kode:"Gartland III",gambar:"siku-lateral:gartland-3",ringkas:"Tanpa kontak korteks; posteromedial lebih sering daripada posterolateral; risiko neurovaskular tertinggi.",ref:_(574),indikasi:"g3"}]},{id:"fleksi",nama:{id:"Tipe fleksi (2%)",en:"Flexion type (2%)"},kode:"Gartland (fleksi)",jenis:[{id:"fleksi",nama:{id:"Tipe fleksi — fragmen distal ke anterior",en:"Flexion type — distal fragment anterior"},kode:"I–III (fleksi)",gambar:"siku-lateral:fleksi",ringkas:"Jatuh pada siku yang fleksi; korteks anterior sebagai engsel; tipe III sering ireduksibel tertutup.",ref:_(574),indikasi:"fleksi"}]}],indikasi:{g1:{intro:"Tidak bergeser: cukup imobilisasi, tetapi periksa ulang neurovaskular setelah lengan difleksikan.",opsi:[{id:"gips",nama:{id:"Gips/splint lengan panjang",en:"Long-arm cast/splint"},gambar:"gips-lengan-panjang",utama:["Gartland I","Fleksi siku 60–90°, 2–3 minggu"],ref:_(574),tatalaksana:"gips"}]},g2:{intro:"Bergeser dengan engsel posterior: reduksi tertutup, lalu nilai apakah reduksi stabil tanpa fleksi berlebihan.",opsi:[{id:"reduksi-gips",nama:{id:"Reduksi tertutup + gips",en:"Closed reduction + cast"},gambar:"gips-lengan-panjang",utama:["Reduksi stabil pada fleksi ≤ 90°","Tanpa bengkak berat"],ref:_(574),tatalaksana:"reduksi-gips"},{id:"crpp",nama:{id:"Reduksi tertutup + pinning perkutan",en:"Closed reduction + percutaneous pinning"},gambar:"siku-ap:crpp",utama:["Reduksi tidak stabil","Reduksi hanya bertahan dengan fleksi berlebihan (risiko vaskular/kompartemen)"],ref:_(574),tatalaksana:"crpp"}]},g3:{intro:"Bergeser total: standar terapi adalah reduksi tertutup dan pinning perkutan; reduksi terbuka untuk yang ireduksibel atau dengan cedera neurovaskular.",opsi:[{id:"crpp",nama:{id:"Reduksi tertutup + pinning perkutan (standar)",en:"Closed reduction + percutaneous pinning (standard)"},gambar:"siku-ap:crpp",utama:["Gartland III yang dapat direduksi tertutup","Pin lateral divergen; pin medial hanya bila perlu, dengan proteksi n. ulnaris"],ref:[_(574),_(575)],tatalaksana:"crpp"},{id:"orif",nama:{id:"Reduksi terbuka + pin",en:"Open reduction + pinning"},gambar:"siku-ap:orif",utama:["Tidak stabil rotasi / ireduksibel (pucker sign, interposisi brakialis)","Fraktur terbuka","Cedera neurovaskular yang memerlukan eksplorasi"],ref:_(574),tatalaksana:"orif"}]},fleksi:{intro:"Tipe fleksi lebih jarang dan lebih sering ireduksibel tertutup.",opsi:[{id:"crpp",nama:{id:"Reduksi tertutup + pinning",en:"Closed reduction + pinning"},gambar:"siku-ap:crpp",utama:["Tipe I–II yang stabil setelah reduksi dalam ekstensi"],ref:_(574),tatalaksana:"crpp"},{id:"orif",nama:{id:"Reduksi terbuka + pin",en:"Open reduction + pinning"},gambar:"siku-ap:orif",utama:["Tipe III anterolateral yang ireduksibel"],ref:_(574),tatalaksana:"orif"}]}},tatalaksana:{gips:{nama:{id:"Gips/splint lengan panjang",en:"Long-arm cast/splint"},bab:[{judul:"Teknik",isi:"Siku difleksikan **60–90°** dalam gips/splint lengan panjang selama **2–3 minggu**. Setelah difleksikan, periksa ulang nadi dan perfusi: fleksi berlebihan pada siku yang bengkak dapat menekan a. brakialis.",ref:_(574)},{judul:"Tindak lanjut",isi:"Foto ulang untuk memastikan tidak ada pergeseran lanjut; setelah gips dilepas, gerak aktif; hilang gerak > 5° terjadi pada sekitar 5%.",ref:_(575)}]},"reduksi-gips":{nama:{id:"Reduksi tertutup lalu gips",en:"Closed reduction then casting"},bab:[{judul:"Urutan reduksi",isi:"Traksi longitudinal → koreksi pergeseran koronal dan rotasi → koreksi sagital dengan fleksi siku sambil mendorong olekranon ke anterior; pronasi lengan bawah untuk pergeseran posteromedial. Nilai stabilitas dengan pencitraan.",ref:_(574)},{judul:"Kapan beralih ke pin",isi:"Bila reduksi hanya bertahan dengan fleksi > 90° atau tidak stabil, pasang pin perkutan — mempertahankan fl
