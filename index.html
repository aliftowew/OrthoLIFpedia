**langsung** (remodeling osteonal tanpa kalus) bila fiksasi memberi [[stabilitas-absolut|stabilitas absolut]], atau **tidak langsung** lewat [[kalus]] bila ada gerak terkendali ([[stabilitas-relatif|stabilitas relatif]]). Yang menentukan adalah [[strain]] di celah fraktur (teori Perren) dan suplai darah; setiap tindakan bedah mengubah keduanya, jadi fiksasi selalu kompromi antara mekanika dan biologi.",angka:[{nilai:"2%",label:"toleransi strain tulang utuh sebelum patah — di atas ini tulang tidak bisa menjembatani celah",ref:J(18)},{nilai:"100%",label:"toleransi strain jaringan granulasi; kalus membesar untuk menurunkan strain di tepi",ref:J(18)},{nilai:"1–7",satuan:"hari",label:"fase inflamasi: hematoma → jaringan granulasi",ref:J(13)},{nilai:"2–3",satuan:"minggu",label:"kalus lunak terbentuk; fragmen tak lagi bergerak bebas",ref:J(13)},{nilai:"3–4",satuan:"bulan",label:"kalus keras: fragmen menyatu dengan tulang anyaman (woven bone)",ref:J(13)},{nilai:"≈ 50%",label:"penurunan aliran darah korteks segera setelah fraktur; hiperemia memuncak pada 2 minggu",ref:J(11)},{nilai:"> 2.500",satuan:"N",label:"gaya kompresi yang bisa dihasilkan satu sekrup lag dan bertahan melampaui waktu penyembuhan",ref:J(20)},{nilai:"≈ 13",satuan:"minggu",label:"gerak antarfragmen fraktur diafisis tibia turun ke tingkat stabil oleh kalus",ref:J(17)}],poin:[{teks:"Tulang itu kaku dan kuat tetapi **getas** (seperti kaca, bukan karet): patah pada deformasi kecil, sehingga tidak bisa menjembatani celah yang terus bergeser berlebihan.",ref:J(10)},{teks:"Fraktur terjadi dalam sepersekian milidetik dengan proses mirip implosi (kavitasi) yang merusak jaringan lunak di sekitarnya — kerusakan jaringan lunak selalu lebih luas daripada yang tampak.",ref:J(10)},{teks:"Suplai darah ke kalus sebagian besar datang dari **jaringan lunak sekitar**, bukan dari kanal medula — alasan utama untuk tidak mengupas periosteum dan otot.",ref:J(12),penting:!0},{teks:"Reaming menurunkan aliran darah endosteal sementara (pemulihan tertunda sesuai luas reaming) tetapi tidak mengganggu perfusi kalus.",ref:J(12)},{teks:"Penyembuhan tidak langsung (sekunder) = cara alami tulang sembuh: inflamasi → kalus lunak → kalus keras → remodeling; melibatkan osifikasi intramembranosa dan endokondral.",ref:J(13),penting:!0},{teks:"Penyembuhan langsung (primer) hanya terjadi pada stabilitas absolut: osteon dengan 'kepala pemotong' (cutting cone) menembus garis fraktur; **tanpa kalus**, lebih lambat, sehingga implan harus kuat menahan beban lama tanpa gagal lelah.",ref:J(22),penting:!0},{teks:"Tulang kanselus (metafisis) sembuh lebih cepat dan tanpa kalus eksternal yang berarti karena potensi angiogenik besar dan fiksasi metafisis biasanya lebih stabil.",ref:J(14)},{teks:"Definisi klinis: fraktur **stabil** = tidak bergeser tampak di bawah beban fisiologis; **stabilitas absolut** = tidak ada gerak sama sekali di garis fraktur di bawah beban fisiologis.",ref:J(15)},{teks:"Syarat stabilitas relatif yang berhasil: pergeseran di bawah beban bersifat **elastis** (kembali), bukan permanen. Terlalu kaku (tanpa gerak) maupun terlalu lentur sama-sama menunda penyembuhan.",ref:J(15)},{teks:"Teori strain Perren: strain = ΔL/L. Celah sempit dengan gerak kecil berstrain tinggi; kalus memperbesar volume agar strain di tepi turun, lalu tulang menjembatani dari **tepi ke pusat**. Osteon bahkan tersusun spiral seperti pegas untuk menurunkan strain.",ref:J(18)},{teks:"Fraktur multifragmentari mentoleransi lebih banyak gerak karena gerak total dibagi ke banyak bidang fraktur → strain per celah lebih kecil. Sebaliknya, plat jembatan pada fraktur **simpel** menciptakan strain tinggi di satu celah sempit → delayed union/nonunion.",ref:J(17),penting:!0},{teks:"Stabilitas absolut dicapai lewat **preload kompresi + friksi**: kompresi statis tidak menyebabkan nekrosis tekanan; friksi melawan geser akibat torsi; permukaan kasar yang saling mengunci menambah tahanan.",ref:J(20)},{teks:"Sekrup lag mengompresi dari dalam fraktur, tetapi lengan tuasnya kecil dan tidak toleran terhadap satu kali beban berlebih (ulir slip = kompresi hilang) → di diafisis selalu dilindungi plat proteksi.",ref:J(21)},{teks:"Plat lurus yang diregangkan hanya mengompresi korteks dekat; **prebending** (sedikit melengkungkan plat) membuat korteks jauh ikut terkompresi.",ref:J(21)},{teks:"Plat memiliki enam fungsi: proteksi, kompresi, tension band, bridging, buttress, dan alat reduksi; LCP dengan lubang kombinasi bisa dipakai untuk stabilitas absolut maupun relatif (prinsip fiksator internal).",ref:J(21)},{teks:"Tanda radiologis fiksasi absolut sehat: garis fraktur memudar dengan trabekula menyeberang; tanda tidak sehat: celah melebar, 'kalus iritasi' berawan, dan **osteolisis di sekitar sekrup** (tanda paling dini kegagalan).",ref:J(23)},{teks:"Kontak plat–tulang yang luas mengganggu perfusi periosteal dan menimbulkan porosis sementara di bawah plat; LC-DCP/LCP yang bertakik mengurangi kontak, bridging plate menghindari kontak di zona fraktur.",ref:J(11)}],tabel:[{judul:"Dua jenis penyembuhan tulang",kolom:["Aspek","Langsung (primer)","Tidak langsung (sekunder)"],baris:[["Syarat mekanis","Stabilitas absolut: tanpa gerak di garis fraktur","Stabilitas relatif: gerak terkendali, elastis"],["Proses","Remodeling osteonal (Haversian) menembus fraktur","Inflamasi → kalus lunak → kalus keras → remodeling"],["Kalus","Tidak ada (atau minimal)","Ada; makin lentur fiksasi, makin besar"],["Kecepatan","Lebih lambat; implan harus kuat lama","Cara alami, umumnya lebih cepat bila kalus terbentuk"],["Implan khas","Sekrup lag + plat proteksi/kompresi","Nail, fiksator eksternal, bridge plate, gips"],["Indikasi khas","Fraktur artikular, beberapa diafisis simpel (lengan bawah)","Diafisis multifragmentari, metafisis"]],ref:J(15)},{judul:"Tahap penyembuhan tidak langsung",kolom:["Tahap","Waktu","Ciri utama"],baris:[["Inflamasi","segera – 1–7 hari","Hematoma, nekrosis ujung fragmen, sitokin; hematoma diganti jaringan granulasi"],["Kalus lunak","≈ 2–3 minggu","Sel progenitor periosteum/endosteum → osteoblas; tulang anyaman jauh dari celah; fibroblas & kondrosit dekat celah"],["Kalus keras","sampai 3–4 bulan","Osifikasi endokondral mengubah kalus jadi tulang anyaman; mulai dari tepi (strain terendah) ke pusat"],["Remodeling","bulan – tahun","Tulang anyaman → lamelar lewat remodeling osteonal; kanal medula pulih"]],ref:J(13)}],algoritma:[{judul:"Memilih prinsip stabilitas",langkah:[{teks:"Apakah fraktur mengenai permukaan sendi?",cabang:["Ya → reduksi anatomis + stabilitas absolut (kompresi antarfragmen), mobilisasi dini"]},{teks:"Fraktur diafisis: simpel atau multifragmentari?",cabang:["Simpel (transversal/oblik pendek/spiral) → bisa absolut (lag screw + plat) terutama lengan bawah, atau nail terkunci","Multifragmentari → relatif (nail, bridge plate/LCP sebagai fiksator internal, fiksator eksternal); jangan dikompresi"]},{teks:"Nilai biologi: kualitas jaringan lunak, perfusi, komorbid.",cabang:["Jaringan lunak buruk → teknik yang paling sedikit mengganggu perfusi (MIO, fiksator eksternal)"]},"Jangan mencampur prinsip pada satu fraktur: plat kompresi pada kominusi yang tidak direduksi = strain tinggi di celah kecil → nonunion."],ref:J(17)}],jebakan:[{teks:"Penyembuhan primer bukan tujuan fiksasi absolut melainkan **efek samping**; tujuannya reduksi anatomis dan rehabilitasi dini (Danis).",ref:J(12)},{teks:"Nail Küntscher klasik tahan lentur tetapi lemah terhadap torsi dan tidak mencegah pemendekan — karena itu nail modern dikunci (locked).",ref:J(17)},{teks:"Gangguan vitalitas tulang (biologi) jauh lebih sulit ditangani daripada nonunion hipertrofik akibat fiksasi terlalu lentur, yang cukup diperbaiki dengan menambah stabilitas.",ref:J(19)},{teks:"BMP-2 bukan obat rutin: sebagian besar pemakaian off-label dan bisa menimbulkan osifikasi ektopik.",ref:J(13)}],istilahIds:["strain","kalus","stabilitas-absolut","stabilitas-relatif","penyembuhan-langsung","remodeling-haversian","ligamentotaxis","dinamisasi","internal-fixator","protection-plate","osifikasi-endokondral"],adeganIds:["strain","stabilitas"],klasifikasiIds:[],soal:[{id:"A-2-01",pertanyaan:"Fraktur diafisis femur multifragmentari difiksasi dengan nail intramedular terkunci. Jenis penyembuhan yang diharapkan adalah…",opsi:["Penyembuhan langsung tanpa kalus lewat remodeling osteonal","Penyembuhan tidak langsung dengan pembentukan kalus","Penyembuhan intramembranosa tanpa fase inflamasi","Penyembuhan dengan jaringan fibrosa permanen"],jawaban:1,penjelasan:"Nail memberi stabilitas relatif: gerak antarfragmen terkendali merangsang kalus (penyembuhan sekunder).",ref:J(16),tingkat:1,tag:["biomekanik"]},{id:"A-2-02",pertanyaan:"Menurut teori strain Perren, toleransi strain tulang utuh sebelum patah adalah sekitar…",opsi:["2%","10%","30%","100%"],jawaban:0,penjelasan:"Tulang utuh mentoleransi strain sekitar 2%; jaringan granulasi mentoleransi hingga 100%.",ref:J(18),tingkat:1,tag:["strain"]},{id:"A-2-03",pertanyaan:"Mengapa plat jembatan (bridge plate) tidak boleh dipakai pada fraktur diafisis simpel?",opsi:["Plat akan mengompresi fraktur berlebihan","Satu celah sempit menanggung seluruh gerak → strain tinggi → nonunion","Kalus tidak bisa terbentuk di bawah plat","Sekrup tidak bisa dipasang bikortikal"],jawaban:1,penjelasan:"Pada fraktur simpel, seluruh gerak terjadi di satu celah kecil sehingga strain melampaui toleransi tulang anyaman; fraktur multifragmentari membagi gerak ke banyak bidang.",ref:J(17),tingkat:2,tag:["strain"]},{id:"A-2-04",pertanyaan:"Sumber utama suplai darah ke kalus adalah…",opsi:["Arteri nutrisia endosteal","Jaringan lunak di sekitar fraktur","Arteri metafisis","Kanal Haversian korteks"],jawaban:1,penjelasan:"Studi mikroangiografi menunjukkan sebagian besar vaskularisasi kalus berasal dari jaringan lunak sekitar — alasan untuk tidak mengupasnya.",ref:J(12),tingkat:1,tag:["biologi"]},{id:"A-2-05",pertanyaan:"Tanda radiologis paling dini bahwa fiksasi plat dengan stabilitas absolut mulai gagal adalah…",opsi:["Kalus perifer yang besar","Osteolisis di sekitar sekrup","Garis fraktur yang memudar","Trabekula menyeberangi garis fraktur"],jawaban:1,penjelasan:"Osteolisis di antarmuka sekrup–tulang menandakan beban berlebih melewati plat; kalus 'iritasi' berawan dan celah melebar juga tanda instabilitas.",ref:J(23),tingkat:2,tag:["radiologi"]},{id:"A-2-06",pertanyaan:"Fase penyembuhan tidak langsung yang ditandai fragmen tidak lagi bergerak bebas, kira-kira 2–3 minggu pascafraktur, adalah…",opsi:["Inflamasi","Kalus lunak","Kalus keras","Remodeling"],jawaban:1,penjelasan:"Akhir fase kalus lunak memberi stabilitas cukup untuk mencegah pemendekan, meski angulasi masih mungkin.",ref:J(13),tingkat:1,tag:["biologi"]},{id:"A-2-07",pertanyaan:"Dua mekanisme yang menghasilkan stabilitas absolut pada fiksasi kompresi adalah…",opsi:["Preload kompresi dan friksi antarfragmen","Kalus dan osifikasi endokondral","Ligamentotaxis dan kontak tiga titik","Kekakuan plat dan panjang plat"],jawaban:0,penjelasan:"Kompresi menjaga kontak fragmen; friksi yang ditimbulkannya melawan gaya geser akibat torsi.",ref:J(20),tingkat:2,tag:["biomekanik"]},{id:"A-2-08",pertanyaan:"Plat lurus yang diregangkan pada tulang lurus akan…",opsi:["Mengompresi kedua korteks secara simetris","Mengompresi korteks dekat saja dengan sedikit distraksi korteks jauh","Mendistraksi korteks dekat","Tidak menghasilkan kompresi"],jawaban:1,penjelasan:"Kompresi hanya di bawah plat; prebending plat membuat korteks jauh ikut terkompresi.",ref:J(21),tingkat:2,tag:["plat"]}]};var ea=a=>({buku:"AO",bab:"1.4",hlm:a}),xi={id:"A-4",ringkasan:"Klasifikasi AO/OTA (Compendium 2018, berbasis sistem Müller) menyandikan **lokasi** (tulang + segmen) lalu **morfologi** (tipe A/B/C → grup → subgrup) menjadi kode alfanumerik seperti **32-B2** atau **33C3.3**. Tipe diafisis: simpel–wedge–multifragmentari; tipe segmen ujung: ekstraartikular–parsial artikular–artikular komplet. Klasifikasi baru lengkap setelah semua informasi (termasuk temuan intraoperatif) terkumpul.",angka:[{nilai:"3",label:"segmen tiap tulang panjang: 1 proksimal, 2 diafisis, 3 distal (tibia punya segmen ke-4: maleolar, 44)",ref:ea(41)},{nilai:"30°",label:"batas grup diafisis simpel: oblik bila ≥ 30° terhadap garis tegak lurus sumbu tulang, transversal bila < 30°",ref:ea(44)},{nilai:"2",label:"proyeksi radiografi polos tegak lurus minimal untuk klasifikasi; CT untuk fraktur kompleks",ref:ea(46)},{nilai:"2018",label:"revisi Compendium terakhir (revisi pertama 2007; kesepakatan AO–OTA 1996)",ref:ea(39)}],poin:[{teks:"Tujuan klasifikasi (Müller): mempertimbangkan keparahan lesi tulang, menjadi dasar terapi, dan dasar evaluasi hasil — sekaligus alat komunikasi, dokumentasi, riset, dan prognosis.",ref:ea(39)},{teks:"Nomor tulang: 1 humerus, 2R radius, 2U ulna, 3 femur, 4 tibia, 4F fibula, 5 spine, 6 pelvis (61 cincin, 62 asetabulum), 7 tangan (77 metakarpal, 78 falang), 8 kaki (87 metatarsal, 88 falang), 9 kraniomaksilofasial; skapula 14, klavikula 15, toraks 16, patela 34.",ref:ea(40),penting:!0},{teks:"Segmen ujung ditentukan oleh **persegi** yang sisinya sama dengan bagian terlebar metafisis (kecuali femur proksimal 31). Pada dewasa epifisis dan metafisis sudah menyatu menjadi satu segmen ujung.",ref:ea(41),penting:!0},{teks:"Tipe diafisis: **A simpel** (satu garis sirkumferensial), **B wedge** (fragmen perantara, masih ada kontak korteks setelah reduksi), **C multifragmentari** (tidak ada kontak fragmen utama setelah reduksi).",ref:ea(42),penting:!0},{teks:"Tipe segmen ujung: **A ekstraartikular**, **B parsial artikular** (sebagian sendi masih menempel pada metafisis), **C artikular komplet** (permukaan sendi terpisah seluruhnya dari diafisis).",ref:ea(43),penting:!0},{teks:"Pengecualian: 11 humerus proksimal (A unifokal 2-part, B bifokal 3-part, C artikular/4-part — istilah Neer dimasukkan), 31 femur proksimal (A trokanterik, B kolum, C kaput; segmen dibatasi garis batas bawah trokanter minor), 44 maleolar (A infra-, B trans-, C suprasindesmotik menurut level fraktur fibula).",ref:ea(43),penting:!0},{teks:"Grup diafisis: A1 spiral, A2 oblik, A3 transversal; B2 wedge utuh, B3 wedge terfragmentasi; C2 segmental utuh, C3 segmental terfragmentasi.",ref:ea(44)},{teks:"Grup segmen ujung: A1 avulsi, A2 simpel, A3 multifragmentari; B1 simpel, B2 bervariasi per tulang (split-depresi), B3 terfragmentasi; C1 artikular simpel + metafisis simpel, C2 artikular simpel + metafisis multifragmentari, C3 keduanya multifragmentari.",ref:ea(45)},{teks:"Proses klasifikasi: anamnesis & pemeriksaan (mekanisme, jaringan lunak) → pencitraan (2 proyeksi tegak lurus; CT untuk kompleks; MRI jarang) → observasi langsung saat reduksi/operasi sebagai penentu akhir. Keputusan terapi sering dibuat sebelum klasifikasi final.",ref:ea(46)},{teks:"Menentukan segmen: cari **pusat fraktur** — titik tengah garis oblik/spiral, bagian terlebar wedge, atau setelah reduksi pada multifragmentari. Fraktur artikular yang bergeser **selalu** diklasifikasi sebagai segmen ujung.",ref:ea(46)},{teks:"Pertanyaan 'ya/tidak' berjenjang: tulang mana? segmen ujung atau tengah? tipe? grup? lalu tambahkan kualifikasi (huruf kecil dalam kurung) dan universal modifier (dalam kurung siku) bila perlu.",ref:ea(41)},{teks:"Klasifikasi harus **reliabel** (antarpengamat), **akurat** (sesuai status sebenarnya), dan punya **validitas isi** (mencakup semua fraktur); validasi dilakukan sebelum dipakai untuk studi luaran.",ref:ea(48)},{teks:"Perubahan revisi 2018: 'complex' diganti 'multifragmentary'; 'multifragmentary' pada subgrup B/C diganti 'fragmentary'; pembagian diafisis menjadi sepertiga menjadi opsional; modifier umum dikumpulkan sebagai universal modifiers; tanda hubung dihapus dari kode; radius dan ulna dipisah (2R/2U); kode fibula ditambahkan; klasifikasi femur proksimal dan tibia proksimal (kuadran Kfuri–Schatzker) diperbarui.",ref:ea(48)},{teks:"Contoh pembacaan 33C3.3: femur (3), segmen distal (3), artikular komplet (C), artikular multifragmentari + metafisis multifragmentari (3), subgrup perluasan metafisis-diafisis multifragmentari (.3).",ref:ea(48)}],tabel:[{judul:"Tipe fraktur tulang panjang dewasa",kolom:["Segmen","A","B","C"],baris:[["1 proksimal / 3 distal (ujung)","Ekstraartikular","Parsial artikular","Artikular komplet"],["2 diafisis","Simpel","Wedge","Multifragmentari"],["11 humerus proksimal","Ekstraartikular unifokal (2-part)","Ekstraartikular bifokal (3-part)","Artikular / 4-part"],["31 femur proksimal","Trokanterik","Kolum (subkapital/transservikal)","Kaput (artikular)"],["44 maleolar","Infrasindesmotik","Transsindesmotik","Suprasindesmotik"]],ref:ea(42)},{judul:"Grup menurut tipe",kolom:["Tipe","Grup 1","Grup 2","Grup 3"],baris:[["Diafisis A simpel","Spiral","Oblik (≥ 30°)","Transversal (< 30°)"],["Diafisis B wedge","—","Wedge utuh","Wedge terfragmentasi"],["Diafisis C multifragmentari","—","Segmental utuh","Segmental terfragmentasi"],["Ujung A ekstraartikular","Avulsi","Simpel","Multifragmentari"],["Ujung B parsial artikular","Simpel (split)","Split-depresi (bervariasi per tulang)","Terfragmentasi"],["Ujung C artikular komplet","Artikular simpel, metafisis simpel","Artikular simpel, metafisis multifragmentari","Artikular & metafisis multifragmentari"]],ref:ea(44),catatan:"Grup B1 dan C1 tidak ada untuk diafisis pada revisi 2018."}],algoritma:[{judul:"Mengklasifikasi fraktur diafisis langkah demi langkah",langkah:["Tulang mana? (1, 2R, 2U, 3, 4, 4F)","Pusat fraktur di segmen tengah? → segmen 2.",{teks:"Tipe: simpel (A), wedge (B), atau multifragmentari (C)?",cabang:["A → grup: spiral (1), oblik (2), transversal (3)","B → grup: utuh (2), terfragmentasi (3)","C → grup: segmental utuh (2), segmental terfragmentasi (3)"]},"Tambahkan kualifikasi dan/atau universal modifier bila perlu."],ref:ea(46)},{judul:"Mengklasifikasi fraktur segmen ujung",langkah:["Tulang mana? Ujung proksimal (1) atau distal (3)?",{teks:"Apakah garis fraktur masuk ke permukaan sendi?",cabang:["Tidak → tipe A; grup avulsi (1), simpel (2), multifragmentari (3)","Ya, sebagian sendi masih menempel ke metafisis → tipe B; grup simpel (1), split-depresi (2), terfragmentasi (3)","Ya, seluruh sendi terpisah dari diafisis → tipe C; grup artikular simpel (1) atau multifragmentari (2); subgrup menurut pola metafisis"]},"Tambahkan kualifikasi dan/atau universal modifier bila perlu."],ref:ea(47)}],jebakan:[{teks:"Fraktur artikular yang bergeser selalu dikode sebagai segmen ujung meski garis utamanya memanjang ke diafisis — cedera sendi lebih penting untuk terapi dan prognosis.",ref:ea(46)},{teks:"'Fragmentary' (grup) ≠ 'multifragmentary' (tipe C) sejak 2018: wedge terfragmentasi tetap tipe B selama masih ada kontak korteks fragmen utama setelah reduksi.",ref:ea(48)},{teks:"Kode revisi 2018 ditulis tanpa tanda hubung (32B2); penulisan 32-B2 masih sering dipakai dalam pengajaran.",ref:ea(49)},{teks:"Klasifikasi bukan hanya dari radiografi: status jaringan lunak dan temuan intraoperatif ikut menentukan; jangan memaksa klasifikasi final sebelum informasi lengkap.",ref:ea(46)}],istilahIds:["wedge","multifragmentari","parsial-artikular","artikular-komplet","split-depresi","universal-modifier","fraktur-terimpaksi"],adeganIds:[],klasifikasiIds:["ao-ota",["ao-ota","32-B2"],["ao-ota","31"],["ao-ota","44"]],soal:[{id:"A-4-01",pertanyaan:"Kode AO/OTA 42-A1 berarti…",opsi:["Tibia, segmen proksimal, ekstraartikular avulsi","Tibia, diafisis, fraktur spiral simpel","Tibia, distal, parsial artikular simpel","Femur, diafisis, wedge utuh"],jawaban:1,penjelasan:"4 = tibia, 2 = diafisis, A = simpel, 1 = spiral.",ref:ea(44),tingkat:1,tag:["kode"]},{id:"A-4-02",pertanyaan:"Fraktur diafisis femur dengan fragmen butterfly utuh; setelah reduksi masih ada kontak korteks antara fragmen proksimal dan distal. Tipe dan grupnya adalah…",opsi:["32-A2","32-B2","32-C2","33-B2"],jawaban:1,penjelasan:"Fragmen perantara dengan kontak korteks setelah reduksi = wedge (B); satu fragmen utuh = grup 2.",ref:ea(42),tingkat:2,tag:["kode"]},{id:"A-4-03",pertanyaan:"Segmen ujung tulang panjang dewasa didefinisikan sebagai…",opsi:["Sepertiga proksimal atau distal panjang tulang","Persegi yang sisinya sama dengan bagian terlebar metafisis","Daerah antara epifisis dan diafisis sejauh 5 cm","Daerah yang dilapisi tulang rawan sendi"],jawaban:1,penjelasan:"Persegi dengan sisi selebar metafisis; kecuali femur proksimal yang dibatasi garis bawah trokanter minor.",ref:ea(41),tingkat:1,tag:["definisi"]},{id:"A-4-04",pertanyaan:"Fraktur maleolar dengan fraktur fibula setinggi sindesmosis dikode sebagai tipe…",opsi:["44-A","44-B","44-C","43-B"],jawaban:1,penjelasan:"Segmen maleolar (44) diklasifikasi menurut level fraktur fibula: infra- (A), trans- (B), suprasindesmotik (C).",ref:ea(43),tingkat:1,tag:["kode"]},{id:"A-4-05",pertanyaan:"Garis fraktur diafisis yang membentuk sudut 20° terhadap garis tegak lurus sumbu tulang termasuk grup…",opsi:["A1 spiral","A2 oblik","A3 transversal","B2 wedge"],jawaban:2,penjelasan:"Transversal bila < 30°, oblik bila ≥ 30°.",ref:ea(44),tingkat:1,tag:["definisi"]},{id:"A-4-06",pertanyaan:"Fraktur femur distal dengan permukaan sendi terpisah seluruhnya dari diafisis, sendi pecah sederhana (satu garis) tetapi metafisis kominutif. Kodenya…",opsi:["33-B2","33-C1","33-C2","33-C3"],jawaban:2,penjelasan:"Artikular komplet (C) dengan artikular simpel dan metafisis multifragmentari = C2.",ref:ea(45),tingkat:2,tag:["kode"]},{id:"A-4-07",pertanyaan:"Perubahan pada revisi AO/OTA 2018 yang BENAR adalah…",opsi:["Istilah 'multifragmentary' diganti 'complex'","Radius dan ulna digabung dalam satu kode 22","Tanda hubung dihapus dari kode dan fibula mendapat kode sendiri","Pembagian diafisis menjadi sepertiga diwajibkan"],jawaban:2,penjelasan:"2018: 'complex' → 'multifragmentary', radius/ulna dipisah (2R/2U), tanda hubung dihapus, fibula diberi kode, pembagian sepertiga opsional.",ref:ea(48),tingkat:2,tag:["revisi"]},{id:"A-4-08",pertanyaan:"Fraktur humerus proksimal dengan dua garis fraktur (collum chirurgicum + tuberositas mayor) tanpa dislokasi termasuk tipe…",opsi:["11-A (unifokal)","11-B (bifokal)","11-C (artikular)","12-A"],jawaban:1,penjelasan:"Dua garis fraktur ekstraartikular = bifokal = tipe B (setara Neer 3-part).",ref:ea(43),tingkat:2,tag:["kode"]}]};var X=a=>({buku:"AO",bab:"4.4",hlm:a}),oa=a=>({buku:"HoF",bab:"42",hlm:a}),Ci={id:"E-1",ringkasan:"Anak bukan dewasa kecil: tulangnya lebih lentur (modulus elastisitas lebih rendah), [[periosteum]] tebal, dan punya [[fisis]] yang lebih lemah daripada ligamen — sehingga cedera yang pada dewasa menjadi sprain, pada anak menjadi fraktur fisis. Fraktur anak sembuh cepat dan [[remodeling|me-remodel]] sesuai usia, jarak ke fisis, dan bidang gerak sendi; **rotasi tidak me-remodel**. Klasifikasi: Salter-Harris untuk fisis, AO Pediatric (PCCF) untuk seluruh tulang panjang. Terapi: reduksi tertutup + gips untuk yang stabil; ESIN, K-wire, atau sekrup kanula untuk yang tidak stabil; hindari manipulasi berulang.",angka:[{nilai:"1 dari 7",label:"anak di IGD datang dengan fraktur; ≈ 50% anak pernah patah tulang sebelum dewasa",ref:[X(379),oa(542)]},{nilai:"30%",label:"fraktur tulang panjang anak melibatkan fisis (seri 2.650 fraktur); HoF: 15–30% trauma skeletal anak adalah cedera fisis",ref:[X(379),oa(542)]},{nilai:"≤ 50%",label:"cedera fisis terjadi di radius distal; lokasi kedua humerus distal",ref:X(379)},{nilai:"70%",label:"cedera fisis adalah Salter-Harris tipe II",ref:X(384)},{nilai:"2,7 : 1",label:"rasio anak laki-laki : perempuan untuk fraktur tunggal; puncak insidens laki-laki 16 th, perempuan 12 th",ref:oa(542)},{nilai:"< 5%",label:"fraktur anak yang terbuka",ref:oa(542)},{nilai:"5–7",satuan:"hari",label:"batas remanipulasi cedera fisis; juga lama imobilisasi fraktur yang dicurigai sebelum foto ulang",ref:[oa(547),X(383)]},{nilai:"< 2",satuan:"mm",label:"pergeseran maksimal yang diterima pada fraktur fisis intraartikular (SH III–IV)",ref:[X(391),oa(547)]},{nilai:"50–60",satuan:"kg",label:"batas berat badan untuk ESIN (titanium elastic nail) pada fraktur diafisis",ref:X(392)},{nilai:"3–4",satuan:"minggu",label:"K-wire yang melintasi fisis biasanya dilepas",ref:X(393)}],poin:[{teks:"Tulang anak: kadar air lebih tinggi, mineral lebih rendah → modulus elastisitas lebih rendah (kurang getas), strain-to-failure lebih tinggi, relatif lebih kuat terhadap tarik daripada tekan; gagal pada energi lebih rendah daripada dewasa.",ref:oa(543)},{teks:"Fisis lebih lemah daripada tulang terhadap torsi, geser, dan lentur, dan lebih lemah daripada ligamen → cedera 'sprain' dewasa menjadi fraktur fisis pada anak.",ref:oa(543),penting:!0},{teks:"Zona fisis (HoF): reserve/germinal, proliferatif, hipertrofik, kalsifikasi sementara. Zona **hipertrofik** paling lemah terhadap geser → tempat cedera tersering; zona germinal di sisi epifisis biasanya selamat sehingga gangguan pertumbuhan jarang pada SH I–II.",ref:[oa(543),X(380)],penting:!0},{teks:"Dua sistem pertumbuhan: memanjang oleh sistem epifisis, melingkar (diameter) oleh periosteum/endosteum (aturan Roux 1895). Henti tumbuh sementara (garis henti tumbuh di radiografi) terjadi setelah hampir semua cedera fisis; henti permanen jarang tetapi serius.",ref:X(379)},{teks:"Periosteum anak tebal dan menyatu dengan fisis di cincin perikondral (LaCroix): membantu reduksi sebagai engsel di sisi cekung dan mencegah overreduksi, tetapi traksi longitudinal saja tidak melepaskan fragmen yang terkunci — perlu rekreasi deformitas terkendali.",ref:oa(547),penting:!0},{teks:"Pola khas anak: **torus/buckle** (kompresi di pertemuan metafisis–diafisis, stabil, jarang perlu reduksi), **greenstick** (lentur; mungkin perlu dipatahkan tuntas untuk reduksi), **deformasi plastis/bowing** (tanpa garis fraktur, deformitas bisa permanen), spiral panjang pada anak kecil (diafisis gagal sebelum fisis), fraktur fisis pada anak lebih besar.",ref:oa(544),penting:!0},{teks:"Empat faktor potensi remodeling angular: usia skeletal, potensi fisis spesifik (humerus proksimal > humerus distal), kedekatan dengan sendi, dan orientasi terhadap sumbu gerak sendi. **Deformitas rotasi tidak me-remodel.**",ref:[X(381),oa(547)],penting:!0},{teks:"Pertumbuhan ekstremitas atas terutama di humerus proksimal dan radius/ulna distal (bahu & pergelangan tangan) → remodeling besar; siku/humerus distal sedikit. Ulna proksimal adalah apofisis tanpa lempeng pertumbuhan sejati → lesi Monteggia remodel buruk. Ekstremitas bawah: pertumbuhan terbesar di sekitar lutut, tetapi remodeling lebih kecil daripada ekstremitas atas.",ref:X(381)},{teks:"Anamnesis & pemeriksaan: fokus, tanpa menimbulkan nyeri; anak bukan sejarawan yang baik; periksa seluruh ekstremitas; status neurovaskular sebelum dan sesudah manipulasi; waspadai sindrom kompartemen pada anak nonverbal yang rewel dengan mekanisme remuk.",ref:[X(382),oa(544)]},{teks:"Curigai **kekerasan pada anak (NAI)**: fraktur femur transversal < 1 tahun atau humerus transversal < 3 tahun, fraktur sudut metafisis (corner fracture), riwayat tidak sesuai pola, cedera tanpa saksi, banyak fraktur dalam berbagai tahap penyembuhan, stigmata kulit; bila ragu rawat inap dan libatkan layanan sosial.",ref:oa(544),penting:!0},{teks:"Radiografi: dua proyeksi tegak lurus termasuk sendi atas dan bawah; bila fraktur jelas bergeser dan akan ditangani di bawah anestesi, satu proyeksi bisa cukup; foto pembanding sisi sehat hanya bila benar-benar perlu (radiasi); CT hati-hati pada < 2 tahun (tiroid, timus); USG berguna untuk kondilus lateral & pemisahan epifisis bayi; MRI butuh anestesi; artrogram intraoperatif untuk fragmen rawan.",ref:[X(383),oa(545)]},{teks:"Polytrauma anak: ikuti ATLS; stabilisasi dini semua fraktur tulang panjang besar, pelvis tidak stabil, dan tulang belakang (early total care sering tepat; fiksator eksternal cepat); anak mengompensasi perdarahan lama lalu kolaps mendadak; sebagian besar fraktur pelvis anak stabil; cedera kartilago triradiata (< 8 th) → displasia asetabulum.",ref:X(382)},{teks:"Tujuan terapi: bebas nyeri cepat, anatomi & fungsi normal, mobilisasi dini, **hindari reduksi berulang** dan anestesi berulang, hasil optimal dengan invasi minimal.",ref:X(391)},{teks:"Terapi tertutup: sebagian besar fraktur ekstremitas atas → reduksi tertutup + gips sirkular berbantalan yang dibentuk baik (3 titik: gips melengkung menghasilkan tulang lurus); traksi untuk femur < 3–4 tahun; gips mencakup sendi atas dan bawah karena kaku pascaimobilisasi jarang pada anak; gips pendek sama efektifnya untuk radius distal.",ref:[X(391),oa(547)]},{teks:"Tanda instabilitas yang mendorong terapi operatif: garis fraktur oblik, fraktur kedua tulang berpasangan pada level sama, pergeseran total.",ref:X(391)},{teks:"Indikasi terapi bedah: fraktur terbuka, polytrauma, cedera kepala/spinal, fraktur kolum femur, cedera fisis intraartikular bergeser > 2 mm (SH III–IV), fraktur ireduksibel, cedera vaskular, sindrom kompartemen, fraktur dengan luka bakar/jaringan lunak berat, fraktur tidak stabil yang butuh posisi abnormal untuk mempertahankan reduksi.",ref:[X(391),oa(547)],penting:!0},{teks:"Implan anak: ESIN/TEN standar untuk diafisis usia 3–4 tahun sampai pubertas (≤ 50–60 kg; end cap memperluas indikasi); K-wire halus melintasi fisis tegak lurus, kecepatan rendah, dilepas 3–4 minggu; sekrup lag **sejajar fisis** untuk E/3–E/4 dan dilepas bila masih tumbuh; plat jarang (pemakaian turun dari 60% ke 5%); fiksator eksternal ±10–12% kasus, pin 1–2 cm dari fisis (fisis ≈ 4 mm).",ref:X(392)},{teks:"Fraktur terbuka anak: debridemen agresif seperti dewasa, tetapi usahakan selamatkan ekstremitas — amputasi dini hanya untuk menyelamatkan nyawa; anak mentoleransi kehilangan jaringan lebih baik.",ref:X(392)},{teks:"Komplikasi khas: henti tumbuh total (beda panjang → epifisiodesis/pemanjangan) atau parsial (deformitas angular progresif, jembatan fisis), overgrowth (diafisis femur), deformitas angular metafisis (tibia proksimal → valgus), osteonekrosis (kaput femur, kaput radius).",ref:[oa(548),X(380)]}],tabel:[{judul:"Salter-Harris (dengan padanan Peterson dan tambahan Rang)",kolom:["Tipe","Jalur garis fraktur","Prognosis & terapi"],baris:[["I (Peterson III)","Sepanjang fisis (zona hipertrofik–kalsifikasi); radiografi bisa normal","Zona germinal utuh → prognosis baik; diagnosis klinis; reduksi tertutup lembut + gips"],["II (Peterson II)","Fisis + keluar lewat metafisis (fragmen Thurston-Holland); engsel periosteum utuh di sisi fragmen; **70%** cedera fisis","Prognosis baik; reduksi tertutup + gips; fiksasi bila tidak stabil"],["III (Peterson IV)","Fisis + epifisis ke sendi; melewati zona reserve & proliferatif","Intraartikular: reduksi anatomis (< 1–2 mm) + fiksasi tanpa merusak fisis; risiko henti tumbuh parsial"],["IV (Peterson V)","Dari sendi melintasi epifisis, fisis, metafisis (semua zona)","Reduksi anatomis + fiksasi; risiko jembatan tulang & deformitas angular"],["V","Kompresi/remuk fisis; radiografi awal normal","Diagnosis retrospektif saat henti tumbuh; prognosis buruk"],["VI (Rang)","Avulsi cincin perikondral (zona Ranvier) di insersi ligamen","Reduksi & fiksasi akurat; gangguan tumbuh tetap mungkin"],["VII (Rang) / Peterson VI","Cedera abrasi terbuka tepi fisis / kehilangan sebagian fisis (mesin pemotong rumput, road drag)","Sering menyebabkan jembatan fisis; kehilangan jaringan lunak & neurovaskular"]],ref:[X(384),oa(546)]},{judul:"Deformitas yang masih dapat diterima setelah terapi nonoperatif (bukti lemah — hati-hati, terutama rotasi)",kolom:["Fraktur","Usia (th)","Angulasi yang diterima","Pergeseran"],baris:[["Humerus proksimal","< 5","—","Total"],["Humerus proksimal","5–12","40–70°","—"],["Humerus proksimal","> 12","—","50%"],["Humerus diafisis","semua","20–30° varus; 20° sagital","—"],["Femur diafisis","0–2","30° varus/valgus; 30° sagital","—"],["Femur diafisis","3–5","15° varus/valgus; 20° sagital","—"],["Femur diafisis","6–10","10° varus/valgus; 15° sagital","—"],["Femur diafisis","≥ 11","5° varus/valgus; 10° sagital","—"],["Tibia diafisis","< 8 dan > 8","5° valgus; 10° varus","—"]],ref:X(381),catatan:"Tabel 4.4-1 AO menyebut basis bukti lemah. HoF: makin dekat fisis makin toleran (humerus proksimal 45–60° pada anak kecil), sedangkan diafisis radius/tibia harus dalam 10° dari normal."},{judul:"Pilihan implan pada anak",kolom:["Implan","Indikasi utama","Catatan"],baris:[["Gips sirkular berbantalan","Fraktur stabil, mayoritas ekstremitas atas","Boleh dibelah; cakup sendi atas–bawah"],["ESIN / TEN","Diafisis femur, tibia, lengan bawah, humerus; usia 3–4 th – pubertas, ≤ 50–60 kg","End cap untuk fraktur kompleks/anak lebih berat; lengan bawah dilepas 6 bulan"],["K-wire","Suprakondiler, metafisis, melintasi fisis bila perlu","Tegak lurus fisis, kecepatan rendah, ≥ 2 mm pada siku; dilepas 3–4 minggu; perlu gips"],["Sekrup kanula / small fragment","Fraktur artikular & periartikular (E/3, E/4), kolum femur","Sejajar fisis; dilepas bila masih tumbuh; boleh melintasi fisis kolum femur"],["Fiksator eksternal","Fraktur terbuka, polytrauma, femur/tibia tidak stabil, anak lebih berat","±10–12% kasus; risiko refraktur; pin 1–2 cm dari fisis"],["Plat","Pengecualian: remaja besar, koreksi sekunder, MIPO","Pelepasan = operasi besar; pemakaian turun 60% → 5%"],["Nail antegrade dewasa (piriformis/ trokanter)","Kontraindikasi pada anak yang masih tumbuh","Risiko nekrosis avaskular kaput femur"]],ref:X(392)}],algoritma:[{judul:"Pendekatan umum fraktur anak",langkah:["Primary survey (ATLS) bila trauma mayor; singkirkan kekerasan pada anak dari anamnesis dan pola fraktur.","Pemeriksaan lembut dan terfokus; status neurovaskular; analgesia sebelum radiografi.","Radiografi 2 proyeksi termasuk sendi atas–bawah; kenali varian normal dan pusat osifikasi; foto pembanding hanya bila perlu.",{teks:"Fisis terlibat?",cabang:["SH I–II → reduksi tertutup lembut + gips; jangan remanipulasi setelah 5–7 hari","SH III–IV bergeser ≥ 2 mm → reduksi anatomis terbuka + fiksasi (sekrup sejajar fisis / K-wire)"]},{teks:"Fraktur stabil?",cabang:["Ya → gips sirkular dibentuk baik, kontrol radiografi (mis. 1 minggu)","Tidak (oblik, kedua tulang satu level, geser total, ireduksibel) → ESIN / K-wire / sekrup / fiksator eksternal"]},"Edukasi orang tua: risiko gangguan pertumbuhan dan jadwal kontrol jangka panjang bila fisis terlibat."],ref:[X(391),oa(547)]}],jebakan:[{teks:"Fraktur SH I pada anak kecil bisa dengan radiografi normal — diagnosis klinis dari nyeri tekan di fisis; imobilisasi 5–7 hari lalu foto ulang.",ref:[oa(546),X(383)]},{teks:"Fraktur fisis yang bergeser lagi setelah beberapa hari sebaiknya dibiarkan me-remodel; remanipulasi setelah 5–7 hari meningkatkan risiko henti tumbuh.",ref:[X(402),oa(547)]},{teks:"Deformitas rotasi tidak pernah diperbaiki remodeling — nilai rotasi secara klinis, bukan hanya dari angulasi di radiografi.",ref:[X(381),oa(547)]},{teks:"Fraktur epifisis femur distal/tibia proksimal selalu energi tinggi dengan risiko gangguan tumbuh besar meskipun 'hanya' SH II.",ref:X(413)},{teks:"Fraktur femur transversal pada bayi < 1 tahun atau humerus transversal < 3 tahun = curiga kekerasan sampai terbukti sebaliknya.",ref:oa(544)},{teks:"Nail intramedular tipe dewasa dari fossa piriformis dikontraindikasikan pada anak: risiko nekrosis avaskular kaput femur.",ref:X(411)}],istilahIds:["fisis","periosteum","remodeling","thurston-holland","torus","greenstick","deformasi-plastis","esin","henti-tumbuh","cincin-perikondral","nai"],adeganIds:["fisis","remodeling"],klasifikasiIds:["salter-harris","pccf"],soal:[{id:"E-1-01",pertanyaan:"Zona fisis yang paling sering menjadi tempat garis fraktur karena paling lemah terhadap gaya geser adalah…",opsi:["Zona reserve (germinal)","Zona proliferatif","Zona hipertrofik","Zona kalsifikasi sementara"],jawaban:2,penjelasan:"Zona hipertrofik memiliki resistensi geser terendah; zona germinal di sisi epifisis biasanya selamat sehingga SH I–II jarang mengganggu pertumbuhan.",ref:oa(543),tingkat:1,tag:["fisis"]},{id:"E-1-02",pertanyaan:"Tipe Salter-Harris yang paling sering dijumpai adalah…",opsi:["Tipe I","Tipe II","Tipe III","Tipe IV"],jawaban:1,penjelasan:"Tipe II (fisis + fragmen metafisis Thurston-Holland) mencakup sekitar 70% cedera fisis.",ref:X(384),tingkat:1,tag:["salter-harris"]},{id:"E-1-03",pertanyaan:"Faktor berikut meningkatkan potensi remodeling fraktur anak, KECUALI…",opsi:["Usia skeletal lebih muda","Letak fraktur dekat fisis/sendi","Deformitas searah bidang gerak sendi","Deformitas rotasi"],jawaban:3,penjelasan:"Rotasi tidak me-remodel; tiga faktor lain plus potensi fisis spesifik menentukan remodeling angular.",ref:X(381),tingkat:1,tag:["remodeling"]},{id:"E-1-04",pertanyaan:"Bayi 8 bulan dibawa dengan fraktur femur transversal tanpa riwayat trauma yang jelas. Langkah yang tepat adalah…",opsi:["Pulangkan dengan spica cast dan kontrol 2 minggu","Curigai kekerasan: rawat inap, survei skeletal, libatkan layanan sosial","Lakukan MRI untuk menyingkirkan tumor","Observasi 24 jam di IGD"],jawaban:1,penjelasan:"Fraktur femur transversal < 1 tahun, riwayat tidak sesuai, dan cedera tanpa saksi adalah tanda NAI; dokter wajib memastikan anak aman.",ref:oa(544),tingkat:2,tag:["nai"]},{id:"E-1-05",pertanyaan:"Batas waktu setelah cedera yang melewatinya remanipulasi fraktur fisis sebaiknya tidak lagi dilakukan adalah…",opsi:["24 jam","48 jam","5–7 hari","3 minggu"],jawaban:2,penjelasan:"Remanipulasi setelah 5–7 hari berisiko merusak fisis yang sudah mulai menyembuh → henti tumbuh; lebih baik dibiarkan me-remodel.",ref:oa(547),tingkat:2,tag:["terapi"]},{id:"E-1-06",pertanyaan:"Dalam klasifikasi AO Pediatric (PCCF), huruf E, M, dan D berturut-turut menunjukkan…",opsi:["Ekstraartikular, Metafisis, Dislokasi","Epifisis, Metafisis, Diafisis","Epifisis, Multifragmentari, Displaced","Elastis, Metaphyseal, Direct"],jawaban:1,penjelasan:"PCCF mengganti kode A-B-C dewasa dengan lokasi E (epifisis = intraartikular), M (metafisis), D (diafisis), lalu kode pola anak setelah tanda '/'.",ref:X(386),tingkat:1,tag:["pccf"]},{id:"E-1-07",pertanyaan:"Fiksasi fraktur Salter-Harris IV yang dianjurkan adalah…",opsi:["Sekrup lag melintasi fisis secara oblik","Sekrup lag sejajar fisis di epifisis dan/atau metafisis, dilepas bila masih tumbuh","Plat kompresi melewati fisis","Gips saja tanpa reduksi"],jawaban:1,penjelasan:"Fraktur artikular E/3–E/4 direduksi anatomis dan difiksasi stabil dengan sekrup sejajar fisis; K-wire boleh melintasi fisis tegak lurus bila perlu.",ref:X(393),tingkat:2,tag:["terapi"]},{id:"E-1-08",pertanyaan:"Pernyataan yang BENAR mengenai ESIN (titanium elastic nail) pada anak adalah…",opsi:["Dipakai pada semua usia dan berat badan","Standar untuk fraktur diafisis anak 3–4 tahun hingga pubertas dengan berat ≤ 50–60 kg","Hanya untuk fraktur artikular","Harus selalu dikombinasi dengan plat"],jawaban:1,penjelasan:"ESIN menjadi standar diafisis pada rentang usia/berat tersebut; end cap memperluas indikasi untuk fraktur lebih kompleks dan anak lebih berat.",ref:X(392),tingkat:1,tag:["implan"]}]};var T=a=>({buku:"HoF",bab:"44",hlm:a}),Ai={id:"E-3",ringkasan:"Siku adalah regio fraktur anak yang paling 'berbahaya untuk ujian': banyak pusat osifikasi ([[critoe|CRITOE]]), garis radiografi yang harus dihafal (garis humerus anterior, garis radiokapitelar, [[baumann|sudut Baumann]], [[fat-pad|fat pad]]), dan cedera yang mudah terlewat. Fraktur **suprakondiler** (55–75% fraktur siku) ditangani menurut [[gartland|Gartland]]: tipe III = reduksi tertutup + pinning perkutan; periksa n. medianus/interoseus anterior dan nadi sebelum–sesudah manipulasi. Fraktur **kondilus lateral** (SH IV, [[milch|Milch]]) sering butuh reduksi terbuka; **epikondilus medial** sering menyertai dislokasi dan bisa terjebak di sendi.",angka:[{nilai:"8–9%",label:"fraktur siku dari seluruh fraktur ekstremitas atas anak; 85% di humerus distal; terbanyak usia 5–10 tahun, musim panas",ref:T(570)},{nilai:"55–75%",label:"fraktur siku anak adalah suprakondiler; tipe ekstensi 98%, fleksi 2%; puncak 5–8 tahun; sisi kiri/nondominan",ref:T(574)},{nilai:"> 70%",label:"kemungkinan fraktur bila fat pad posterior terlihat (spesifisitas tinggi); fat pad supinator hanya positif pada 50% fraktur leher radius",ref:T(572)},{nilai:"7–10%",label:"cedera saraf pada suprakondiler (n. medianus/interoseus anterior tersering); cedera vaskular 0,5%; sindrom kompartemen < 1%",ref:T(575)},{nilai:"3% vs 14%",label:"deformitas angular (cubitus varus) setelah pinning perkutan vs reduksi + gips saja",ref:T(575)},{nilai:"17%",label:"fraktur humerus distal adalah kondilus lateral (puncak 6 tahun); 40% tidak bergeser (Jakob I), 60% butuh reduksi terbuka",ref:[T(576),T(578)]},{nilai:"14%",label:"fraktur humerus distal adalah epikondilus medial; 50% menyertai dislokasi siku; fragmen terjebak di sendi 15–18%",ref:T(585)},{nilai:"5–8,5%",label:"fraktur siku adalah kaput/kolum radius; 90% mengenai fisis atau kolum; puncak 9–10 tahun",ref:T(593)},{nilai:"2–3",satuan:"tahun",label:"puncak usia pulled elbow (rentang 6 bulan–6 tahun); 70% siku kiri; kambuh 5–30%",ref:T(597)},{nilai:"13–14",satuan:"tahun",label:"puncak usia dislokasi siku (3–6% cedera siku), setelah fisis menutup; > 90% posterolateral",ref:[T(599),T(601)]}],poin:[{teks:"Anatomi: tiga sendi (ulnohumeral, radiokapitelar, radioulnar proksimal); permukaan sendi kapitulum–troklea menonjol ke anterior-distal 30–45°; siku hanya menyumbang 20% pertumbuhan memanjang ekstremitas atas (remodeling kecil!).",ref:T(570)},{teks:"CRITOE — urutan pusat osifikasi: Capitellum 6 bulan–2 th, Radial head 4 th, Internal (medial) epicondyle 6–7 th, Trochlea 8 th, Olecranon 8–10 th, External (lateral) epicondyle 12 th; anak perempuan ±2 tahun lebih dini kecuali kapitulum.",ref:T(570),penting:!0},{teks:"Garis radiografi lateral: **garis humerus anterior** harus memotong sepertiga tengah pusat osifikasi kapitulum; garis koronoid menyinggung kondilus lateral anterior; sudut diafisis–kondilus 30–45°; bentuk 'teardrop'. Garis melalui pusat kapitulum harus **selalu** membelah kaput radius pada semua proyeksi.",ref:T(572),penting:!0},{teks:"Garis radiografi AP: sudut Baumann (garis fisis kondilus lateral vs sumbu humerus; HoF: normal 15–20°, harus sama dengan sisi sehat), sudut humerus–ulna (carrying angle sebenarnya), sudut metafisis–diafisis.",ref:T(572)},{teks:"Fat pad: anterior (koronoid) sensitif tetapi tidak spesifik; **posterior (olekranon)** hanya terangkat oleh efusi sedang–besar → sangat spesifik untuk kelainan intraartikular; fat pad bisa tidak tampak setelah dislokasi karena kapsul robek.",ref:T(572),penting:!0},{teks:"Suprakondiler ekstensi: jatuh pada tangan terentang dengan hiperekstensi; tangan pronasi → geser posteromedial (lebih sering), supinasi → posterolateral. Tanda klinis: deformitas S, **pucker sign** (lesung kulit anterior = fragmen proksimal menembus brakialis → reduksi tertutup mungkin sulit).",ref:T(574),penting:!0},{teks:"Gartland: I tidak bergeser; II bergeser dengan korteks posterior utuh (boleh berangulasi/berotasi); III bergeser total (posteromedial/posterolateral). Tipe fleksi: I–III analog dengan korteks anterior sebagai engsel, tipe III biasanya anterolateral dan sering perlu reduksi terbuka.",ref:T(574),penting:!0},{teks:"Terapi suprakondiler ekstensi: I gips/splint lengan panjang fleksi 60–90° selama 2–3 minggu; II reduksi tertutup + gips, fiksasi bila tidak stabil atau reduksi hanya bertahan dengan fleksi berlebihan; **III reduksi tertutup + pinning perkutan** (standar); ORIF untuk tidak stabil rotasi, terbuka, atau cedera neurovaskular. Urutan reduksi: traksi → koreksi koronal & horizontal → sagital (fleksi sambil mendorong olekranon). Pin lateral dahulu; bila perlu pin medial, ekstensikan siku untuk melindungi n. ulnaris. Gips 3 minggu, pin dilepas, olahraga ditunda 3 minggu lagi.",ref:T(575)},{teks:"Komplikasi suprakondiler: neurapraksia 7–10% (medianus/AIN tersering; ulnaris pada tipe fleksi atau iatrogenik pin medial), vaskular 0,5% — nadi hilang tetapi tangan hangat & perfusi baik → observasi; cubitus varus 10–20% (3% dengan pin vs 14% gips); hilang gerak > 5° pada 5%; miositis osifikans setelah manipulasi kasar.",ref:T(575)},{teks:"Kondilus lateral (SH IV): deformitas kasar minimal, bengkak lateral; nyeri saat ekstensi pergelangan tangan dengan tahanan. Teori 'pull-off' (avulsi origo ekstensor oleh varus) dan 'push-off' (kaput radius menumbuk kondilus). Varus stress view dan **artrogram** membantu pada anak yang belum osifikasi.",ref:T(577)},{teks:"Milch (kondilus lateral): I garis lateral ke alur kapitulotroklear = SH IV, siku stabil, lebih jarang; II garis ke apeks troklea = SH II, siku tidak stabil (subluksasi posterolateral), lebih sering. Jakob: I tidak bergeser (< 2 mm) → imobilisasi 3 minggu; II bergeser sedang → coba reduksi tertutup + K-wire, artrogram; III bergeser & berotasi → reduksi terbuka, dua K-wire halus menyilang dan menyebar di metafisis; jangan diseksi posterior (satu-satunya suplai darah).",ref:T(578),penting:!0},{teks:"Kondilus lateral terlambat > 3–6 minggu → pertimbangkan terapi tertutup apa pun pergeserannya (osteonekrosis & kaku tinggi bila direduksi terbuka terlambat). Komplikasi: spur lateral (cubitus pseudovarus), delayed/nonunion → cubitus valgus → tardy ulnar palsy, osteonekrosis 'fishtail'.",ref:T(578)},{teks:"Fraktur transfiseal humerus distal: anak < 6–7 tahun; radius–ulna tetap sejajar satu sama lain tetapi bergeser **posteromedial** terhadap humerus dengan hubungan kondilus lateral–kaput radius utuh (diagnostik); curiga **kekerasan pada anak** dan cedera lahir. DeLee A (< 7 bulan, SH I), B (7 bulan–3 th, SH I/II), C (3–7 th, fragmen metafisis besar). Reduksi tertutup bila ≤ 4–5 hari; jangan manipulasi setelah 6–7 hari; komplikasi tersering cubitus varus.",ref:[T(582),T(584)],penting:!0},{teks:"Epikondilus medial: apofisis traksi (MCL & fleksor), osifikasi 4–6 th, **terakhir menyatu (15 th)**; mekanisme utama avulsi saat dislokasi siku atau valgus-ekstensi/lempar; fragmen biasanya bergeser distal. Pemeriksaan: nyeri fleksi pergelangan dengan tahanan, instabilitas valgus (uji pada fleksi 15°), status n. ulnaris. Apofisis yang **hilang** dari foto standar → cari fragmen yang terjebak di sendi.",ref:[T(585),T(586)],penting:!0},{teks:"Terapi epikondilus medial: mayoritas nonoperatif (60% hanya fibrous union tetapi 96% hasil baik/sangat baik; splint 3–4 hari lalu gerak aktif); indikasi absolut operasi = fragmen terjebak ireduksibel (manuver Roberts berhasil ±40%); relatif = disfungsi n. ulnaris, instabilitas valgus pada atlet, pergeseran besar pada anak muda/atlet. Komplikasi: n. ulnaris 10–16% (sampai 50% bila terjebak), nonunion hingga 60% pada pergeseran besar nonoperatif (jarang fungsional).",ref:T(587)},{teks:"Kaput/kolum radius: 90% fisis atau kolum (kaput dilindungi tudung rawan tebal); sering bersama olekranon, koronoid, epikondilus medial; keluhan bisa nyeri pergelangan tangan. O'Brien: I < 30°, II 30–60°, III > 60°. Wilkins: A SH I/II, B SH III/IV, C metafisis. Kolum radius toleran angulasi, tidak toleran translasi.",ref:[T(593),T(595)]},{teks:"Terapi kolum radius: I imobilisasi 7–10 hari lalu gerak; II reduksi tertutup (Patterson: traksi-supinasi-varus; Israeli: fleksi-pronasi; Esmarch) lalu gips pronasi 10–14 hari, K-wire bila tidak stabil; ORIF bila ireduksibel, > 60°, translasi > 4 mm, atau geser medial; **pin transkapitelar kontraindikasi**; eksisi kaput radius hasil buruk pada anak; teknik Métaizeau (nail intramedular dari distal). Hasil buruk 15–23% apa pun terapinya.",ref:T(596)},{teks:"Komplikasi kaput/kolum radius: hilang gerak (pronasi > supinasi > ekstensi > fleksi), overgrowth kaput 20–40%, osteonekrosis 10–20% (70% terkait reduksi terbuka), sinostosis radioulnar (paling serius, terkait diseksi luas & terapi > 5 hari), miositis osifikans hingga 32%.",ref:T(596)},{teks:"Pulled elbow (subluksasi kaput radius): tarikan longitudinal pada siku ekstensi–pronasi; lengan menggantung pronasi, pseudoparalisis; radiografi tidak perlu bila riwayat klasik, usia ≤ 5 th, dan klinis mendukung. Reduksi: supinasi + fleksi maksimal dengan ibu jari di kaput radius, atau hiperpronasi; 'klik'; pakai normal 5–10 menit; kambuh berhenti setelah 4–5 tahun saat ligamen anular menguat.",ref:[T(597),T(598)]},{teks:"Dislokasi siku anak: posterolateral > 90%; cari fraktur penyerta (epikondilus medial, koronoid, kolum radius). Reduksi: anak 0–8 th tengkurap dengan dorongan ke anterior pada olekranon; > 8 th terlentang, supinasi-fleksi-traksi (Parvin); hindari reduksi dengan hiperekstensi (jebakan n. medianus). Splint 90° lalu gerak aktif lembut 5–7 hari; defisit saraf 10%; tulang heterotopik 3% (18% bila ada fraktur).",ref:[T(599),T(601)]},{teks:"Olekranon anak: 5% fraktur siku, puncak 5–10 th, 20% dengan cedera penyerta (radius proksimal tersering); grup A fleksi (transversal), B ekstensi (valgus/varus, greenstick ekstraartikular), C geser (periosteum posterior utuh = tension band alami). Tidak bergeser → splint fleksi 5–10° selama 3 minggu, foto ulang 5–7 hari; periosteum posterior robek (celah teraba/fragmen memisah saat fleksi) → fiksasi (K-wire + tension band, sekrup).",ref:[T(603),T(605)]}],tabel:[{judul:"CRITOE — pusat osifikasi siku",kolom:["Pusat","Usia muncul","Catatan"],baris:[["C — Capitellum","6 bulan – 2 tahun","Termasuk krista lateral troklea; satu-satunya yang tidak lebih dini pada anak perempuan"],["R — Radial head","4 tahun","Nukleus kecil pipih; bisa bipartit (varian normal, tepi halus)"],["I — Internal (medial) epicondyle","6–7 tahun","Apofisis traksi; terakhir menyatu (15 tahun); hilang dari foto = cari di sendi"],["T — Trochlea","8 tahun","Sering banyak pusat; troklea tampak tanpa epikondilus medial = fragmen terjebak"],["O — Olecranon","8–10 tahun","Sering beberapa pusat yang akhirnya menyatu; garis fisis oblik ke proksimal-anterior"],["E — External (lateral) epicondyle","12 tahun","Garis fisis lateral sering disangka fraktur"]],ref:T(570),catatan:"Kecuali kapitulum, pusat osifikasi muncul ±2 tahun lebih dini pada anak perempuan."},{judul:"Fraktur suprakondiler: Gartland dan terapi (tipe ekstensi)",kolom:["Tipe","Radiografi","Terapi","Catatan"],baris:[["I","Tidak bergeser; garis humerus anterior memotong kapitulum; sering hanya fat pad posterior","Gips/splint lengan panjang fleksi 60–90°, 2–3 minggu","Periksa ulang neurovaskular setelah fleksi"],["II","Bergeser, korteks posterior utuh; garis humerus anterior di depan kapitulum","Reduksi tertutup + gips; pin bila tidak stabil / malrotasi / butuh fleksi berlebihan","Fleksi berlebihan dengan bengkak antekubital → risiko neurovaskular"],["III","Pergeseran total, posteromedial (tangan pronasi) atau posterolateral (supinasi)","Reduksi tertutup + pinning perkutan (standar); ORIF bila tidak stabil rotasi/terbuka/cedera neurovaskular; traksi olekranon jarang","Pin lateral dahulu; pin medial dengan siku ekstensi (lindungi n. ulnaris)"],["Fleksi I–III (2%)","Korteks anterior utuh pada II; III biasanya anterolateral","I gips mendekati ekstensi 2–3 minggu; II reduksi tertutup + pin; III sering reduksi terbuka + pin","Cedera n. ulnaris paling sering pada tipe fleksi"]],ref:T(575)},{judul:"Diagnosis banding cedera humerus distal anak",kolom:["Cedera","Usia khas","Kunci radiografi","Terapi utama"],baris:[["Suprakondiler","5–8 th","Garis humerus anterior tidak memotong kapitulum; S-shape","Pin perkutan untuk tipe III"],["Kondilus lateral (SH IV)","6 th","Fragmen lateral ± subluksasi radius lateral; artrogram bila belum osifikasi","Jakob II–III: reduksi (terbuka) + K-wire"],["Kondilus medial (SH IV)","8–14 th","Sering salah dianggap epikondilus medial; fat pad positif (intraartikular); laksitas varus & valgus","Kilfoyle II–III: ORIF"],["Transfiseal","< 6–7 th","Radius–ulna bergeser posteromedial bersama, hubungan kapitulum–radius utuh","Reduksi tertutup ≤ 4–5 hari; curiga NAI"],["Epikondilus medial","11–12 th","Fragmen bergeser distal / terjebak di sendi; fat pad tidak andal (ekstrakapsular)","Nonoperatif; operasi bila terjebak"],["Dislokasi siku","13–14 th","Posterolateral; cari fraktur epikondilus medial, koronoid, kolum radius","Reduksi tertutup, gerak dini"]],ref:[T(574),T(582),T(585),T(599)]},{judul:"Kaput/kolum radius anak: O'Brien dan terapi",kolom:["Angulasi","Terapi"],baris:[["Tipe I < 30°","Imobilisasi 7–10 hari (collar-and-cuff/splint/gips) lalu gerak dini"],["Tipe II 30–60°","Reduksi tertutup (Patterson, Israeli, Esmarch) → gips pronasi fleksi 90° 10–14 hari; K-wire perkutan bila tidak stabil"],["Tipe III > 60°, translasi > 4 mm, geser medial, ireduksibel","Reduksi terbuka + K-wire oblik (atau Métaizeau); tanpa pin transkapitelar; tanpa eksisi kaput"]],ref:T(596),catatan:"Prediktor hasil baik: < 10 tahun, cedera tunggal, jaringan lunak minimal, angulasi awal < 30°, translasi awal < 3 mm, terapi tertutup dan dini."}],algoritma:[{judul:"Fraktur suprakondiler di IGD",langkah:["Periksa & dokumentasikan n. medianus/AIN (OK sign), n. radialis (ekstensi ibu jari), n. ulnaris (abduksi jari), nadi radialis, capillary refill, kehangatan tangan — **sebelum dan sesudah** setiap manipulasi/splint.","Cari tanda terbuka (laserasi → uji injeksi salin intraartikular bila ragu) dan bengkak antekubital masif (sindrom kompartemen).","Radiografi AP + lateral sejati; nilai garis humerus anterior, Baumann, fat pad posterior; tentukan Gartland.",{teks:"Tipe?",cabang:["I → splint/gips fleksi 60–90°, 2–3 minggu","II → reduksi tertutup + gips; pin bila tidak stabil, malrotasi, atau butuh fleksi berlebihan","III → reduksi tertutup + pin perkutan di kamar operasi; ORIF bila tidak stabil rotasi / terbuka / neurovaskular"]},{teks:"Nadi hilang setelah reduksi?",cabang:["Tangan hangat, perfusi baik (pink pulseless) → observasi","Tangan pucat tanpa nadi → eksplorasi a. brakialis (± fasiotomi)"]},"Jangan imobilisasi dalam hiperfleksi bila bengkak: risiko neurovaskular dan sindrom kompartemen."],ref:[T(571),T(575)]},{judul:"Anak kecil dengan lengan menggantung pronasi setelah ditarik",langkah:["Riwayat tarikan longitudinal (absen pada 33–50% kasus) + usia 6 bulan–6 tahun + tanpa efusi/nyeri te
