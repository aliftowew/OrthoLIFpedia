kular di distal olekranon dengan angulasi valgus; sering bersama fraktur radius proksimal.",ref:[la(603),la(604)],indikasi:"b"},{id:"b2",nama:{id:"B2 — pola varus",en:"B2 — varus pattern"},kode:"B2",gambar:"olekranon-anak:ekstensi-varus",ringkas:"Greenstick dengan angulasi varus; garis longitudinal sering sulit terlihat.",ref:[la(603),la(604)],indikasi:"b"}]},{id:"shear",nama:{id:"Grup C — geser",en:"Group C — shear"},kode:"C",jenis:[{id:"c",nama:{id:"Geser: fragmen distal ke anterior, periosteum posterior utuh",en:"Shear: distal fragment anterior, posterior periosteum intact"},kode:"C",gambar:"olekranon-anak:shear",ringkas:"Korteks anterior gagal karena tegangan; periosteum posterior yang utuh dapat berfungsi sebagai tension band dalam hiperfleksi.",ref:[la(603),la(604)],indikasi:"c"}]}],indikasi:{"a-tak":{intro:"Fleksi tak bergeser: splint dalam ekstensi hampir penuh agar triseps tidak menarik fragmen; foto ulang dini untuk menangkap pergeseran awal.",ref:la(604),opsi:[{id:"splint",nama:{id:"Splint fleksi 5–10°, 3 minggu",en:"Splint at 5–10° flexion, 3 weeks"},gambar:"olekranon-anak:splint-ekstensi",utama:["Tak bergeser","Foto ulang 5–7 hari"],ref:la(604),tatalaksana:"splint"}]},"a-geser":{intro:"Bergeser atau kominutif: stabilisasi bedah. Pilih teknik fiksasi dengan mengingat implan sering perlu dilepas kemudian.",ref:[la(604),la(605)],opsi:[{id:"tbw",nama:{id:"K-wire + tension band (kawat atau benang)",en:"K-wires + tension band (wire or suture)"},gambar:"olekranon-anak:tension-band",utama:["Fraktur transversal bergeser","Benang mengurangi kebutuhan pelepasan implan"],ref:la(605),tatalaksana:"fiksasi"},{id:"sekrup",nama:{id:"Sekrup cancellous ± tension band",en:"Cancellous screw ± tension band"},gambar:"olekranon-anak:sekrup-tension-band",utama:["Fragmen cukup besar","Alternatif pada anak lebih besar"],ref:la(605),tatalaksana:"fiksasi"}]},b:{intro:"Cedera ekstensi umumnya perlu koreksi deformitas varus/valgus: kunci olekranon di fosa dengan ekstensi, lalu beri gaya berlawanan; sedikit overkoreksi mencegah kambuh.",ref:la(604),opsi:[{id:"koreksi",nama:{id:"Koreksi angulasi tertutup + imobilisasi",en:"Closed correction of angulation + immobilization"},gambar:"olekranon-anak:koreksi-angulasi",utama:["Greenstick varus/valgus","Overkoreksi ringan"],ref:la(604),tatalaksana:"koreksi"}]},c:{intro:"Geser dengan periosteum posterior utuh: imobilisasi dalam hiperfleksi memakai periosteum sebagai tension band; operasi bila bengkak berlebihan membuat hiperfleksi berisiko neurovaskular.",ref:la(604),opsi:[{id:"hiperfleksi",nama:{id:"Imobilisasi hiperfleksi",en:"Immobilization in hyperflexion"},gambar:"olekranon-anak:gips-hiperfleksi",utama:["Periosteum posterior utuh","Bengkak tidak berlebihan"],ref:la(604),tatalaksana:"hiperfleksi"},{id:"fiksasi",nama:{id:"Fiksasi interna",en:"Internal fixation"},gambar:"olekranon-anak:tension-band",utama:["Bengkak berlebihan (risiko neurovaskular dalam hiperfleksi)","Periosteum posterior robek"],ref:[la(604),la(605)],tatalaksana:"fiksasi"}]}},tatalaksana:{splint:{nama:{id:"Splint dalam ekstensi hampir penuh",en:"Splint in near-full extension"},bab:[{judul:"Protokol",isi:"Cedera fleksi tak bergeser: splint dengan siku fleksi **5–10°** selama **3 minggu**; foto ulang pada **5–7 hari** untuk menilai pergeseran dini.",ref:la(604)},{judul:"Komplikasi yang diawasi",isi:"**Hilang reduksi** pada fraktur yang dirawat nonoperatif lalu bergeser — dapat sangat mengganggu fungsi siku bila tidak dikenali dini; **elongasi** ujung olekranon/apofisis yang membatasi ekstensi; delayed union jarang (< 1%) dan biasanya asimtomatik.",ref:la(605)}]},koreksi:{nama:{id:"Koreksi angulasi cedera ekstensi",en:"Correcting angulation in extension injuries"},bab:[{judul:"Teknik",isi:"Kunci olekranon di **fosa olekranon** dengan siku **ekstensi**, lalu beri gaya **varus atau valgus** berlawanan arah deformitas; **overkoreksi** ringan membantu mencegah kambuhnya deformitas. Fraktur greenstick ini ekstraartikular.",ref:[la(603),la(604)]}]},hiperfleksi:{nama:{id:"Imobilisasi hiperfleksi (cedera geser)",en:"Hyperflexion immobilization (shear injury)"},bab:[{judul:"Prinsip",isi:"Bila periosteum posterior utuh, ia berfungsi sebagai **tension band** saat siku dihiperfleksikan, menahan fragmen distal yang cenderung ditarik ke anterior oleh brakialis–biseps. Pertimbangkan operasi bila bengkak berlebihan — hiperfleksi dapat menyebabkan gangguan neurovaskular.",ref:la(604)}]},fiksasi:{nama:{id:"Fiksasi interna olekranon anak",en:"Internal fixation of the pediatric olecranon"},bab:[{judul:"Kapan",isi:"Fraktur bergeser atau kominutif. Kunci penilaian stabilitas: **periosteum posterior** — defek teraba atau fragmen memisah saat fleksi → fiksasi.",ref:[la(604),la(605)]},{judul:"Pilihan implan",isi:"K-wire + tension band, tension band saja, sekrup cancellous saja, atau sekrup + tension band. **Pelepasan implan sering diperlukan** — pertimbangkan saat memilih (tension band kawat vs **benang**).",ref:la(605)},{judul:"Pascaoperasi",isi:"Gips dengan siku fleksi **70–80°** selama **3 minggu**, lalu gerak aktif.",ref:la(605)},{judul:"Komplikasi",isi:"Cedera saraf jarang saat trauma; **neurapraksia ulnaris** dilaporkan setelah pseudartrosis olekranon akibat fiksasi tidak adekuat; elongasi apofisis membatasi ekstensi.",ref:la(605)}]}}}});var mr={};Oa(mr,{default:()=>zt});var $a,zt,gr=ga(()=>{$a=a=>({buku:"HoF",bab:"44",hlm:a}),zt={id:"pulled-elbow",nama:{id:"Pulled elbow (subluksasi kaput radius)",en:"Pulled elbow (radial head subluxation)"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:597,akhir:599}}],gambar:"pulled-elbow:normal",intro:{id:"Anak 6 bulan–6 tahun (puncak 2–3 tahun) yang ditarik tangannya lalu tiba-tiba tidak mau memakai lengannya: ligamen anular terselip ke dalam sendi radiokapitelar. Diagnosisnya klinis, foto sering tidak perlu, dan reduksinya satu gerakan — supinasi–fleksi atau hiperpronasi. Yang penting: kenali kapan gambaran ini **bukan** pulled elbow.",en:"A child aged 6 months–6 years (peak 2–3) who was pulled by the hand and suddenly stops using the arm: the annular ligament has slipped into the radiocapitellar joint. Diagnosis is clinical, imaging is often unnecessary, and reduction is a single maneuver — supination–flexion or hyperpronation. The key skill is recognizing when this picture is **not** a pulled elbow."},introRef:[$a(597),$a(598),$a(599)],pemeriksaan:{klinis:[{teks:"Riwayat khas: tarikan **longitudinal mendadak** pada lengan yang ekstensi (anak 'disentak' saat akan menyeberang), sering dengan bunyi 'klik'. Nyeri awal cepat reda; lengan dibiarkan menggantung dengan lengan bawah **pronasi** dan siku sedikit fleksi; anak menolak memakai tangan (**pseudoparalisis**).",ref:$a(598)},{teks:"Riwayat tarikan **tidak ada pada 33–50%** kasus. Efusi jarang; nyeri tekan biasanya di sisi **anterior dan lateral** siku.",ref:$a(598)},{teks:"Periksa neurovaskular: gangguan neurovaskular **tidak** terjadi pada subluksasi sederhana — bila ada, pikirkan diagnosis lain.",ref:$a(598)},{teks:"Singkirkan **artritis septik dini** dan **fraktur radius proksimal**, yang dapat tampil serupa, terutama bila riwayat tarikan tidak ada.",ref:$a(598)}],radiologis:[{teks:"Foto **tidak perlu** bila riwayat klasik, usia ≤ 5 tahun, dan pemeriksaan sangat mendukung; selain itu AP dan lateral siku.",ref:$a(598)},{teks:"Foto biasanya normal; pergeseran lateral kaput radius **> 3 mm** terhadap kapitulum pada AP disebut menandai subluksasi, tetapi sumbu radiokapitelar mudah kabur oleh rotasi sedikit saja — tanda ini hanya tampak pada ± **25%** kasus.",ref:$a(598)},{teks:"USG tidak rutin; dapat memperlihatkan pelebaran area eko-negatif antara kaput radius dan kapitulum (jarak radiokapitelar normal ± 7,2 mm; selisih **> 3 mm** dengan sisi sehat menunjang subluksasi).",ref:$a(598)}],mekanisme:[{teks:"Traksi longitudinal pada siku ekstensi; masih diperdebatkan apakah lengan bawah harus supinasi atau pronasi — lebih diterima bahwa cedera terjadi dalam **pronasi**.",ref:$a(598)},{teks:"Stabilitas utama sendi radioulnar proksimal berasal dari **ligamen anular** yang memeluk kaput radius di takik radialis ulna; ligamen menegang pada supinasi karena bentuk kaput, dan diperkuat ligamen kolateral radialis. Setelah **5 tahun**, perlekatan distal ligamen ke kolum radius menguat sehingga robekan/pergeseran tidak lagi terjadi.",ref:[$a(597),$a(598)]}],epidemiologi:[{teks:"Perempuan lebih sering (laki : perempuan **1 : 2**); siku **kiri 70%**; usia **6 bulan–6 tahun**, puncak **2–3 tahun**; kekambuhan **5–30%**.",ref:$a(597)}]},klasifikasi:[{nama:"Tidak ada skema klasifikasi",teks:"Yang penting menyingkirkan kemungkinan lain (artritis septik dini, fraktur radius proksimal), terutama bila riwayat tarikan tidak ada.",ref:$a(598)}],kelompok:[{id:"pulled",nama:{id:"Subluksasi kaput radius",en:"Radial head subluxation"},kode:"nursemaid's elbow",jenis:[{id:"akut",nama:{id:"Akut, riwayat klasik",en:"Acute, classic history"},kode:"akut",gambar:"pulled-elbow:subluksasi",ringkas:"Ligamen anular terjepit di sendi radiokapitelar setelah tarikan longitudinal; lengan menggantung pronasi, tanpa efusi.",ref:$a(598),indikasi:"akut"},{id:"mekanisme",nama:{id:"Tanpa riwayat tarikan (33–50%)",en:"No history of a pull (33–50%)"},kode:"atipikal",gambar:"pulled-elbow:mekanisme",ringkas:"Tetap mungkin pulled elbow, tetapi ambang untuk foto dan pemikiran diagnosis banding lebih rendah.",ref:$a(598),indikasi:"atipikal"},{id:"berulang",nama:{id:"Berulang / ireduksibel",en:"Recurrent / irreducible"},kode:"5–39%",gambar:"pulled-elbow:normal",ringkas:"Kambuh pada 5–39% sampai ligamen anular menguat (4–5 tahun); ireduksibel jarang (interposisi ligamen).",ref:$a(599),indikasi:"berulang"}]}],indikasi:{akut:{intro:"Reduksi tertutup di tempat: supinasi dengan tekanan ibu jari pada kaput lalu fleksi maksimal, atau hiperpronasi. 'Klik' teraba; anak biasanya memakai lengannya lagi dalam 5–10 menit.",ref:$a(599),opsi:[{id:"supinasi-fleksi",nama:{id:"Supinasi + fleksi",en:"Supination + flexion"},gambar:"pulled-elbow:reduksi-supinasi-fleksi",utama:["Manuver klasik","Ibu jari menekan kaput radius"],ref:$a(599),tatalaksana:"reduksi"},{id:"hiperpronasi",nama:{id:"Hiperpronasi",en:"Hyperpronation"},gambar:"pulled-elbow:reduksi-hiperpronasi",utama:["Alternatif satu gerakan"],ref:$a(599),tatalaksana:"reduksi"}]},atipikal:{intro:"Tanpa riwayat tarikan atau usia > 5 tahun: buat foto AP–lateral dulu untuk menyingkirkan fraktur; bila pemeriksaan tetap mendukung, lakukan reduksi.",ref:$a(598),opsi:[{id:"foto-reduksi",nama:{id:"Foto dulu → reduksi bila sesuai",en:"Radiograph first → reduce if consistent"},gambar:"pulled-elbow:reduksi-supinasi-fleksi",utama:["Riwayat tidak klasik / usia > 5 tahun","Singkirkan fraktur radius proksimal & artritis septik"],ref:[$a(598),$a(599)],tatalaksana:"reduksi"}]},berulang:{intro:"Kekambuhan berhenti sendiri setelah 4–5 tahun saat ligamen anular menguat; ireduksibel sangat jarang dan memerlukan reduksi terbuka.",ref:$a(599),opsi:[{id:"reduksi-ulang",nama:{id:"Reduksi ulang tiap episode",en:"Reduce each episode"},gambar:"pulled-elbow:reduksi-hiperpronasi",utama:["Kambuh 5–39%","Edukasi orang tua: hindari menarik tangan"],ref:$a(599),tatalaksana:"reduksi"},{id:"terbuka",nama:{id:"Reduksi terbuka (ireduksibel)",en:"Open reduction (irreducible)"},gambar:"pulled-elbow:subluksasi",utama:["Interposisi ligamen anular","Transeksi + repair ligamen"],ref:$a(599),tatalaksana:"terbuka"}]}},tatalaksana:{reduksi:{nama:{id:"Reduksi tertutup pulled elbow",en:"Closed reduction of pulled elbow"},bab:[{judul:"Supinasi–fleksi",isi:"Lengan bawah **disupinasi** sambil ibu jari menekan kaput radius, lalu siku dibawa ke **fleksi maksimal** dengan lengan bawah tetap supinasi. 'Klik' dapat teraba.",ref:$a(599)},{judul:"Hiperpronasi",isi:"**Hiperpronasi** lengan bawah juga dapat mereduksi subluksasi.",ref:$a(599)},{judul:"Sesudahnya",isi:"Nyeri sesaat saat manuver, lalu bebas nyeri dan lengan dipakai normal dalam **5–10 menit**. Foto pascareduksi umumnya tidak perlu; sling tidak perlu bila anak sudah memakai lengannya tanpa keluhan.",ref:$a(599)},{judul:"Bila anak tetap rewel",isi:"Pertimbangkan pemeriksaan lebih lanjut untuk kelainan lain atau ulangi reduksi. Bila cedera sudah **12–24 jam**, sinovitis reaktif dapat menjelaskan nyeri tekan dan keengganan bergerak setelah reduksi.",ref:$a(599)},{judul:"Subluksasi yang tak dikenali",isi:"Umumnya tereduksi spontan dengan hilangnya nyeri — diagnosis baru disadari retrospektif.",ref:$a(599)}]},terbuka:{nama:{id:"Reduksi terbuka (sangat jarang)",en:"Open reduction (very rare)"},bab:[{judul:"Indikasi & teknik",isi:"Subluksasi **ireduksibel** karena interposisi ligamen anular: reduksi terbuka dengan **transeksi dan repair** ligamen anular untuk mendapatkan reduksi stabil.",ref:$a(599)}]}}}});var br={};Oa(br,{default:()=>Vt});var q,Yi,Vt,cr=ga(()=>{q=a=>({buku:"HoF",bab:"44",hlm:a}),Yi=a=>({buku:"AO",bab:"4.4",hlm:a}),Vt={id:"dislokasi-siku-anak",nama:{id:"Dislokasi siku anak",en:"Pediatric elbow dislocation"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:599,akhir:603}},{buku:"AO",bab:"4.4",hlm:{awal:398,akhir:398}}],gambar:"dislokasi-siku-anak:posterior",intro:{id:"Dislokasi siku anak jarang (3–6% cedera siku) dan memuncak pada 13–14 tahun setelah fisis menutup — pada anak kecil, 'dislokasi' pada foto lebih mungkin **separasi transfiseal**. Hampir semua posterolateral, dan separuhnya membawa fraktur penyerta: **epikondilus medial** (yang bisa terjepit di sendi), koronoid, atau kolum radius.",en:"Pediatric elbow dislocation is uncommon (3–6% of elbow injuries) and peaks at 13–14 years after physeal closure — in a small child, a 'dislocation' on film is more likely a **transphyseal separation**. Nearly all are posterolateral, and about half carry associated fractures: the **medial epicondyle** (which may get trapped in the joint), coronoid, or radial neck."},introRef:[q(599),q(600),q(583)],pemeriksaan:{klinis:[{teks:"Lengan dilindungi, instabilitas bervariasi, **bengkak masif**. Periksa neurovaskular **sebelum** foto dan manipulasi: n. medianus, ulnaris, radialis, interoseus anterior, dan a. brakialis berisiko. Ulangi setelah reduksi.",ref:q(600)},{teks:"Nadi radialis dapat teraba walau a. brakialis cedera karena kolateral; angiografi bila dicurigai gangguan vaskular. Pemeriksaan serial bila bengkak antekubital masif atau berisiko **sindrom kompartemen**.",ref:q(600)}],radiologis:[{teks:"AP dan lateral siku; teliti fraktur penyerta — tersering gangguan **apofisis epikondilus medial**, lalu prosesus koronoid dan kolum radius.",ref:q(600)},{teks:"Pada anak kecil, bedakan dari separasi transfiseal: dislokasi bergeser terutama **posterolateral** dengan hubungan kapitulum–radius proksimal **terputus**; pada transfiseal hubungan itu tetap dan pergeserannya posteromedial.",ref:q(583)},{teks:"AO: fraktur epikondilus medial kebanyakan akibat dislokasi yang **tereduksi spontan** — mengenali dislokasi dan epikondilus yang patah bisa sulit; inkongruensi sendi harus mengarahkan ke fragmen yang **terjepit** di dalam sendi.",ref:Yi(398)}],mekanisme:[{teks:"Tersering jatuh pada tangan atau siku terentang: gaya pengungkit melepaskan olekranon dari troklea disertai translasi permukaan sendi. **Posterior**: hiperekstensi + valgus + abduksi lengan + supinasi lengan bawah → cedera kapsul, ligamen kolateral (terutama medial), dan otot. **Anterior**: gaya langsung pada sisi posterior siku yang fleksi.",ref:q(600)},{teks:"Stabilitas siku: kongruensi sendi, tegangan triseps–fleksor, dan ligamen — bundel anterior ligamen kolateral medial paling penting. Ekstensi dan pronasi adalah posisi relatif tidak stabil. Gerak fungsional memerlukan fleksi 30–130°, supinasi 50°, pronasi 50°.",ref:[q(599),q(600)]}],epidemiologi:[{teks:"**3–6%** cedera siku; puncak **13–14 tahun** setelah fisis menutup; insidens fraktur penyerta tinggi (epikondilus medial, koronoid, kaput/kolum radius).",ref:q(599)},{teks:"Posterolateral **> 90%**; anterior hanya **1%**; divergen jarang; dislokasi medial/lateral tidak dilaporkan pada anak.",ref:[q(600),q(601)]}]},klasifikasi:[{nama:"Kronologis",teks:"Akut · kronis (tidak tereduksi) · berulang.",ref:q(600)},{nama:"Deskriptif (posisi radius–ulna terhadap humerus distal)",teks:"**Posterior**: posterolateral (> 90%), posteromedial. **Anterior** (1%). **Divergen** (jarang): anterior–posterior (ulna posterior, kaput radius anterior) atau mediolateral/transversal (humerus distal terjepit antara radius lateral dan ulna medial).",ref:[q(600),q(601),q(602)]},{nama:"Fraktur-dislokasi",teks:"Fraktur penyerta tersering: prosesus koronoid, kolum radius, apofisis epikondilus medial; jarang fraktur geser kapitulum atau troklea.",ref:q(601)}],kelompok:[{id:"posterior",nama:{id:"Dislokasi posterior (> 90%)",en:"Posterior dislocation (> 90%)"},kode:"posterolateral",jenis:[{id:"murni",nama:{id:"Posterolateral murni",en:"Pure posterolateral"},kode:"tanpa fraktur",gambar:"dislokasi-siku-anak:posterior",ringkas:"Radius–ulna di posterolateral humerus distal; kapsul dan ligamen kolateral medial robek.",ref:q(600),indikasi:"posterior"},{id:"epikondilus",nama:{id:"Dengan fraktur epikondilus medial",en:"With medial epicondyle fracture"},kode:"± terjepit",gambar:"dislokasi-siku-anak:posterior-epikondilus",ringkas:"Ligamen kolateral ulnaris mengavulsi apofisis; setelah reduksi, pastikan fragmen tidak tertinggal di dalam sendi.",ref:[q(585),q(600)],indikasi:"epikondilus"},{id:"inkarserata",nama:{id:"Fragmen epikondilus terjepit di sendi",en:"Epicondyle fragment incarcerated in the joint"},kode:"operasi",gambar:"dislokasi-siku-anak:inkarserata",ringkas:"Sendi inkongruen setelah reduksi atau reduksi tertutup gagal → harus diatasi.",ref:[q(601),Yi(398)],indikasi:"epikondilus"},{id:"koronoid",nama:{id:"Dengan fraktur koronoid / kolum radius",en:"With coronoid / radial neck fracture"},kode:"instabilitas",gambar:"dislokasi-siku-anak:koronoid",ringkas:"Fragmen koronoid besar mengancam stabilitas; kolum radius menambah risiko sinostosis dan 'terrible triad'.",ref:[q(601),q(602)],indikasi:"koronoid"}]},{id:"lain",nama:{id:"Dislokasi lain (jarang)",en:"Other dislocations (rare)"},kode:"anterior · divergen",jenis:[{id:"anterior",nama:{id:"Anterior (1%)",en:"Anterior (1%)"},kode:"1%",gambar:"dislokasi-siku-anak:anterior",ringkas:"Gaya langsung pada siku fleksi; waspadai avulsi tendon triseps dan fraktur olekranon penyerta.",ref:[q(600),q(602)],indikasi:"anterior"},{id:"divergen",nama:{id:"Divergen",en:"Divergent"},kode:"jarang",gambar:"dislokasi-siku-anak:divergen",ringkas:"Radius dan ulna terpisah: tipe anterior–posterior (lebih sering) atau mediolateral (sangat jarang).",ref:q(602),indikasi:"divergen"}]}],indikasi:{posterior:{intro:"Reduksi tertutup segera dengan sedasi–analgesia (atau anestesi); teknik berbeda menurut usia; hindari reduksi dalam hiperekstensi. Splint posterior 90° lalu gerak aktif lembut 5–7 hari.",ref:q(601),opsi:[{id:"tengkurap",nama:{id:"Anak 0–8 tahun: tengkurap, dorong olekranon",en:"Age 0–8: prone, push the olecranon"},gambar:"dislokasi-siku-anak:reduksi-tengkurap",utama:["Lengan bawah menggantung di tepi meja","Tekanan ke anterior pada ujung olekranon"],ref:q(601),tatalaksana:"reduksi"},{id:"telentang",nama:{id:"Anak > 8 tahun: telentang, supinasi–fleksi–traksi (Parvin)",en:"Age > 8: supine, supination–flexion–traction (Parvin)"},gambar:"dislokasi-siku-anak:reduksi-telentang",utama:["Traksi distal dengan lengan bawah supinasi dan siku fleksi","Hiperekstensi → risiko jepitan n. medianus"],ref:q(601),tatalaksana:"reduksi"},{id:"brace",nama:{id:"Brace engsel bila tidak stabil tanpa fraktur",en:"Hinged brace if unstable without fracture"},gambar:"dislokasi-siku:brace-engsel",utama:["Instabilitas dalam busur gerak","Tanpa fraktur penyerta"],ref:q(601),tatalaksana:"pascareduksi"}]},epikondilus:{intro:"Setelah reduksi, cari fragmen epikondilus medial yang terjepit; fragmen yang terjepit atau ireduksibel harus ditangani (manuver Roberts atau operasi). AO: pergeseran epikondilus < 0,5 cm dapat diterima, > 1 cm tidak.",ref:[q(601),Yi(398)],opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup + evaluasi fragmen",en:"Closed reduction + fragment check"},gambar:"dislokasi-siku-anak:reduksi-telentang",utama:["Foto pascareduksi wajib","Fragmen di luar sendi dan < 0,5–1 cm → nonoperatif"],ref:[q(601),Yi(398)],tatalaksana:"reduksi"},{id:"orif",nama:{id:"Fiksasi epikondilus (sekrup / K-wire)",en:"Fix the epicondyle (screw / K-wire)"},gambar:"dislokasi-siku-anak:sekrup-epikondilus",utama:["Fragmen terjepit","Pergeseran > 1 cm / instabilitas valgus","Sekrup pada anak hampir matur, K-wire pada anak kecil"],ref:[q(601),Yi(398),Yi(399)],tatalaksana:"operatif"}]},koronoid:{intro:"Fragmen koronoid besar yang bergeser memerlukan ORIF untuk mencegah instabilitas berulang; fiksator eksternal untuk dislokasi sangat tidak stabil (ligamen kolateral medial rusak) sebagai penyelamat.",ref:q(601),opsi:[{id:"orif",nama:{id:"ORIF koronoid",en:"ORIF of the coronoid"},gambar:"dislokasi-siku-anak:orif-koronoid",utama:["Fragmen besar, bergeser","Mencegah redislokasi"],ref:q(601),tatalaksana:"operatif"},{id:"eksfiks",nama:{id:"Fiksator eksternal (penyelamat)",en:"External fixator (salvage)"},gambar:"dislokasi-siku:eksfiks-engsel",utama:["Sangat tidak stabil","Ligamen kolateral medial rusak"],ref:q(601),tatalaksana:"operatif"}]},anterior:{intro:"Reduksi tertutup dengan sedasi: traksi distal pada lengan bawah yang fleksi, lalu dorongan dorsal pada lengan bawah volar dan dorongan anterior pada humerus distal. Nilai fungsi triseps; fraktur olekranon penyerta biasanya perlu ORIF.",ref:[q(601),q(602)],opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup anterior",en:"Closed reduction of anterior dislocation"},gambar:"dislokasi-siku-anak:anterior",utama:["Traksi pada lengan bawah fleksi","Periksa triseps setelahnya"],ref:[q(601),q(602)],tatalaksana:"reduksi"},{id:"orif",nama:{id:"ORIF olekranon penyerta",en:"ORIF of the associated olecranon"},gambar:"olekranon-anak:tension-band",utama:["Fraktur olekranon menyertai dislokasi anterior"],ref:q(602),tatalaksana:"operatif"}]},divergen:{intro:"Tipe anterior–posterior direduksi seperti dislokasi posterior ditambah tekanan posterior pada tonjolan kaput radius anterior; tipe mediolateral dengan traksi distal langsung pada siku ekstensi sambil menekan radius dan ulna agar konvergen.",ref:q(602),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup divergen",en:"Closed reduction of divergent dislocation"},gambar:"dislokasi-siku-anak:divergen",utama:["AP: seperti posterior + tekan kaput radius","Mediolateral: traksi + konvergensi radius–ulna"],ref:q(602),tatalaksana:"reduksi"}]}},tatalaksana:{reduksi:{nama:{id:"Reduksi tertutup dislokasi siku anak",en:"Closed reduction of pediatric elbow dislocation"},bab:[{judul:"Persiapan",isi:"Sedasi dan analgesia, atau anestesi umum/regional. Dokumentasikan status neurovaskular sebelum manipulasi.",ref:[q(600),q(601)]},{judul:"Anak 0–8 tahun",isi:"Pasien **tengkurap**, lengan bawah menggantung di tepi meja; tekanan ke **anterior** pada ujung olekranon mereduksi sendi.",ref:q(601)},{judul:"Anak > 8 tahun",isi:"Pasien telentang; reduksi dengan lengan bawah **supinasi** dan siku **fleksi** sambil traksi distal (**Parvin**). Reduksi dalam **hiperekstensi** berhubungan dengan jepitan n. medianus dan trauma jaringan lunak lebih besar.",ref:q(601)},{judul:"Anterior & divergen",isi:"Anterior: traksi distal pada lengan bawah fleksi untuk melemaskan otot, lalu dorongan dorsal pada lengan bawah volar + dorongan anterior pada humerus distal; periksa **triseps** (dapat terkelupas dari olekranon). Divergen AP: seperti posterior + tekanan posterior pada kaput radius; mediolateral: traksi distal pada siku ekstensi dengan konvergensi radius–ulna.",ref:[q(601),q(602)]},{judul:"Setelah reduksi",isi:"Nilai ulang neurovaskular, periksa busur gerak yang stabil, dan **foto pascareduksi wajib**.",ref:q(601)}]},pascareduksi:{nama:{id:"Perawatan pascareduksi",en:"Post-reduction care"},bab:[{judul:"Imobilisasi singkat",isi:"Splint posterior **90°** dengan balutan longgar dan elevasi; awasi bengkak antekubital dan lengan bawah. **Gerak aktif lembut 5–7 hari** setelah reduksi memberi hasil jangka panjang lebih baik; hindari gerak pasif paksa (redislokasi); imobilisasi lama → hasil buruk dan kontraktur fleksi.",ref:q(601)},{judul:"Brace engsel",isi:"Dipertimbangkan pada instabilitas tanpa fraktur penyerta, dalam busur gerak yang stabil. Pemulihan gerak dan kekuatan penuh butuh **3–6 bulan**.",ref:q(601)},{judul:"Komplikasi",isi:"**Hilang ekstensi** terminal 10–15° (biasanya tidak bermakna); **defisit neurologis 10%** — tersering jepitan n. medianus, n. ulnaris pada gangguan epikondilus medial; eksplorasi bila fungsi saraf menurun setelah manipulasi, nyeri hebat di distribusi saraf, atau tidak ada pemulihan setelah **3 bulan** (EMG + pemeriksaan serial). **Vaskular** jarang (a. brakialis) → reduksi segera; bila perfusi tidak pulih, angiografi dan rekonstruksi dengan vena safena. **Sindrom kompartemen** (Volkmann) → elevasi agresif, hindari hiperfleksi, fasiotomi bila perlu. **Redislokasi** < 1% pada dislokasi murni, meningkat dengan fraktur koronoid + kaput radius (*terrible triad*). **Tulang heterotopik/miositis** 3% dislokasi murni, 18% dengan fraktur — hindari manipulasi paksa; indometasin untuk profilaksis, **radioterapi dikontraindikasikan** pada fisis terbuka. Fragmen osteokondral yang tak dikenali; sinostosis radioulnar (terutama dengan fraktur kolum radius); cubitus recurvatum lambat.",ref:[q(602),q(603)]}]},operatif:{nama:{id:"Tatalaksana operatif",en:"Operative management"},bab:[{judul:"Indikasi",isi:"Reduksi tertutup gagal karena **interposisi** jaringan lunak/tulang; fragmen **koronoid** besar bergeser (ORIF untuk mencegah instabilitas berulang); gangguan apofisis **epikondilus medial** dengan fragmen terjepit harus diatasi. Rekonstruksi ligamen lateral untuk instabilitas berulang biasanya tidak perlu; **fiksator eksternal** untuk dislokasi sangat tidak stabil dengan ligamen kolateral medial rusak sebagai penyelamat.",ref:q(601)},{judul:"Epikondilus medial",isi:"AO: K-wire pada anak kecil, **sekrup** pada anak hampir matur; pastikan permukaan di atas lintasan n. ulnaris halus. Batas pergeseran yang dapat diterima masih diperdebatkan: < 0,5 cm diterima, > 1 cm tidak (risiko siku tidak stabil).",ref:[Yi(398),Yi(399)]},{judul:"Fraktur penyerta lain",isi:"Fraktur olekranon pada dislokasi anterior biasanya memerlukan ORIF; fraktur geser kapitulum/troklea anterior dapat menyertai dislokasi anterior — fragmen osteokondral yang tertinggal menjelaskan hasil buruk dislokasi yang tampak sederhana.",ref:[q(602),q(603)]}]}}}});var hr={};Oa(hr,{default:()=>Ut});var w,ai,Ut,fr=ga(()=>{w=a=>({buku:"HoF",bab:"45",hlm:a}),ai=a=>({buku:"AO",bab:"4.4",hlm:a}),Ut={id:"radius-ulna-anak",nama:{id:"Lengan bawah anak: diafisis, Monteggia, Galeazzi",en:"Pediatric forearm: shaft, Monteggia, Galeazzi"},sumber:[{buku:"HoF",bab:"45",hlm:{awal:606,akhir:614}},{buku:"AO",bab:"4.4",hlm:{awal:401,akhir:402}}],gambar:"radius-ulna-anak:utuh",intro:{id:"Tulang lengan bawah anak bisa **melengkung tanpa patah** (deformasi plastis), patah **satu korteks** (greenstick), **melipat** (torus), atau patah lengkap — dan periosteum tebal di sisi cekung menjadi engsel yang dipakai saat reduksi. Dua hal yang tidak boleh terlewat: **kaput radius** pada setiap fraktur ulna (Monteggia) dan **DRUJ/fisis ulna distal** pada fraktur radius distal (Galeazzi-ekuivalen).",en:"A child's forearm bones may **bend without breaking** (plastic deformation), break **one cortex** (greenstick), **buckle** (torus), or break completely — and the thick periosteum on the concave side is the hinge used during reduction. Two things must never be missed: the **radial head** with every ulnar fracture (Monteggia) and the **DRUJ/distal ulnar physis** with a distal radius fracture (Galeazzi equivalent)."},introRef:[w(607),w(609),w(613),w(614)],pemeriksaan:{klinis:[{teks:"Nyeri, bengkak, deformitas bervariasi, menolak memakai lengan. Periksa neurovaskular: cedera pergelangan dapat memberi gejala **terowongan karpal**; fraktur lebih proksimal dapat mencederai **n. interoseus anterior/posterior**.",ref:w(608)},{teks:"Palpasi tangan, pergelangan, lengan bawah, dan lengan atas; periksa siku dan bahu ipsilateral — **15%** disertai fraktur suprakondiler (*floating elbow*).",ref:[w(606),w(608)]},{teks:"Bengkak dramatis → singkirkan **sindrom kompartemen** dengan pemeriksaan serial ± tekanan kompartemen; **nyeri pada ekstensi pasif jari** paling sensitif; tanda klasik (nyeri tak sebanding, pucat, parestesia, nadi hilang, paralisis) → evaluasi agresif, fasiotomi bila perlu. Lepas semua balutan/bidai dari lapangan untuk memeriksa kulit.",ref:w(608)}],radiologis:[{teks:"AP dan lateral **lengan bawah, pergelangan, dan siku**; jangan memutar lengan bawah untuk mendapatkan proyeksi — putar sinar (*cross-table*).",ref:w(608)},{teks:"**Tuberositas bisipital** menunjukkan rotasi fragmen proksimal: supinasi 90° → mengarah medial; netral → posterior; pronasi 90° → lateral; pada radius normal tuberositas 180° dari styloid radii (pada anak ciri ini kurang jelas).",ref:[w(608),w(609)]},{teks:"Pada setiap fraktur/bowing ulna, sumbu radius harus melewati **pusat kapitulum** pada setiap proyeksi; ulna harus lurus. Pada anak kecil Monteggia sering terlewat karena ulna hanya **melengkung plastis**, atau fraktur ulna proksimal tampak seperti fraktur olekranon yang menyembunyikan dislokasi kaput radius.",ref:ai(401)}],mekanisme:[{teks:"**Tidak langsung**: jatuh pada tangan terentang; rotasi lengan bawah menentukan arah angulasi — pronasi → cedera fleksi (angulasi dorsal), supinasi → cedera ekstensi (angulasi volar). **Langsung**: pukulan pada batang radius/ulna.",ref:w(608)},{teks:"Gaya otot pendeformasi: sepertiga proksimal — biseps & supinator memfleksikan–mensupinasi fragmen proksimal, pronator teres & kuadratus mempronasi distal; sepertiga tengah — proksimal netral, pronator kuadratus mempronasi distal; sepertiga distal — brakioradialis mendorsofleksikan dan mendeviasi radial segmen distal.",ref:w(607)},{teks:"Periosteum anak sangat kuat dan tebal; umumnya robek di sisi **cembung** dan tetap utuh sebagai engsel di sisi **cekung** — penting saat reduksi tertutup.",ref:w(607)},{teks:"Monteggia: Bado I dari pukulan langsung, hiperpronasi, atau hiperekstensi; Bado III dari stres varus pada tangan yang tertanam di permukaan tetap; Bado II varian dislokasi siku posterior saat korteks anterior ulna lebih lemah daripada ligamen siku.",ref:w(613)}],epidemiologi:[{teks:"Fraktur lengan bawah = **40%** semua fraktur anak (hanya 4% diafisis); 80% pada anak > 5 tahun; puncak saat kecepatan tumbuh maksimal (tulang paling lemah); distribusi: **60%** metafisis distal, **20%** batang, **14%** fisis distal, < 4% sepertiga proksimal.",ref:w(606)},{teks:"Cedera saraf **1%** (medianus tersering). Fisis distal menyumbang **80%** pertumbuhan lengan bawah.",ref:w(606)},{teks:"Monteggia: **0,4%** fraktur lengan bawah anak; puncak 4–10 tahun; fraktur ulna biasanya di pertemuan sepertiga proksimal–tengah. Galeazzi: jarang pada anak, 3% fraktur radius distal disertai gangguan DRUJ; puncak 9–12 tahun; **Galeazzi-ekuivalen** (fraktur radius distal + fraktur fisis ulna distal) lebih sering daripada Galeazzi sejati.",ref:[w(613),w(615)]}]},klasifikasi:[{nama:"Deskriptif (diafisis)",teks:"Lokasi: sepertiga proksimal/tengah/distal. Tipe: **deformasi plastis**, inkomplet (**greenstick**), kompresi (**torus/buckle**), **komplet**. Pergeseran dan angulasi.",ref:w(609)},{nama:"Bado (Monteggia)",teks:"**I** dislokasi kaput radius anterior + fraktur diafisis ulna dengan angulasi anterior (70%). **II** dislokasi posterior/posterolateral + angulasi posterior ulna (3–6%). **III** dislokasi lateral/anterolateral + fraktur metafisis ulna, biasanya greenstick (23%). **IV** dislokasi anterior + fraktur radius dan ulna sepertiga proksimal pada level sama (1–11%).",ref:w(613)},{nama:"Monteggia-ekuivalen",teks:"**I** dislokasi kaput radius terisolasi. **II** fraktur ulna + fraktur kolum radius. **III** fraktur kolum radius terisolasi. **IV** dislokasi siku (ulnohumeral).",ref:w(614)},{nama:"Walsh (Galeazzi anak)",teks:"**I** radius distal bergeser **dorsal** (gaya supinasi) — reduksi dengan pronasi paksa + dorongan dorsal→volar. **II** bergeser **volar** (gaya pronasi) — reduksi dengan supinasi + dorongan volar→dorsal.",ref:w(615)},{nama:"Batas deformitas yang dapat diterima (AO Tabel 4.4-1)",teks:"Batang lengan bawah: usia **< 9 tahun** angulasi 15°, malrotasi 45°, pergeseran lengkap; **> 9 tahun** angulasi 10°, malrotasi 30°. Bukti lemah — terutama soal rotasi — gunakan dengan hati-hati.",ref:ai(381)}],kelompok:[{id:"diafisis",nama:{id:"Diafisis radius–ulna",en:"Radius–ulna shaft"},kode:"plastis · torus · greenstick · komplet",jenis:[{id:"plastis",nama:{id:"Deformasi plastis (bowing)",en:"Plastic deformation (bowing)"},kode:"bowing",gambar:"radius-ulna-anak:plastis",ringkas:"Tulang melengkung tanpa garis fraktur; sering terlewat dan dapat mengunci rotasi atau menghalangi reduksi fraktur tulang pasangannya.",ref:w(611),indikasi:"plastis"},{id:"torus",nama:{id:"Torus / buckle (kompresi)",en:"Torus / buckle (compression)"},kode:"torus",gambar:"radius-ulna-anak:torus",ringkas:"Korteks melipat tanpa pemisahan; stabil bila hanya satu korteks.",ref:[w(609),w(616)],indikasi:"torus"},{id:"greenstick",nama:{id:"Greenstick (inkomplet)",en:"Greenstick (incomplete)"},kode:"inkomplet",gambar:"radius-ulna-anak:greenstick",ringkas:"Korteks sisi cembung patah, sisi cekung melengkung utuh — cenderung kambuh deformitasnya bila tidak dikoreksi berlebih.",ref:[w(609),w(611)],indikasi:"greenstick"},{id:"komplet",nama:{id:"Komplet (bergeser / bayonet)",en:"Complete (displaced / bayonet)"},kode:"komplet",gambar:"radius-ulna-anak:komplet",ringkas:"Kedua korteks patah; aposisi bayonet ≤ 1 cm masih diterima pada anak < 8–10 tahun; di atas 10 tahun tidak ada deformitas yang diterima.",ref:w(611),indikasi:"komplet"}]},{id:"monteggia",nama:{id:"Monteggia (fraktur ulna + dislokasi kaput radius)",en:"Monteggia (ulna fracture + radial head dislocation)"},kode:"Bado I–IV",jenis:[{id:"bado-1",nama:{id:"Bado I — kaput radius anterior (70%)",en:"Bado I — anterior radial head (70%)"},kode:"Bado I",gambar:"radius-ulna-anak:monteggia-anak",ringkas:"Fraktur ulna berangulasi anterior (sering greenstick/oblik pendek) dengan kaput radius di depan kapitulum.",ref:w(613),indikasi:"monteggia"},{id:"bado-plastis",nama:{id:"Bowing ulna + dislokasi kaput radius",en:"Ulnar bowing + radial head dislocation"},kode:"plastis",gambar:"radius-ulna-anak:monteggia-plastis",ringkas:"Pada anak kecil ulna hanya melengkung — lesi sering terlewat; bowing harus dikoreksi dan dipertahankan agar kaput tetap tereduksi.",ref:[w(614),ai(401)],indikasi:"monteggia"},{id:"bado-2",nama:{id:"Bado II — kaput radius posterior (3–6%)",en:"Bado II — posterior radial head (3–6%)"},kode:"Bado II",gambar:"radius-ulna-diafisis:monteggia-2",ringkas:"Angulasi posterior ulna; varian dislokasi siku posterior.",ref:w(613),indikasi:"monteggia"},{id:"bado-3",nama:{id:"Bado III — kaput radius lateral (23%)",en:"Bado III — lateral radial head (23%)"},kode:"Bado III",gambar:"radius-ulna-diafisis:monteggia-3",ringkas:"Fraktur metafisis ulna (biasanya greenstick) dengan kaput radius lateral/anterolateral; stres varus.",ref:w(613),indikasi:"monteggia"},{id:"bado-4",nama:{id:"Bado IV — + fraktur radius proksimal (1–11%)",en:"Bado IV — + proximal radius fracture (1–11%)"},kode:"Bado IV",gambar:"radius-ulna-diafisis:monteggia-4",ringkas:"Dislokasi anterior dengan fraktur radius dan ulna sepertiga proksimal pada level sama.",ref:w(613),indikasi:"monteggia"},{id:"ekuivalen",nama:{id:"Monteggia-ekuivalen",en:"Monteggia equivalent"},kode:"ekuivalen I–IV",gambar:"radius-ulna-anak:garis-radiokapitelar",ringkas:"Dislokasi kaput terisolasi, ulna + kolum radius, kolum radius terisolasi, atau dislokasi siku — periksa garis radiokapitelar pada semua proyeksi.",ref:[w(614),ai(401)],indikasi:"monteggia"}]},{id:"galeazzi",nama:{id:"Galeazzi & Galeazzi-ekuivalen",en:"Galeazzi & Galeazzi equivalent"},kode:"Walsh I–II",jenis:[{id:"galeazzi",nama:{id:"Galeazzi — fraktur radius + gangguan DRUJ",en:"Galeazzi — radius fracture + DRUJ disruption"},kode:"Walsh I/II",gambar:"radius-ulna-diafisis:galeazzi",ringkas:"Fraktur sepertiga tengah–distal radius dengan ulna utuh dan DRUJ terganggu; tipe I dorsal (supinasi), tipe II volar (pronasi).",ref:w(615),indikasi:"galeazzi"},{id:"galeazzi-ekuivalen",nama:{id:"Galeazzi-ekuivalen — + fraktur fisis ulna distal",en:"Galeazzi equivalent — + distal ulnar physeal fracture"},kode:"lebih sering",gambar:"radius-ulna-anak:galeazzi-ekuivalen",ringkas:"Pengganti gangguan DRUJ pada anak: fisis ulna distal lepas; arrest fisis ulna terjadi pada 55%.",ref:w(615),indikasi:"galeazzi"}]}],indikasi:{plastis:{intro:"Anak < 4 tahun atau deformitas < 20° biasanya remodel: gips lengan panjang 4–6 minggu sampai tidak nyeri tekan. Koreksi bila bowing menghalangi reduksi fraktur penyerta, menghalangi rotasi penuh pada anak > 4 tahun, atau > 20°.",ref:w(611),opsi:[{id:"gips",nama:{id:"Gips lengan panjang tanpa koreksi",en:"Long-arm cast without correction"},gambar:"radius-ulna-anak:gips-lengan-panjang",utama:["< 4 tahun atau < 20°","4–6 minggu sampai tidak nyeri tekan"],ref:w(611),tatalaksana:"gips"},{id:"koreksi",nama:{id:"Koreksi bowing (anestesi umum)",en:"Correct the bow (general anesthesia)"},gambar:"radius-ulna-anak:koreksi-plastis",utama:["> 20°, menghalangi rotasi (> 4 tahun), atau menghalangi reduksi fraktur lain","Gaya 20–30 kg selama 2–3 menit di atas ganjal"],ref:w(611),tatalaksana:"koreksi-plastis"}]},torus:{intro:"Satu korteks: stabil, imobilisasi protektif untuk nyeri; bila kedua korteks (bikortikal), gips lengan panjang.",ref:[w(616),w(617)],opsi:[{id:"protektif",nama:{id:"Imobilisasi protektif (unikortikal)",en:"Protective immobilization (unicortical)"},gambar:"radius-ulna-anak:gips-lengan-panjang",utama:["Hanya satu korteks terlibat"],ref:w(616),tatalaksana:"gips"},{id:"gips",nama:{id:"Gips lengan panjang (bikortikal)",en:"Long-arm cast (bicortical)"},gambar:"radius-ulna-anak:gips-lengan-panjang",utama:["Kedua korteks terlibat"],ref:w(617),tatalaksana:"gips"}]},greenstick:{intro:"Tak bergeser/minimal: gips lengan panjang yang dicetak baik dengan sedikit overkoreksi agar deformitas tidak kambuh. Menyelesaikan fraktur menurunkan risiko kambuh, tetapi membuat reduksi lebih sulit — bila dipilih, patahkan korteks utuh hati-hati tanpa membuat pergeseran.",ref:[w(611),w(612)],opsi:[{id:"gips",nama:{id:"Gips lengan panjang cetak + overkoreksi ringan",en:"Molded long-arm cast + slight overcorrection"},gambar:"radius-ulna-anak:cetakan-tiga-titik",utama:["Tak bergeser / minimal","Rotasi sesuai level fraktur"],ref:[w(610),w(611)],tatalaksana:"gips"},{id:"penuhkan",nama:{id:"Selesaikan fraktur lalu gips",en:"Complete the fracture, then cast"},gambar:"radius-ulna-anak:penuhkan-fraktur",utama:["Mencegah kambuhnya deformitas","Patahkan korteks utuh perlahan sambil mencegah pergeseran"],ref:w(612),tatalaksana:"reduksi-gips"}]},komplet:{intro:"Reduksi tertutup dan gips lengan panjang yang dicetak baik (tiga titik + interoseus) untuk sebagian besar; operasi bila terbuka, tidak stabil/tidak dapat direduksi, sindrom kompartemen, floating elbow, refraktur bergeser, segmental, atau usia > 10 tahun dengan angulasi menetap. AO: > 6 tahun (banyak yang menurunkan ke 4–3 tahun), fraktur kedua tulang yang tidak stabil → ESIN.",ref:[w(609),w(612),ai(402)],opsi:[{id:"reduksi-gips",nama:{id:"Reduksi tertutup + gips lengan panjang cetak",en:"Closed reduction + molded long-arm cast"},gambar:"radius-ulna-anak:cetakan-tiga-titik",utama:["Reduksi stabil dalam batas yang dapat diterima","Tekanan di sisi periosteum utuh (cekung)","4–8 minggu; short-arm pada 4–6 minggu bila menyatu"],ref:[w(609),w(610),w(611)],tatalaksana:"reduksi-gips"},{id:"esin",nama:{id:"ESIN (paku elastis intrameduler)",en:"ESIN (elastic intramedullary nails)"},gambar:"radius-ulna-anak:esin",utama:["Tidak stabil / tidak dapat diterima setelah reduksi","Terbuka, kompartemen, floating elbow, refraktur, segmental, > 10 tahun","AO: pilihan untuk kedua tulang yang tidak stabil pada anak > 6 tahun"],ref:[w(612),ai(402)],tatalaksana:"esin"},{id:"plat",nama:{id:"Plat (kominusi berat / hampir matur)",en:"Plating (severe comminution / near maturity)"},gambar:"radius-ulna-anak:plat-kedua",utama:["Kominusi berat atau kehilangan tulang segmental (perlu stabilitas rotasi)","Remaja hampir matur dengan fraktur tidak stabil"],ref:[w(612),ai(402)],tatalaksana:"esin"}]},monteggia:{intro:"Terapi ditentukan oleh jenis fraktur ulna, bukan tipe Bado; tujuannya reduksi kaput radius yang tepat. Bowing → koreksi lengkung; inkomplet → reduksi tertutup + gips (I dan III stabil dalam fleksi 100–110° dan supinasi penuh); komplet → K-wire/intrameduler bila kaput tidak dapat direduksi atau dipertahankan.",ref:[w(614),ai(401)],opsi:[{id:"gips",nama:{id:"Reduksi tertutup + gips fleksi 100–110°, supinasi",en:"Closed reduction + cast at 100–110° flexion, supination"},gambar:"radius-ulna-anak:monteggia-gips",utama:["Ulna bowing atau greenstick stabil","Kaput radius tereduksi; foto kontrol 1 minggu","Angulasi 10° diterima < 10 tahun bila kaput tereduksi"],ref:[w(614),ai(401)],tatalaksana:"monteggia-tertutup"},{id:"esin",nama:{id:"Rekonstruksi ulna: ESIN / K-wire (jarang plat)",en:"Ulnar reconstruction: ESIN / K-wire (rarely plate)"},gambar:"radius-ulna-anak:monteggia-esin",utama:["Fraktur ulna komplet / tidak stabil","Kaput tidak dapat direduksi atau dipertahankan"],ref:[w(614),ai(401)],tatalaksana:"monteggia-operatif"}]},galeazzi:{intro:"Reduksi tertutup menurut tipe Walsh (I: pronasi paksa + dorongan dorsal→volar; II: supinasi + dorongan volar→dorsal); operasi bila reduksi tidak dapat dipertahankan — cross pinning, pin intrameduler, atau plat.",ref:w(615),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup sesuai tipe + gips",en:"Type-specific closed reduction + cast"},gambar:"radius-ulna-anak:gips-lengan-panjang",utama:["Tipe I: pronasi paksa","Tipe II: supinasi"],ref:w(615),tatalaksana:"galeazzi"},{id:"pin",nama:{id:"Cross pinning / pin IM / plat",en:"Cross pinning / IM pins / plate"},gambar:"radius-ulna-anak:galeazzi-pin",utama:["Reduksi tidak dapat dipertahankan"],ref:w(615),tatalaksana:"galeazzi"}]}},tatalaksana:{gips:{nama:{id:"Gips lengan panjang yang dicetak baik",en:"Well-molded long-arm cast"},bab:[{judul:"Cetakan",isi:"Cetakan **tiga titik** dan **interoseus**; gips dibentuk **oval** untuk melebarkan ruang interoseus, dan **dibelah (bivalve)** bila bengkak dikhawatirkan; lengan dielevasi. Koreksi deformitas kasar sejak awal untuk melindungi jaringan lunak; bidai bila reduksi tertunda.",ref:[w(609),w(610),w(611)]},{judul:"Rotasi menurut level",isi:"Sepertiga **proksimal → supinasi**; **tengah → netral**; **distal → pronasi**; hindari posisi ekstrem apa pun levelnya.",ref:w(610)},{judul:"Lama & batas remodeling",isi:"**4–8 minggu** sampai ada bukti union; dapat diganti gips lengan pendek pada 4–6 minggu bila penyembuhan adekuat. Koreksi angulasi ± **1°/bulan (10°/tahun)**, eksponensial dan bergantung lokasi–usia (sampai 15° di pergelangan pada < 10 tahun); **rotasi tidak remodel**; bayonet ≤ 1 cm diterima bila < 8–10 tahun; > 10 tahun tidak ada deformitas yang diterima. AO: batang lengan bawah < 9 tahun 15°/45° rotasi, > 9 tahun 10°/30°.",ref:[w(611),ai(381)]},{judul:"Komplikasi",isi:"**Refraktur 5%** (lebih sering setelah greenstick dan setelah pelepasan plat); malunion; sinostosis jarang (trauma energi tinggi, operasi, manipulasi berulang, fraktur proksimal, cedera kepala); sindrom kompartemen — selalu bivalve gips setelah reduksi; cedera saraf medianus/ulnaris/PIN, iatrogenik 8,5% pada yang dioperasi.",ref:[w(612),w(613)]}]},"koreksi-plastis":{nama:{id:"Koreksi deformasi plastis",en:"Correcting plastic deformation"},bab:[{judul:"Teknik",isi:"Biasanya perlu **anestesi umum** karena dibutuhkan gaya **20–30 kg**. Puncak lengkung diletakkan di atas **ganjal berbantal**, gaya konstan diberikan **2–3 menit**, lalu gips lengan panjang yang dicetak baik. Sisa angulasi setelah koreksi harus < 10–20°.",ref:w(611)},{judul:"Kapan dikoreksi",isi:"Bila bowing (1) menghalangi reduksi fraktur penyerta, (2) menghalangi rotasi penuh pada anak > 4 tahun, atau (3) melebihi **20°**. Pada Monteggia, lengkung ulna harus dikoreksi dan dipertahankan untuk menjaga reduksi kaput radius — ulna proksimal (apofisis) berkapasitas remodeling rendah.",ref:[w(611),ai(381),ai(401)]}]},"reduksi-gips":{nama:{id:"Reduksi tertutup fraktur batang",en:"Closed reduction of shaft fractures"},bab:[{judul:"Persiapan",isi:"Sedasi, anestesi lokal, atau anestesi umum sesuai luas/tipe fraktur dan usia; **finger trap** dengan beban dapat membantu.",ref:w(609)},{judul:"Prinsip reduksi",isi:"Pertahankan reduksi dengan tekanan di sisi **periosteum utuh (cekung)**. Memperbesar deformitas untuk melepaskan fragmen hanya untuk fraktur **radius distal**, bukan fraktur batang.",ref:w(609)},{judul:"Greenstick",isi:"Imobilisasi dalam gips cetak dengan **sedikit overkoreksi**; menyelesaikan fraktur mengurangi kambuhnya deformitas tetapi reduksi fraktur yang bergeser lebih sulit — patahkan korteks utuh dengan hati-hati sambil mencegah pergeseran.",ref:[w(611),w(612)]},{judul:"Floating elbow",isi:"Fraktur suprakondiler ipsilateral: pin suprakondiler lalu gips untuk lengan bawah; stabilisasi lengan bawah bila sangat tidak stabil/bergeser atau ada kekhawatiran sindrom kompartemen.",ref:w(612)}]},esin:{nama:{id:"Fiksasi intrameduler elastis (ESIN) & plat",en:"Elastic intramedullary nailing (ESIN) & plating"},bab:[{judul:"Indikasi",isi:"Reduksi tidak stabil/tidak dapat diterima; fraktur terbuka/sindrom kompartemen; *floating elbow*; refraktur bergeser; fraktur segmental; usia (biasanya > 10 tahun bila angulasi bermakna menetap). Stabilisasi bedah diperlukan pada **1,5–31%** kasus. AO: hasil fungsional nonoperatif sering buruk pada anak > 6 tahun dengan fraktur kedua tulang yang tidak stabil → operasi; banyak yang menurunkan batas ke 4 (bahkan 3) tahun dengan alasan sosial-ekonomi keluarga, dibenarkan oleh teknik ESIN yang minimal invasif.",ref:[w(612),ai(402)]},{judul:"Teknik ESIN",isi:"Paku fleksibel atau berlengkung untuk memulihkan lengkung radius. **Radius direduksi lebih dulu**, paku masuk tepat proksimal styloid radii setelah dua cabang n. radialis superfisialis dilihat; lalu ulna, paku **antegrade lewat olekranon** atau retrograde lewat metafisis distal dengan melindungi n. ulnaris. Splint volar **4 minggu**; implan dibiarkan **6–9 bulan**, dilepas bila kalus solid dan garis fraktur hilang. AO: pascaoperasi biasanya fungsional tanpa gips (splint antalgik bila perlu).",ref:[w(612),ai(402)]},{judul:"Plat",isi:"Untuk kominusi berat atau kehilangan tulang segmental (butuh stabilitas rotasi) dan pada individu yang matur secara skeletal. AO: ESIN telah menggantikan plat konvensional; plat untuk remaja lebih tua dengan fraktur tidak stabil dan potensi tumbuh kecil; refraktur lebih sering setelah pelepasan plat.",ref:[w(612),w(613),ai(402)]}]},"monteggia-tertutup":{nama:{id:"Monteggia: reduksi tertutup dan gips",en:"Monteggia: closed reduction and cast"},bab:[{judul:"Prinsip",isi:"Terapi berdasarkan **jenis fraktur ulna**, bukan tipe Bado. Deformasi plastis → reduksi lengkung ulna. Fraktur inkomplet → reduksi tertutup dan gips; tipe I dan III lebih stabil dalam **fleksi 100–110°** dan **supinasi penuh**. Angulasi **10°** diterima pada anak < 10 tahun asalkan reduksi kaput radius adekuat.",ref:w(614)},{judul:"AO",isi:"Tujuan terapi adalah **reduksi kaput radius yang tepat**. Pada greenstick ulna yang stabil, reduksi tertutup dan gips (dalam supinasi) memadai; **kontrol foto setelah 1 minggu** wajib.",ref:ai(401)},{judul:"Komplikasi",isi:"Cedera **n. interoseus posterior 10–20%** (tersering tipe I dan III); miositis osifikans **7%**.",ref:w(614)}]},"monteggia-operatif":{nama:{id:"Monteggia: rekonstruksi ulna",en:"Monteggia: ulnar reconstruction"},bab:[{judul:"Indikasi & teknik",isi:"Fraktur ulna komplet diterapi dengan **K-wire atau fiksasi intrameduler** bila kaput radius tidak dapat direduksi atau dipertahankan. AO: pada situasi tidak stabil ulna harus direkonstruksi **anatomis**, yang otomatis mereduksi kaput radius — biasanya dengan paku elastis, jarang dengan plat kecil.",ref:[w(614),ai(401)]}]},galeazzi:{nama:{id:"Galeazzi & Galeazzi-ekuivalen",en:"Galeazzi & Galeazzi equivalent"},bab:[{judul:"Reduksi menurut tipe",isi:"Tipe I (dorsal, supinasi): **pronasi paksa** + dorongan dorsal→volar pada radius distal. Tipe II (volar, pronasi): **supinasi** + dorongan volar→dorsal.",ref:w(615)},{judul:"Operatif",isi:"Indikasi: reduksi **tidak dapat dipertahankan** → cross pinning, pin intrameduler, atau plat.",ref:w(615)},{judul:"Komplikasi",isi:"**Malunion** paling sering karena subluksasi ulna yang menetap; **arrest fisis ulna 55%** pada Galeazzi-ekuivalen.",ref:w(615)}]}}}});var xr={};Oa(xr,{gambarSkema:()=>ol});function _t(a){let i=(s,l,t)=>`<rect x="100" y="${s}" width="120" height="120" rx="10" class="${l?"segmen-sorot":"segmen-redup"}"/>`+J(236,s+66,t),e=a==="2"?'<rect x="118" y="140" width="84" height="140" rx="10" class="segmen-sorot"/>':'<rect x="118" y="140" width="84" height="140" rx="10" class="segmen-redup"/>';return i(14,a==="1","1")+e+J(236,214,"2")+i(286,a==="3","3")}function Wt(a,i){switch(`${a}${i||""}`){case"A":case"A1":return f("M134,188 C152,196 168,210 186,232")+f("M134,232 C152,224 168,210 186,188","fraktur tipis");case"A2":return f("M134,234 L186,186");case"A3":return f("M134,210 L152,206 L170,214 L186,210");case"B":case"B2":return xi("M134,178 L166,212 L134,246 Z")+f("M166,212 L186,202");case"B3":return xi("M134,178 L166,212 L134,246 Z")+f("M134,212 L166,212")+f("M166,212 L186,202")+f("M148,196 L150,228","fraktur tipis");case"C":case"C2":return f("M134,172 L186,166")+f("M134,252 L186,246");case"C3":return f
