ksi.",ref:[ta(167),Z(585)]},{judul:"Komplikasi",isi:"Nonunion **0,1–13%** (85% di sepertiga tengah); untuk fraktur tengah yang bergeser total, nonunion **15%** nonoperatif vs **2%** operatif. Faktor risiko: pergeseran total, pemendekan > 2 cm, merokok, usia, energi tinggi, refraktur. Malunion dapat menurunkan skor DASH pada 1 tahun; penyempitan thoracic outlet dapat menjepit pleksus brakialis.",ref:[ta(168),Z(585)]}]},plat:{nama:{id:"Reduksi terbuka dan fiksasi plat",en:"Open reduction and plate fixation"},bab:[{judul:"Waktu operasi",isi:"Indikasi absolut dioperasi tanpa menunda. Untuk indikasi relatif, penundaan > 2–3 minggu mempersulit reduksi, terutama bila direncanakan teknik perkutan.",ref:Z(576)},{judul:"Posisi & pendekatan",isi:"Beach chair / setengah duduk, bantalan di bawah bahu untuk mengangkat klavikula; lengan boleh dibebaskan. Insisi transversal sepanjang sumbu klavikula (lebih ekstensibel) atau *saber-cut* sejajar garis Langer (lebih aman untuk n. supraklavikular, kosmetik lebih baik). Kulit–subkutis dimobilisasi sebagai satu lapisan dan lapisan miofasial diinsisi satu lapisan agar penutupan berlapis di atas plat.",ref:Z(578)},{judul:"Reduksi",isi:"Hindari pengupasan periosteum agresif terutama posterior dan inferior; pertahankan perlekatan jaringan lunak fragmen vertikal. Fragmen intermediet difiksasi sekrup mini/small sebagai **lag screw** sehingga fraktur menjadi simpel, lalu klem reduksi menyejajarkan fragmen proksimal–distal.",ref:Z(578)},{judul:"Implan & posisi plat",isi:"Plat kompresi 3.5, plat rekonstruksi, atau LCP prakontur anatomis. Posisi **superior** lebih kuat secara biomekanik (terutama bila ada kominusi inferior) dan lebih sederhana, tetapi berisiko menonjol dan membutuhkan bor hati-hati karena struktur neurovaskular di bawahnya (terutama sepertiga proksimal; sebagian memakai bor osilasi/retraktor tumpul). Posisi **anterior/anteroinferior**: lintasan bor lebih aman, kurang menonjol, mudah dikontur, sekrup lebih panjang. Dalam mode kompresi/proteksi: stabilitas absolut dengan **3 sekrup bikortikal** tiap sisi. Bila stabilitas absolut tak tercapai, pakai prinsip plat jembatan dengan panjang plat memadai — plat rekonstruksi tidak cukup kuat sebagai jembatan.",ref:[ta(167),Z(576),Z(578)]},{judul:"Penutupan",isi:"Cangkok tulang tidak diperlukan pada operasi primer. Tutup lapisan miofasial dengan baik di atas plat untuk menutupi implan dan melindungi dari infeksi.",ref:Z(578)},{judul:"Pascaoperasi",isi:"Sling dan latihan pendulum bahu dimulai; kontrol **2 minggu** untuk luka dan foto, lalu sling dilepas dan gerak bebas tanpa mengangkat beban. Bila ada tanda union pada **6 minggu**, mulai penguatan. Hindari olahraga kontak/ekstrem **3 bulan** pertama.",ref:Z(584)},{judul:"Komplikasi",isi:"Infeksi luka hingga **4,8%**; baal infraklavikular hingga **83%** (berkurang seiring waktu, tanpa kehilangan fungsi bermakna); implan menonjol/iritasi (lebih sedikit dengan plat anterior atau prakontur rendah); refraktur setelah pelepasan implan; nonunion **2%**; pembuluh subklavia berisiko pada plat superior. Pelepasan plat rutin dan dini tidak dianjurkan.",ref:[ta(168),Z(585)]}]},im:{nama:{id:"Fiksasi intramedular dengan nail elastis titanium",en:"Intramedullary fixation with a titanium elastic nail"},bab:[{judul:"Kelebihan & kekurangan",isi:"Insisi kecil, kosmesis lebih baik, diseksi jaringan lunak minimal, implan tidak menonjol. Kekurangan: iritasi/kerusakan kulit di titik masuk (sering perlu pelepasan), migrasi implan, dan tanpa penguncian statis sehingga panjang–rotasi tidak terkontrol → pemendekan sekunder pada multifragmentari. Karena itu **hanya untuk pola simpel** transversal/oblik. Pin berulir kaku generasi lama pernah bermigrasi ke rongga toraks; HoF mencatat komplikasi hingga **50%** pada implan intramedular lama.",ref:[ta(167),Z(576),Z(579)]},{judul:"Teknik",isi:"Antegrade dari titik masuk anteromedial fragmen medial, **1–2 cm** lateral sendi sternoklavikular: lubang bor 2,5 mm pada korteks anterior diperbesar dengan awl; nail elastis **2,0–3,5 mm** dimasukkan ke kanal medula dan dilewatkan menyeberangi fraktur di bawah pencitraan. Bila reduksi tertutup gagal atau kanal sempit, coba reduksi perkutan dengan klem runcing; bila masih gagal, insisi di atas fraktur untuk reduksi langsung — diperlukan pada sekitar **50%** kasus. Ujung nail dimajukan ke korteks distal fragmen lateral; ujung medial dipotong dan ditutup end cap.",ref:Z(579)},{judul:"Catatan keselamatan",isi:"Reduksi tertutup klavikula tidak selalu mudah; waspadai paparan radiasi berlebihan pada tangan operator.",ref:Z(579)}]},"plat-lateral":{nama:{id:"Plat lateral anatomis untuk fraktur ujung lateral",en:"Anatomical lateral plate for lateral-end fractures"},bab:[{judul:"Pendekatan",isi:"Beach chair; insisi berpusat pada ujung distal klavikula, diperpanjang 1 cm melewati sendi AC. Sendi AC dikenali dengan bantuan jarum setelah diseksi lapisan dalam.",ref:Z(580)},{judul:"Fiksasi",isi:"Fragmen lateral memerlukan minimal **3 sekrup bikortikal**; lag screw pada fraktur oblik. Plat locking lateral prakontur memungkinkan lebih banyak sekrup locking ke fragmen distal dan menghindari komplikasi hook plate. Jahitan/sling substitusi ligamen CC dapat ditambahkan bila area sekrup terbatas.",ref:[ta(167),Z(577),Z(581)]},{judul:"Pascaoperasi",isi:"Sama dengan plat diafisis: sling + pendulum, kontrol 2 minggu, penguatan setelah tanda union (6 minggu), tanpa olahraga kontak 3 bulan.",ref:Z(584)}]},hook:{nama:{id:"Hook plate",en:"Hook plate"},bab:[{judul:"Prinsip",isi:"Dipilih bila fragmen lateral terlalu kecil untuk sekrup. Ruang subakromial ditembus dengan gunting lengkung/klem, kait dimasukkan ke ruang subakromial **posterior** sendi AC, lalu plat direduksi ke permukaan superior klavikula; sekrup korteks dapat dipasang berurutan memakai plat sebagai pengungkit.",ref:Z(580)},{judul:"Konsekuensi",isi:"Implan paling efektif mempertahankan reduksi, tetapi **selalu** menimbulkan impingement subakromial yang nyeri dan membatasi gerak — pasien harus diberi tahu bahwa operasi kedua untuk melepas plat diperlukan setelah fraktur sembuh; fungsi bahu umumnya pulih baik setelah pelepasan.",ref:Z(581)}]},cc:{nama:{id:"Fiksasi korakoklavikular",en:"Coracoclavicular fixation"},bab:[{judul:"Pilihan teknik",isi:"Diturunkan dari terapi dislokasi AC: sekrup korakoklavikular (Bosworth), jahitan/tightrope, atau sling tendon/sintetik mengelilingi korakoid dan klavikula. Dapat menjadi tambahan fiksasi primer atau rekonstruksi utama. Hasil memuaskan tanpa konsensus metode terbaik; sebagian kehilangan reduksi dapat diharapkan.",ref:[ta(167),Z(577),Z(583)]}]},"reduksi-medial":{nama:{id:"Reduksi tertutup pergeseran posterior ujung medial",en:"Closed reduction of posterior medial-end displacement"},bab:[{judul:"Langkah",isi:"Reduksi tertutup **segera** dicoba dengan retraksi bahu ipsilateral. Bila gagal, klem tulang runcing perkutan atau towel clip untuk menarik ujung medial ke anterior. Bila tetap gagal: reduksi terbuka dan stabilisasi bersama bedah vaskular; bila tersedia radiologi intervensi, kateter balon dapat dipasang sebelum operasi untuk kontrol vaskular proksimal.",ref:Z(584)},{judul:"Mengapa gawat",isi:"Pergeseran posterior dapat menekan mediastinum superior: cedera vaskular, bahkan obstruksi trakea. Dislokasi/pergeseran anterior sebaliknya sering tidak stabil setelah reduksi dan dapat dibiarkan karena jarang mengganggu fungsi.",ref:Z(584)}]},"orif-medial":{nama:{id:"Stabilisasi terbuka fraktur ujung medial",en:"Open stabilization of medial-end fractures"},bab:[{judul:"Implan",isi:"Plat 3.5 konvensional atau locking bila fragmen medial cukup besar; plat klavikula lateral anatomis memungkinkan lebih banyak sekrup. Bila fragmen medial terlalu kecil atau pada dislokasi, plat difiksasi ke sternum menjembatani sendi.",ref:Z(584)},{judul:"Pencitraan",isi:"Diagnosis dengan foto polos sulit; tilt sefalad 40° (*serendipity view*) membandingkan dengan sisi normal; CT memberi gambaran terbaik.",ref:Z(584)}]}}}});var Sn={};Da(Sn,{default:()=>Zt});var C,Me,Zt,Tn=ma(()=>{C=a=>({buku:"HoF",bab:"12",hlm:a}),Me=a=>({buku:"AO",bab:"6.1.2",hlm:a}),Zt={id:"sendi-ac-sc",nama:{id:"Sendi akromioklavikular & sternoklavikular",en:"Acromioclavicular & sternoclavicular joints"},sumber:[{buku:"HoF",bab:"12",hlm:{awal:170,akhir:180}},{buku:"AO",bab:"6.1.2",hlm:{awal:581,akhir:583}}],gambar:"sendi-ac:utuh",intro:{id:"Dua sendi di ujung klavikula: AC dinilai dari arah dan derajat pergeseran klavikula distal (Rockwood I–VI); SC jarang, tetapi dislokasi posterior mengancam mediastinum.",en:"Two joints at the ends of the clavicle: AC injuries are graded by the direction and degree of distal clavicle displacement (Rockwood I–VI); SC injuries are rare, but posterior dislocation threatens the mediastinum."},pemeriksaan:{klinis:[{teks:"Sendi AC: periksa pasien berdiri/duduk dengan lengan menggantung agar deformitas tampak — bahu dan lengan turun, *step-off* di AC, kulit dapat *tenting* di atas klavikula distal; nyeri tekan di sendi.",ref:[C(171),C(172)]},{teks:"Sendi SC: pasien menopang lengan dengan tangan sebelahnya, kepala miring ke sisi cedera; bengkak dan nyeri tekan di medial klavikula.",ref:C(177)},{teks:"Dislokasi SC posterior: bendungan vena lengan, sesak, nyeri saat inspirasi, sulit menelan, rasa tercekik — auskultasi kedua paru; pleksus brakialis dan pembuluh besar tepat di belakang klavikula medial.",ref:C(177)}],radiologis:[{teks:"AC: seri trauma bahu (AP, skapular-Y, aksilar) biasanya cukup; **Zanca** (tilt sefalad 10–15°) memperjelas klavikula distal; foto stres dengan beban 10–15 lb di pergelangan membandingkan jarak korakoklavikular kedua sisi (sulit dalam keadaan akut).",ref:C(172)},{teks:"SC: asimetri klavikula pada foto toraks AP; **Hobbs** (lateral sefalokaudal 90°); **Serendipity** (tilt sefalad 40° ke manubrium): dislokasi anterior — klavikula medial di atas garis interklavikular, posterior — di bawahnya.",ref:[C(177),C(178)]},{teks:"CT adalah pemeriksaan terbaik untuk SC: membedakan fraktur klavikula medial dari dislokasi dan menangkap subluksasi ringan.",ref:C(178)}],mekanisme:[{teks:"AC — langsung (tersering): jatuh pada bahu dengan lengan aduksi, akromion terdorong ke medial-inferior. Tidak langsung: jatuh pada tangan terentang, gaya naik lewat kaput humerus ke AC — ligamen CC tidak teregang.",ref:C(171)},{teks:"Stabilitas horizontal AC oleh ligamen AC; stabilitas vertikal oleh ligamen korakoklavikular (konoid medial, trapezoid lateral); jarak CC normal 1,1–1,3 cm.",ref:C(170)},{teks:"SC — langsung: gaya pada klavikula anteromedial mendorongnya ke posterior (mediastinum). Tidak langsung: tekanan bahu dari anterolateral → dislokasi anterior; dari posterolateral → posterior (tumpukan pemain football).",ref:C(176)},{teks:"Fisis klavikula medial adalah fisis yang paling akhir menutup (osifikasi 20 tahun, fusi 25–30 tahun) — banyak 'dislokasi SC' pada pasien muda sebenarnya cedera fisis.",ref:C(175)}],epidemiologi:[{teks:"Dislokasi AC: **9–10%** cedera akut gelang bahu (AO: 12%); puncak dekade kedua, olahraga kontak; laki-laki ≈ 5:1.",ref:[C(170),Me(581)]},{teks:"SC jarang: dari 1.603 dislokasi gelang bahu hanya **3%** SC (85% glenohumeral, 12% AC); ≈ 80% akibat kecelakaan kendaraan (47%) atau olahraga (31%).",ref:C(175)},{teks:"Cedera penyerta AC: fraktur klavikula, akromion, korakoid; pneumotoraks/kontusio paru pada tipe VI.",ref:C(171)}]},klasifikasi:[{nama:"Rockwood (AC)",teks:"I sprain ligamen AC; II ligamen AC putus, CC teregang (klavikula sedikit naik, celah CC normal pada foto stres); III AC + CC putus, celah CC 25–100% lebih lebar; IV klavikula distal ke posterior ke dalam/menembus trapezius; V pergeseran superior > 100% (celah CC 100–300%); VI klavikula di bawah akromion atau korakoid.",ref:[C(172),C(173)]},{nama:"SC — anatomis",teks:"Anterior (lebih sering) dan posterior.",ref:C(178)},{nama:"SC — etiologis",teks:"Sprain/subluksasi (ringan: stabil; sedang: subluksasi, ligamen sebagian putus; berat: tidak stabil), dislokasi akut, rekuren (jarang), tak tereduksi, atraumatik (spontan, kongenital, osteoartritis, osteitis kondensans, hiperostosis, infeksi).",ref:C(178)}],kelompok:[{id:"ac",nama:{id:"Sendi akromioklavikular",en:"Acromioclavicular joint"},kode:"Rockwood",jenis:[{id:"ac-1",nama:{id:"Tipe I — sprain AC",en:"Type I — AC sprain"},kode:"I",gambar:"sendi-ac:tipe-1",ringkas:"Nyeri tekan sendi AC, nyeri minimal saat gerak, celah CC tak nyeri; foto normal.",ref:C(172),indikasi:"ac-12"},{id:"ac-2",nama:{id:"Tipe II — AC putus, CC teregang",en:"Type II — AC torn, CC sprained"},kode:"II",gambar:"sendi-ac:tipe-2",ringkas:"Klavikula distal sedikit di atas akromion dan dapat digoyang; sendi melebar, jarak CC pada foto stres sama dengan sisi sehat.",ref:C(172),indikasi:"ac-12"},{id:"ac-3",nama:{id:"Tipe III — AC + CC putus",en:"Type III — AC and CC torn"},kode:"III",gambar:"sendi-ac:tipe-3",ringkas:"Lengan turun, ujung klavikula dapat menegangkan kulit; klavikula distal di atas tepi medial akromion, celah CC 25–100% lebih lebar.",ref:C(172),indikasi:"ac-3"},{id:"ac-4",nama:{id:"Tipe IV — posterior",en:"Type IV — posterior"},kode:"IV",gambar:"sendi-ac:tipe-4",ringkas:"Klavikula distal menembus trapezius ke posterior; lebih nyeri daripada tipe III; dipastikan dengan foto aksilar atau CT.",ref:C(173),indikasi:"ac-456"},{id:"ac-5",nama:{id:"Tipe V — superior berat",en:"Type V — grossly superior"},kode:"V",gambar:"sendi-ac:tipe-5",ringkas:"Pergeseran superior > 100% dengan deltoid–trapezius terlepas; kulit *tenting*; celah CC 100–300%.",ref:C(173),indikasi:"ac-456"},{id:"ac-6",nama:{id:"Tipe VI — inferior",en:"Type VI — inferior"},kode:"VI",gambar:"sendi-ac:tipe-6",ringkas:"Klavikula di bawah akromion (subakromial) atau korakoid (subkorakoid), bahu tampak datar; trauma energi tinggi — fraktur klavikula/iga atas dan cedera pleksus sering menyertai.",ref:C(173),indikasi:"ac-456"}]},{id:"sc",nama:{id:"Sendi sternoklavikular",en:"Sternoclavicular joint"},kode:"",jenis:[{id:"sc-sprain",nama:{id:"Sprain / subluksasi SC",en:"SC sprain / subluxation"},kode:"",gambar:"sendi-sc:sprain",ringkas:"Ringan: sendi stabil; sedang: subluksasi dengan ligamen sebagian putus.",ref:C(178),indikasi:"sc-sprain"},{id:"sc-anterior",nama:{id:"Dislokasi SC anterior",en:"Anterior SC dislocation"},kode:"",gambar:"sendi-sc:anterior",ringkas:"Lebih sering; tonjolan klavikula medial; pada Serendipity klavikula berada di atas garis interklavikular.",ref:[C(178)],indikasi:"sc-anterior"},{id:"sc-posterior",nama:{id:"Dislokasi SC posterior",en:"Posterior SC dislocation"},kode:"",gambar:"sendi-sc:posterior",ringkas:"Klavikula medial di belakang manubrium menekan trakea, esofagus, dan pembuluh besar — keluhan napas/menelan harus dicari; komplikasi hingga **25%**.",ref:[C(177),C(180)],indikasi:"sc-posterior"},{id:"sc-fisis",nama:{id:"Cedera fisis klavikula medial",en:"Medial clavicular physeal injury"},kode:"< 25 tahun",gambar:"sendi-sc:fisis",ringkas:"Pada pasien muda, 'dislokasi' sering adalah separasi fisis karena fisis medial baru menyatu pada usia 25–30 tahun; CT membedakannya.",ref:[C(175),C(178)],indikasi:"sc-fisis"}]}],indikasi:{"ac-12":{intro:"Tipe I–II: nonoperatif. Lebih dari separuh pasien tipe I–II masih bergejala pada tindak lanjut jangka panjang.",ref:C(174),opsi:[{id:"sling",nama:{id:"Istirahat, es, sling → gerak dini",en:"Rest, ice, sling → early motion"},gambar:"sling",utama:["Tipe I: istirahat 7–10 hari, aktivitas penuh setelah gerak bebas nyeri (± 2 minggu)","Tipe II: sling 1–2 minggu, gerak lembut secepatnya, tanpa aktivitas berat 6 minggu"],ref:C(174),tatalaksana:"ac-nonop"}]},"ac-3":{intro:"Tipe III adalah wilayah kontroversi: nonoperatif untuk sebagian besar — literatur terkini (AO) bahkan mengunggulkan nonoperatif pada dewasa muda aktif, yang menyisakan deformitas kosmetik tetapi fungsi baik; stabilisasi operatif dipertimbangkan pada pergeseran berat atau pekerja di atas kepala.",ref:[C(175),Me(581),Me(583)],opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling, gerak dini, penguatan",en:"Nonoperative — sling, early motion, strengthening"},gambar:"sling",utama:["Pasien tidak aktif, bukan pekerja berat, atlet rekreasional — terutama lengan nondominan","Menerima deformitas","Atlet kontak: perbaikan umumnya dihindari (risiko cedera ulang)"],ref:C(175),tatalaksana:"ac-nonop"},{id:"cc",nama:{id:"Stabilisasi operatif (rekonstruksi CC)",en:"Operative stabilization (CC reconstruction)"},gambar:"sendi-ac:cc-rekonstruksi",utama:["Muda, aktif, pergeseran lebih berat","Pekerja yang memakai lengan di atas bidang horizontal"],ref:C(175),tatalaksana:"ac-op"}]},"ac-456":{intro:"Tipe IV–VI umumnya direduksi terbuka dan ligamen korakoklavikular diperbaiki/direkonstruksi untuk stabilitas vertikal — meski tanpa bukti level 1.",ref:C(175),opsi:[{id:"orif",nama:{id:"Reduksi terbuka + perbaikan/rekonstruksi CC",en:"Open reduction + CC repair/reconstruction"},gambar:"sendi-ac:orif",utama:["Tipe IV (posterior), V (superior berat), VI (inferior)","Sekrup CC Bosworth ± perbaikan ligamen; tightrope/anchor artroskopik; sling tendon/sintetik mengitari korakoid"],ref:[C(175),Me(583)],tatalaksana:"ac-op"},{id:"hook",nama:{id:"Hook plate",en:"Hook plate"},gambar:"sendi-ac:hook-plate",utama:["Seperti pada fraktur klavikula lateral: menahan reduksi vertikal sampai ligamen sembuh","Perlu dilepas kemudian"],ref:Me(583),tatalaksana:"ac-op"}]},"sc-sprain":{intro:"Sprain dan subluksasi SC ditangani nonoperatif dengan es, imobilisasi singkat, dan kembali bertahap ke aktivitas.",ref:C(178),opsi:[{id:"nonop",nama:{id:"Es + sling (ringan) / strap klavikula (sedang)",en:"Ice + sling (mild) / clavicle strap (moderate)"},gambar:"angka-delapan",utama:["Ringan: es 24 jam, sling 3–4 hari","Sedang: strap klavikula, sling-and-swathe, atau perban angka-delapan 1 minggu, lalu sling 4–6 minggu"],ref:[C(178),C(179)],tatalaksana:"sc-nonop"}]},"sc-anterior":{intro:"Dislokasi anterior biasanya tidak stabil setelah direduksi, sehingga upaya reduksi tertutup pun kontroversial; sling untuk kenyamanan diterima.",ref:C(179),opsi:[{id:"sling",nama:{id:"Sling untuk kenyamanan (menerima deformitas)",en:"Sling for comfort (accept deformity)"},gambar:"sling",utama:["Reduksi umumnya tidak stabil","Tonjolan medial yang tersisa adalah keluhan kosmetik tersering"],ref:[C(179),C(180)],tatalaksana:"sc-nonop"},{id:"reduksi",nama:{id:"Reduksi tertutup (tekanan posterior)",en:"Closed reduction (posterior pressure)"},gambar:"sendi-sc:reduksi-anterior",utama:["Anestesi umum atau narkotik + relaksan","Telentang, gulungan di antara skapula; tekan klavikula medial ke posterior","Lalu strap/sling-and-swathe/angka-delapan 4–6 minggu"],ref:C(179),tatalaksana:"sc-reduksi"}]},"sc-posterior":{intro:"Dislokasi posterior memerlukan reduksi segera — tertutup atau terbuka — di bawah anestesi umum, setelah masalah paru dan neurovaskular disingkirkan, dengan ahli bedah toraks siaga.",ref:[C(179),C(180)],opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup — traksi abduksi-ekstensi ± towel clip",en:"Closed reduction — abduction-extension traction ± towel clip"},gambar:"sendi-sc:reduksi-posterior",utama:["Sering berhasil dan tetap stabil","Telentang, gulungan di antara skapula; traksi lengan abduksi-ekstensi; towel clip menarik klavikula ke anterior bila perlu"],ref:[C(179),C(180)],tatalaksana:"sc-reduksi"},{id:"op",nama:{id:"Reduksi terbuka / fiksasi jaringan lunak",en:"Open reduction / soft-tissue fixation"},gambar:"sendi-sc:fiksasi-jahit",utama:["Gagal reduksi tertutup atau tidak stabil","Fiksasi ke sternum dengan fasia lata, tendon subklavius, atau jahitan; osteotomi atau reseksi klavikula medial","K-wire/pin Steinmann dihindari — migrasi"],ref:C(180),tatalaksana:"sc-op"}]},"sc-fisis":{intro:"Cedera fisis medial biasanya berhasil direduksi tertutup dan sembuh dengan imobilisasi 4–6 minggu.",ref:C(180),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup + strap 4–6 minggu",en:"Closed reduction + strap 4–6 weeks"},gambar:"sendi-sc:reduksi-anterior",utama:["Strap klavikula, sling-and-swathe, atau perban angka-delapan setelah reduksi"],ref:C(180),tatalaksana:"sc-reduksi"}]}},tatalaksana:{"ac-nonop":{nama:{id:"Nonoperatif sendi AC",en:"Nonoperative AC treatment"},bab:[{judul:"Tipe I",isi:"Istirahat 7–10 hari, kompres es, sling. Aktivitas penuh ditunda sampai gerak penuh tanpa nyeri (sekitar 2 minggu).",ref:C(174)},{judul:"Tipe II",isi:"Sling 1–2 minggu, gerak lembut secepat mungkin; hindari aktivitas berat 6 minggu. Lebih dari 50% pasien tipe I–II masih bergejala pada tindak lanjut jangka panjang.",ref:C(174)},{judul:"Tipe III nonoperatif",isi:"Sling, gerak dini, penguatan, dan menerima deformitas — pilihan untuk pasien tidak aktif, bukan pekerja berat, atlet rekreasional, terutama lengan nondominan.",ref:C(175)},{judul:"Komplikasi",isi:"Osifikasi korakoklavikular (tanpa tambahan disabilitas), osteolisis klavikula distal (nyeri tumpul kronis dan lemah), artritis AC.",ref:C(175)}]},"ac-op":{nama:{id:"Stabilisasi operatif sendi AC",en:"Operative AC stabilization"},bab:[{judul:"Siapa",isi:"Tipe III pada pasien muda-aktif dengan pergeseran berat dan pekerja di atas kepala; tipe IV–VI pada umumnya. Perbaikan dihindari pada atlet kontak karena risiko cedera ulang.",ref:C(175)},{judul:"Apa yang dilakukan",isi:"Reduksi terbuka, lalu perbaikan atau rekonstruksi ligamen korakoklavikular untuk mengembalikan stabilitas vertikal; perlekatan deltoid–trapezius yang terlepas dijahit kembali. Belum ada bukti level 1 untuk pilihan ini.",ref:C(175)},{judul:"Teknik (AO)",isi:"Sekrup korakoklavikular Bosworth ± perbaikan ligamen primer; hook plate seperti pada fraktur klavikula lateral; stabilisasi artroskopik/mini-open dengan *tightrope* atau *suture anchor*; augmentasi ligamen CC dengan sling sintetik atau tendon (hamstring) yang dilingkarkan pada korakoid dan klavikula. Hasil memuaskan tanpa konsensus metode terbaik; sebagian kehilangan reduksi lazim.",ref:Me(583)}]},"sc-nonop":{nama:{id:"Nonoperatif sendi SC",en:"Nonoperative SC treatment"},bab:[{judul:"Sprain ringan",isi:"Es pada 24 jam pertama, sling 3–4 hari, kembali ke aktivitas bertahap sesuai toleransi.",ref:C(178)},{judul:"Sprain sedang / subluksasi",isi:"Es 24 jam pertama; strap klavikula, sling-and-swathe, atau perban angka-delapan selama 1 minggu, lalu sling 4–6 minggu.",ref:[C(178),C(179)]},{judul:"Dislokasi anterior tanpa reduksi",isi:"Karena reduksi umumnya tidak stabil, sling untuk kenyamanan dapat diterima; keluhan tersisa biasanya kosmetik (tonjolan medial).",ref:[C(179),C(180)]}]},"sc-reduksi":{nama:{id:"Reduksi tertutup sendi SC",en:"Closed reduction of the SC joint"},bab:[{judul:"Persiapan",isi:"Anestesi umum (atau narkotik + relaksan otot pada pasien tabah). Pasien telentang dengan gulungan di antara kedua skapula. Pada dislokasi posterior, singkirkan dulu masalah paru dan neurovaskular dan pastikan ahli bedah umum/toraks tersedia.",ref:[C(179),C(180)]},{judul:"Anterior",isi:"Tekanan langsung ke posterior pada klavikula medial biasanya mereduksi, tetapi sering tidak stabil. Pascareduksi: strap klavikula, sling-and-swathe, atau perban angka-delapan 4–6 minggu; sebagian memakai balutan anterior tebal dengan plester elastis.",ref:C(179)},{judul:"Posterior",isi:"Traksi lengan dalam abduksi dan ekstensi; bila perlu klavikula ditarik ke anterior dengan towel clip (ujung medial disiapkan steril). Reduksi tertutup sering berhasil dan tetap stabil; imobilisasi 4–6 minggu.",ref:[C(179),C(180)]},{judul:"Cedera fisis medial",isi:"Reduksi tertutup biasanya berhasil; strap klavikula, sling-and-swathe, atau perban angka-delapan 4–6 minggu.",ref:C(180)},{judul:"Komplikasi dislokasi posterior",isi:"Hingga 25%: pneumotoraks, laserasi vena kava superior, bendungan vena leher, ruptur esofagus, kompresi arteri subklavia atau karotis, perubahan suara.",ref:C(180)}]},"sc-op":{nama:{id:"Tatalaksana operatif sendi SC",en:"Operative SC treatment"},bab:[{judul:"Pilihan",isi:"Fiksasi klavikula medial ke sternum dengan fasia lata, tendon subklavius, atau jahitan; osteotomi klavikula medial; atau reseksi klavikula medial.",ref:C(180)},{judul:"Yang dihindari",isi:"K-wire atau pin Steinmann tidak dianjurkan karena implan dapat bermigrasi ke mediastinum.",ref:C(180)}]}}}});var Pn={};Da(Pn,{default:()=>Gt});var x,H,Gt,Fn=ma(()=>{x=a=>({buku:"HoF",bab:"13",hlm:a}),H=a=>({buku:"AO",bab:"6.1.1",hlm:a}),Gt={id:"skapula",nama:{id:"Skapula",en:"Scapula"},sumber:[{buku:"HoF",bab:"13",hlm:{awal:181,akhir:190}},{buku:"AO",bab:"6.1.1",hlm:{awal:565,akhir:572}}],gambar:"skapula:utuh",intro:{id:"Tulang pipih yang terlindung otot: patah berarti energi tinggi — cari cedera dada, pleksus, dan tulang belakang dulu. Sebagian besar ekstraartikular dan sembuh dengan sling; operasi untuk glenoid yang bergeser, leher yang miring, dan cincin suspensori yang putus dua kali.",en:"A flat bone shielded by muscle: a fracture means high energy — look for chest, plexus and spine injuries first. Most are extra-articular and heal in a sling; surgery is for displaced glenoid, angulated neck and a doubly disrupted suspensory ring."},pemeriksaan:{klinis:[{teks:"Evaluasi trauma lengkap (ABCDE) lebih dulu; pasien menopang lengan dalam aduksi dengan tangan sebelahnya, nyeri terutama pada abduksi bahu.",ref:x(182)},{teks:"Sindrom kompartemen di atas skapula jarang tetapi harus disingkirkan bila nyeri tak sebanding; **tanda Comolli** — bengkak segitiga di toraks posterior — menandakan hematoma dengan tekanan meningkat.",ref:x(182)},{teks:"Gejala klinis tidak spesifik dan sering tertutup cedera lain; fraktur leher mengancam **n. supraskapular** di takik skapula — curiga lesi n. supraskapular atau aksilaris dibuktikan dengan EMG.",ref:H(565)}],radiologis:[{teks:"Sering pertama kali terlihat pada foto toraks. Seri trauma bahu: AP sejati, aksilar, skapular-Y (lateral sejati) — menampilkan sebagian besar fraktur glenoid, leher, badan, dan akromion; aksilar memperjelas akromion dan tepi glenoid.",ref:x(182)},{teks:"Jangan keliru dengan **os acromiale** (apofisis tak menyatu, bulat; ≈ 3% populasi, bilateral 60%). **Stryker notch** (tilt sefalad 45°) untuk korakoid; CT untuk glenoid intraartikular; foto toraks wajib karena cedera toraks sering.",ref:x(182)},{teks:"AO: keterlibatan glenoid memerlukan CT (jumlah/ukuran fragmen, pergeseran artikular); rekonstruksi 3-D kian dipakai untuk perencanaan; klavikula selalu dinilai karena fraktur penyerta sering.",ref:H(565)}],mekanisme:[{teks:"Hampir selalu energi tinggi: kecelakaan mobil ≈ 50%, sepeda motor 11–25%. Tidak langsung (beban aksial lengan terentang) → leher/glenoid; langsung (pukulan/jatuh) → badan; benturan ujung bahu → akromion/korakoid; dislokasi bahu → glenoid; tarikan otot/ligamen → avulsi.",ref:x(181)},{teks:"Fraktur terisolasi biasanya pukulan langsung ke punggung dengan pola stelata; fraktur tepi glenoid anterior/posterior umumnya akibat dislokasi/subluksasi glenohumeral (*bony Bankart*) — fokus terapinya stabilitas sendi.",ref:H(565)}],epidemiologi:[{teks:"**3–5%** fraktur bahu dan 0,4–1% semua fraktur; usia rerata 35–45 tahun.",ref:x(181)},{teks:"Cedera penyerta pada 35–98%: iga/klavikula/sternum ipsilateral; pneumotoraks **11–55%**; kontusio paru 11–54%; pleksus brakialis dan avulsi vaskular; tulang belakang (servikal bawah 20%, torakal 76%, lumbal 4%). Fraktur klavikula menyertai 25% (AO).",ref:[x(181),H(565)]}]},klasifikasi:[{nama:"Zdravkovic–Damholt (anatomis)",teks:"I badan; II apofisis (akromion, korakoid); III sudut superolateral (leher dan glenoid).",ref:x(182)},{nama:"Ideberg (glenoid intraartikular)",teks:"I avulsi tepi anterior; IIA transversal / IIB oblik keluar inferior; III oblik keluar superior (sering dengan cedera AC); IV transversal keluar tepi medial; V kombinasi II + IV; VI kominutif (Goss). Bersifat historis — keputusan berdasarkan pergeseran komponen artikular.",ref:x(183)},{nama:"Akromion",teks:"I pergeseran minimal (IA avulsi, IB fraktur komplet); II bergeser tanpa menyempitkan ruang subakromial; III bergeser dengan penyempitan ruang subakromial.",ref:x(184)},{nama:"Korakoid",teks:"I proksimal terhadap ligamen korakoklavikular; II distal terhadapnya.",ref:x(185)},{nama:"AO/OTA 14",teks:"Tulang 14: prosesus (14A), badan (14B), fossa glenoid (14F).",ref:H(566)},{nama:"Disosiasi skapulotorakal",teks:"I muskuloskeletal saja; IIA + vaskular; IIB + neurologis; III + keduanya.",ref:x(189)}],kelompok:[{id:"badan-leher",nama:{id:"Badan & leher",en:"Body and neck"},kode:"Zdravkovic I & III",jenis:[{id:"badan",nama:{id:"Badan skapula",en:"Scapular body"},kode:"14B",gambar:"skapula:badan",ringkas:"Pola stelata akibat pukulan langsung; hampir selalu menyatu tanpa operasi, malunion umumnya ditoleransi.",ref:[x(188),H(565)],indikasi:"badan"},{id:"leher",nama:{id:"Leher skapula (glenoid)",en:"Scapular neck"},kode:"",gambar:"skapula:leher",ringkas:"Fragmen glenoid bergeser ke medial dan berotasi (permukaan sendi menghadap kaudal) — memperpendek lengan kerja rotator cuff.",ref:H(569),indikasi:"leher"},{id:"floating",nama:{id:"Floating shoulder (leher + klavikula)",en:"Floating shoulder"},kode:"SSSC ×2",gambar:"skapula:floating",ringkas:"Dua putusan pada cincin suspensori bahu superior (glenoid–korakoid–lig. CC–klavikula distal–AC–akromion); glenoid dapat jatuh ke kaudal.",ref:[x(187),H(570)],indikasi:"floating"}]},{id:"glenoid",nama:{id:"Glenoid (Ideberg)",en:"Glenoid (Ideberg)"},kode:"14F",jenis:[{id:"glenoid-1",nama:{id:"I — avulsi tepi anterior",en:"I — anterior rim avulsion"},kode:"Ideberg I",gambar:"skapula:glenoid-1",ringkas:"Bony Bankart: fragmen tepi dengan labrum; penting untuk stabilitas sendi meski kecil.",ref:[x(183),H(569)],indikasi:"glenoid-1"},{id:"glenoid-2",nama:{id:"II — keluar inferior",en:"II — exiting inferiorly"},kode:"Ideberg IIA/IIB",gambar:"skapula:glenoid-2",ringkas:"Transversal (A) atau oblik (B) melalui fossa keluar di inferior; dapat menyebabkan subluksasi inferior kaput humerus.",ref:[x(183),x(186)],indikasi:"glenoid-2"},{id:"glenoid-3",nama:{id:"III — keluar superior",en:"III — exiting superiorly"},kode:"Ideberg III",gambar:"skapula:glenoid-3",ringkas:"Oblik keluar di superior, sering disertai cedera sendi AC; reduksinya sulit.",ref:[x(183),x(186)],indikasi:"glenoid-3"},{id:"glenoid-4",nama:{id:"IV — keluar tepi medial",en:"IV — exiting medial border"},kode:"Ideberg IV",gambar:"skapula:glenoid-4",ringkas:"Transversal menembus badan sampai tepi medial.",ref:x(183),indikasi:"glenoid-4"},{id:"glenoid-56",nama:{id:"V–VI — kombinasi / kominutif",en:"V–VI — combined / comminuted"},kode:"Ideberg V, VI",gambar:"skapula:glenoid-6",ringkas:"V: pola II + IV; VI: glenoid kominutif.",ref:x(183),indikasi:"glenoid-56"}]},{id:"apofisis",nama:{id:"Akromion & korakoid",en:"Acromion and coracoid"},kode:"14A",jenis:[{id:"akromion",nama:{id:"Akromion",en:"Acromion"},kode:"I–III",gambar:"skapula:akromion",ringkas:"Tipe III menyempitkan ruang subakromial → impingement; singkirkan os acromiale dan robekan rotator cuff penyerta.",ref:[x(184),x(186)],indikasi:"akromion"},{id:"korakoid",nama:{id:"Korakoid",en:"Coracoid"},kode:"I–II",gambar:"skapula:korakoid-1",ringkas:"Tipe I proksimal ligamen CC (fragmen ikut klavikula bila AC terdislokasi), tipe II distal (ligamen tetap utuh).",ref:[x(185),H(568)],indikasi:"korakoid"}]},{id:"khusus",nama:{id:"Situasi khusus",en:"Special situations"},kode:"",jenis:[{id:"skapulotorakal",nama:{id:"Disosiasi skapulotorakal",en:"Scapulothoracic dissociation"},kode:"",gambar:"skapula:skapulotorakal",ringkas:"Amputasi forequarter subkutan: skapula lepas dari dinding dada; pleksopati komplet 80%, cedera a. subklavia/aksilaris 88%; lengan tak berdenyut dengan bengkak masif.",ref:x(189),indikasi:"skapulotorakal"},{id:"intratorakal",nama:{id:"Dislokasi intratorakal skapula",en:"Intrathoracic scapular dislocation"},kode:"sangat jarang",gambar:"skapula:intratorakal",ringkas:"Sudut inferior terkunci di ruang interkostal; dipastikan dengan CT toraks.",ref:x(190),indikasi:"intratorakal"}]}],indikasi:{badan:{intro:"Fiksasi badan skapula jarang diindikasikan; nonoperatif hampir selalu efektif. AO menyebut pergeseran 100% atau angulasi > 45° sebagai indikasi relatif.",ref:[x(186),H(566)],opsi:[{id:"nonop",nama:{id:"Sling + gerak dini",en:"Sling + early motion"},gambar:"sling",utama:["Hampir semua fraktur badan","Pasien tua/sedenter dengan komorbiditas (AO)"],ref:[x(186),H(566)],tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF badan (plat rekonstruksi via Judet)",en:"Body ORIF (reconstruction plate via Judet)"},gambar:"skapula:plat-leher",utama:["Eksplorasi neurovaskular diperlukan (HoF)","Pergeseran 100% atau angulasi > 45° pada pasien muda-aktif (AO)"],ref:[x(186),H(566)],tatalaksana:"orif-badan-leher"}]},leher:{intro:"Leher biasanya simtomatik dengan gerak dini; operasi bila angulasi > 40°, translasi medial > 1 cm (HoF) / > 2 cm (AO), sudut glenopolar < 22°, atau bersama fraktur klavikula bergeser.",ref:[x(186),H(566)],opsi:[{id:"nonop",nama:{id:"Simtomatik + gerak dini",en:"Symptomatic + early range of motion"},gambar:"sling",utama:["Pergeseran dan angulasi di bawah ambang","Sudut glenopolar masih > 20–30°"],ref:[x(186),x(187)],tatalaksana:"nonop"},{id:"plat",nama:{id:"ORIF plat rekonstruksi 3.5 di tepi lateral",en:"ORIF reconstruction plate 3.5 on the lateral margin"},gambar:"skapula:plat-leher",utama:["Pemendekan > 1 cm / rotasi > 40° (AO) · angulasi > 40° / translasi medial 1 cm (HoF)","Pendekatan posterior"],ref:[x(186),H(569)],tatalaksana:"orif-badan-leher"}]},floating:{intro:"Secara historis dioperasi karena glenoid dapat miring dan memendek; seri nonoperatif terbaru memberi hasil baik — sudut glenopolar < 30° (HoF) dan pergeseran medial > 2 cm (AO) mengarah ke operasi.",ref:[x(187),H(570)],opsi:[{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Pergeseran minimal (< 5 mm) — Edwards dkk.","Tanpa dislokasi kaudal glenoid: cedera ini tidak inheren tidak stabil (van Noort dkk.)"],ref:H(570),tatalaksana:"nonop"},{id:"klavikula",nama:{id:"Fiksasi klavikula (± leher glenoid)",en:"Clavicle fixation (± glenoid neck)"},gambar:"skapula:fiksasi-klavikula",utama:["Fiksasi klavikula umumnya cukup menstabilkan leher glenoid (HoF)","Pergeseran medial dengan pemendekan > 2 cm (AO)"],ref:[x(186),H(570)],tatalaksana:"orif-badan-leher"}]},"glenoid-1":{intro:"Fragmen tepi anteroinferior yang bergeser harus dioperasi untuk memulihkan permukaan sendi dan mencegah instabilitas berulang — bahkan bila kecil (AO).",ref:H(569),opsi:[{id:"orif",nama:{id:"ORIF sekrup lag via deltopektoral",en:"Lag-screw ORIF via deltopectoral"},gambar:"skapula:orif-glenoid",utama:["Instabilitas sendi atau fragmen > ¼ fossa (HoF)","Sekrup lag 3.5/2.7 dari luar kapsul, cukup panjang ke korteks posterior leher"],ref:[x(186),H(569)],tatalaksana:"orif-glenoid"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Fragmen kecil tanpa instabilitas","Kaput humerus tetap di tengah glenoid"],ref:[x(186),H(569)],tatalaksana:"nonop"}]},"glenoid-2":{intro:"Subluksasi inferior kaput humerus dapat terjadi — reduksi terbuka terutama bila *step-off* artikular > 5 mm.",ref:x(186),opsi:[{id:"orif",nama:{id:"Reduksi terbuka (anterior) + sekrup lag",en:"Open reduction (anterior) + lag screws"},gambar:"skapula:orif-glenoid",utama:["Step-off > 5 mm atau subluksasi inferior","Pendekatan anterior umumnya cukup"],ref:[x(186),H(569)],tatalaksana:"orif-glenoid"},{id:"nonop",nama:{id:"Nonoperatif + gerak dini",en:"Nonoperative + early motion"},gambar:"sling",utama:["Kaput tetap terpusat di fossa (Ideberg)"],ref:H(569),tatalaksana:"nonop"}]},"glenoid-3":{intro:"Reduksi sering sulit: perlu paparan superior untuk sekrup superior→inferior, pengangkatan sebagian klavikula atau reseksi klavikula distal selain pendekatan anterior; cincin suspensori mungkin perlu distabilkan.",ref:x(186),opsi:[{id:"orif",nama:{id:"ORIF via pendekatan superior ± anterior",en:"ORIF via superior ± anterior approach"},gambar:"skapula:orif-glenoid",utama:["Pergeseran artikular bermakna","Stabilisasi SSSC tambahan bila perlu"],ref:[x(186),H(567)],tatalaksana:"orif-glenoid"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Pergeseran minimal, kaput terpusat"],ref:H(569),tatalaksana:"nonop"}]},"glenoid-4":{intro:"Pertimbangkan reduksi terbuka untuk fraktur bergeser, terutama bila fragmen glenoid superior bergeser ke lateral.",ref:x(186),opsi:[{id:"orif",nama:{id:"Reduksi terbuka (posterior/superior)",en:"Open reduction (posterior/superior)"},gambar:"skapula:orif-glenoid",utama:["Fragmen superior bergeser lateral","Pergeseran artikular ≥ 5 mm (AO)"],ref:[x(186),H(566)],tatalaksana:"orif-glenoid"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Tidak bergeser"],ref:x(186),tatalaksana:"nonop"}]},"glenoid-56":{intro:"Operasi belum tentu memberi fungsi lebih baik daripada nonoperatif dengan gerak dini — dipertimbangkan bila step-off artikular > 5 mm.",ref:x(186),opsi:[{id:"nonop",nama:{id:"Nonoperatif + gerak dini",en:"Nonoperative + early motion"},gambar:"sling",utama:["Step-off < 5 mm","Pasien tua/sedenter"],ref:[x(186),H(566)],tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF — pulihkan permukaan sendi saja",en:"ORIF — restore the joint surface only"},gambar:"skapula:orif-glenoid",utama:["Step-off > 5 mm","Pada kominusi badan + glenoid: cukup rekonstruksi artikular dan sejajarkan ke tepi lateral; fragmen badan dibiarkan (AO)"],ref:[x(186),H(569)],tatalaksana:"orif-glenoid"}]},akromion:{intro:"Singkirkan dulu os acromiale dan robekan rotator cuff. Fraktur bergeser yang menyempitkan ruang subakromial difiksasi agar tidak impingement.",ref:[x(186),H(569)],opsi:[{id:"nonop",nama:{id:"Sling + gerak dini",en:"Sling + early motion"},gambar:"sling",utama:["Tipe I–II (ruang subakromial tidak menyempit)"],ref:[x(184),H(568)],tatalaksana:"nonop"},{id:"tb",nama:{id:"Tension band dorsal / sekrup lag 2.7",en:"Dorsal tension band / 2.7 lag screws"},gambar:"skapula:tension-band-akromion",utama:["Tipe III — impingement subakromial","Pendekatan superior"],ref:[x(186),H(569)],tatalaksana:"orif-prosesus"}]},korakoid:{intro:"Fraktur korakoid sentral (ligamen CC utuh) ikut bergeser bersama klavikula bila AC terdislokasi — maka kedua cedera difiksasi; perifer nonoperatif kecuali fragmen kehilangan kontak.",ref:[x(186),H(568),H(569)],opsi:[{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Tidak bergeser","Perifer tanpa kehilangan kontak (tarikan korakobrakialis)"],ref:[H(568),H(569)],tatalaksana:"nonop"},{id:"orif",nama:{id:"Sekrup lag 3.5 + stabilisasi AC",en:"3.5 lag screw + AC stabilization"},gambar:"skapula:orif-korakoid",utama:["Separasi AC derajat III + korakoid bergeser nyata (HoF)","Fraktur sentral dengan dislokasi AC (AO)"],ref:[x(186),x(187),H(568)],tatalaksana:"orif-prosesus"}]},skapulotorakal:{intro:"Cedera mengancam nyawa: pasien sering politrauma — ATLS, angiografi dan perbaikan vaskular, eksplorasi pleksus, stabilisasi tulang.",ref:x(189),opsi:[{id:"awal",nama:{id:"Tatalaksana awal & lanjutan",en:"Initial and later management"},gambar:"skapula:skapulotorakal",utama:["Angiografi → perbaikan vaskular; eksplorasi pleksus brakialis","EMG 3 minggu, mielografi/MRI 6 minggu; amputasi atas siku primer bila pleksus hancur"],ref:[x(189),x(190)],tatalaksana:"skapulotorakal"}]},intratorakal:{intro:"Reduksi tertutup lalu sling-and-swathe 2 minggu, dilanjutkan pemakaian fungsional bertahap.",ref:x(190),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup + sling-and-swathe",en:"Closed reduction + sling and swathe"},gambar:"skapula:intratorakal",utama:["Dipastikan dengan CT toraks","Imobilisasi 2 minggu"],ref:x(190),tatalaksana:"nonop"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif",en:"Nonoperative treatment"},bab:[{judul:"Siapa",isi:"Sebagian besar fraktur skapula ekstraartikular: sling dan gerak bahu dini. Pasien tua, sedenter, atau dengan komorbiditas sebaiknya nonoperatif — indikasi operasi relatif dan diputuskan per pasien.",ref:[x(186),H(566)]},{judul:"Khusus",isi:"Leher glenoid: simtomatik dengan latihan gerak dini. Glenoid bergeser: Ideberg masih menganjurkan nonoperatif selama kaput humerus tetap terpusat di fossa. Dislokasi intratorakal: reduksi tertutup, sling-and-swathe 2 minggu, lalu pemakaian fungsional bertahap.",ref:[x(186),x(190),H(569)]},{judul:"Prognosis",isi:"Hasil Constant baik tetapi menurun pada sudut glenopolar rendah (terutama < 20°); hasil buruk 6–15% pada fraktur bergeser berat; ISS tinggi dan fraktur iga memperburuk fungsi. Malunion badan umumnya ditoleransi (krepitus skapulotorakal); nonunion sangat jarang.",ref:[x(188),H(572)]}]},"orif-glenoid":{nama:{id:"ORIF glenoid",en:"Glenoid ORIF"},bab:[{judul:"Indikasi",isi:"Fragmen tepi (anterior, inferior, posterior) dengan instabilitas sendi; pergeseran intraartikular ≥ 5 mm yang melibatkan > 25% permukaan sendi; HoF: > 25% permukaan ± subluksasi. Fraktur Bankart yang bergeser dioperasi walau kecil demi stabilitas.",ref:[x(186),H(566),H(569)]},{judul:"Pendekatan",isi:"Deltopektoral untuk tepi anterior/inferior dan korakoid — subskapularis direfleksi, artrotomi anterior, kaput disubluksasi ke posterior; kapsul ditutup anatomis dan tendon dijahit cermat. Superior untuk fragmen glenoid superior (insisi koronal antara klavikula dan spina, trapezius dibelah, takik skapula dikenali untuk melindungi n. supraskapular). Posterior (Judet atau versi sederhana lewat interval infraspinatus–teres minor) untuk tepi posterior, leher, dan badan.",ref:[x(188),H(567),H(568)]},{judul:"Fiksasi",isi:"Sekrup lag 3.5 atau 2.7 dari luar kapsul (tepi: sekrup kanselus 4.0 berulir sebagian), ditambah washer jaringan lunak; tulang lunak → sekrup cukup panjang ke korteks posterior leher. Pada kominusi badan + glenoid, cukup pulihkan permukaan sendi dan sejajarkan glenoid ke tepi lateral; fragmen badan tidak disentuh.",ref:[H(566),H(569)]},{judul:"Pascaoperasi",isi:"Tepi anterior: sling rotasi internal 2 minggu lalu gerak bertahap, rotasi eksternal penuh setelah union (6–8 minggu). Tepi posterior: bidai rotasi eksternal (*gunslinger*) 2–4 minggu. Penguatan setelah union, ± 6 minggu.",ref:H(570)},{judul:"Komplikasi",isi:"Kekakuan (terutama rotasi internal) tersering — 9 dari 234 kasus operatif; infeksi dalam jarang (0/84, 0/234); hematoma ruang periskapular; palsi n. supraskapular (terjepit fraktur atau cedera saat pendekatan) → atrofi supraspinatus/infraspinatus.",ref:H(570)}]},"orif-badan-leher":{nama:{id:"ORIF badan, leher, dan floating shoulder",en:"ORIF of body, neck and floating shoulder"},bab:[{judul:"Leher",isi:"Fragmen glenoid bergeser medial dan berotasi (sendi menghadap kaudal) memendekkan lengan kerja rotator cuff; pemendekan > 1 cm dan rotasi > 40° menjadi indikasi ORIF — plat rekonstruksi 3.5 di tepi lateral lewat pendekatan posterior.",ref:H(569)},{judul:"Badan",isi:"Jarang: eksplorasi neurovaskular (HoF) atau pergeseran 100%/angulasi > 45° (AO). Plat 1/3 tubular atau rekonstruksi 3.5 — plat kompresi terlalu tebal; di luar tepi, badan hanya menerima sekrup 12–14 mm. Posisi lateral; pendekatan Judet (insisi dari sudut posterior akromion sepanjang spina ke tepi medial sampai sudut inferior; deltoid dilepas dari spina dengan sisa jaringan untuk dijahit kembali).",ref:[x(186),x(188),H(566),H(567)]},{judul:"Floating shoulder",isi:"Fiksasi klavikula (plat rekonstruksi/LC-DCP/LCP 3.5) biasanya cukup mengembalikan stabilitas; leher glenoid difiksasi bila perlu — terutama pergeseran medial dengan pemendekan > 2 cm. Deformitas residual bersifat aditif bila beberapa fraktur bergeser sedang.",ref:[x(186),H(570),H(571)]},{judul:"Hasil",isi:"Seri 84 pasien dengan Judet ekstensil: tanpa nonunion, 3 malunion, tanpa infeksi. Mobilisasi cepat dalam sling begitu nyeri reda; penguatan setelah union.",ref:[H(570),H(572)]}]},"orif-prosesus":{nama:{id:"Fiksasi akromion dan korakoid",en:"Acromion and coracoid fixation"},bab:[{judul:"Akromion",isi:"Fraktur bergeser direduksi dan difiksasi karena malunion menimbulkan impingement rotator cuff: tension band dorsal (HoF) atau sekrup lag 2.7 / plat mini-fragmen (AO) lewat pendekatan superior. Singkirkan os acromiale dan robekan cuff lebih dulu.",ref:[x(186),H(566),H(569)]},{judul:"Spina skapula",isi:"Fraktur spina yang bergeser sering perlu operasi (risiko nonunion dan gangguan fungsi setelah malunion): plat rekonstruksi 2.7 di sisi posterior.",ref:H(568)},{judul:"Korakoid",isi:"Fraktur sentral dengan dislokasi AC: sekrup lag 3.5 pada korakoid dan sendi AC juga distabilkan; HoF: separasi AC derajat III + korakoid bergeser → ORIF keduanya. Fraktur perifer nonoperatif kecuali fragmen kehilangan kontak karena tarikan korakobrakialis. Hasil fiksasi prosesus (13 akromion, 14 korakoid): semua sembuh dengan gerak penuh tanpa nyeri.",ref:[x(186),x(187),H(568),H(569),H(572)]}]},skapulotorakal:{nama:{id:"Disosiasi skapulotorakal",en:"Scapulothoracic dissociation"},bab:[{judul:"Diagnosis",isi:"Bengkak masif bahu, lengan tak berdenyut, defisit neurologis komplet/parsial, dan pergeseran lateral skapula pada foto toraks tanpa rotasi (diagnostik). Cedera neurovaskular lazim: pleksopati komplet 80%, parsial 15%, a. subklavia/aksilaris 88%.",ref:x(189)},{judul:"Awal",isi:"Protokol ATLS; angiografi dengan perbaikan vaskular dan eksplorasi pleksus brakialis sesuai indikasi; stabilisasi cedera tulang/sendi penyerta. Bila eksplorasi awal menunjukkan pleksus hancur, pertimbangkan amputasi atas siku primer.",ref:[x(189),x(190)]},{judul:"Lanjutan",isi:"EMG pada 3 minggu; mielografi servikal atau MRI pada 6 minggu (tanda *empty sleeve*); ≥ 3 pseudomeningokel berarti prognosis buruk. Artrodesis bahu dan/atau amputasi atas siku bila lengan *flail*; avulsi radiks dan defisit komplet berprognosis buruk, cedera parsial sering pulih fungsional.",ref:x(190)},{judul:"Prognosis",isi:"Lengan flail 52%, amputasi dini 21%, kematian 10%.",ref:x(190)}]}}}});var Bn={};Da(Bn,{default:()=>Vt});var j,Vt,En=ma(()=>{j=a=>({buku:"HoF",bab:"14",hlm:a}),Vt={id:"dislokasi-bahu",nama:{id:"Dislokasi glenohumeral",en:"Glenohumeral dislocation"},sumber:[{buku:"HoF",bab:"14",hlm:{awal:194,akhir:211}}],gambar:"dislokasi-bahu:anterior",intro:{id:"Sendi besar yang paling sering terdislokasi — 96% ke anterior. Yang menentukan nasib bahu adalah usia saat dislokasi pertama: rekurensi hampir 90% pada remaja, 10–15% pada usia 40.",en:"The most commonly dislocated major joint — 96% anterior. Age at first dislocation decides the shoulder's fate: recurrence is nearly 90% in teenagers and 10–15% at 40."},introRef:[j(194),j(205)],pemeriksaan:{klinis:[{teks:"Anterior: bahu ditahan sedikit abduksi–rotasi eksternal, nyeri dan spasme; bahu 'persegi' karena akromion menonjol, cekung di bawah akromion posterior, massa teraba di anterior.",ref:j(197)},{teks:"Periksa **n. aksilaris** (sensasi kulit deltoid; kontraksi deltoid sering tak dapat diuji — atoni deltoid jangan dikira cedera saraf) dan **n. muskulokutaneus** (sensasi lengan bawah anterolateral).",ref:j(197)},{teks:"Pasien yang sudah tereduksi spontan: uji apprehension — abduksi, ekstensi, rotasi eksternal memunculkan rasa akan lepas; Feagin: tekanan ke bawah pada humerus proksimal dengan siku bertumpu.",ref:[j(198),j(199)]},{teks:"Posterior: tanpa deformitas mencolok — lengan dalam posisi 'sling' (aduksi–rotasi internal); rotasi eksternal terbatas (sering < 0°), elevasi < 90°, massa posterior, bahu anterior mendatar, korakoid menonjol; **60–80%** terlewat pada pemeriksaan awal.",ref:[j(206),j(207)]},{teks:"Luxatio erecta: lengan terkunci 'memberi hormat' (abduksi 110–160°), kaput teraba di dinding dada lateral/aksila; gangguan neurovaskular hampir selalu ada.",ref:j(209)},{teks:"Pasien > 40 tahun yang tidak dapat mengangkat lengan setelah dislokasi: curigai robekan rotator cuff (35–40% pada > 40 tahun, hingga 80% pada > 60 tahun) — USG dapat dipertimbangkan pada dislokasi pertama > 40 tahun.",ref:j(196)}],radiologis:[{teks:"Seri trauma dalam bidang skapula: AP, skapular-Y, aksilar. Foto **sebelum reduksi** untuk dislokasi pertama, usia > 40 tahun, dan trauma energi tinggi (risiko fraktur penyerta).",ref:j(199)},{teks:"Tidak bisa aksilar standar → **Velpeau axillary** (tetap dalam sling, condong ke belakang 45°). **West Point** (tengkurap, 25°/25°) untuk tepi glenoid anteroinferior; **Hill-Sachs view** (AP rotasi internal maksimal); **Stryker notch** (telapak di puncak kepala, berkas 10° sefalad ke korakoid) menampilkan 90% defek posterolateral.",ref:[j(201),j(202)]},{teks:"Tanda dislokasi posterior pada AP: hilangnya tumpang tindih elips kaput–glenoid, **vacant glenoid** (celah > 6 mm), **trough sign** (reverse Hill-Sachs, 75%), hilangnya profil kolum (rotasi internal penuh), kaput 'kosong' di fossa. Aksilar paling jelas; CT mengukur persentase kaput yang terimpaksi.",ref:j(207)},{teks:"CT untuk impaksi kaput/glenoid, benda lepas, bony Bankart; artrografi untuk rotator cuff; MRI untuk cuff, kapsul, labrum.",ref:j(203)}],mekanisme:[{teks:"Anterior: tidak langsung pada abduksi–ekstensi–rotasi eksternal (tersering); benturan langsung dari posterior; kejang/sengatan listrik (biasanya posterior); laksitas → dislokasi dengan trauma minimal.",ref:[j(196),j(197)]},{teks:"Patoanatomi: kapsul robek dari glenoid (atau dari humerus — HAGL); **Bankart** = avulsi labrum anteroinferior (± fragmen tepi glenoid = bony Bankart) pada 40% bahu yang dioperasi; **Hill-Sachs** = impaksi posterolateral kaput oleh tepi glenoid — 27% dislokasi akut, 74% rekuren.",ref:j(196)},{teks:"Stabilisator pasif: konformitas, efek vakum, adhesi cairan sinovial, inklinasi skapula (0–30°), kapsul-ligamen — pita superior IGHL adalah penahan utama dislokasi anterior (rotasi eksternal pada abduksi 45–90°); aktif: biseps kaput longum, rotator cuff, stabilisator skapula.",ref:j(195)},{teks:"Posterior: aduksi–fleksi–rotasi internal (tidak langsung) atau kejang/listrik karena rotator internal (latisimus, pektoralis, subskapularis) lebih kuat; langsung dari anterior.",ref:j(206)},{teks:"Inferior: hiperabduksi — kolum humerus membentur akromion dan mengungkit kaput ke inferior; sering avulsi rotator cuff, cedera pektoralis, fraktur humerus proksimal, a. aksilaris/pleksus. Superior: gaya anterior-superior ekstrem pada lengan aduksi (jatuh dari ketinggian).",ref:[j(209),j(210)]}],epidemiologi:[{teks:"Hingga **45%** dari semua dislokasi; anterior 96%, posterior 2–4%, inferior/superior ≈ 0,5%; insiden 17/100.000/tahun; puncak laki-laki 21–30 tahun dan perempuan 61–80 tahun.",ref:j(194)},{teks:"Rekurensi 50% semua usia — hampir **89%** pada 14–20 tahun.",ref:j(194)}]},klasifikasi:[{nama:"Derajat & kronologi",teks:"Dislokasi vs subluksasi; kongenital; akut vs kronis; terkunci; rekuren; didapat (mikrotrauma berulang — renang, senam, angkat beban; labrum utuh dengan laksitas kapsul).",ref:j(203)},{nama:"Gaya & arah",teks:"Atraumatik (laksitas, tereduksi sendiri) vs traumatik (satu cedera besar, Bankart, unidireksional, perlu bantuan reduksi); volunter vs involunter; subkorakoid, subglenoid, intratorakal.",ref:j(203)},{nama:"Posterior",teks:"Etiologis: traumatik (sprain, subluksasi, dislokasi, rekuren, terkunci) vs atraumatik (volunter, kongenital, didapat). Anatomis: subakromial 98%, subglenoid, subspinous.",ref:j(207)}],kelompok:[{id:"anterior",nama:{id:"Anterior",en:"Anterior"},kode:"96%",jenis:[{id:"anterior",nama:{id:"Dislokasi anterior akut",en:"Acute anterior dislocation"},kode:"subkorakoid",gambar:"dislokasi-bahu:anterior",ringkas:"Kaput di anterior-inferior glenoid; reduksi tertutup setelah analgesia/blok/sedasi, lalu imobilisasi 2–5 minggu.",ref:[j(203),j(205)],indikasi:"anterior"},{id:"rekuren",nama:{id:"Instabilitas anterior rekuren (Bankart)",en:"Recurrent anterior instability (Bankart)"},kode:"",gambar:"dislokasi-bahu:bankart",ringkas:"Labrum anteroinferior lepas dari glenoid; rekurensi 80–92% pada usia 20 tahun, 60% pada 30, 10–15% pada 40.",ref:[j(196),j(205)],indikasi:"rekuren"},{id:"lesi-tulang",nama:{id:"Hill-Sachs & bony Bankart",en:"Hill-Sachs and bony Bankart"},kode:"",gambar:"dislokasi-bahu:hill-sachs",ringkas:"Impaksi posterolateral kaput (27% akut, 74% rekuren) dan fragmen tepi glenoid; fragmen glenoid > 5 mm adalah indikasi operasi.",ref:[j(196),j(205)],indikasi:"lesi-tulang"},{id:"cuff",nama:{id:"Dislokasi pada > 40 tahun: rotator cuff",en:"Dislocation over 40: rotator cuff"},kode:"",gambar:"dislokasi-bahu:rotator-cuff",ringkas:"Robekan cuff 35–40% pada > 40 tahun, hingga 80% pada > 60; waspada lengan yang tak bisa diangkat; imobilisasi lebih singkat karena kekakuan.",ref:[j(196),j(205)],indikasi:"anterior"}]},{id:"posterior",nama:{id:"Posterior",en:"Posterior"},kode:"2–4%",jenis:[{id:"posterior",nama:{id:"Dislokasi posterior (subakromial)",en:"Posterior dislocation (subacromial)"},kode:"98%",gambar:"dislokasi-bahu:posterior",ringkas:"Permukaan sendi menghadap posterior tanpa pergeseran kasar; tuberositas minor menempati fossa; sering disertai impaksi kaput anterior.",ref:j(207),indikasi:"posterior"},{id:"reverse-hs",nama:{id:"Reverse Hill-Sachs (impaksi anteromedial)",en:"Reverse Hill-Sachs (anteromedial impaction)"},kode:"trough sign",gambar:"dislokasi-bahu:mclaughlin",ringkas:"Defek anteromedial kaput oleh tepi glenoid posterior; persentase keterlibatan kaput (CT) menentukan: 20–40% vs > 40%.",ref:[j(207),j(208)],indikasi:"reverse-hs"}]},{id:"jarang",nama:{id:"Inferior & superior",en:"Inferior and superior"},kode:"≈ 0,5%",jenis:[{id:"inferior",nama:{id:"Luxatio erecta (inferior)",en:"Luxatio erecta (inferior)"},kode:"",gambar:"dislokasi-bahu:inferior",ringkas:"Batang humerus mengarah superior, kaput di bawah glenoid; lebih sering pada lansia; cedera neurovaskular hampir selalu menyertai.",ref:j(209),indikasi:"inferior"},{id:"superior",nama:{id:"Dislokasi superior",en:"Superior dislocation"},kode:"",gambar:"dislokasi-bahu:superior",ringkas:"Kaput di atas akromion, lengan memendek dalam aduksi; fraktur akromion/klavikula/korakoid/tuberositas dan cedera AC sering menyertai.",ref:j(210),indikasi:"superior"}]}],indikasi:{anterior:{intro:"Reduksi tertutup setelah evaluasi klinis dan analgesia, blok intraartikular, dan/atau sedasi; lalu imobilisasi 2–5 minggu — lebih singkat pada > 40 tahun (kekakuan), lebih lama pada pasien muda dengan riwayat rekurensi.",ref:[j(203),j(205)],opsi:[{id:"traksi",nama:{id:"Traksi–kontratraksi / Hippocrates",en:"Traction–countertraction / Hippocratic"},gambar:"dislokasi-bahu:traksi-kontratraksi",utama:["Metode dasar dengan asisten (kain kontratraksi)","Hippocrates: satu operator, kaki di lipatan aksila, traksi aksial + rotasi lembut"],ref:[j(203),j(204)],tatalaksana:"reduksi-anterior"},{id:"stimson",nama:{id:"Stimson / manipulasi skapula (tengkurap)",en:"Stimson / scapular manipulation (prone)"},gambar:"dislokasi-bahu:stimson",utama:["Tengkurap, lengan menggantung dengan beban 5 lb selama 15–20 menit","Manipulasi skapula: ujung inferior didorong medial-inferior"],ref:[j(204),j(205)],tatalaksana:"reduksi-anterior"},{id:"milch",nama:{id:"Milch (abduksi–rotasi eksternal)",en:"Milch (abduction–external rotation)"},gambar:"dislokasi-bahu:milch",utama:["Telentang, lengan abduksi dan rotasi eksternal, ibu jari mendorong kaput ke tempatnya","Kocher (pengungkit) tidak dianjurkan — risiko fraktur"],ref:j(205),tatalaksana:"reduksi-anterior"},{id:"op",nama:{id:"Stabilisasi operatif (Bankart artroskopik)",en:"Operative stabilization (arthroscopic Bankart)"},gambar:"dislokasi-bahu:bankart-repair",utama:["Dislokasi pertama pada laki-laki muda aktif","Interposisi jaringan lunak (tak tereduksi)","Tuberositas mayor tetap > 5 mm ke superior setelah reduksi; fragmen tepi glenoid > 5 mm"],ref:j(205),tatalaksana:"stabilisasi"}]},rekuren:{intro:"Prognosis paling ditentukan usia saat dislokasi pertama dan aktivitas pasien — bukan jenis atau lama imobilisasi. Sebagian besar rekurensi terjadi dalam 2 tahun pertama, lebih sering pada laki-laki.",ref:[j(205),j(206)],opsi:[{id:"op",nama:{id:"Perbaikan Bankart artroskopik",en:"Arthroscopic Bankart repair"},gambar:"dislokasi-bahu:bankart-repair",utama:["Perbaikan ligamen/labrum anteroinferior adalah prosedur standar","Capsular shift, kapsulorafi, transfer otot/tendon, transfer tulang untuk kasus refrakter"],ref:j(205),tatalaksana:"stabilisasi"},{id:"nonop",nama:{id:"Rehabilitasi & penguatan",en:"Rehabilitation and strengthening"},gambar:"sling",utama:["Instabilitas atraumatik/volunter atau multidireksional dengan laksitas — konseling dan penguatan","Pasien tua dengan risiko rekurensi rendah"],ref:[j(203),j(208)],tatalaksana:"pascareduksi"}]},"lesi-tulang":{intro:"Fragmen tepi glenoid > 5 mm dan tuberositas mayor yang tetap bergeser > 5 mm ke superior setelah reduksi adalah indikasi operasi.",ref:j(205),opsi:[{id:"op",nama:{id:"Stabilisasi operatif ± fiksasi fragmen",en:"Operative stabilization ± fragment fixation"},gambar:"dislokasi-bahu:bankart-repair",utama:["Fragmen tepi glenoid > 5 mm (bony Bankart)","Transfer tulang untuk kasus refrakter"],ref:j(205),tatalaksana:"stabilisasi"},{id:"nonop",nama:{id:"Reduksi + imobilisasi + rehabilitasi",en:"Reduction + immobilization + rehabilitation"},gambar:"sling",utama:["Hill-Sachs tanpa instabilitas berulang","Fragmen glenoid kecil"],ref:j(205),tatalaksana:"pascareduksi"}]},posterior:{intro:"Reduksi tertutup butuh relaksasi otot penuh, sedasi, dan analgesia — nyerinya melebihi dislokasi anterior dan sering memerlukan anestesi umum. Jangan memaksa rotasi eksternal bila impaksi terkunci di tepi glenoid.",ref:j(208),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup — traksi aduksi + angkat kaput",en:"Closed reduction — adduction traction + lift the head"},gambar:"dislokasi-bahu:reduksi-posterior",utama:["Telentang; traksi lengan aduksi searah deformitas, kaput diangkat lembut ke fossa","Impaksi terkunci: tambah traksi lateral pada lengan atas"],ref:j(208),tatalaksana:"reduksi-posterior"},{id:"op",nama:{id:"Stabilisasi operatif",en:"Operative stabilization"},gambar:"dislokasi-bahu:mclaughlin",utama:["Tuberositas minor bergeser besar; fragmen glenoid posterior besar","Tak tereduksi / impaksi menghalangi reduksi; dislokasi terbuka","Subluksasi/redislokasi dalam sling-and-swathe; instabilitas rekuren"],ref:j(208),tatalaksana:"op-posterior"}]},"reverse-hs":{intro:"Besarnya defek anteromedial kaput (CT) menentukan: 20–40% → transfer tuberositas minor (McLaughlin modifikasi); > 40% → hemiartroplasti dengan versi netral.",ref:j(208),opsi:[{id:"mclaughlin",nama:{id:"McLaughlin modifikasi (transfer tuberositas minor)",en:"Modified McLaughlin (lesser tuberosity transfer)"},gambar:"dislokasi-bahu:mclaughlin",utama:["Keterlibatan kaput 20–40%","Tuberositas minor + subskapularis dipindahkan ke dalam defek"],ref:j(208),tatalaksana:"op-posterior"},{id:"hemi",nama:{id:"Hemiartroplasti (versi netral)",en:"Hemiarthroplasty (neutral version)"},gambar:"dislokasi-bahu:hemiartroplasti",utama:["Keterlibatan kaput > 40%"],ref:j(208),tatalaksana:"op-posterior"},{id:"nonop",nama:{id:"Reduksi + imobilisasi rotasi eksternal",en:"Reduction + external-rotation immobilization"},gambar:"sling",utama:["Defek kecil yang stabil setelah reduksi","Defek anteromedial besar: imobilisasi dalam rotasi eksternal lebih stabil"],ref:j(208),tatalaksana:"reduksi-posterior"}]},inferior:{intro:"Reduksi dengan traksi–kontratraksi searah posisi humerus (superolateral) sambil abduksi diturunkan bertahap; kaput yang 'terjerat' (buttonhole) di kapsul inferior memerlukan reduksi terbuka.",ref:j(210),opsi:[{id:"reduksi",nama:{id:"Traksi superolateral + kontratraksi kain",en:"Superolateral traction + sheet countertraction"},gambar:"dislokasi-bahu:reduksi-inferior",utama:["Traksi aksial searah humerus, abduksi dikurangi bertahap","Sling 3–6 minggu (lebih singkat pada lansia)"],ref:j(210),tatalaksana:"reduksi-jarang"},{id:"terbuka",nama:{id:"Reduksi terbuka",en:"Open reduction"},gambar:"dislokasi-bahu:inferior",utama:["Kaput buttonhole lewat kapsul inferior — lebarkan defek kapsul, perbaiki struktur yang rusak"],ref:j(210),tatalaksana:"reduksi-jarang"}]},superior:{intro:"Reduksi tertutup dengan analgesia dan sedasi: traksi aksial ke inferior dengan kontratraksi, ditambah traksi lateral pada lengan atas; cedera jaringan lunak dan fraktur penyerta sering — yang tak tereduksi perlu reduksi terbuka.",ref:j(211),opsi:[{id:"reduksi",nama:{id:"Traksi inferior + traksi lateral",en:"Inferior traction + lateral traction"},gambar:"dislokasi-bahu:superior",utama:["Analgesia dan sedasi","Cari fraktur akromion/klavikula/korakoid/tuberositas"],ref:[j(210),j(211)],tatalaksana:"reduksi-jarang"}]}},tatalaksana:{"reduksi-anterior":{nama:{id:"Reduksi tertutup dislokasi anterior",en:"Closed reduction of anterior dislocation"},bab:[{judul:"Persiapan",isi:"Evaluasi klinis dan neurovaskular lengkap, foto sebelum reduksi (dislokasi pertama, > 40 tahun, energi tinggi), lalu analgesik, blok intraartikular, dan/atau sedasi.",ref:[j(199),j(203)]},{judul:"Teknik",isi:"**Traksi–kontratraksi** dengan kain di dada. **Hippocrates**: satu operator, kaki di lipatan aksila ke dinding dada, traksi aksial dengan rotasi internal–eksternal lembut. **Stimson**: tengkurap, lengan menggantung dengan traksi manual atau beban 5 lb, reduksi dalam 15–20 menit. **Manipulasi skapula**: posisi Stimson, ujung inferior skapula didorong ke medial-inferior sementara skapula superomedial ditahan. **Milch**: telentang, abduksi dan rotasi eksternal, ibu jari mendorong kaput. **Kocher** (mengungkit kaput pada glenoid anterior) tidak dianjurkan karena risiko fraktur.",ref:[j(203),j(204),j(205)]},{judul:"Tak tereduksi",isi:"Dislokasi anterior akut yang tak tereduksi (jarang) biasanya karena interposisi jaringan lunak dan memerlukan reduksi terbuka.",ref:j(205)}]},pascareduksi:{nama:{id:"Pascareduksi & rehabilitasi",en:"Post-reduction care and rehabilitation"},bab:[{judul:"Imobilisasi",isi:"2–5 minggu. Lebih singkat pada > 40 tahun karena kekakuan tangan–pergelangan–siku–bahu menyulitkan; lebih lama pada pasien muda dengan riwayat rekurensi. Velpeau tidak lebih baik daripada sling sederhana dalam mencegah rekurensi; rotasi internal vs eksternal masih diperdebatkan.",ref:j(205)},{judul:"Terapi",isi:"Setelah imobilisasi: rotasi eksternal, fleksi, abduksi bertahap, dengan gerak aktif penuh tangan, pergelangan, siku sejak awal.",ref:j(205)},{judul:"Rekurensi",isi:"Komplikasi tersering: usia 20 tahun 80–92% (lebih rendah pada non-atlet), 30 tahun 60%, 40 tahun 10–15%; kebanyakan dalam 2 tahun pertama, lebih sering laki-laki. Prognosis ditentukan usia saat dislokasi pertama dan aktivitas — tidak oleh jenis/lama imobilisasi.",ref:[j(205),j(206)]},{judul:"Komplikasi lain",isi:"Lesi tulang (Hill-Sachs, bony Bankart, tuberositas mayor, akromion/korakoid, degeneratif); jaringan lunak (robekan cuff pada lansia, kapsul/subskapularis); vaskular (lansia aterosklerotik, a. aksilaris, saat reduksi); saraf — muskulokutaneus dan aksilaris, neurapraksia hampir selalu pulih; menetap > 3 bulan → evaluasi lanjut dan kemungkinan eksplorasi.",ref:j(206)},{judul:"Instabilitas atraumatik",isi:"Pasien dengan dislokasi volunter ditangani nonoperatif: konseling dan latihan penguatan.",ref:j(208)}]},stabilisasi:{nama:{id:"Stabilisasi operatif anterior",en:"Operative anterior stabilization"},bab:[{judul:"Indikasi",isi:"Dislokasi pertama pada laki-laki muda aktif; interposisi jaringan lunak; fraktur tuberositas mayor yang tetap bergeser > 5 mm ke superior setelah reduksi; fragmen tepi glenoid > 5 mm.",ref:j(205)},{judul:"Prosedur",isi:"Umumnya perbaikan ligamen/labrum anteroinferior secara artroskopik (lesi Bankart). Capsular shift, kapsulorafi, transfer otot/tendon, dan transfer tulang dicadangkan untuk kasus refrakter.",ref:j(205)},{judul:"Pascaoperasi",isi:"Sling/immobilizer hingga 3 minggu (< 30 tahun), 2 minggu (30–40 tahun), 1–2 minggu (> 50 tahun) menurut jenis stabilisasi; dilepas 2–4 kali sehari untuk latihan gerak bahu, pergelangan, tangan; terapi menuju gerak aktif-pasif dan kekuatan.",ref:j(205)}]},"reduksi-posterior":{nama:{id:"Reduksi tertutup dislokasi posterior",en:"Closed reduction of posterior dislocation"},bab:[{judul:"Teknik",isi:"Relaksasi otot penuh, sedasi, analgesia — sering anestesi umum. Telentang: traksi pada lengan aduksi searah deformitas sambil kaput diangkat lembut ke fossa. Jangan paksa rotasi eksternal (fraktur kaput bila impaksi terkunci di tepi glenoid posterior); bila terkunci, tambahkan traksi lateral pada lengan atas.",ref:j(208)},{judul:"Pascareduksi",isi:"Sling-and-swathe bila stabil; bila subluksasi/redislokasi dalam sling-and-swathe, pertimbangkan stabilisasi bedah. Defek anteromedial besar: imobilisasi rotasi eksternal lebih stabil. Selama imobilisasi: isometrik rotasi eksternal dan deltoid; setelahnya program penguatan rotator internal–eksternal yang agresif.",ref:j(208)},{judul:"Komplikasi",isi:"Fraktur tepi glenoid posterior, batang humerus, tuberositas, kaput; rekurensi (atraumatik, defek kaput besar, fragmen glenoid besar); cedera neurovaskular lebih jarang daripada anterior (n. aksilaris di ruang kuadrangular, cabang n. supraskapular ke infraspinatus di takik spinoglenoid); subluksasi anterior akibat penjahitan posterior terlalu ketat.",ref:[j(208),j(209)]}]},"op-posterior":{nama:{id:"Tatalaksana operatif dislokasi posterior",en:"Operative treatment of posterior dislocation"},bab:[{judul:"Indikasi",isi:"Pergeseran besar fraktur tuberositas minor; fragmen glenoid posterior besar; tak tereduksi atau impaksi yang menghalangi reduksi; dislokasi terbuka; impaksi anteromedial (reverse Hill-Sachs) 20–40% → transfer tuberositas minor dengan subskapularis ke defek (McLaughlin modifikasi), > 40% → hemiartroplasti versi netral; instabilitas rekuren.",ref:j(208)},{judul:"Pilihan prosedur",isi:"Reduksi terbuka, plikasi infraspinatus (reverse Putti-Platt), transfer tendon biseps kaput longum ke tepi glenoid posterior (Boyd-Sisk), osteotomi humerus/glenoid, kapsulorafi.",ref:j(208)}]},"reduksi-jarang":{nama:{id:"Reduksi dislokasi inferior & superior",en:"Reduction of inferior and superior dislocations"},bab:[{judul:"Luxatio erecta",isi:"Traksi aksial searah posisi humerus (superolateral) dengan kontratraksi kain melingkari tubuh, abduksi diturunkan bertahap. Sling 3–6 minggu, lebih singkat pada lansia. Kaput yang menerobos kapsul inferior (buttonhole) → reduksi terbuka: defek kapsul dilebarkan dan struktur rusak diperbaiki. Gangguan neurovaskular hampir selalu ada tetapi biasanya pulih setelah reduksi.",ref:j(210)},{judul:"Superior",isi:"Traksi aksial ke inferior dengan kontratraksi, ditambah traksi lateral lengan atas, dengan analgesia dan sedasi. Cedera jaringan lunak (cuff, kapsul, biseps) dan fraktur penyerta sering; yang tak tereduksi memerlukan reduksi terbuka. Komplikasi neurovaskular biasanya cedera traksi yang pulih setelah reduksi.",ref:[j(210),j(211)]}]}}}});var Hn={};Da(Hn,{default:()=>qt});var D,z,qt,Rn=ma(()=>{D=a=>({buku:"HoF",bab:"15",hlm:a}),z=a=>({buku:"AO",bab:"6.2.1",hlm:a}),qt={id:"humerus-proksimal",nama:{id:"Humerus proksimal",en:"Proximal humerus"},sumber:[{buku:"HoF",bab:"15",hlm:{awal:212,akhir:220}},{buku:"AO",bab:"6.2.1",hlm:{awal:587,akhir:605}}],gambar:"humerus-proksimal:utuh",intro:{id:"Fraktur humerus tersering dan fraktur fragilitas khas lansia; empat bagian Neer (kepala, dua tuberositas, batang) ditarik otot ke arah berbeda — itulah yang menentukan pergeseran dan terapi.",en:"The most common humerus fracture and a typical fragility fracture; Neer's four parts are pulled apart by muscle forces that dictate displacement and treatment."},pemeriksaan:{klinis:[{teks:"Lengan dirapatkan ke dada dan ditopang tangan sebelahnya; ekimosis proksimal humerus bisa muncul terlambat, dan ekimosis dinding dada/pinggang harus dibedakan dari cedera toraks.",ref:D(214)},{teks:"Periksa **n. aksilaris**: sensasi kulit lateral lengan atas di atas deltoid; motorik biasanya belum bisa diuji karena nyeri. Translasi inferior fragmen distal akibat atoni deltoid bukan dislokasi sejati dan biasanya pulih dalam **4 minggu** — bila menetap, curigai cedera n. aksilaris.",ref:D(214)},{teks:"Cedera vaskular 5–6% (a. aksilaris tersering) dan pleksus brakialis 6%; sirkulasi kolateral yang kaya dapat menyamarkan cedera arteri.",ref:D(219)}],radiologis:[{teks:"Seri bahu: AP dan lateral (Y) pada bidang skapula plus **aksilar** — pandangan terbaik untuk glenoid dan reduksi sendi; bila nyeri, pakai aksilar Velpeau (pasien tetap dengan sling, condong 45° ke belakang).",ref:D(214)},{teks:"CT untuk keterlibatan sendi, derajat pergeseran, fraktur impresi, dan tepi glenoid; MRI bukan untuk fraktur, kecuali menilai rotator cuff.",ref:D(214)}],mekanisme:[{teks:"Jatuh pada lengan terentang dari posisi berdiri pada perempuan tua (fraktur fragilitas); pada pasien muda energi tinggi dengan cedera jaringan lunak dan dislokasi yang lebih berat.",ref:D(213)},{teks:"Gaya deformasi: supraspinatus & rotator eksternal menarik tuberositas mayor ke superior-posterior; subskapularis menarik tuberositas minor ke medial; pektoralis mayor menarik batang ke medial; deltoid mengabduksi fragmen proksimal.",ref:D(213)},{teks:"Vaskularisasi kepala terutama dari a. arkuata (cabang a. sirkumfleksa humeri anterior) lewat alur bisipital; fraktur kolum anatomikum berprognosis buruk karena suplai yang rentan.",ref:D(213)}],epidemiologi:[{teks:"**4–5%** semua fraktur dan 45% fraktur humerus; 85% tidak bergeser; perempuan : laki-laki 2 : 1 karena osteoporosis.",ref:D(212)}]},klasifikasi:[{nama:"Neer",teks:"Empat bagian: kepala, tuberositas mayor, tuberositas minor, batang. Satu bagian disebut **bergeser** bila > 1 cm atau angulasi > 45°. Satu-bagian (tak bergeser berapa pun garis frakturnya), dua-bagian (kolum anatomikum / kolum chirurgicum / tuberositas mayor / minor), tiga-bagian (kolum chirurgicum + salah satu tuberositas), empat-bagian, fraktur-dislokasi, fraktur permukaan sendi.",ref:D(215)},{nama:"AO/OTA 11",teks:"11A ekstraartikular unifokal (dua-bagian, kolum chirurgicum); 11B ekstraartikular bifokal (tiga-bagian); 11C artikular / empat-bagian (kolum anatomikum). Keparahan dan risiko vaskular kepala naik dari A1 ke C3.",ref:z(592)},{nama:"LEGO (Hertel)",teks:"Menekankan letak garis fraktur di antara keempat bagian dan kombinasinya; panjang ekstensi metafisis dorsomedial dan keutuhan engsel medial memprediksi vaskularisasi kepala.",ref:[z(592),z(605)]}],kelompok:[{id:"satu",nama:{id:"Satu-bagian (tak bergeser)",en:"One-part (undisplaced)"},kode:"Neer 1 · 85% kasus",jenis:[{id:"1-bagian",nama:{id:"Tak bergeser / terimpaksi",en:"Undisplaced / impacted"},kode:"Neer 1 · AO 11A1",gambar:"humerus-proksimal:1-bagian",ringkas:"Berapa pun jumlah garis fraktur, tidak ada bagian yang bergeser > 1 cm atau berangulasi > 45°.",ref:D(215),indikasi:"satu"}]},{id:"dua",nama:{id:"Dua-bagian",en:"Two-part"},kode:"Neer 2 · AO 11A",jenis:[{id:"collum-chirurgicum",nama:{id:"Kolum chirurgicum",en:"Surgical neck"},kode:"Neer 2 · AO 11A",gambar:"humerus-proksimal:collum-chirurgicum",ringkas:"Batang tertarik ke medial oleh pektoralis mayor; korteks medial (kalkar) yang hancur membuat fraktur tidak stabil.",ref:[D(216),z(601)],indikasi:"collum-chirurgicum"},{id:"tuberositas-mayor",nama:{id:"Tuberositas mayor",en:"Greater tuberosity"},kode:"Neer 2",gambar:"humerus-proksimal:tuberositas-mayor",ringkas:"Fragmen tertarik ke superior-posterior oleh rotator cuff; pergeseran > 5–10 mm (5 mm untuk translasi superior) → nonunion & impingement subakromial.",ref:D(216),indikasi:"tuberositas-mayor"},{id:"tuberositas-minor",nama:{id:"Tuberositas minor",en:"Lesser tuberosity"},kode:"Neer 2",gambar:"humerus-proksimal:tuberositas-minor",ringkas:"Jarang; singkirkan dislokasi posterior yang menyertai. Operasi bila fragmen menghalangi rotasi internal.",ref:D(216),indikasi:"tuberositas-minor"},{id:"collum-anatomicum",nama:{id:"Kolum anatomikum",en:"Anatomical neck"},kode:"Neer 2 · AO 11C",gambar:"humerus-proksimal:collum-anatomicum",ringkas:"Jarang, sulit direduksi tertutup, dan risiko osteonekrosis kepala tinggi karena suplai darah terputus.",ref:D(216),indikasi:"collum-anatomicum"}]},{id:"tiga-empat",nama:{id:"Tiga- & empat-bagian",en:"Three- and four-part"},kode:"Neer 3–4 · AO 11B–C",jenis:[{id:"3-bagian",nama:{id:"Tiga-bagian",en:"Three-part"},kode:"Neer 3 · AO 11B",gambar:"humerus-proksimal:3-bagian",ringkas:"Kolum chirurgicum + satu tuberositas; gaya otot yang berlawanan membuatnya tidak stabil sehingga reduksi tertutup sulit dipertahankan.",ref:D(216),indikasi:"3-bagian"},{id:"4-bagian",nama:{id:"Empat-bagian",en:"Four-part"},kode:"Neer 4 · AO 11C",gambar:"humerus-proksimal:4-bagian",ringkas:"Kepala terlepas dari kedua tuberositas dan batang; osteonekrosis **4–35%**.",ref:D(217),indikasi:"4-bagian"},{id:"valgus-impaksi",nama:{id:"Empat-bagian valgus-terimpaksi",en:"Valgus-impacted four-part"},kode:"Neer 4 (varian)",gambar:"humerus-proksimal:valgus-impaksi",ringkas:"Kepala terdorong ke valgus di antara tuberositas dengan engsel medial sering utuh — osteonekrosis lebih rendah, hasil ORIF sangat baik.",ref:D(217),indikasi:"valgus-impaksi"}]},{id:"dislokasi-artikular",nama:{id:"Fraktur-dislokasi & permukaan sendi",en:"Fracture-dislocation & articular surface"},kode:"Neer · AO 11C",jenis:[{id:"fraktur-dislokasi",nama:{id:"Fraktur-dislokasi",en:"Fracture-dislocation"},kode:"Neer",gambar:"humerus-proksimal:fraktur-dislokasi",ringkas:"Kepala keluar dari glenoid; pleksus brakialis dan a. aksilaris dekat fragmen kepala pada dislokasi anterior; manipulasi berulang memicu miositis osifikans.",ref:D(217),indikasi:"fraktur-dislokasi"},{id:"head-split",nama:{id:"Fraktur permukaan sendi (head-split, Hill-Sachs)",en:"Articular surface (head-split, Hill-Sachs)"},kode:"AO 11C",gambar:"humerus-proksimal:head-split",ringkas:"Paling sering menyertai dislokasi posterior; keterlibatan kepala > 40% mungkin perlu prostesis, ORIF dipertimbangkan dulu pada < 40 tahun.",ref:D(218),indikasi:"head-split"}]}],indikasi:{satu:{intro:"Tak bergeser atau terimpaksi: sling dan gerak dini. Hasil akhir mendekati gerak penuh dalam 1 tahun.",ref:D(216),opsi:[{id:"nonop",nama:{id:"Sling + gerak dini",en:"Sling + early motion"},gambar:"sling",utama:["Satu-bagian / terimpaksi","Pasien > 75 tahun osteoporotik dengan tuntutan rendah meski bergeser (AO)"],ref:[D(215),z(592)],tatalaksana:"nonop"}]},"collum-chirurgicum":{intro:"Nonoperatif jarang diindikasikan kecuali fraktur berangulasi yang stabil (bergerak sebagai satu unit) pada pasien tuntutan rendah atau yang tidak toleran operasi.",opsi:[{id:"nonop",nama:{id:"Sling (± reduksi tertutup)",en:"Sling (± closed reduction)"},gambar:"sling",utama:["Stabil, bergerak sebagai satu unit","Pasien lemah / kontraindikasi bedah / > 75 tahun tuntutan rendah"],ref:[D(216),z(592)],tatalaksana:"nonop"},{id:"pin",nama:{id:"Reduksi tertutup + pin/sekrup perkutan",en:"Closed reduction + percutaneous pins/screws"},gambar:"humerus-proksimal:pin-perkutan",utama:["Pasien muda, tulang baik, pola simpel","Bukan untuk head-split, fraktur-dislokasi, atau kalkar medial yang hancur"],ref:[D(216),z(603)],tatalaksana:"pin"},{id:"plat",nama:{id:"ORIF plat locking",en:"ORIF locking plate"},gambar:"humerus-proksimal:plat-locking",utama:["Pilihan utama fraktur kolum chirurgicum bergeser","Pergeseran bermakna, varus/valgus berlebihan"],ref:[D(216),z(603)],tatalaksana:"plat"},{id:"nail",nama:{id:"Nail intramedular",en:"Intramedullary nail"},gambar:"humerus-proksimal:nail-humerus",utama:["Dua-bagian kolum chirurgicum bergeser total, termasuk lansia","Cincin proksimal relatif utuh tetapi kepala tidak stabil terhadap batang"],ref:z(603),tatalaksana:"nail"},{id:"artroplasti",nama:{id:"Prostesis (hemi / reverse)",en:"Arthroplasty (hemi / reverse)"},gambar:"humerus-proksimal:reverse",utama:["Osteopenia ekstrem dengan fiksasi tak mungkin"],ref:D(216),tatalaksana:"artroplasti"}]},"tuberositas-mayor":{intro:"Pergeseran > 5–10 mm (5 mm superior) berarti nonunion dan impingement subakromial bila dibiarkan.",ref:D(216),opsi:[{id:"nonop",nama:{id:"Sling",en:"Sling"},gambar:"sling",utama:["Pergeseran < 5 mm","Tereduksi setelah reduksi dislokasi anterior"],ref:D(216),tatalaksana:"nonop"},{id:"jahit",nama:{id:"Fiksasi jahitan / anchor ± perbaikan rotator cuff",en:"Suture/anchor fixation ± cuff repair"},gambar:"humerus-proksimal:jahitan-anchor",utama:["Fragmen tuberositas terisolasi — jahitan lebih andal daripada sekrup","Tulang baik: sekrup lag masih bisa"],ref:[D(216),z(600)],tatalaksana:"jahit"}]},"tuberositas-minor":{intro:"Umumnya tertutup; operasi bila fragmen menghalangi rotasi internal.",opsi:[{id:"nonop",nama:{id:"Sling",en:"Sling"},gambar:"sling",utama:["Tanpa hambatan rotasi internal","Singkirkan dislokasi posterior"],ref:D(216),tatalaksana:"nonop"},{id:"jahit",nama:{id:"Fiksasi jahitan / sekrup",en:"Suture / screw fixation"},gambar:"humerus-proksimal:jahitan-anchor",utama:["Fragmen bergeser menghalangi rotasi internal"],ref:D(216),tatalaksana:"jahit"}]},"collum-anatomicum":{intro:"Jarang dan tidak bisa direduksi tertutup; osteonekrosis sering.",opsi:[{id:"plat",nama:{id:"ORIF (pasien muda)",en:"ORIF (younger patients)"},gambar:"humerus-proksimal:plat-locking",utama:["Pasien muda"],ref:D(216),tatalaksana:"plat"},{id:"artroplasti",nama:{id:"Prostesis (lansia)",en:"Arthroplasty (older patients)"},gambar:"humerus-proksimal:hemiartroplasti",utama:["Lansia","Fraktur-dislokasi kolum anatomikum (osteonekrosis tinggi)"],ref:[D(216),D(217)],tatalaksana:"artroplasti"}]},"3-bagian":{intro:"Bergeser → operatif, kecuali pasien sangat lemah; pertahankan suplai darah dengan diseksi minimal.",opsi:[{id:"plat",nama:{id:"ORIF plat locking",en:"ORIF locking plate"},gambar:"humerus-proksimal:plat-locking",utama:["Pasien muda — upaya pertama","Lansia: plat locking memperluas indikasi, tetapi siapkan prostesis"],ref:[D(217),z(603)],tatalaksana:"plat"},{id:"nail",nama:{id:"Nail intramedular (multilock)",en:"Multilock IM nail"},gambar:"humerus-proksimal:nail-humerus",utama:["Tipe 3-bagian tertentu dengan cincin proksimal relatif utuh"],ref:z(601),tatalaksana:"nail"},{id:"artroplasti",nama:{id:"Prostesis (hemi / reverse)",en:"Arthroplasty"},gambar:"humerus-proksimal:reverse",utama:["Lansia bila fiksasi tidak memungkinkan","Reverse makin dipilih karena penyembuhan tuberositas pada hemiartroplasti tidak terprediksi"],ref:D(217),tatalaksana:"artroplasti"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Pasien sangat lemah / tidak toleran operasi"],ref:D(217),tatalaksana:"nonop"}]},"4-bagian":{intro:"Osteonekrosis 4–35%; ORIF bila tulang baik, kepala masih di glenoid, dan jaringan lunak kontinu — selebihnya prostesis pada lansia.",ref:D(217),opsi:[{id:"plat",nama:{id:"ORIF plat locking (+ jahitan/wire)",en:"ORIF locking plate (+ sutures/wires)"},gambar:"humerus-proksimal:plat-locking",utama:["Tulang baik, kepala di dalam glenoid, jaringan lunak kontinu","Sebagian besar 4-bagian pada pasien muda (AO)"],ref:[D(217),z(603)],tatalaksana:"plat"},{id:"artroplasti",nama:{id:"Reverse total shoulder (lansia)",en:"Reverse total shoulder (elderly)"},gambar:"humerus-proksimal:reverse",utama:["Prostesis primer pada lansia","Fraktur-dislokasi berat atau rotator cuff defisien"],ref:[D(217),z(603)],tatalaksana:"artroplasti"},{id:"hemi",nama:{id:"Hemiartroplasti",en:"Hemiarthroplasty"},gambar:"humerus-proksimal:hemiartroplasti",utama:["Pasien paruh baya dengan fraktur-dislokasi 3–4 bagian berat","Bukan untuk lansia dengan tuberositas kominutif osteoporotik"],ref:z(603),tatalaksana:"artroplasti"}]},"valgus-impaksi":{intro:"Varian dengan osteonekrosis lebih rendah; hasil ORIF sangat baik.",opsi:[{id:"pin",nama:{id:"Reduksi + pin perkutan",en:"Reduction + percutaneous pins"},gambar:"humerus-proksimal:pin-perkutan",utama:["Pola valgus-terimpaksi dengan tulang baik"],ref:z(603),tatalaksana:"pin"},{id:"plat",nama:{id:"ORIF plat locking",en:"ORIF locking plate"},gambar:"humerus-proksimal:plat-locking",utama:["Reduksi kepala dari valgus dengan elevator/bone tamp, lalu plat"],ref:[D(217),z(598)],tatalaksana:"plat"}]},"fraktur-dislokasi":{intro:"Reduksi dini wajib; dengan fraktur kolum, reduksi memerlukan anestesi umum dan relaksasi otot.",opsi:[{id:"reduksi",nama:{id:"Reduksi sendi lalu sling (2-bagian)",en:"Joint re
