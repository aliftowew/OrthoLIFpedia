), nilai ulang; MCL bila masih tak stabil; eksfiks engsel untuk instabilitas menetap"],ref:X(255),tatalaksana:"operatif"}]},triad:{intro:"Hampir semua fraktur-dislokasi dioperasi: fiksasi/penggantian kaput radius, fiksasi koronoid (atau perbaikan kapsul anterior), perbaikan LCL; MCL atau eksfiks engsel lateral hanya bila masih tak stabil. Eksisi kaput radius saja **kontraindikasi** — kegagalan tinggi karena instabilitas berulang.",ref:[X(255),X(256)],opsi:[{id:"rekonstruksi",nama:{id:"Rekonstruksi bertahap (koronoid → kaput radius → LCL)",en:"Stepwise reconstruction (coronoid → radial head → LCL)"},gambar:"dislokasi-siku:triad-rekonstruksi",utama:["Pendekatan posterior diperluas memberi akses lateral dan medial; > 50% origo ekstensor komunis robek","Kaput radius difiksasi atau diganti prostesis; LCL ke epikondilus lateral"],ref:[X(255),Ba(653)],tatalaksana:"operatif"},{id:"eksfiks",nama:{id:"+ MCL / fiksator eksternal engsel",en:"+ MCL / hinged external fixator"},gambar:"dislokasi-siku:eksfiks-engsel",utama:["Instabilitas menetap setelah rekonstruksi sisi lateral","Periksa ulang reduksi dan panjang radius lebih dulu"],ref:[X(256),Ba(650),Ba(653)],tatalaksana:"operatif"},{id:"nonop",nama:{id:"Nonoperatif (jarang)",en:"Nonoperative (rare)"},gambar:"dislokasi-siku:brace-engsel",utama:["Tujuan terapi jarang tercapai; pasien harus sadar risiko instabilitas, kaku, artrosis dari fraktur kaput radius"],ref:X(255),tatalaksana:"reduksi"}]},koronoid:{intro:"Takik troklea — terutama koronoid — harus dipulihkan; kontak radiokapitelar sangat penting; LCL lebih penting daripada MCL pada sebagian besar instabilitas traumatik, dan MCL biasanya sembuh dengan gerak aktif tanpa perbaikan.",ref:[X(253),X(254)],opsi:[{id:"orif",nama:{id:"Fiksasi koronoid (sekrup / plat kecil / jahitan kapsul)",en:"Coronoid fixation (screw / small plate / capsular suture)"},gambar:"dislokasi-siku:triad-rekonstruksi",utama:["Fragmen besar atau faset anteromedial dengan instabilitas","Pendekatan Hotchkiss (over-the-top) atau split FCU untuk faset anteromedial; cabang motorik pertama n. ulnaris di anterior harus dijaga"],ref:[Ba(644),Ba(645),Ba(648)],tatalaksana:"operatif"},{id:"nonop",nama:{id:"Nonoperatif + gerak dini",en:"Nonoperative + early motion"},gambar:"dislokasi-siku:brace-engsel",utama:["Ujung koronoid kecil dengan siku stabil (ligamen utuh: hingga 50% ujung koronoid boleh hilang)"],ref:[X(250),Ba(639)],tatalaksana:"reduksi"}]},"olekranon-fd":{intro:"Fraktur-dislokasi olekranon memerlukan plat posterior/medial precontoured atau LCP 3.5 yang memulihkan panjang, aligment, rotasi, dan koronoid — kawat angka-delapan + K-wire tidak cukup stabil tanpa plat.",ref:[Ba(652),Ba(653)],opsi:[{id:"plat",nama:{id:"ORIF plat ulna proksimal + fiksasi koronoid",en:"Proximal ulna plate + coronoid fixation"},gambar:"dislokasi-siku:monteggia-posterior",utama:["Transolekranon: reduksi langsung ulna, sekrup/plat koronoid; kapsul anterior yang avulsi dijahit anchor","Monteggia posterior: plat posterior mereduksi sendi radioulnar; kaput radius difiksasi/diganti; LCL diperbaiki"],ref:[Ba(652),Ba(653)],tatalaksana:"operatif"}]}},tatalaksana:{reduksi:{nama:{id:"Reduksi tertutup & tatalaksana nonoperatif",en:"Closed reduction and nonoperative care"},bab:[{judul:"Reduksi",isi:"Sedasi dan analgesia adekuat (atau anestesi umum/regional). Posterior: koreksi pergeseran medial/lateral, traksi longitudinal, lalu fleksi; traksi distal dengan siku fleksi. **Parvin**: tengkurap, traksi lembut ke bawah pada pergelangan beberapa menit, saat olekranon mulai tergelincir distal lengan atas diangkat lembut — tanpa asisten/anestesi bila lembut. **Meyn–Quigley**: hanya lengan bawah menggantung dari tepi brankar, tangan lain memandu olekranon. Dislokasi harus direduksi segera.",ref:[X(254),Ba(641)]},{judul:"Sesudah reduksi",isi:"Nilai ulang neurovaskular (hilangnya fungsi saraf setelah reduksi jarang → pertimbangkan eksplorasi untuk jepitan) dan uji busur gerak stabil. Stabil: splint 90°, lalu ortosis engsel setelah 3–5 hari yang mengizinkan gerak penuh terlindung. Tak stabil < 30° fleksi: pronasi lengan bawah dan nilai ulang — bila stabil, splint 90° pronasi lalu ortosis engsel yang mempertahankan pronasi. Tak stabil > 30° fleksi → operasi. Foto pascareduksi wajib.",ref:X(254)},{judul:"Brace & rehabilitasi",isi:"Ortosis engsel 6 minggu dengan ekstensi dan rotasi ditambah bertahap; kontrol radiologis ketat; setelah 6 minggu terapi fisik dengan peregangan terminal. Pemulihan gerak dan kekuatan 3–6 bulan. Imobilisasi umumnya jangan melebihi 2 minggu — kekakuan adalah aturan setelah dislokasi.",ref:[X(255),X(256)]},{judul:"Komplikasi",isi:"Kekakuan; n. ulnaris tersering (observasi; penurunan fungsi setelah manipulasi dan nyeri hebat → eksplorasi; tanpa pemulihan 3 bulan + EMG → eksplorasi); a. brakialis (reduksi segera, angiografi bila perfusi tak pulih); sindrom kompartemen (elevasi, hindari hiperfleksi); instabilitas berulang jarang pada dislokasi posterior terisolasi; artrosis lebih sering pada fraktur-dislokasi; osifikasi heterotopik — meningkat dengan reduksi berulang, trauma jaringan lunak, fraktur penyerta; manipulasi paksa dihindari; indometasin kontroversial; radiasi profilaksis tidak lagi dianjurkan.",ref:[X(256),X(257)]}]},operatif:{nama:{id:"Tatalaksana operatif instabilitas siku",en:"Operative treatment of elbow instability"},bab:[{judul:"Prinsip",isi:"Pulihkan stabilitas intrinsik: takik troklea (koronoid dan olekranon), kaput radius, dan LCL diperbaiki/direkonstruksi; MCL jarang perlu diperbaiki — sembuh dengan gerak aktif. Tujuan operasi: siku stabil agar gerak aktif dimulai idealnya saat luka kering (48 jam), paling lambat 1 minggu.",ref:[X(253),X(254),Ba(655)]},{judul:"Dislokasi simpel",isi:"Reduksi terbuka dan perbaikan jaringan lunak ke humerus distal: LCL dulu (suture anchor atau terowongan tulang), nilai ulang stabilitas; MCL dipertimbangkan bila masih tak stabil; fiksasi eksternal engsel untuk instabilitas menetap.",ref:X(255)},{judul:"Terrible triad",isi:"Pendekatan posterior diperluas (akses lateral + medial). Periksa kapsul dan ligamen lateral (origo ekstensor komunis robek > 50%). Urutan: koronoid direduksi–difiksasi dulu (bila tak bisa dari lateral → diseksi medial dengan merefleksi/membelah massa fleksor-pronator); kaput radius difiksasi atau diganti; kompleks ligamen lateral dilekatkan kembali ke epikondilus lateral. Bila masih tak stabil: periksa reduksi, perbaiki kapsul anterior/MCL (jahitan langsung atau anchor); masih tak stabil → fiksator eksternal engsel. Dengan LCL diperbaiki dan kontak radiokapitelar pulih, gerak aktif segera biasanya mungkin, imobilisasi ≤ 10 hari masih wajar.",ref:[X(255),Ba(653)]},{judul:"Koronoid",isi:"Hotchkiss *over-the-top* (membelah massa fleksor-pronator, brakialis direfleksi) untuk ujung dan faset anteromedial; alternatif split FCU antara kedua kepala — cabang artikular posterior n. ulnaris boleh dikorbankan, cabang motorik pertama (anterior) dijaga. Fragmen difiksasi sekrup lag atau plat 2.0; sekrup sudut variabel bermanfaat pada multifragmentari/osteoporotik.",ref:[Ba(644),Ba(645),Ba(648)]},{judul:"Fraktur-dislokasi olekranon",isi:"Transolekranon: pendekatan posterior, reduksi langsung ulna, fiksasi koronoid dengan sekrup/plat; kapsul anterior yang avulsi dijahit anchor bila tak stabil; plat precontoured posterior/medial atau LCP 3.5 sebagai buttress/jembatan — kawat angka-delapan + K-wire tidak cukup. Monteggia posterior: restorasi sempurna panjang-aligment-rotasi ulna dengan plat posterior mereduksi sendi radioulnar proksimal; koronoid dengan sekrup lag; korteks anterior ulna harus utuh agar plat berfungsi sebagai tension band; kaput radius difiksasi/diganti dan ligamen lateral dilekatkan kembali.",ref:[Ba(652),Ba(653)]},{judul:"Komplikasi & prognosis",isi:"Dini: kehilangan fiksasi, instabilitas, palsi n. interoseus posterior, infeksi, kekakuan, redislokasi. Lanjut: osifikasi heterotopik, kekakuan, implan menonjol, kegagalan implan, nonunion (terutama leher radius), neuropati ulnaris, artrosis, nyeri pergelangan pada Essex-Lopresti. Lebih dari 50% pasien mengalami ≥ 1 komplikasi; kontraktur kapsul masih membaik ≥ 1 tahun dengan peregangan; busur fungsional 30–120° fleksi dan > 120° total rotasi.",ref:Ba(655)}]}}}});var Zs={};Oa(Zs,{default:()=>Pt});var ta,wa,Pt,Gs=ga(()=>{ta=a=>({buku:"HoF",bab:"19",hlm:a}),wa=a=>({buku:"AO",bab:"6.3.1",hlm:a}),Pt={id:"olekranon",nama:{id:"Olekranon",en:"Olecranon"},sumber:[{buku:"HoF",bab:"19",hlm:{awal:258,akhir:264}},{buku:"AO",bab:"6.3.1",hlm:{awal:637,akhir:656}}],gambar:"olekranon:transversal",intro:{id:"Fraktur olekranon yang bergeser adalah putusnya mekanisme ekstensor: tidak bisa meluruskan siku melawan gravitasi berarti operasi. Transversal simpel → tension band; kominutif, meluas distal koronoid, atau fraktur-dislokasi → plat.",en:"A displaced olecranon fracture is a disrupted extensor mechanism: inability to extend the elbow against gravity means surgery. Simple transverse → tension band; comminuted, extending distal to the coronoid, or fracture-dislocation → plate."},introRef:[ta(259),ta(263),wa(646)],pemeriksaan:{klinis:[{teks:"Lengan ditopang tangan sebelahnya dengan siku agak fleksi; abrasi di olekranon/tangan menunjukkan mekanisme. Defek teraba di lokasi fraktur; **tak mampu ekstensi aktif melawan gravitasi** = diskontinuitas mekanisme triseps.",ref:ta(259)},{teks:"Evaluasi neurosensorik: n. ulnaris dekat dengan ulna proksimal — cedera mungkin terutama pada fraktur kominutif energi tinggi; dislokasi penyerta harus direduksi dan dibidai secepatnya.",ref:[ta(259),wa(637)]}],radiologis:[{teks:"AP dan lateral; **lateral sejati** wajib — memperlihatkan luas fraktur, kominusi, keterlibatan permukaan sendi, dan pergeseran kaput radius. AP untuk menyingkirkan fraktur/dislokasi penyerta, meski humerus distal dapat menutupi detail.",ref:ta(259)},{teks:"Fraktur olekranon transversal/oblik simpel belum tentu stabil — dapat menyertai dislokasi siku atau lengan bawah; CT untuk kasus kompleks.",ref:wa(638)}],mekanisme:[{teks:"Langsung: jatuh pada ujung siku → kominutif (lebih jarang). Tidak langsung: kontraksi eksentrik triseps yang kuat pada siku fleksi → transversal/oblik (lebih sering). Kombinasi/kekerasan ekstrem → kominutif bergeser atau fraktur-dislokasi dengan fragmen ulna distal dan kaput radius ke anterior.",ref:ta(258)},{teks:"Olekranon subkutan sehingga rentan trauma langsung dan fraktur terbuka; tendon triseps membungkus kapsul sebelum berinsersi — fraktur bergeser = putusnya mekanisme ekstensor.",ref:[ta(258),wa(637)]},{teks:"Pusat osifikasi muncul 10 tahun, menyatu ± 16 tahun; lempeng epifisis persisten pada dewasa biasanya bilateral dan familial — jangan dikira fraktur.",ref:ta(258)}],epidemiologi:[{teks:"Bimodal: muda energi tinggi, tua jatuh sederhana; 11,5/100.000/tahun; **8–10%** fraktur siku; ulna proksimal ≈ 10% lesi ekstremitas atas.",ref:[ta(258),wa(637)]}]},klasifikasi:[{nama:"Mayo",teks:"I tak bergeser/minimal (IA tanpa kominusi, IB kominutif) → nonoperatif; II fragmen proksimal bergeser tanpa instabilitas siku (IIA tanpa kominusi → tension band; IIB kominutif → plat); III dengan instabilitas ulnohumeral → operasi.",ref:ta(259)},{nama:"Schatzker",teks:"Transversal (avulsi di apeks takik sigmoid); transversal-impaksi (depresi artikular dari gaya langsung); oblik (hiperekstensi, dari tengah takik ke distal); kominutif dengan cedera penyerta (koronoid → instabilitas); oblik-distal (melewati koronoid → stabilitas terganggu); fraktur-dislokasi.",ref:ta(260)},{nama:"AO/OTA 2U1 & Nijs–Devriendt",teks:"2U1A ekstraartikular, 2U1B artikular parsial, 2U1C artikular komplet. Patomekanis: A bending pada siku terkunci (metadiafisis); B1–B2 putusnya mekanisme ekstensor, B3 fraktur geser koronoid; C impaksi humerus distal ke ulna proksimal.",ref:wa(640)}],kelompok:[{id:"simpel",nama:{id:"Tak bergeser & transversal/oblik simpel",en:"Nondisplaced and simple transverse/oblique"},kode:"Mayo I–IIA",jenis:[{id:"tak-bergeser",nama:{id:"Tak bergeser / minimal",en:"Nondisplaced / minimally displaced"},kode:"Mayo I",gambar:"olekranon:tak-bergeser",ringkas:"Mekanisme ekstensor masih berfungsi; nonoperatif dengan kontrol radiologis 5–7 hari.",ref:[ta(259),ta(261)],indikasi:"tak-bergeser"},{id:"transversal",nama:{id:"Transversal bergeser (avulsi)",en:"Displaced transverse (avulsion)"},kode:"Mayo IIA · 2U1B1",gambar:"olekranon:transversal",ringkas:"Tarikan triseps–brakialis di apeks takik; fragmen proksimal tertarik ke atas; tension band ideal.",ref:[ta(259),ta(260)],indikasi:"bergeser-simpel"},{id:"oblik",nama:{id:"Oblik",en:"Oblique"},kode:"Mayo IIA",gambar:"olekranon:oblik",ringkas:"Hiperekstensi; dari tengah takik berjalan distal; cenderung bergeser saat kawat dikencangkan → sekrup lag/plat.",ref:[ta(260),wa(646)],indikasi:"bergeser-simpel"}]},{id:"kompleks",nama:{id:"Kominutif, distal koronoid, fraktur-dislokasi",en:"Comminuted, distal to coronoid, fracture-dislocation"},kode:"Mayo IIB–III",jenis:[{id:"kominutif",nama:{id:"Kominutif",en:"Comminuted"},kode:"Mayo IIB",gambar:"olekranon:kominutif",ringkas:"Trauma langsung; depresi artikular harus diangkat dan ditopang; tension band tidak bekerja → plat.",ref:[ta(259),wa(645),wa(647)],indikasi:"kompleks"},{id:"oblik-distal",nama:{id:"Oblik-distal (melewati koronoid)",en:"Oblique-distal (past the coronoid)"},kode:"",gambar:"olekranon:oblik-distal",ringkas:"Meluas distal dari koronoid dan mengganggu stabilitas siku; selalu plat.",ref:[ta(260),ta(263)],indikasi:"kompleks"},{id:"fraktur-dislokasi",nama:{id:"Fraktur-dislokasi (Mayo III)",en:"Fracture-dislocation (Mayo III)"},kode:"2U1C3",gambar:"olekranon:transolekranon",ringkas:"Instabilitas ulnohumeral; transolekranon anterior atau Monteggia posterior — lihat juga segmen dislokasi siku.",ref:[ta(259),wa(651),wa(652)],indikasi:"kompleks"}]}],indikasi:{"tak-bergeser":{intro:"Nonoperatif untuk fraktur minimal bergeser dan sebagian fraktur bergeser pada lansia dengan fungsi rendah; stabilitas cukup pada 3 minggu untuk mulai gerak terlindung.",ref:ta(261),opsi:[{id:"splint",nama:{id:"Gips/splint lengan panjang 45–90° → gerak pada 3 minggu",en:"Long arm cast/splint at 45–90° → motion at 3 weeks"},gambar:"humerus-distal:splint-posterior",utama:["Minimal bergeser; pasien dapat diandalkan boleh mulai gerak setelah 5–7 hari","Foto ulang 5–7 hari untuk mendeteksi pergeseran"],ref:[ta(261),ta(262)],tatalaksana:"nonop"}]},"bergeser-simpel":{intro:"Setiap fraktur bergeser = putusnya mekanisme ekstensor → operasi; tension band untuk fraktur tanpa kominusi proksimal dari koronoid, sekrup lag/plat untuk oblik yang cenderung bergeser.",ref:[ta(262),ta(263),wa(646)],opsi:[{id:"tbw",nama:{id:"Tension band wiring (2 K-wire + kawat angka-delapan)",en:"Tension band wiring (two K-wires + figure-of-eight)"},gambar:"olekranon:tension-band",utama:["Transversal/oblik simpel proksimal dari koronoid (B1/B2) dengan kualitas tulang baik","Hasil sangat baik; implan sering perlu dilepas"],ref:[ta(262),ta(263),wa(645)],tatalaksana:"tension-band"},{id:"sekrup",nama:{id:"Sekrup intramedular 6.5 / nail terkunci",en:"6.5 intramedullary screw / locked nail"},gambar:"olekranon:sekrup-im",utama:["Sekrup harus mencapai kanal distal; waspadai lengkung kanal ulna","Nail terkunci lewat ujung olekranon: hasil baik, iritasi jaringan lunak lebih sedikit"],ref:[ta(263),wa(648)],tatalaksana:"operatif-lain"},{id:"plat",nama:{id:"Plat (tension band plate)",en:"Plate (tension band plate)"},gambar:"olekranon:plat",utama:["Oblik yang bergeser saat kawat dikencangkan","Tulang osteoporotik (migrasi implan tinggi pada tension band)"],ref:[wa(645),wa(646)],tatalaksana:"plat"},{id:"nonop",nama:{id:"Nonoperatif pada lansia fungsi rendah",en:"Nonoperative in low-demand elderly"},gambar:"humerus-distal:splint-posterior",utama:["Gips 5 hari lalu sling + mobilisasi aktif: 22 dari 28 nonunion, tetapi fungsi baik (fleksi 140°, ekstensi −15°) tanpa operasi"],ref:wa(641),tatalaksana:"nonop"}]},kompleks:{intro:"Plat untuk semua jenis fraktur ulna proksimal: kominutif (plat jembatan), meluas distal koronoid, Monteggia (kompresi), fraktur-dislokasi transolekranon; kawat angka-delapan + K-wire tidak cukup stabil di sini.",ref:[ta(263),wa(652)],opsi:[{id:"plat",nama:{id:"Plat ulna proksimal (precontoured / LCP 3.5 / rekonstruksi)",en:"Proximal ulna plate (precontoured / LCP 3.5 / reconstruction)"},gambar:"olekranon:plat",utama:["Kominutif, oblik-distal, fraktur-dislokasi","Plat locking precontoured lebih baik pada tulang buruk dan fraktur sangat proksimal"],ref:[ta(263),wa(647)],tatalaksana:"plat"},{id:"eksisi",nama:{id:"Eksisi fragmen + perbaikan triseps",en:"Fragment excision + triceps repair"},gambar:"olekranon:eksisi",utama:["Nonunion, kominusi luas, lansia osteopenik berat dengan kebutuhan rendah, ekstraartikular","Hingga 50% olekranon efektif; **kontraindikasi** pada fraktur-dislokasi atau fraktur kaput radius"],ref:ta(263),tatalaksana:"operatif-lain"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif",en:"Nonoperative treatment"},bab:[{judul:"Imobilisasi",isi:"Gips atau splint lengan panjang dengan siku fleksi 45–90° (disukai banyak penulis); pada pasien yang dapat diandalkan, splint posterior/ortosis dengan gerak bertahap setelah 5–7 hari. Foto ulang dalam 5–7 hari untuk menyingkirkan pergeseran; union tulang biasanya belum lengkap sampai 6–8 minggu.",ref:[ta(261),ta(262)]},{judul:"Gerak",isi:"Umumnya stabilitas cukup pada 3 minggu untuk melepas gips dan memulai gerak terlindung — hindari ekstensi aktif dan fleksi > 90°.",ref:ta(262)},{judul:"Lansia fungsi rendah",isi:"AO: nonoperatif untuk fraktur bergeser (2U1B1) pada lansia berkebutuhan rendah; seri 28 pasien dengan gips 5 hari lalu sling dan mobilisasi aktif — 22 nonunion, tak satu pun memerlukan operasi, fungsi baik.",ref:wa(641)}]},"tension-band":{nama:{id:"Tension band wiring",en:"Tension band wiring"},bab:[{judul:"Prinsip & indikasi",isi:"Mengubah gaya tarik triseps menjadi kompresi di permukaan sendi; untuk fraktur avulsi tanpa kominusi proksimal dari koronoid (sisi kompresi artikular utuh). Studi biomekanik terbaru: tak ada konversi distraksi→kompresi sepanjang gerak, tetapi hasil klinis pada tulang baik sangat baik; migrasi implan tinggi pada osteoporosis dan fraktur kompleks.",ref:[ta(262),ta(263),wa(645)]},{judul:"Teknik",isi:"Posisi telentang (lengan di dada), lateral, atau tengkurap; insisi posterior langsung dari suprakondiler sampai 4–5 cm distal fraktur, dapat melengkung ke radial melindungi n. ulnaris; flap tebal penuh; insersi ankoneus dilepas dekat ulna. Siku difleksikan, sendi dibersihkan, fragmen artikular yang terimpaksi diangkat dan ditopang pengganti tulang; reduksi langsung dengan hook/klem runcing sambil siku diekstensikan. Dua K-wire 1.6–1.8 mm paralel dekat permukaan sendi menembus korteks anterior (atau teknik inside-out); kawat baja 1.0 mm angka-delapan lewat lubang bor 2 mm di ulna distal dan di bawah tendon triseps; dipilin di kedua sisi untuk kompresi simetris; K-wire dibengkokkan 180° dan dibenamkan di bawah tendon triseps agar tidak keluar saat ekstensi aktif. Kawat yang menonjol melewati korteks anterior dapat menghambat rotasi atau mengiritasi n. interoseus anterior.",ref:[ta(262),ta(263),wa(643),wa(645),wa(646),wa(647)]},{judul:"Oblik",isi:"Bila fraktur oblik cenderung bergeser saat kawat dikencangkan, tambahkan atau ganti K-wire dengan sekrup lag 4 mm; plat adalah alternatif.",ref:wa(646)},{judul:"Pascaoperasi",isi:"Splint posterior; dengan perbaikan stabil, latihan gerak dini.",ref:ta(263)},{judul:"Komplikasi",isi:"Implan simtomatik hingga 80% (pelepasan 34–66%, lebih rendah dengan plat locking precontoured/nail); kegagalan implan 1–5%; infeksi 0–6%; migrasi pin 15%; neuritis ulnaris 2–12%; osifikasi heterotopik 2–13%; nonunion 5%; penurunan gerak hingga 50% (terutama ekstensi) dengan sedikit keterbatasan fungsional.",ref:[ta(263),ta(264)]}]},plat:{nama:{id:"Fiksasi plat ulna proksimal",en:"Proximal ulna plate fixation"},bab:[{judul:"Indikasi",isi:"Semua tipe: simpel (tension band plate), kominutif (plat jembatan), Monteggia (kompresi), transolekranon; wajib bila fraktur meluas distal dari koronoid. Plat tipe A (metadiafisis) dengan stabilitas relatif memulihkan panjang-rotasi-aligment; B dan C artikular → rekonstruksi anatomis dengan stabilitas absolut.",ref:[ta(263),wa(647)]},{judul:"Teknik",isi:"Plat 1/3 tubular, LCP 3.5, atau rekonstruksi dibentuk mengitari ujung olekranon sebagai tension band; dijangkarkan dulu ke olekranon dengan dua sekrup, klem Verbrugge distal menekan fraktur; sekrup lag tambahan lewat plat; LCP dengan locking head screws untuk fraktur sangat proksimal; plat precontoured olekranon. Pada B1/B2, plat dengan ekstensi proksimal panjang diselipkan lewat belahan longitudinal tendon triseps untuk menetralkan tarikan triseps. Tipe C: fokus pada fragmen pemegang koronoid (keystone) — sekrup lag atau plat 2.0 untuk fragmen terpisah, sekrup sudut variabel pada multifragmentari/osteoporotik.",ref:[wa(647),wa(648)]},{judul:"Fraktur-dislokasi",isi:"Transolekranon: plat posterior/medial precontoured atau LCP 3.5 menopang fragmen artikular intercalated atau menjembatani kominusi; koronoid difiksasi sekrup/plat; kapsul anterior yang avulsi dijahit anchor. Monteggia posterior: restorasi panjang-aligment-rotasi dengan plat posterior mereduksi sendi radioulnar proksimal; korteks anterior ulna harus utuh agar plat bekerja sebagai tension band; kaput radius difiksasi/diganti, ligamen lateral dilekatkan kembali.",ref:[wa(652),wa(653)]},{judul:"Hasil",isi:"Plat precontoured dengan kemampuan locking memberi fiksasi metafisis lebih baik daripada plat konvensional, terutama pada tulang buruk; iritasi jaringan lunak dari implan subkutan sering memerlukan pelepasan.",ref:[ta(263),wa(648)]}]},"operatif-lain":{nama:{id:"Sekrup/nail intramedular & eksisi",en:"Intramedullary screw/nail and excision"},bab:[{judul:"Sekrup intramedular",isi:"Sekrup kanselus 6.5 harus cukup panjang untuk mengait kanal intramedular distal; dapat dikombinasikan dengan tension band; waspadai lengkung kanal ulna yang dapat menggeser fraktur saat sekrup dimajukan.",ref:ta(263)},{judul:"Nail intramedular",isi:"Nail terkunci lewat ujung olekranon memberi hasil baik; AO (Nijs): nail kompresi pada tipe B dan nail terkunci pada tipe A dengan fungsi baik tanpa iritasi jaringan lunak yang memerlukan pelepasan.",ref:[ta(263),wa(648)]},{judul:"Eksisi + perbaikan triseps",isi:"Nonunion, kominusi luas, lansia osteopenik berat berkebutuhan rendah, ekstraartikular. Eksisi hingga 50% olekranon efektif (Wolfgang); stabilitas menurun seiring besar fragmen yang dieksisi, dan menyelaraskan tendon triseps dengan permukaan anterior takik sigmoid menambah stabilitas (Morrey). Kontraindikasi pada fraktur-dislokasi siku atau fraktur kaput radius. Dengan ligamen utuh, seluruh ujung olekranon dapat direseksi tanpa mengganggu stabilitas.",ref:[ta(263),wa(639)]}]}}}});var zs={};Oa(zs,{default:()=>Tt});var ea,ca,Tt,Vs=ga(()=>{ea=a=>({buku:"HoF",bab:"20",hlm:a}),ca=a=>({buku:"AO",bab:"6.3.1",hlm:a}),Tt={id:"kaput-radius",nama:{id:"Kaput radius",en:"Radial head"},sumber:[{buku:"HoF",bab:"20",hlm:{awal:265,akhir:272}},{buku:"AO",bab:"6.3.1",hlm:{awal:637,akhir:656}}],gambar:"kaput-radius:mason-2",intro:{id:"Sepertiga dari semua fraktur siku. Pertanyaan kuncinya: adakah hambatan mekanis rotasi lengan bawah, dan apakah sikunya stabil? Tanpa hambatan → sling dan gerak dalam 24–48 jam; dengan ketidakstabilan → kaput radius harus dipertahankan (fiksasi atau prostesis), bukan dibuang.",en:"A third of all elbow fractures. The key questions: is there a mechanical block to forearm rotation, and is the elbow stable? No block → sling and motion within 24–48 hours; instability → the radial head must be kept (fixation or prosthesis), not discarded."},introRef:[ea(265),ea(268),ea(270)],pemeriksaan:{klinis:[{teks:"Gerak siku dan lengan bawah terbatas, nyeri pada rotasi pasif; nyeri tekan setempat di kaput radius; efusi siku.",ref:ea(266)},{teks:"Periksa lengan bawah distal dan pergelangan: nyeri tekan/stres di sendi radioulnar distal menandakan **lesi Essex-Lopresti**. Uji kompetensi MCL, terutama pada tipe IV (instabilitas valgus) — sulit dalam keadaan akut.",ref:ea(266)},{teks:"Aspirasi hemartrosis lewat pendekatan lateral langsung + injeksi lidokain mengurangi nyeri dan memungkinkan penilaian gerak pasif — mengenali hambatan mekanis.",ref:ea(266)}],radiologis:[{teks:"AP dan lateral; **Greenspan** (lengan bawah netral, berkas 45° sefalad) menampilkan sendi radiokapitelar; AP diambil tegak lurus lengan bawah karena siku sulit diekstensikan penuh.",ref:[ea(266),ca(637)]},{teks:"Fraktur tak bergeser dapat hanya tampak sebagai fat pad sign positif (posterior lebih sensitif). Keluhan lengan bawah/pergelangan → foto pergelangan. CT untuk kominusi/pergeseran fragmen dan perencanaan.",ref:[ea(267),ca(638)]}],mekanisme:[{teks:"Jatuh pada tangan terentang (energi lebih tinggi: jatuh dari ketinggian, olahraga); kaput radius pecah saat membentur kapitulum — beban aksial murni, gaya rotatori posterolateral, atau saat terdislokasi posterior pada Monteggia posterior/fraktur-dislokasi olekranon posterior.",ref:ea(265)},{teks:"Beban aksial pada fleksi 0–35° → fraktur koronoid; 0–80° → fraktur kaput radius. Sering disertai cedera ligamen siku, lebih jarang fraktur kapitulum.",ref:[ea(265),ea(266)]},{teks:"Kaput radius penahan sekunder valgus (menggeser pusat rotasi varus–valgus ke lateral sehingga beban MCL berkurang) dan bersama ligamen interoseus menjaga stabilitas longitudinal; migrasi proksimal radius terjadi setelah eksisi bila ligamen interoseus robek. Sudut leher–batang ± 140°; diameter kaput ± 22 mm (19,8–33,6).",ref:[ea(265),ca(638)]}],epidemiologi:[{teks:"**1,7–5,4%** semua fraktur dan sepertiga fraktur siku; sepertiga pasien memiliki cedera penyerta bahu/humerus/lengan bawah/pergelangan/tangan.",ref:ea(265)},{teks:"Insiden 28–39/100.000/tahun; terbanyak perempuan > 50 tahun dengan osteoporosis; pada muda (laki-laki) energi tinggi.",ref:ca(637)}]},klasifikasi:[{nama:"Mason (modifikasi)",teks:"I tak bergeser (pergeseran intraartikular < 2 mm, tanpa hambatan rotasi); II fragmen marginal bergeser > 2 mm/impaksi/angulasi, mungkin hambatan rotasi; III kominutif seluruh kaput, hambatan gerak; IV fraktur kaput radius dengan dislokasi siku.",ref:[ea(267),ea(268),ca(641)]},{nama:"AO/OTA 2R1",teks:"A ekstraartikular (A2 tilt kaput — sering dengan avulsi ligamen dan instabilitas), B artikular parsial (B1 geser ± fragmen intermediet), C artikular komplet (C3 fragmentasi dengan impaksi lateral).",ref:[ca(640),ca(643)]},{nama:"Pola rekonstruksi (AO)",teks:"Wedge, impaksi, multifragmentari, leher radius.",ref:ca(650)}],kelompok:[{id:"terisolasi",nama:{id:"Fraktur terisolasi",en:"Isolated fractures"},kode:"Mason I–III",jenis:[{id:"mason-1",nama:{id:"Mason I — tak bergeser",en:"Mason I — nondisplaced"},kode:"< 2 mm",gambar:"kaput-radius:mason-1",ringkas:"Sering hanya fat pad sign; sling dan gerak dini.",ref:[ea(267),ea(268)],indikasi:"stabil"},{id:"mason-2",nama:{id:"Mason II — marginal bergeser",en:"Mason II — displaced marginal"},kode:"> 2 mm",gambar:"kaput-radius:mason-2",ringkas:"Satu-satunya indikasi operasi yang disepakati: hambatan mekanis gerak; relatif: fragmen besar (> 25% keliling) bergeser > 2 mm.",ref:ea(269),indikasi:"mason-2"},{id:"mason-3",nama:{id:"Mason III — kominutif seluruh kaput",en:"Mason III — whole-head comminution"},kode:"",gambar:"kaput-radius:mason-3",ringkas:"ORIF hanya bila ≤ 2–3 fragmen dapat difiksasi stabil; selebihnya prostesis; eksisi akut hampir tak pernah bila ada instabilitas.",ref:[ea(270),ca(650)],indikasi:"mason-3"},{id:"leher",nama:{id:"Leher radius / tilt kaput",en:"Radial neck / head tilt"},kode:"2R1A2",gambar:"kaput-radius:leher",ringkas:"Jarang pada dewasa; tilt > 20° diangkat dan difiksasi dengan cangkok tulang dan sekrup/mini-plate; sering dengan avulsi ligamen.",ref:[ca(643),ca(649),ca(650)],indikasi:"mason-2"}]},{id:"kompleks",nama:{id:"Bagian dari cedera kompleks",en:"Part of a complex injury"},kode:"Mason IV · Essex-Lopresti",jenis:[{id:"mason-4",nama:{id:"Mason IV — dengan dislokasi siku",en:"Mason IV — with elbow dislocation"},kode:"",gambar:"kaput-radius:mason-4",ringkas:"Fragmen parsial pada cedera kompleks sering bergeser tanpa perlekatan jaringan lunak; stabilitas siku bergantung pada kaput radius — fiksasi bila simpel, prostesis bila tidak.",ref:ea(270),indikasi:"kompleks"},{id:"essex-lopresti",nama:{id:"Essex-Lopresti",en:"Essex-Lopresti"},kode:"",gambar:"kaput-radius:essex-lopresti",ringkas:"Robekan longitudinal ligamen interoseus + fraktur/dislokasi kaput radius + cedera DRUJ; sulit didiagnosis — nyeri pergelangan tanda paling sensitif; eksisi kaput → migrasi proksimal radius.",ref:[ea(271),ca(654)],indikasi:"kompleks"}]}],indikasi:{stabil:{intro:"Tak bergeser dan sebagian besar fraktur terisolasi bergeser tanpa hambatan gerak: nonoperatif — sling dan gerak dini 24–48 jam begitu nyeri reda.",ref:ea(268),opsi:[{id:"sling",nama:{id:"Sling + gerak dini",en:"Sling + early motion"},gambar:"sling",utama:["Tanpa hambatan mekanis rotasi","AO: pergeseran < 2 mm atau < 30% permukaan sendi; gerak penuh segera"],ref:[ea(268),ca(641)],tatalaksana:"nonop"},{id:"aspirasi",nama:{id:"Aspirasi hemartrosis ± anestesi lokal",en:"Hemarthrosis aspiration ± local anesthetic"},gambar:"kaput-radius:aspirasi",utama:["Meredakan nyeri akut dan memungkinkan uji gerak pasif","Manfaat jangka panjang masih diperdebatkan"],ref:[ea(266),ea(268),ca(641)],tatalaksana:"nonop"}]},"mason-2":{intro:"Hambatan mekanis gerak (dinilai setelah injeksi lidokain) adalah indikasi operasi yang disepakati; relatif: fragmen besar > 25% keliling dengan pergeseran > 2 mm tanpa hambatan.",ref:ea(269),opsi:[{id:"orif",nama:{id:"ORIF sekrup kecil (safe zone)",en:"Small-screw ORIF (safe zone)"},gambar:"kaput-radius:sekrup",utama:["Hambatan gerak; fragmen > 25% bergeser > 2 mm","Pendekatan Kocher/Kaplan, implan hanya di busur aman 90° antara stiloid radius dan tuberkel Lister"],ref:[ea(269),ea(270)],tatalaksana:"orif"},{id:"plat",nama:{id:"Mini T/L-plate pada leher (safe zone)",en:"Mini T/L-plate on the neck (safe zone)"},gambar:"kaput-radius:plat-leher",utama:["Impaksi, kominusi, atau fraktur leher penyerta","Plat precontoured dengan sekrup sudut-stabil menopang kaput di atas defek"],ref:[ca(649),ca(650)],tatalaksana:"orif"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Bergeser tanpa hambatan gerak dan tanpa instabilitas"],ref:ea(268),tatalaksana:"nonop"}]},"mason-3":{intro:"ORIF hanya bila fiksasi stabil dapat dicapai (dua fragmen); lebih dari tiga fragmen sering berhasil buruk → prostesis logam; eksisi akut jarang dan tak pernah bila berpotensi tak stabil.",ref:[ea(270),ca(650)],opsi:[{id:"orif",nama:{id:"Rekonstruksi di meja + sekrup/plat",en:"On-table reconstruction + screws/plate"},gambar:"kaput-radius:plat-leher",utama:["Dua fragmen (HoF); sebagian penulis melaporkan hasil baik pada multifragmentari","Sekrup posisi (bukan lag) pada impaksi agar kaput tidak menyempit"],ref:[ea(270),ca(649),ca(650)],tatalaksana:"orif"},{id:"prostesis",nama:{id:"Prostesis kaput radius logam",en:"Metal radial head prosthesis"},gambar:"kaput-radius:prostesis",utama:["> 3 fragmen / tak dapat direkonstruksi, terutama dengan instabilitas","Spacer agar kapsul-ligamen sembuh; hindari overstuffing"],ref:[ea(270),ca(650)],tatalaksana:"prostesis"},{id:"eksisi",nama:{id:"Eksisi kaput radius (tertunda)",en:"Radial head excision (delayed)"},gambar:"kaput-radius:eksisi",utama:["Jarang akut; tidak pernah pada fraktur-dislokasi, Essex-Lopresti, Monteggia","Eksisi lambat untuk Mason II–III: baik–sangat baik 80%"],ref:[ea(270),ca(650)],tatalaksana:"eksisi"}]},kompleks:{intro:"Pada siku/lengan bawah yang tak stabil, kaput radius harus dipertahankan: fiksasi bila polanya simpel dan dapat diandalkan, kalau tidak reseksi sisa kaput dan ganti prostesis logam; perbaiki ligamen anular/lateral; nilai DRUJ.",ref:[ea(270),ea(271),ca(650)],opsi:[{id:"orif",nama:{id:"ORIF (pola simpel, ≤ 2 fragmen)",en:"ORIF (simple pattern, ≤ 2 fragments)"},gambar:"kaput-radius:sekrup",utama:["Hanya bila fiksasi stabil dan dapat diandalkan","Dilanjutkan perbaikan ligamen lateral"],ref:[ea(270),ca(650)],tatalaksana:"orif"},{id:"prostesis",nama:{id:"Prostesis logam + perbaikan ligamen",en:"Metal prosthesis + ligament repair"},gambar:"kaput-radius:prostesis",utama:["Pilihan pada siku tak stabil; silikon ditinggalkan","Essex-Lopresti: kaput yang hancur diganti implan untuk menjaga hubungan radius–ulna; DRUJ dievaluasi/difiksasi"],ref:[ea(270),ea(271),ca(654)],tatalaksana:"prostesis"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif",en:"Nonoperative treatment"},bab:[{judul:"Protokol",isi:"Sling untuk kenyamanan dan gerak siku–lengan bawah 24–48 jam setelah cedera begitu nyeri reda; aspirasi sendi ± anestesi lokal dianjurkan sebagian penulis untuk nyeri. Nyeri menetap, kontraktur, dan inflamasi dapat berarti fraktur kapitulum (osteokondral) yang terlewat → MRI.",ref:[ea(268),ca(641)]},{judul:"Tujuan",isi:"Koreksi hambatan rotasi, gerak dini, stabilitas lengan bawah dan siku, membatasi artrosis ulnohumeral/radiokapitelar (yang terakhir jarang).",ref:ea(268)},{judul:"Komplikasi",isi:"Kontraktur siku — setelah imobilisasi singkat untuk nyeri, dorong fleksi–ekstensi dan rotasi; terapi fisik tak terbukti memperbaiki luaran jangka panjang cedera simpel. Titik akhir keras = kontraktur matur, implan menonjol, atau osifikasi heterotopik (risiko: floating elbow, operasi berulang, penundaan, imobilisasi lama). Nyeri pergelangan kronis = cedera ligamen interoseus/DRUJ/TFCC yang terlewat. Artritis pascatrauma, CRPS, instabilitas kronis (fraktur-dislokasi okult).",ref:ea(272)}]},orif:{nama:{id:"ORIF kaput & leher radius",en:"ORIF of the radial head and neck"},bab:[{judul:"Pendekatan",isi:"Telentang, lengan di meja tangan; **Kocher** antara ankoneus dan ekstensor karpi ulnaris (internervus sejati), insisi dari krista suprakondiler lateral 5 cm proksimal sendi; n. radialis bercabang setinggi kaput radius — retraktor anterior hati-hati; lindungi kompleks ligamen lateral yang tak cedera. Alternatif Kaplan. Rotasi lembut lengan bawah memperlihatkan keliling kaput dan leher.",ref:[ea(269),ca(641),ca(643),ca(644),ca(648)]},{judul:"Safe zone",isi:"Implan hanya di busur 90° antara stiloid radius dan tuberkel Lister (Caputo) atau di antara garis Smith–Hotchkiss — bagian kaput yang tidak berartikulasi dengan insisura ulna, agar tidak mengganggu rotasi.",ref:[ea(269),ca(648)]},{judul:"Fiksasi",isi:"Reduksi langsung dengan dental hook dan klem runcing; fiksasi sementara K-wire 1 mm. Parsial: sekrup lag 1.5/2.0/2.4 countersunk atau sekrup kompresi headless (sepenuhnya di dalam tulang). Impaksi: fragmen diangkat dengan hook/elevator, defek diisi cangkok kanselus dari epikondilus lateral, sekrup sebagai **sekrup posisi** (bukan lag) agar kaput tidak menyempit, ± miniplate. Multifragmentari: K-wire sementara, 2–3 sekrup 2 mm; pertahankan hubungan periosteum; T/L-plate kecil di luar sendi radioulnar proksimal. Artikular komplet: kaput direkonstruksi lalu difiksasi ke batang dengan plat di leher (safe zone), kaput dengan sekrup lag/headless. Leher: realign kaput, cangkok tulang, sekrup penopang/miniplate; tilt > 20° diangkat dan difiksasi.",ref:[ea(270),ca(648),ca(649),ca(650)]},{judul:"Ligamen & pascaoperasi",isi:"Setelah fiksasi/penggantian, ligamen anular diperbaiki dan stabilitas diuji sepanjang gerak; pada dislokasi penyerta, kompleks ligamen lateral dijahit nonabsorbable lewat lubang bor/anchor; instabilitas menetap → periksa reduksi dan panjang radius, eksplorasi/perbaiki MCL atau fiksator eksternal engsel. Gerak aktif/aktif-asistif dini; imobilisasi ≤ 5–7 hari.",ref:[ea(271),ca(650)]}]},prostesis:{nama:{id:"Prostesis kaput radius",en:"Radial head prosthesis"},bab:[{judul:"Rasional & indikasi",isi:"Spacer yang mencegah migrasi proksimal radius dan memulihkan stabilitas longitudinal/valgus sambil kapsul-ligamen sembuh; untuk kaput yang tak dapat direkonstruksi (> 3 fragmen) terutama pada siku tak stabil; silikon memberi fungsi buruk jangka panjang — implan logam (titanium, vitallium) menjadi pilihan.",ref:[ea(270),ca(650)]},{judul:"Kunci keberhasilan",isi:"Fiksasi stem stabil dan restorasi panjang radius yang tepat — kaput maksimal 1 mm di atas insisura; **overstuffing** (implan terlalu besar/panjang) adalah penyebab kegagalan bedah tersering. Luaran masih diperdebatkan: perubahan artritis hingga 50%, nyeri hingga 47%.",ref:[ea(270),ca(650)]},{judul:"Essex-Lopresti",isi:"Pulihkan stabilitas komponen siku dan DRUJ: perbaikan atau penggantian kaput radius dengan evaluasi DRUJ (reduksi dan pinning bila perlu); eksisi kaput menyebabkan migrasi proksimal; migrasi simtomatik dapat memerlukan sinostosis radioulnar.",ref:[ea(270),ea(271),ca(654)]}]},eksisi:{nama:{id:"Eksisi kaput radius",en:"Radial head excision"},bab:[{judul:"Kapan",isi:"Jarang diindikasikan untuk cedera terisolasi akut dan tak pernah pada situasi berpotensi tak stabil (fraktur-dislokasi, Essex-Lopresti, Monteggia). AO: karena instabilitas ligamen/longitudinal ada pada kebanyakan fraktur multifragmentari, hampir tak ada tempat untuk eksisi akut — lebih baik nonoperatif lalu eksisi tertunda untuk memulihkan rotasi setelah jaringan lunak sembuh dan siku stabil.",ref:[ea(270),ca(650)]},{judul:"Teknik & hasil",isi:"Pendekatan lateral langsung (n. interoseus posterior berisiko); level eksisi proksimal dari ligamen anular. Pasien umumnya sedikit keluhan, nyeri ringan sesekali, gerak hampir normal; DRUJ jarang simtomatik, migrasi proksimal rerata 2 mm (kecuali Essex-Lopresti). Eksisi lambat Mason II–III: baik–sangat baik 80%.",ref:ea(270)}]}}}});var Us={};Oa(Us,{default:()=>Ft});var K,Ca,Ft,qs=ga(()=>{K=a=>({buku:"HoF",bab:"21",hlm:a}),Ca=a=>({buku:"AO",bab:"6.3.2",hlm:a}),Ft={id:"radius-ulna-diafisis",nama:{id:"Diafisis radius & ulna",en:"Radius and ulna shaft"},sumber:[{buku:"HoF",bab:"21",hlm:{awal:273,akhir:283}},{buku:"AO",bab:"6.3.2",hlm:{awal:657,akhir:672}}],gambar:"radius-ulna-diafisis:kedua",intro:{id:"Lengan bawah adalah sebuah 'sendi' berbentuk cincin: bila satu tulang memendek, tulang lainnya patah atau sendi radioulnar lepas (Monteggia, Galeazzi). Karena itu fraktur bergeser pada dewasa hampir selalu ORIF dengan plat 3.5 — dengan lengkung radius dipulihkan sempurna.",en:"The forearm is a ring-shaped 'joint': if one bone shortens, the other breaks or a radioulnar joint dislocates (Monteggia, Galeazzi). Hence displaced fractures in adults are almost always plated with 3.5 plates — with the radial bow restored exactly."},introRef:[K(273),K(275),Ca(661)],pemeriksaan:{klinis:[{teks:"Deformitas kasar, nyeri, bengkak, hilangnya fungsi tangan–lengan bawah. Periksa denyut radialis–ulnaris dan n. medianus, radialis, ulnaris; tepi ulna subkutan — luka dangkal pun dapat memaparkan tulang.",ref:K(275)},{teks:"Nyeri hebat tak henti, kompartemen tegang, atau nyeri pada regangan pasif jari = **sindrom kompartemen** mengancam/terjadi → ukur tekanan, fasiotomi segera (kedua kompartemen anterior dan satu posterior).",ref:[K(275),Ca(670)]},{teks:"Monteggia: bengkak siku, deformitas, krepitasi, nyeri rotasi; cedera n. radialis/n. interoseus posterior sering (terutama Bado II). Galeazzi: nyeri pergelangan atau lengan bawah tengah yang bertambah saat DRUJ distres.",ref:[K(278),K(281)]}],radiologis:[{teks:"AP dan lateral lengan bawah **termasuk siku dan pergelangan** untuk menyingkirkan Monteggia/Galeazzi; garis melalui kaput dan batang radius harus selalu menuju kapitulum pada semua proyeksi; foto pembanding sisi sehat bila deformitas sulit dinilai.",ref:[K(275),K(279),Ca(657)]},{teks:"Tanda cedera DRUJ: fraktur basis stiloid ulna, DRUJ melebar pada AP, ulna subluksasi pada lateral, pemendekan radius > 5 mm; varians ulna paling berkaitan dengan instabilitas DRUJ.",ref:K(281)}],mekanisme:[{teks:"Energi tinggi (kecelakaan kendaraan/motor), trauma langsung saat melindungi kepala, luka tembak, jatuh dari ketinggian/olahraga; fraktur patologis jarang.",ref:K(274)},{teks:"Lengan bawah bekerja sebagai cincin; ulna relatif lurus menjadi sumbu rotasi radius yang melengkung lateral — lengkung radius yang tidak dipulihkan membatasi pronasi–supinasi. Pita sentral membran interoseus (± 3,5 cm) menyumbang stabilitas: pemotongannya saja mengurangi stabilitas 71%.",ref:K(273)},{teks:"Gaya deformasi: fraktur radius distal dari insersi supinator tetapi proksimal dari pronator teres → fragmen proksimal supinasi (biseps + supinator); distal dari keduanya → rotasi netral. Galeazzi: berat tangan (angulasi dorsal, subluksasi DRUJ), pronator kuadratus (pronasi–proksimal–volar), brakioradialis (pemendekan), ekstensor/abduktor ibu jari (pemendekan).",ref:[K(274),K(280),K(281)]},{teks:"Monteggia (Bado): I pronasi paksa; II beban aksial pada siku fleksi; III abduksi paksa siku; IV mekanisme I dengan batang radius ikut patah. Nightstick: pukulan langsung tepi ulna subkutan saat menangkis.",ref:[K(277),K(278)]}],epidemiologi:[{teks:"Lebih sering pada laki-laki (kecelakaan, olahraga kontak, perkelahian, jatuh dari ketinggian); rasio terbuka:tertutup tertinggi setelah tibia. AO: 10–14% semua fraktur, volume operasi naik > 200% (1996–2006).",ref:[K(273),Ca(657)]},{teks:"Galeazzi ≈ 3× lebih sering daripada Monteggia; radius sepertiga distal melibatkan DRUJ sampai terbukti sebaliknya.",ref:K(280)}]},klasifikasi:[{nama:"AO/OTA 2R2 / 2U2",teks:"A simpel, B wedge, C multifragmentari — radius dan ulna dikode terpisah (revisi 2018).",ref:Ca(658)},{nama:"Bado (Monteggia)",teks:"I dislokasi kaput radius anterior + fraktur diafisis ulna angulasi anterior; II posterior/posterolateral + angulasi posterior; III lateral/anterolateral + fraktur metafisis ulna; IV anterior + fraktur radius dan ulna sepertiga proksimal setinggi sama.",ref:K(279)},{nama:"Galeazzi & varian",teks:"Fraktur diafisis radius di pertemuan sepertiga tengah–distal + cedera DRUJ ('fracture of necessity'); varian di mana pun sepanjang radius atau kedua tulang dengan DRUJ; reverse Galeazzi = fraktur ulna distal + cedera DRUJ.",ref:K(280)},{nama:"Deskriptif",teks:"Terbuka/tertutup, lokasi, kominutif/segmental, pergeseran, angulasi, rotasi.",ref:K(275)}],kelompok:[{id:"kedua",nama:{id:"Kedua tulang",en:"Both bones"},kode:"2R2 + 2U2",jenis:[{id:"kedua",nama:{id:"Fraktur kedua tulang bergeser",en:"Displaced both-bone fracture"},kode:"",gambar:"radius-ulna-diafisis:kedua",ringkas:"Lengan bawah adalah sendi: ORIF plat kompresi 3.5 adalah pilihan pada dewasa; dua insisi terpisah.",ref:[K(275),K(276)],indikasi:"kedua"},{id:"kominutif",nama:{id:"Kominutif / segmental / terbuka",en:"Comminuted / segmental / open"},kode:"2R2C · 2U2C",gambar:"radius-ulna-diafisis:kedua-kominutif",ringkas:"Plat jembatan dengan stabilitas relatif tetapi panjang–rotasi–aligment harus tepat; terbuka boleh ORIF primer setelah debridemen kecuali sangat berat.",ref:[K(276),Ca(667)],indikasi:"kedua"}]},{id:"ulna",nama:{id:"Ulna",en:"Ulna"},kode:"2U2",jenis:[{id:"nightstick",nama:{id:"Nightstick (ulna terisolasi)",en:"Nightstick (isolated ulna)"},kode:"",gambar:"radius-ulna-diafisis:nightstick",ringkas:"Trauma langsung saat menangkis; angka delayed/nonunion tinggi meski tertutup dan simpel.",ref:[K(277),Ca(657)],indikasi:"nightstick"},{id:"monteggia",nama:{id:"Monteggia (Bado I–IV)",en:"Monteggia (Bado I–IV)"},kode:"",gambar:"radius-ulna-diafisis:monteggia-1",ringkas:"Fraktur ulna proksimal + dislokasi kaput radius; reduksi tertutup hanya untuk anak — dewasa ORIF ulna, kaput radius biasanya tereduksi sendiri (> 90%).",ref:[K(277),K(279)],indikasi:"monteggia"}]},{id:"radius",nama:{id:"Radius",en:"Radius"},kode:"2R2",jenis:[{id:"radius-terisolasi",nama:{id:"Radius proksimal ⅔ terisolasi",en:"Isolated proximal two-thirds radius"},kode:"",gambar:"radius-ulna-diafisis:radius-terisolasi",ringkas:"Terlindung otot ekstensor — jarang patah sendiri; hilangnya lengkung radius = indikasi ORIF.",ref:[K(280),K(282)],indikasi:"radius"},{id:"galeazzi",nama:{id:"Galeazzi",en:"Galeazzi"},kode:"fracture of necessity",gambar:"radius-ulna-diafisis:galeazzi",ringkas:"Radius sepertiga tengah–distal + cedera DRUJ; terapi tertutup gagal tinggi karena empat gaya deformasi — selalu ORIF.",ref:[K(280),K(282)],indikasi:"galeazzi"}]}],indikasi:{kedua:{intro:"Fraktur kedua tulang bergeser pada dewasa: ORIF plat kompresi 3.5 (LC-DCP) — dua insisi, pulihkan panjang ulna–radius, rotasi, dan lengkung radius. Nonoperatif hanya untuk yang tak bergeser (jarang).",ref:[K(275),K(276),Ca(661)],opsi:[{id:"plat",nama:{id:"ORIF dua plat LC-DCP 3.5",en:"ORIF with two 3.5 LC-DCP plates"},gambar:"radius-ulna-diafisis:plat-kedua",utama:["Semua fraktur bergeser kedua tulang; terbuka setelah debridemen","Simpel/wedge: stabilitas absolut + lag screw; multifragmentari: plat jembatan"],ref:[K(276),Ca(661),Ca(667)],tatalaksana:"orif"},{id:"gips",nama:{id:"Gips lengan panjang (tak bergeser)",en:"Long arm cast (nondisplaced)"},gambar:"gips-lengan-panjang",utama:["Tak bergeser, jarang; rotasi netral, siku 90°, kontrol ketat","AO: fraktur batang simpel tak bergeser dapat brace/gips"],ref:[K(275),Ca(661)],tatalaksana:"nonop"},{id:"eksfiks",nama:{id:"Fiksasi eksternal / nail IM",en:"External fixation / IM nail"},gambar:"radius-ulna-diafisis:eksfiks",utama:["Eksfiks: kehilangan tulang/jaringan lunak berat, kontaminasi, nonunion terinfeksi — sementara, segera ganti plat","Nail terkunci: segmental, terbuka dengan kehilangan tulang, patologis, plat gagal; kontrol rotasi masih dipertanyakan"],ref:[K(276),Ca(661),Ca(670)],tatalaksana:"orif"}]},nightstick:{intro:"Tak bergeser/minimal: splint sugar-tong 7–10 hari lalu brace fungsional 8 minggu atau sling + balut kompresi; bergeser > 10° atau > 50% lebar batang → ORIF plat DC 3.5.",ref:K(279),opsi:[{id:"brace",nama:{id:"Sugar-tong → brace fungsional / sling",en:"Sugar-tong → functional brace / sling"},gambar:"radius-ulna-diafisis:brace-lengan-bawah",utama:["Angulasi ≤ 10°, pergeseran ≤ 50%","Gerak aktif siku, pergelangan, tangan"],ref:K(279),tatalaksana:"nonop"},{id:"plat",nama:{id:"ORIF plat DC 3.5",en:"ORIF with 3.5 DC plate"},gambar:"radius-ulna-diafisis:plat-ulna",utama:["Angulasi > 10° (bidang apa pun) atau pergeseran > 50% lebar batang","AO: bergeser, rotasi > 10°, atau angulasi > 10° pada tulang tunggal"],ref:[K(279),Ca(661)],tatalaksana:"orif"}]},monteggia:{intro:"Operatif pada dewasa: ORIF ulna dengan plat DC/rekonstruksi 3.5 di sisi tegangan (dorsal, terutama Bado II); kaput radius umumnya tereduksi tertutup begitu panjang ulna pulih (> 90%).",ref:[K(279),K(280)],opsi:[{id:"orif",nama:{id:"ORIF ulna + reduksi tertutup kaput radius",en:"Ulna ORIF + closed reduction of the radial head"},gambar:"radius-ulna-diafisis:monteggia-orif",utama:["Semua Monteggia dewasa; reduksi tertutup + gips hanya untuk anak","Kaput tetap lepas → reduksi ulna tidak akurat (tersering), ligamen anular/n. radialis terjepit"],ref:[K(279),K(280),Ca(658),Ca(659)],tatalaksana:"orif"},{id:"kaput",nama:{id:"+ fiksasi/penggantian kaput radius",en:"+ radial head fixation/replacement"},gambar:"kaput-radius:prostesis",utama:["Fraktur kaput radius penyerta (sering pada Bado II)","Redislokasi > 6 minggu → artroplasti kaput radius + rekonstruksi ligamen"],ref:K(280),tatalaksana:"orif"}]},radius:{intro:"Radius proksimal: tak bergeser → gips lengan panjang sampai sembuh radiologis; setiap bukti hilangnya lengkung radius → ORIF plat DC 3.5.",ref:K(282),opsi:[{id:"gips",nama:{id:"Gips lengan panjang",en:"Long arm cast"},gambar:"gips-lengan-panjang",utama:["Tak bergeser dengan lengkung radius utuh"],ref:K(282),tatalaksana:"nonop"},{id:"plat",nama:{id:"ORIF plat DC 3.5",en:"ORIF with 3.5 DC plate"},gambar:"radius-ulna-diafisis:plat-kedua",utama:["Bergeser atau lengkung radius hilang","Pendekatan posterior (Thompson) memperlihatkan n. interoseus posterior pada radius proksimal"],ref:[K(276),K(282)],tatalaksana:"orif"}]},galeazzi:{intro:"ORIF adalah terapi pilihan (terapi tertutup gagal tinggi): plat DC 3.5 pada permukaan volar radius lewat pendekatan Henry; DRUJ dinilai setelah fiksasi — stabil → gerak dini; tak stabil → pin K-wire + supinasi 4–6 minggu.",ref:[K(282),Ca(659)],opsi:[{id:"orif",nama:{id:"ORIF radius (Henry, plat volar) + evaluasi DRUJ",en:"Radius ORIF (Henry, volar plate) + DRUJ assessment"},gambar:"radius-ulna-diafisis:galeazzi-orif",utama:["Semua Galeazzi","DRUJ tetap lepas → kapsulotomi dorsal; tak stabil → K-wire 2.0 dalam netral/sedikit supinasi + bidai"],ref:[K(282),Ca(659)],tatalaksana:"orif"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif",en:"Nonoperative treatment"},bab:[{judul:"Kedua tulang tak bergeser",isi:"Jarang; gips lengan panjang yang dicetak baik dalam rotasi netral dengan siku fleksi 90°, kontrol sering untuk mendeteksi hilangnya reduksi.",ref:K(275)},{judul:"Nightstick",isi:"Tak bergeser/minimal: splint sugar-tong 7–10 hari, lalu brace fungsional 8 minggu dengan gerak aktif siku–pergelangan–tangan, atau sling + balut kompresi. Nightstick berisiko delayed/nonunion tinggi meski tertutup dan simpel.",ref:[K(279),Ca(657)]},{judul:"Radius proksimal tak bergeser",isi:"Gips lengan panjang sampai ada bukti penyembuhan radiologis; hilangnya lengkung radius → ORIF.",ref:K(282)},{judul:"Monteggia & Galeazzi",isi:"Reduksi tertutup + gips Monteggia hanya untuk anak; Galeazzi tertutup gagal tinggi — keduanya operatif pada dewasa.",ref:[K(279),K(282)]}]},orif:{nama:{id:"ORIF plat lengan bawah",en:"Forearm plate fixation"},bab:[{judul:"Prinsip",isi:"Pulihkan panjang ulna dan radius (mencegah subluksasi PRUJ/DRUJ), rotasi, dan lengkung radius. Plat 3.5 (LC-DCP dianjurkan) ideal; 6 korteks / 3 sekrup bikortikal tiap fragmen utama (plat 7–8 lubang; lebih panjang untuk kompleks); lag screw interfragmen bila mungkin (3.5; 2.7/2.4 pada fragmen kecil); sekrup locking jarang diperlukan. Operasi tertutup idealnya < 24 jam; terbuka segera debridemen + fiksasi; penundaan meningkatkan risiko sinostosis.",ref:[K(276),Ca(661)]},{judul:"Pendekatan",isi:"Telentang di meja tangan. **Ulna**: insisi lurus sepanjang krista antara ekstensor dan fleksor karpi ulnaris; plat di permukaan posterior atau anterior, bukan di tepi subkutan; lindungi cabang kutaneus dorsal n. ulnaris 5–8 cm dari lipatan pergelangan. **Radius anterior (Henry)**: antara brakioradialis dan fleksor karpi radialis (distal) / pronator teres (proksimal); n. radialis superfisial di bawah brakioradialis direfleksi radial, a. radialis ke ulnar; untuk leher radius, supinator direfleksi ulnar→radial dalam supinasi penuh — supinasi paling melindungi n. interoseus posterior; untung untuk fraktur ke metafisis distal. **Posterior (Thompson)** untuk ⅓ proksimal–tengah, memungkinkan identifikasi PIN dalam supinator. **Dua insisi terpisah** dengan jembatan kulit lebar — satu insisi menaikkan cedera saraf dan sinostosis.",ref:[K(276),Ca(662),Ca(663),Ca(664)]},{judul:"Reduksi",isi:"Simpel (A) dan wedge (B): stabilitas absolut, reduksi anatomis + lag screw (2.7 lebih mudah pada dewasa kecil); multifragmentari (C): plat jembatan dengan stabilitas relatif tetapi panjang–aligment–rotasi tepat; stripping periosteum ≤ 1 mm tepi fraktur, tidak sirkumferensial; fragmen bebas berperlekatan dibiarkan, yang devital diganti cangkok kanselus. Kedua tulang: reduksi dulu tulang dengan fraktur lebih sederhana sebagai panduan panjang/rotasi tulang lain; teknik push-pull/eksfiks sementara untuk tipe C. Plat sedikit dipra-bengkok agar tidak menganga di sisi berlawanan; kompresi aksial dengan pengeboran eksentrik; pada oblik, kompresi plat dulu baru lag screw lewat plat. Cek rotasi penuh-simetris dan seluruh lengan bawah AP–lateral dengan C-arm penuh.",ref:[Ca(667),Ca(668)]},{judul:"Monteggia",isi:"ORIF ulna dengan plat DC/rekonstruksi 3.5 di sisi tegangan (dorsal), terutama Bado II; setelah panjang ulna pulih kaput radius biasanya stabil (> 90%); kaput tetap lepas → reduksi ulna tidak akurat (tersering), ligamen anular terjepit, jarang n. radialis/PIN → eksplorasi lateral terpisah atau perluas pendekatan dengan melepas ankoneus–supinator; fraktur kaput penyerta difiksasi/diganti. Pasca: splint posterior 5–7 hari lalu fleksi–ekstensi dan rotasi aktif (AO: gerak penuh dini atau bidai lepas-pasang supinasi 3 minggu).",ref:[K(280),Ca(658),Ca(659)]},{judul:"Galeazzi",isi:"Plat DC 3.5 di permukaan volar datar radius lewat Henry; reduksi radius yang benar biasanya mereduksi DRUJ spontan — bila ulna tetap subluksasi, penyebab tersering malreduksi halus radius. Instabilitas dorsal → kapsulotomi dorsal bila tetap lepas; DRUJ tereduksi tapi tak stabil → K-wire 2.0 (dewasa) dalam netral/sedikit supinasi + bidai siku–pergelangan, pin besar dan dibenamkan, dilepas 6–8 minggu; eksplorasi dorsal hanya bila reduksi tak dapat dipertahankan (tendon ECU terjepit). Stabil → gerak dini; tak stabil → supinasi 4–6 minggu.",ref:[K(282),Ca(659)]},{judul:"Terbuka & defek",isi:"Terbuka: ORIF primer setelah debridemen (hasil setara tertutup) kecuali sangat berat; cangkok pada penutupan primer tertunda atau 6 minggu (kontroversial). Eksfiks hanya bila plat tak dapat tertutup — unilateral, pin ulna perkutan, pin radius terbuka; konsolidasi jarang tercapai → ganti plat dini. Defek: plat jembatan + spacer semen lalu autograft 6–8 minggu (Masquelet); fibula vaskular/single-bone forearm untuk defek besar.",ref:[K(276),Ca(670)]},{judul:"Pascaoperasi",isi:"Fungsional: gerak aktif dini jari–pergelangan–siku–bahu; splint volar/sugar-tong 1 minggu untuk nyeri (lebih lama bila tak dapat diandalkan); hindari gips sirkular; foto 6 dan 12 minggu; beban 6–8 minggu. Implan tidak dilepas pada pasien asimtomatik — refraktur 3,5–25% (HoF: hingga 30% dengan implan fragmen besar), lebih tinggi bila dilepas < 12 bulan; titanium lebih sulit dilepas.",ref:[K(283),Ca(670),Ca(671)]},{judul:"Komplikasi",isi:"Nonunion 3,7–10,3% (kesalahan teknik: reduksi kurang, stripping berlebih, kompresi tak cukup; plat jembatan jangan untuk pola simpel); infeksi ≈ 3%; cedera saraf (PIN pada radius proksimal, n. radialis superfisial pada Henry, cabang dorsal n. ulnaris) — observasi 3 bulan lalu eksplorasi; sindrom kompartemen (10% pada luka tembak, ⅓ proksimal) → kontraktur Volkmann bila terlewat; sinostosis radioulnar 2,6–9% (kedua tulang setinggi sama 11%, cedera kepala, penundaan > 2 minggu, satu insisi, cangkok/sekrup menembus membran interoseus, remuk, infeksi) → eksisi setelah matur 6–9 bulan ± indometasin/radiasi; CRPS; malunion → hilang rotasi.",ref:[K(276),K(277),K(282),K(283),Ca(670),Ca(671)]}]}}}});var Js={};Oa(Js,{default:()=>Bt});var W,Rt,Bt,_s=ga(()=>{W=a=>({buku:"HoF",bab:"43",hlm:a}),Rt=a=>({buku:"HoF",bab:"42",hlm:a}),Bt={id:"klavikula-anak",nama:{id:"Klavikula anak",en:"Pediatric clavicle"},sumber:[{buku:"HoF",bab:"43",hlm:{awal:554,akhir:560}},{buku:"HoF",bab:"42",hlm:{awal:542,akhir:548}}],gambar:"klavikula-anak:utuh",intro:{id:"Tulang panjang yang paling sering patah pada anak — dan hampir selalu sembuh sendiri: selubung periosteum yang tebal tetap di posisi anatomis, sehingga remodeling terjamin dan 'dislokasi' ujung klavikula sebenarnya tulang yang keluar dari selubungnya.",en:"The most frequently fractured long bone in children — and it almost always heals by itself: the thick periosteal sleeve stays in anatomic position, so remodeling is assured, and 'dislocations' of the clavicle ends are really bone escaping its sleeve."},introRef:[W(554)],pemeriksaan:{klinis:[{teks:"Fraktur lahir biasanya jelas: benjolan teraba asimetris di atas klavikula, refleks Moro asimetris; yang tidak jelas bisa salah didiagnosis sebagai tortikolis muskular kongenital karena bayi memiringkan kepala ke sisi fraktur untuk mengendurkan sternokleidomastoid.",ref:W(555)},{teks:"Anak lebih besar: massa nyeri teraba di sepanjang klavikula; nyeri tekan biasanya setempat (difus pada *plastic bowing*); kulit dapat *tenting*, krepitasi, ekimosis.",ref:W(555)},{teks:"Periksa neurovaskular (pleksus brakialis, pembuluh ekstremitas atas) dan paru bila mekanismenya trauma langsung; fraktur medial dengan pergeseran posterior berat dapat menekan trakea.",ref:W(555)},{teks:"Diagnosis banding: **disostosis kleidokranial** (defek osifikasi intramembranosa — ujung distal hilang, defek sentral, atau klavikula tak ada; terapi simtomatik) dan **pseudartrosis kongenital** (pertemuan sepertiga tengah–distal klavikula kanan, ujung tulang halus-runcing, tanpa riwayat trauma; kiri hanya pada dekstrokardia).",ref:W(555)}],radiologis:[{teks:"USG berguna untuk neonatus. Foto AP biasanya cukup; bila fraktur dicurigai tetapi tak jelas: **cephalic tilt** 35–40° (mengurangi tumpang tindih, menilai pergeseran) dan **apical oblique** (sisi cedera diputar 45° ke tabung, tilt sefalad 20°) untuk fraktur sepertiga tengah tak bergeser.",ref:[W(555),W(556)]},{teks:"Sesak napas → foto toraks AP (pneumotoraks, fraktur iga). CT untuk fraktur/dislokasi medial karena sebagian besar adalah Salter-Harris I–II, bukan dislokasi SC sejati.",ref:W(556)},{teks:"Cedera AC anak: seri trauma bahu biasanya cukup; foto tertarget AC memakai sepertiga–separuh dosis agar tidak overpenetrasi; foto stres dengan beban 5–10 lb di pergelangan membandingkan kedua bahu.",ref:W(559)}],mekanisme:[{teks:"Langsung (tersering) pada klavikula atau akromion — risiko tertinggi cedera neurovaskular dan paru di bawahnya; tidak langsung: jatuh pada tangan terentang; cedera lahir: bahu melewati panggul sempit dengan tekanan simfisis pubis atau tekanan obstetrik langsung.",ref:W(555)},{teks:"Fraktur/dislokasi medial umumnya Salter-Harris I atau II; dislokasi SC sejati jarang. Selubung periosteum inferomedial tetap utuh sebagai perancah remodeling — 80% pertumbuhan klavikula terjadi di fisis medial.",ref:W(555)},{teks:"Fraktur lateral: trauma langsung pada akromion; ligamen korakoklavikular **selalu utuh** dan melekat pada tabung periosteum inferior; ligamen AC utuh melekat pada fragmen distal.",ref:W(555)},{teks:"Cedera AC anak: dislokasi sejati jarang karena ligamen CC rapat dengan periosteum klavikula distal — defeknya robekan longitudinal selubung periosteum superior tempat klavikula 'dikupas keluar seperti pisang dari kulitnya'.",ref:W(558)},{teks:"Anatomi: klavikula tulang pertama yang mengalami osifikasi (intramembranosa); epifisis medial (80% pertumbuhan) berosifikasi usia 12–19 tahun dan menyatu usia 22–25 tahun — tulang terakhir yang menyatu; epifisis lateral baru berosifikasi saat menyatu usia 19 tahun.",ref:W(554)}],epidemiologi:[{teks:"**8–15%** semua fraktur anak; 0,5% persalinan normal dan 1,6% persalinan sungsang; 2,8–7,2 per 1.000 persalinan aterm; 84–92% semua fraktur obstetrik; pada bayi makrosomia (> 4.000 g) insiden 13%.",ref:W(554)},{teks:"80% di sepertiga tengah (tepat lateral insersi subklavius, yang melindungi struktur neurovaskular), 10–15% lateral, 5% medial.",ref:W(554)},{teks:"Cedera sendi AC jarang pada anak < 16 tahun; insiden sejati tidak diketahui karena kebanyakan adalah pseudodislokasi.",ref:W(558)}]},klasifikasi:[{nama:"Deskriptif",teks:"Lokasi; terbuka/tertutup; pergeseran; angulasi; tipe (segmental, kominutif, greenstick, dll.).",ref:W(556)},{nama:"Allman",teks:"I sepertiga tengah (tersering); II distal dari ligamen korakoklavikular (sepertiga lateral); III sepertiga medial.",ref:W(556)},{nama:"Dameron–Rockwood (AC anak)",teks:"I sprain ligamen AC tanpa robekan tabung periosteum; II robekan parsial tabung, klavikula distal sedikit tidak stabil, celah AC sedikit melebar; III robekan longitudinal tabung, klavikula distal sangat tidak stabil, pergeseran superior 25–100%; IV klavikula distal ke posterior menembus trapezius (foto aksilar); V tipe III dengan pergeseran > 100%, klavikula subkutan, deltoid/trapezius dapat terlepas; VI infrakorakoid.",ref:W(559)}],kelompok:[{id:"tengah",nama:{id:"Sepertiga tengah",en:"Middle third"},kode:"Allman I · 80%",jenis:[{id:"greenstick",nama:{id:"Greenstick / plastic bowing",en:"Greenstick / plastic bowing"},kode:"",gambar:"klavikula-anak:greenstick",ringkas:"Tulang anak melengkung sebelum patah: korteks cembung retak, korteks cekung utuh; nyeri tekan bisa difus.",ref:[W(555),Rt(544)],indikasi:"tengah"},{id:"komplet",nama:{id:"Komplet, bergeser",en:"Complete, displaced"},kode:"",gambar:"klavikula-anak:tengah-komplet",ringkas:"Lebih sering pada usia ≥ 12 tahun; selubung periosteum tetap anatomis sehingga remodeling terjamin; waspadai kulit yang *tenting*.",ref:[W(554),W(557)],indikasi:"tengah"},{id:"lahir",nama:{id:"Fraktur lahir",en:"Birth fracture"},kode:"neonatus",gambar:"klavikula-anak:lahir",ringkas:"90% fraktur obstetrik; menyatu dalam ± 1 minggu tanpa reduksi; singkirkan paralisis pleksus brakialis.",ref:[W(554),W(555),W(557)],indikasi:"lahir"}]},{id:"ujung",nama:{id:"Lateral & medial (fisis)",en:"Lateral and medial (physeal)"},kode:"Allman II–III",jenis:[{id:"lateral",nama:{id:"Lateral / pseudodislokasi AC",en:"Lateral / AC pseudodislocation"},kode:"Dameron–Rockwood I–VI",gambar:"klavikula-anak:lateral-pseudo",ringkas:"Klavikula distal keluar dari selubung periosteum; ligamen CC tetap melekat pada tabung periosteum — tulang baru terbentuk di dalam tabung.",ref:[W(555),W(558)],indikasi:"lateral"},{id:"medial",nama:{id:"Medial — Salter-Harris I/II",en:"Medial — Salter-Harris I/II"},kode:"",gambar:"klavikula-anak:medial-fisis",ringkas:"Yang tampak 'dislokasi SC' umumnya separasi fisis medial; CT memastikan; pergeseran posterior berat dapat menekan trakea.",ref:[W(555),W(556)],indikasi:"medial"}]}],indikasi:{tengah:{intro:"Hampir semua nonoperatif menurut usia: 2–12 tahun perban angka-delapan atau sling 2–4 minggu; ≥ 12 tahun 3–4 minggu. Pergeseran kasar dengan kulit tenting → pertimbangkan reduksi tertutup/terbuka ± fiksasi.",ref:W(557),opsi:[{id:"nonop",nama:{id:"Perban angka-delapan atau sling",en:"Figure-of-eight bandage or sling"},gambar:"angka-delapan",utama:["2–12 tahun: 2–4 minggu (union lengkap)","12 tahun–matur: 3–4 minggu; angka-delapan sering tak ditoleransi"],ref:W(557),tatalaksana:"nonop"},{id:"reduksi",nama:{id:"Reduksi ± fiksasi (kulit tenting)",en:"Reduction ± fixation (skin tenting)"},gambar:"klavikula-anak:reduksi-sleeve",utama:["Pergeseran kasar dengan kulit tenting","Fragmen kominutif dimanipulasi, dermis dilepaskan dari ujung tulang dengan towel clip, fragmen dikembalikan ke selubung periosteum"],ref:[W(557),W(558)],tatalaksana:"operatif"},{id:"orif",nama:{id:"Fiksasi interna",en:"Internal fixation"},gambar:"klavikula:plat-superior",utama:["Fraktur terbuka","Gangguan neurovaskular"],ref:W(557),tatalaksana:"operatif"}]},lahir:{intro:"Fraktur klavikula neonatus menyatu dalam sekitar 1 minggu; reduksi tidak diindikasikan — cukup hati-hati saat mengangkat bayi.",ref:W(557),opsi:[{id:"nonop",nama:{id:"Balutan lunak / sling / sematkan lengan baju",en:"Soft bandage / sling / pin the sleeve"},gambar:"sling",utama:["Balutan lunak; sling sederhana atau angka-delapan 2–3 minggu sampai nyaman","Lengan baju panjang disematkan ke bahu kontralateral"],ref:W(557),tatalaksana:"nonop"}]},lateral:{intro:"Tipe I–III (Dameron–Rockwood) nonoperatif — remodeling terjamin, sembuh 4–6 minggu. Tipe IV–VI: reduksi klavikula dan perbaikan selubung periosteum, bila perlu fiksasi interna.",ref:W(560),opsi:[{id:"nonop",nama:{id:"Sling, es, gerak dini",en:"Sling, ice, early motion"},gambar:"sling",utama:["Tipe I–III","Penyembuhan lengkap 4–6 minggu; remodeling diharapkan"],ref:W(560),tatalaksana:"nonop"},{id:"op",nama:{id:"Reduksi + perbaikan selubung periosteum",en:"Reduction + periosteal sleeve repair"},gambar:"klavikula-anak:jahit-selubung",utama:["Tipe IV (posterior ke trapezius), V (> 100%, subkutan), VI (infrakorakoid)","Fiksasi interna bila diperlukan; tipe V dapat melaserasi kulit → irigasi-debridemen"],ref:W(560),tatalaksana:"operatif"}]},medial:{intro:"Separasi fisis medial sembuh dan mengalami remodeling karena selubung periosteum inferomedial utuh dan 80% pertumbuhan terjadi di sini; pergeseran posterior yang menekan trakea memerlukan reduksi.",ref:W(555),opsi:[{id:"nonop",nama:{id:"Sling / angka-delapan",en:"Sling / figure-of-eight"},gambar:"angka-delapan",utama:["Tak bergeser atau anterior","CT untuk memastikan fisis, bukan dislokasi SC sejati"],ref:[W(555),W(556)],tatalaksana:"nonop"},{id:"reduksi",nama:{id:"Reduksi (pergeseran posterior / kompresi trakea)",en:"Reduction (posterior displacement / tracheal compression)"},gambar:"sendi-sc:reduksi-posterior",utama:["Pergeseran posterior berat dengan kompresi trakea","Prinsip reduksi seperti dislokasi SC posterior dewasa"],ref:W(555),tatalaksana:"operatif"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif menurut usia",en:"Nonoperative treatment by age"},bab:[{judul:"Lahir – 2 tahun",isi:"Fraktur komplet < 2 tahun tidak lazim dan sering cedera lahir. Fraktur neonatus menyatu ± 1 minggu, tanpa reduksi; hati-hati saat mengangkat; balutan lunak. Bayi: sling sederhana atau perban angka-delapan 2–3 minggu atau sampai nyaman; alternatif, lengan baju panjang disematkan ke bahu kontralateral.",ref:W(557)},{judul:"2 – 12 tahun",isi:"Perban angka-delapan atau sling 2–4 minggu — union lengkap pada saat itu.",ref:W(557)},{judul:"12 tahun – matur",isi:"Fraktur komplet lebih sering. Angka-delapan atau sling 3–4 minggu; angka-delapan sering kurang ditoleransi dan dikaitkan dengan ekimosis, kompresi pembuluh aksila, dan pleksopati brakialis.",ref:W(557)},{judul:"Cedera AC tipe I–III",isi:"Sling, es, latihan gerak dini begitu nyeri reda; remodeling diharapkan; sembuh 4–6 minggu.",ref:W(560)},{judul:"Tonjolan kalus",isi:"Biasanya mengalami remodeling; eksostektomi jarang — bekas luka operasi sering lebih tampak daripada tonjolannya.",ref:W(558)},{judul:"Komplikasi",isi:"Gangguan neurovaskular lebih jarang daripada dewasa berkat periosteum tebal (pleksus/pembuluh subklavia pada pergeseran berat); malunion jarang dan ditoleransi (hanya masalah kosmetik); nonunion 1–3% — mungkin pseudartrosis kongenital, tak pernah terjadi < 12 tahun; cedera paru apikal/pneumotoraks pada trauma langsung berat.",ref:W(558)}]},operatif:{nama:{id:"Tatalaksana operatif",en:"Operative treatment"},bab:[{judul:"Indikasi",isi:"Fraktur terbuka dan gangguan neurovaskular; pergeseran kasar dengan kulit tenting (pertimbangkan reduksi tertutup/terbuka ± fiksasi interna); cedera AC tipe IV–VI.",ref:[W(557),W(560)]},{judul:"Teknik pada fraktur tengah",isi:"Fragmen kominutif yang menegangkan kulit dimanipulasi dan dermis dilepaskan dari ujung tulang dengan towel clip; fragmen dikembalikan ke dalam selubung periosteum dan jaringan lunak diperbaiki; fiksasi interna dapat dipertimbangkan.",ref:[W(557),W(558)]},{judul:"Cedera AC tipe IV–VI",isi:"Reduksi klavikula dan perbaikan selubung periosteum; fiksasi interna bila perlu. Cedera neurovaskular jarang (pergeseran posteroinferior); tipe V dapat melaserasi kulit sehingga perlu irigasi dan debridemen.",ref:W(560)},{judul:"Fisis medial dengan kompresi trakea",isi:"CT membedakan fisis dari dislokasi SC; pergeseran posterior berat yang menekan trakea direduksi dengan prinsip seperti dislokasi SC posterior (lihat segmen sendi AC & SC dewasa).",ref:[W(555),W(556)]}]}}}});var Ws={};Oa(Ws,{default:()=>Ot});var na,Ci,Ot,Ys=ga(()=>{na=a=>({buku:"HoF",bab:"43",hlm:a}),Ci=a=>({buku:"AO",bab:"4.4",hlm:a}),Ot={id:"humerus-proksimal-anak",nama:{id:"Humerus proksimal anak",en:"Pediatric proximal humerus"},sumber:[{buku:"HoF",bab:"43",hlm:{awal:549,akhir:554}},{buku:"AO",bab:"4.4",hlm:{awal:394,akhir:394}}],gambar:"humerus-proksimal-anak:utuh",intro:{id:"80% pertumbuhan humerus terjadi di fisis proksimal — remodeling luar biasa, sehingga angulasi 60–70° pada anak kecil pun diterima. Makin tua anak, makin kecil toleransi: remaja dengan pergeseran besar dipertimbangkan untuk distabilkan.",en:"80% of humeral growth occurs at the proximal physis — remodeling is exceptional, so even 60–70° of angulation is accepted in young children. The older the child, the smaller the tolerance: displaced fractures in adolescents are considered for stabilization."},introRef:[na(549),na(553),Ci(394)],pemeriksaan:{klinis:[{teks:"Neonatus: pseudoparalisis dengan lengan dalam ekstensi, riwayat trauma lahir, demam bervariasi — singkirkan infeksi, fraktur klavikula, dislokasi bahu, dan cedera pleksus brakialis.",ref:na(550)},{teks:"Anak lebih besar: nyeri, disfungsi, bengkak, ekimosis; fragmen batang dapat teraba di anterior; krepitasi saat digerakkan. Lengan ditahan rotasi internal untuk melawan tarikan pektoralis mayor pada fragmen distal.",ref:[na(550),na(551)]},{teks:"Pemeriksaan neurovaskular cermat: n. aksilaris, muskulokutaneus, radialis, ulnaris, medianus.",ref:na(551)}],radiologis:[{teks:"AP, lateral skapular-Y, aksilar; foto pembanding sisi sehat bila perlu. USG pada neonatus karena epifisis belum berosifikasi.",ref:na(551)},{teks:"CT untuk dislokasi posterior dan fraktur kompleks; MRI lebih berguna daripada bone scan untuk fraktur okult (fisis normal pun menyerap radionuklida).",ref:na(551)},{teks:"Pusat osifikasi: kaput 6 bulan, tuberositas mayor 1–3 tahun, tuberositas minor 4–5 tahun; kedua tuberositas menyatu 6–7 tahun dan menyatu dengan kaput 7–13 tahun. Fisis menutup 14–17 tahun (perempuan) / 16–18 tahun (laki-laki).",ref:[na(549),na(550)]}],mekanisme:[{teks:"Tidak langsung: jatuh ke belakang pada tangan terentang dengan siku ekstensi dan pergelangan dorsofleksi. Cedera lahir: lengan hiperekstensi/rotasi saat persalinan; distosia bahu erat dengan makrosomia pada diabetes ibu. Langsung: trauma posterolateral bahu.",ref:na(550)},{teks:"Puncak fisis posteromedial dengan periosteum tebal; fraktur SH I melalui zona hipertrofik sehingga lapisan germinal terjaga dan pertumbuhan normal. Gaya deformasi: subskapularis ke tuberositas minor; sisa cuff ke epifisis posterior/tuberositas mayor; pektoralis mayor ke metafisis anteromedial; deltoid ke batang lateral.",ref:na(550)},{teks:"Vaskularisasi utama: cabang asenden anterolateral a. sirkumfleksa anterior; sebagian tuberositas mayor dan kaput inferior dari a. sirkumfleksa posterior.",ref:na(550)}],epidemiologi:[{teks:"< 5% fraktur anak; insiden 1,2–4,4 per 10.000/tahun; tersering remaja (olahraga), metafisis dan/atau fisis.",ref:na(549)},{teks:"Trauma lahir pada fisis humerus proksimal mewakili 1,9–6,7% cedera fisis.",ref:na(549)}]},klasifikasi:[{nama:"Salter-Harris",teks:"I separasi melalui fisis — biasanya cedera lahir; II (remaja > 12 tahun) dengan fragmen metafisis yang selalu posteromedial; III intraartikular, jarang, menyertai dislokasi; IV jarang, menyertai fraktur terbuka.",ref:na(551)},{nama:"Neer–Horowitz (metafisis)",teks:"I pergeseran < 5 mm; II < ⅓ lebar batang; III ⅓–⅔; IV > ⅔ termasuk pergeseran total.",ref:na(551)},{nama:"Deformitas yang dapat diterima",teks:"1–4 tahun: angulasi 70° dengan pergeseran berapa pun; 5–12 tahun: 40–45° dan pergeseran ½ lebar batang; 12 tahun–matur: 15–20° dan pergeseran < 30% lebar batang. AO: < 12 tahun angulasi hingga 60°, pergeseran penuh bila masih 2–3 tahun pertumbuhan; perempuan > 12 / laki-laki > 14 tahun hanya 50% pergeseran.",ref:[na(553),Ci(394)]}],kelompok:[{id:"fisis",nama:{id:"Fisis (Salter-Harris)",en:"Physeal (Salter-Harris)"},kode:"",jenis:[{id:"sh1",nama:{id:"Salter-Harris I",en:"Salter-Harris I"},kode:"neonatus · 1–4 th",gambar:"humerus-proksimal-anak:sh1",ringkas:"Separasi melalui fisis; cedera lahir khas; prognosis sangat baik karena zona germinal terjaga.",ref:[na(550),na(551)],indikasi:"muda"},{id:"sh2",nama:{id:"Salter-Harris II",en:"Salter-Harris II"},kode:"> 12 th",gambar:"humerus-proksimal-anak:sh2",ringkas:"Tersering pada remaja; fragmen metafisis selalu posteromedial; remodeling lebih terbatas.",ref:[na(551),na(553)],indikasi:"remaja"},{id:"sh34",nama:{id:"Salter-Harris III–IV",en:"Salter-Harris III–IV"},kode:"jarang",gambar:"humerus-proksimal-anak:sh4",ringkas:"III intraartikular menyertai dislokasi; IV menyertai fraktur terbuka — bila bergeser, ORIF.",ref:[na(551),na(553)],indikasi:"terbuka"}]},{id:"metafisis",nama:{id:"Metafisis (Neer–Horowitz)",en:"Metaphyseal (Neer–Horowitz)"},kode:"5–12 th tersering",jenis:[{id:"nh12",nama:{id:"Neer–Horowitz I–II",en:"Neer–Horowitz I–II"},kode:"< ⅓ lebar",gambar:"humerus-proksimal-anak:metafisis-2",ringkas:"Pergeseran kecil; hasil baik berkat remodeling fisis proksimal.",ref:[na(551),na(553)],indikasi:"sekolah"},{id:"nh34",nama:{id:"Neer–Horowitz III–IV",en:"Neer–Horowitz III–IV"},kode:"≥ ⅓ lebar / total",gambar:"humerus-proksimal-anak:metafisis-4",ringkas:"Boleh tersisa pemendekan hingga 3 mm atau angulasi residual — ditoleransi dan sering tak bermakna klinis; pada remaja pertimbangkan stabilisasi.",ref:na(553),indikasi:"sekolah"}]}],indikasi:{muda:{intro:"Neonatus dan anak 1–4 tahun: reduksi tertutup lalu imobilisasi singkat; prognosis sangat baik dan remodeling ekstensif. USG dapat memandu reduksi pada neonatus.",ref:na(552),opsi:[{id:"neonatus",nama:{id:"Neonatus — reduksi tertutup + lengan ke dada 5–10 hari",en:"Neonate — closed reduction + arm to chest 5–10 days"},gambar:"sling-swathe",utama:["Traksi lembut, fleksi 90°, lalu abduksi 90° + rotasi eksternal","Tak stabil: lengan abduksi–rotasi eksternal 3–4 hari sampai kalus dini"],ref:na(552),tatalaksana:"usia"},{id:"balita",nama:{id:"1–4 tahun — reduksi tertutup + sling 10 hari",en:"1–4 years — closed reduction + sling 10 days"},gambar:"sling",utama:["SH I (atau II); angulasi 70° dengan pergeseran berapa pun diterima","Kembali ke aktivitas bertahap"],ref:[na(552),na(553)],tatalaksana:"usia"}]},sekolah:{intro:"5–12 tahun: fraktur metafisis (SH II) tersering karena daerah ini sedang remodeling paling cepat. Reduksi tertutup; kebanyakan stabil setelah reduksi.",ref:na(552),opsi:[{id:"sling",nama:{id:"Stabil — sling-and-swathe",en:"Stable — sling and swathe"},gambar:"sling-swathe",utama:["Angulasi 40–45° dan pergeseran ½ lebar batang masih diterima","AO: collar-and-cuff 3–4 minggu"],ref:[na(552),na(553),Ci(394)],tatalaksana:"usia"},{id:"spica",nama:{id:"Tak stabil — shoulder spica posisi salut 2–3 minggu",en:"Unstable — shoulder spica in salute position 2–3 weeks"},gambar:"spica-salut",utama:["Setelah 2–3 minggu diganti sling, aktivitas bertahap"],ref:na(552),tatalaksana:"usia"},{id:"esin",nama:{id:"ESIN retrograd (bila perlu reduksi dalam anestesi)",en:"Retrograde ESIN (if reduction under anesthesia is needed)"},gambar:"humerus-proksimal-anak:esin",utama:["AO: bila reduksi memerlukan anestesi, langsung fiksasi definitif","Pergeseran penuh pada anak yang hampir matur"],ref:Ci(394),tatalaksana:"operatif"}]},remaja:{intro:"12 tahun–matur: SH II (atau I); potensi remodeling lebih kecil — hanya 15–20° angulasi dan pergeseran < 30% yang diterima; pertimbangkan stabilisasi bedah untuk fraktur bergeser.",ref:na(553),opsi:[{id:"sling",nama:{id:"Stabil — sling-and-swathe 2–3 minggu",en:"Stable — sling and swathe 2–3 weeks"},gambar:"sling-swathe",utama:["Lalu latihan gerak bertahap"],ref:na(553),tatalaksana:"usia"},{id:"spica",nama:{id:"Tak stabil — spica salut 2–3 minggu",en:"Unstable — salute spica 2–3 weeks"},gambar:"spica-salut",utama:["Juga untuk SH IV tanpa indikasi terbuka","Lalu sling dan aktivitas bertahap"],ref:na(553),tatalaksana:"usia"},{id:"esin",nama:{id:"ESIN retrograd / pin perkutan",en:"Retrograde ESIN / percutaneous pins"},gambar:"humerus-proksimal-anak:esin",utama:["Fraktur bergeser pada remaja (HoF: pertimbangkan stabilisasi)","AO: perempuan > 12 / laki-laki > 14 tahun hanya toleransi 50% pergeseran → reduksi + ESIN"],ref:[na(553),Ci(394)],tatalaksana:"operatif"}]},terbuka:{intro:"Reduksi terbuka + fiksasi interna untuk fraktur terbuka, gangguan neurovaskular, SH III–IV bergeser, dan fraktur tak tereduksi karena interposisi jaringan lunak (tendon biseps).",ref:na(553),opsi:[{id:"orif",nama:{id:"Reduksi terbuka + K-wire / pin halus",en:"Open reduction + smooth K-wires / pins"},gambar:"humerus-proksimal-anak:reduksi-terbuka",utama:["Fiksasi anak umumnya K-wire halus perkutan atau pin Steinmann (HoF)","AO: setelah reduksi terbuka, ESIN adalah stabilisasi pilihan; K-wire hanya kasus luar biasa"],ref:[na(553),Ci(394)],tatalaksana:"operatif"}]}},tatalaksana:{usia:{nama:{id:"Tatalaksana nonoperatif menurut usia",en:"Nonoperative treatment by age"},bab:[{judul:"Neonatus",isi:"Kebanyakan SH I, prognosis sangat baik. Reduksi tertutup (dipandu USG): traksi lembut, fleksi 90°, lalu abduksi 90° dan rotasi eksternal. Stabil: lengan diimobilisasi ke dada 5–10 hari. Tak stabil: lengan ditahan abduksi–rotasi eksternal 3–4 hari agar kalus dini terbentuk.",ref:na(552)},{judul:"1–4 tahun",isi:"SH I (jarang II). Reduksi tertutup, sling 10 hari, kembali ke aktivitas bertahap; remodeling ekstensif.",ref:na(552)},{judul:"5–12 tahun",isi:"Fraktur metafisis tersering. Reduksi tertutup; kebanyakan stabil → sling-and-swathe. Tak stabil → shoulder spica dengan lengan posisi salut 2–3 minggu, lalu sling.",ref:na(552)},{judul:"12 tahun – matur",isi:"SH II (jarang I); remodeling lebih kecil. Stabil → sling-and-swathe 2–3 minggu lalu latihan gerak; tak stabil dan SH IV → spica salut 2–3 minggu lalu sling. Pertimbangkan stabilisasi bedah untuk fraktur bergeser pada remaja.",ref:na(553)},{judul:"Berapa yang diterima",isi:"1–4 tahun: angulasi 70° dan pergeseran berapa pun; 5–12 tahun: 40–45° dan ½ lebar batang; 12 tahun–matur: 15–20° dan < 30% lebar batang. AO: hingga 60° (< 12 tahun); pergeseran penuh dengan aposisi bayonet bila masih ≥ 2 tahun pertumbuhan; 10–12 tahun 60° masih dapat ditoleransi secara medis tetapi mungkin tak diterima orang tua. Gerak bahu yang luar biasa mengompensasi deformitas yang tidak remodeling, termasuk rotasi.",ref:[na(553),Ci(394)]},{judul:"Prognosis",isi:"Neer–Horowitz I–II baik; III–IV boleh tersisa pemendekan hingga 3 mm atau angulasi residual yang ditoleransi. Makin muda, makin besar potensi remodeling dan deformitas awal yang dapat diterima.",ref:na(553)},{judul:"Komplikasi",isi:"Varus humerus proksimal (jarang, biasanya < 1 tahun, sudut leher-batang bisa 90° dengan pemendekan dan hilangnya sebagian abduksi; remodeling besar, osteotomi hanya bila sangat membatasi); perbedaan panjang tungkai dan hilangnya gerak (lebih sering setelah operasi; anak lebih tua lebih kaku); subluksasi inferior (SH II, hilangnya tonus deltoid/cuff → imobilisasi lalu penguatan); osteonekrosis (hampir tak pernah pada fraktur tertutup); cedera n. aksilaris pada fraktur-dislokasi — eksplorasi bila tak pulih 4 bulan; henti pertumbuhan (fisis remuk/bergeser besar, batang fisis → eksisi, pemanjangan bila perlu).",ref:[na(553),na(554)]}]},operatif:{nama:{id:"Stabilisasi operatif",en:"Operative stabilization"},bab:[{judul:"Indikasi",isi:"Fraktur terbuka; gangguan neurovaskular; SH III–IV bergeser; tak tereduksi karena interposisi jaringan lunak (tendon biseps); fraktur bergeser pada remaja (HoF). AO: politrauma (termasuk anak kecil), anak > 10–12 tahun, fraktur tak stabil bergeser yang memerlukan reduksi dalam anestesi.",ref:[na(553),Ci(394)]},{judul:"ESIN retrograd (AO)",isi:"Pendekatan lateral humerus distal 1 cm di atas fisis, lindungi n. radialis; dua nail dimasukkan sampai garis fraktur distal; reduksi tertutup atau terbuka; setelah reduksi sempurna nail dimajukan dengan ketukan lembut ke fragmen proksimal (satu dibengkokkan C, satu S — teknik monolateral). Stabilitas baik, mobilisasi dini, tanpa imobilisasi tambahan; nail dilepas setelah 3–4 bulan.",ref:Ci(394)},{judul:"K-wire",isi:"HoF: fiksasi anak umumnya K-wire halus perkutan atau pin Steinmann. AO: K-wire hanya untuk kasus luar biasa karena memerlukan imobilisasi tambahan dan berisiko masalah luka, infeksi, migrasi.",ref:[na(553),Ci(394)]},{judul:"Interposisi biseps",isi:"Jarang; menuntut reduksi terbuka dan fiksasi ESIN interna.",ref:Ci(394)}]}}}});var Xs={};Oa(Xs,{default:()=>Ht});var $i,Da,Ht,Qs=ga(()=>{$i=a=>({buku:"AO",bab:"4.4",hlm:a}),Da=a=>({buku:"HoF",bab:"42",hlm:a}),Ht={id:"humerus-diafisis-anak",nama:{id:"Diafisis humerus anak",en:"Pediatric humeral shaft"},sumber:[{buku:"AO",bab:"4.4",hlm:{awal:394,akhir:394}},{buku:"HoF",bab:"42",hlm:{awal:544,akhir:547}}],gambar:"humerus-diafisis-anak:utuh",intro:{id:"Lebih sering pada anak besar dan hampir selalu nonoperatif: remodelin
