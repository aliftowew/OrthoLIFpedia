esi / frontal (Hahn-Steinthal)",en:"Split depression / frontal (Hahn-Steinthal)"}))]),le("2R",{id:"Radius",en:"Radius"},[_a("2R1",{id:"Radius proksimal (kaput/kolum)",en:"Proximal radius (head/neck)"},"ujung",Pi()),_a("2R2",{id:"Radius diafisis",en:"Radial shaft"},"diaf",be()),_a("2R3",{id:"Radius distal",en:"Distal radius"},"ujung",Pi({id:"Split-depresi (die-punch)",en:"Split depression (die-punch)"}))]),le("2U",{id:"Ulna",en:"Ulna"},[_a("2U1",{id:"Ulna proksimal (olekranon/koronoid)",en:"Proximal ulna (olecranon/coronoid)"},"ujung",Pi()),_a("2U2",{id:"Ulna diafisis",en:"Ulnar shaft"},"diaf",be()),_a("2U3",{id:"Ulna distal",en:"Distal ulna"},"ujung",Pi())]),le("3",{id:"Femur",en:"Femur"},[_a("31",{id:"Femur proksimal",en:"Proximal femur"},"femur-prox",tt,{id:"Pengecualian: segmen = di atas garis batas bawah trokanter minor; A trokanterik, B kolum, C kaput.",en:"Exception: segment = above the inferior border of the lesser trochanter; A trochanteric, B neck, C head."}),_a("32",{id:"Femur diafisis (termasuk subtrokanter)",en:"Femoral shaft (including subtrochanteric)"},"diaf",be()),_a("33",{id:"Femur distal",en:"Distal femur"},"ujung",Pi({id:"Split-depresi / frontal (Hoffa)",en:"Split depression / frontal (Hoffa)"}))]),le("34",{id:"Patela",en:"Patella"},[_a("34",{id:"Patela",en:"Patella"},"patela",ut,{id:"Tipe A avulsi kutub, B vertikal (ekstensor utuh), C transversal (ekstensor putus).",en:"Type A pole avulsion, B vertical (extensor intact), C transverse (extensor disrupted)."})]),le("4",{id:"Tibia",en:"Tibia"},[_a("41",{id:"Tibia proksimal (plateau)",en:"Proximal tibia (plateau)"},"ujung",Pi({id:"Split-depresi (Schatzker II)",en:"Split depression (Schatzker II)"})),_a("42",{id:"Tibia diafisis",en:"Tibial shaft"},"diaf",be()),_a("43",{id:"Tibia distal (pilon)",en:"Distal tibia (pilon)"},"ujung",Pi()),_a("44",{id:"Maleolar",en:"Malleolar"},"maleolar",lt,{id:"Pengecualian: diklasifikasi menurut level fraktur fibula terhadap sindesmosis (Danis-Weber).",en:"Exception: classified by the level of the fibular fracture relative to the syndesmosis (Danis-Weber)."})]),le("4F",{id:"Fibula",en:"Fibula"},[_a("4F1",{id:"Fibula proksimal",en:"Proximal fibula"},"ujung",Pi()),_a("4F2",{id:"Fibula diafisis",en:"Fibular shaft"},"diaf",be()),_a("4F3",{id:"Fibula distal (bukan maleolar)",en:"Distal fibula (non-malleolar)"},"ujung",Pi())])]}});var Zn,Gn,zn,Vn=ga(()=>{Zn={id:"salter-harris",nama:{id:"Salter-Harris — cedera fisis",en:"Salter-Harris — physeal injury"},singkat:"Salter-Harris",deskripsi:{id:"Lima tipe cedera lempeng pertumbuhan menurut jalur garis fraktur terhadap fisis, metafisis, dan epifisis. Prognosis gangguan pertumbuhan memburuk dari tipe I ke V.",en:"Five types of growth-plate injury by the path of the fracture line through physis, metaphysis, and epiphysis. Risk of growth disturbance rises from type I to V."},sumber:[{buku:"AO",bab:"4.4",hlm:{awal:379,akhir:420}},{buku:"HoF",bab:"42",hlm:{awal:542,akhir:548}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Tipe I — melalui fisis saja",en:"Type I — through the physis only"},deskripsi:{id:"Pemisahan epifisis dari metafisis melalui zona hipertrofik fisis tanpa fragmen tulang; sering pada anak kecil. Radiografi bisa normal — diagnosis klinis (nyeri tekan di fisis).",en:"Separation of epiphysis from metaphysis through the hypertrophic zone with no bony fragment; common in young children. Radiographs may be normal — clinical diagnosis (physeal tenderness)."},implikasi:{id:"Reduksi tertutup lembut; imobilisasi; prognosis baik bila suplai darah epifisis utuh.",en:"Gentle closed reduction; immobilization; good prognosis if epiphyseal blood supply is intact."},skema:{jenis:"sh",tipe:1}},{kode:"II",label:{id:"Tipe II — fisis + metafisis",en:"Type II — physis + metaphysis"},deskripsi:{id:"Garis melalui fisis lalu keluar lewat metafisis, menyisakan fragmen metafisis segitiga (Thurston-Holland). Tipe paling sering (≈ 70% cedera fisis).",en:"Line through the physis exiting via the metaphysis, leaving a triangular metaphyseal (Thurston-Holland) fragment. The most common type (≈ 70% of physeal injuries)."},implikasi:{id:"Reduksi tertutup + gips; fiksasi bila tidak stabil (hindari implan melintasi fisis bila mungkin).",en:"Closed reduction and cast; fixation if unstable (avoid implants crossing the physis when possible)."},skema:{jenis:"sh",tipe:2}},{kode:"III",label:{id:"Tipe III — fisis + epifisis (intraartikular)",en:"Type III — physis + epiphysis (intraarticular)"},deskripsi:{id:"Garis melalui fisis lalu keluar lewat epifisis ke permukaan sendi.",en:"Line through the physis exiting through the epiphysis into the joint."},implikasi:{id:"Fraktur artikular: butuh reduksi anatomis, sering operatif (sekrup epifisis sejajar fisis).",en:"Articular fracture: needs anatomic reduction, often operative (epiphyseal screws parallel to the physis)."},skema:{jenis:"sh",tipe:3}},{kode:"IV",label:{id:"Tipe IV — metafisis + fisis + epifisis",en:"Type IV — metaphysis + physis + epiphysis"},deskripsi:{id:"Garis vertikal melintasi metafisis, fisis, dan epifisis ke sendi.",en:"Vertical line crossing metaphysis, physis, and epiphysis into the joint."},implikasi:{id:"Reduksi anatomis dan fiksasi; risiko jembatan tulang (bar) dan gangguan pertumbuhan tinggi.",en:"Anatomic reduction and fixation; high risk of bony bar and growth disturbance."},skema:{jenis:"sh",tipe:4}},{kode:"V",label:{id:"Tipe V — kompresi fisis",en:"Type V — physeal crush"},deskripsi:{id:"Cedera kompresi/remuk pada lempeng pertumbuhan; jarang, sering baru diketahui setelah henti tumbuh.",en:"Crush/compression injury of the growth plate; rare, often recognized only after growth arrest."},implikasi:{id:"Prognosis terburuk; pantau pertumbuhan jangka panjang, beri tahu orang tua.",en:"Worst prognosis; long-term growth follow-up, counsel parents."},skema:{jenis:"sh",tipe:5}}]},Gn={id:"gustilo",nama:{id:"Gustilo-Anderson — fraktur terbuka",en:"Gustilo-Anderson — open fractures"},singkat:"Gustilo",deskripsi:{id:"Derajat fraktur terbuka menurut ukuran luka, kerusakan jaringan lunak, kontaminasi, dan cedera vaskular. Ditetapkan final saat debridemen di kamar operasi, bukan di IGD.",en:"Grades open fractures by wound size, soft-tissue damage, contamination, and vascular injury. Assigned definitively at operative debridement, not in the emergency department."},sumber:[{buku:"AO",bab:"4.2",hlm:{awal:331,akhir:356}},{buku:"HoF",bab:"3",hlm:{awal:68,akhir:76}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Tipe I",en:"Type I"},deskripsi:{id:"Luka < 1 cm, bersih, kerusakan jaringan lunak minimal, pola fraktur sederhana, energi rendah.",en:"Wound < 1 cm, clean, minimal soft-tissue damage, simple fracture pattern, low energy."},skema:{jenis:"gustilo",tipe:"I"}},{kode:"II",label:{id:"Tipe II",en:"Type II"},deskripsi:{id:"Luka 1–10 cm, kerusakan jaringan lunak sedang tanpa flap atau avulsi luas, kominusi ringan–sedang.",en:"Wound 1–10 cm, moderate soft-tissue damage without extensive flaps or avulsion, mild–moderate comminution."},skema:{jenis:"gustilo",tipe:"II"}},{kode:"III",label:{id:"Tipe III",en:"Type III"},deskripsi:{id:"Luka > 10 cm atau kerusakan jaringan lunak luas, energi tinggi, kontaminasi berat; juga fraktur segmental, cedera pertanian, luka tembak kecepatan tinggi, dan fraktur terbuka yang terlambat ditangani.",en:"Wound > 10 cm or extensive soft-tissue damage, high energy, heavy contamination; also segmental fractures, farm injuries, high-velocity gunshot wounds, and delayed-treatment open fractures."},anak:[{kode:"IIIA",label:{id:"IIIA — tulang masih tertutup jaringan lunak",en:"IIIA — bone still covered by soft tissue"},deskripsi:{id:"Meski laserasi luas, periosteum dan jaringan lunak masih cukup menutup tulang.",en:"Despite extensive laceration, periosteum and soft tissue still adequately cover the bone."},implikasi:{id:"Penutupan primer/tunda tanpa flap.",en:"Primary or delayed closure without a flap."},skema:{jenis:"gustilo",tipe:"IIIA"}},{kode:"IIIB",label:{id:"IIIB — butuh flap",en:"IIIB — needs flap coverage"},deskripsi:{id:"Kehilangan jaringan lunak luas dengan periosteum terkelupas dan tulang terpapar; kontaminasi masif.",en:"Extensive soft-tissue loss with periosteal stripping and bone exposure; massive contamination."},implikasi:{id:"Debridemen radikal, fiksasi, penutupan flap lokal/bebas secepatnya (konsep 'fix and flap').",en:"Radical debridement, fixation, early local/free flap coverage ('fix and flap')."},skema:{jenis:"gustilo",tipe:"IIIB"}},{kode:"IIIC",label:{id:"IIIC — cedera arteri",en:"IIIC — arterial injury"},deskripsi:{id:"Disertai cedera arteri yang memerlukan perbaikan agar ekstremitas bertahan.",en:"Associated arterial injury requiring repair for limb survival."},implikasi:{id:"Revaskularisasi segera; pertimbangkan amputasi primer bila tidak layak diselamatkan.",en:"Immediate revascularization; consider primary amputation if the limb is not salvageable."},skema:{jenis:"gustilo",tipe:"IIIC"}}],skema:{jenis:"gustilo",tipe:"III"}}]},zn={id:"tscherne",nama:{id:"Tscherne — cedera jaringan lunak",en:"Tscherne — soft-tissue injury"},singkat:"Tscherne",deskripsi:{id:"Derajat cedera jaringan lunak yang menyertai fraktur tertutup (C0–C3) dan terbuka (O1–O4) menurut Tscherne & Oestern. Menentukan waktu dan jenis fiksasi.",en:"Grades the soft-tissue injury accompanying closed (C0–C3) and open (O1–O4) fractures after Tscherne & Oestern. Guides timing and type of fixation."},sumber:[{buku:"AO",bab:"1.5",hlm:{awal:51,akhir:70}}],tingkat:[{id:"Jenis",en:"Kind"},{id:"Derajat",en:"Grade"}],akar:[{kode:"C",label:{id:"Fraktur tertutup",en:"Closed fractures"},deskripsi:{id:"Kulit utuh; derajat ditentukan oleh kontusio kulit, otot, dan risiko sindrom kompartemen.",en:"Skin intact; grade set by skin and muscle contusion and compartment-syndrome risk."},anak:[{kode:"C0",label:{id:"C0 — jaringan lunak minimal",en:"C0 — minimal soft-tissue injury"},deskripsi:{id:"Cedera tidak langsung, fraktur sederhana (mis. torsi), tanpa kerusakan jaringan lunak berarti.",en:"Indirect injury, simple fracture (e.g. torsion), no significant soft-tissue damage."},skema:{jenis:"tscherne",derajat:"C0"}},{kode:"C1",label:{id:"C1 — abrasi/kontusio superfisial",en:"C1 — superficial abrasion/contusion"},deskripsi:{id:"Abrasi atau kontusio superfisial akibat tekanan fragmen dari dalam; fraktur ringan–sedang.",en:"Superficial abrasion or contusion from fragment pressure within; mild–moderate fracture."},skema:{jenis:"tscherne",derajat:"C1"}},{kode:"C2",label:{id:"C2 — kontusio dalam, otot terlibat",en:"C2 — deep contusion with muscle involvement"},deskripsi:{id:"Abrasi dalam terkontaminasi, kontusio kulit/otot lokal, sindrom kompartemen mengancam; fraktur berat (energi langsung).",en:"Deep contaminated abrasion, local skin/muscle contusion, impending compartment syndrome; severe (direct-energy) fracture."},skema:{jenis:"tscherne",derajat:"C2"}},{kode:"C3",label:{id:"C3 — kerusakan luas / sindrom kompartemen",en:"C3 — extensive damage / compartment syndrome"},deskripsi:{id:"Kontusio atau remuk kulit luas, kerusakan otot berat, avulsi subkutan (Morel-Lavallée), sindrom kompartemen nyata atau cedera vaskular.",en:"Extensive skin contusion or crush, severe muscle damage, subcutaneous avulsion (Morel-Lavallée), manifest compartment syndrome or vascular injury."},skema:{jenis:"tscherne",derajat:"C3"}}]},{kode:"O",label:{id:"Fraktur terbuka",en:"Open fractures"},deskripsi:{id:"Kulit terbuka; derajat menurut luas luka, kontaminasi, dan cedera neurovaskular.",en:"Skin breached; grade by wound size, contamination, and neurovascular injury."},anak:[{kode:"O1",label:{id:"O1 — tusukan dari dalam",en:"O1 — puncture from within"},deskripsi:{id:"Luka kecil akibat fragmen menembus dari dalam, kontusio kulit minimal.",en:"Small wound from a fragment piercing from within, minimal skin contusion."},skema:{jenis:"tscherne",derajat:"O1"}},{kode:"O2",label:{id:"O2 — laserasi + kontusio sekitar",en:"O2 — laceration with surrounding contusion"},deskripsi:{id:"Laserasi kulit dengan kontusio sirkumferensial, kontaminasi sedang.",en:"Skin laceration with circumferential contusion, moderate contamination."},skema:{jenis:"tscherne",derajat:"O2"}},{kode:"O3",label:{id:"O3 — laserasi luas, kontaminasi berat",en:"O3 — extensive laceration, heavy contamination"},deskripsi:{id:"Kerusakan jaringan lunak luas, sering disertai cedera vaskular/saraf; risiko infeksi tinggi.",en:"Extensive soft-tissue damage, often with vascular/nerve injury; high infection risk."},skema:{jenis:"tscherne",derajat:"O3"}},{kode:"O4",label:{id:"O4 — amputasi subtotal/total",en:"O4 — subtotal/total amputation"},deskripsi:{id:"Ekstremitas hampir atau sama sekali terputus.",en:"Limb nearly or completely severed."},skema:{jenis:"tscherne",derajat:"O4"}}]}]}});var Un,qn,Jn,_n,Wn,Yn=ga(()=>{Un={id:"gartland",nama:{id:"Gartland — suprakondiler humerus anak",en:"Gartland — pediatric supracondylar humerus"},singkat:"Gartland",deskripsi:{id:"Fraktur suprakondiler tipe ekstensi (98%) dibagi menurut derajat pergeseran fragmen distal; tipe fleksi (2%) dinilai dengan tiga tipe yang sama (korteks anterior sebagai engsel). AO memakai kode pergeseran I–IV (von Laer) pada 13-M/3.",en:"Extension-type supracondylar fractures (98%) graded by displacement of the distal fragment; the flexion type (2%) uses the same three types (anterior cortex as hinge). AO uses displacement grades I–IV (von Laer) on 13-M/3."},sumber:[{buku:"HoF",bab:"44",hlm:{awal:570,akhir:605}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Tipe I — tidak bergeser",en:"Type I — nondisplaced"},deskripsi:{id:"Fraktur tanpa pergeseran; garis humerus anterior masih memotong kapitulum. Sering hanya tampak tanda fat pad posterior.",en:"Nondisplaced fracture; the anterior humeral line still intersects the capitellum. Often only a posterior fat-pad sign is visible."},implikasi:{id:"Gips/splint lengan panjang dengan siku fleksi 60–90° selama 2–3 minggu.",en:"Long-arm cast or splint with the elbow flexed 60–90° for 2–3 weeks."},skema:{jenis:"gartland",tipe:1}},{kode:"II",label:{id:"Tipe II — bergeser, korteks posterior utuh",en:"Type II — displaced, posterior cortex intact"},deskripsi:{id:"Bergeser dengan korteks posterior utuh sebagai engsel; dapat berangulasi atau berotasi; garis humerus anterior lewat di depan kapitulum.",en:"Displaced with an intact posterior cortex as hinge; may be angulated or rotated; the anterior humeral line passes in front of the capitellum."},implikasi:{id:"Biasanya reduksi tertutup + gips; fiksasi K-wire bila tidak stabil, bila ada malrotasi, atau bila reduksi hanya bertahan dengan fleksi berlebihan (risiko neurovaskular).",en:"Usually closed reduction and casting; K-wire fixation if unstable, malrotated, or if reduction holds only in excessive flexion (neurovascular risk)."},skema:{jenis:"gartland",tipe:2}},{kode:"III",label:{id:"Tipe III — bergeser total",en:"Type III — completely displaced"},deskripsi:{id:"Pergeseran total; posteromedial (lebih sering, tangan pronasi) atau posterolateral (tangan supinasi). Cedera saraf 7–10% (n. medianus/interoseus anterior tersering), cedera vaskular 0,5%, sindrom kompartemen < 1%.",en:"Complete displacement; posteromedial (more common, pronated hand) or posterolateral (supinated hand). Nerve injury 7–10% (median/anterior interosseous most common), vascular injury 0.5%, compartment syndrome < 1%."},implikasi:{id:"Reduksi tertutup + pinning perkutan = standar; ORIF untuk yang tidak stabil rotasi, terbuka, atau dengan cedera neurovaskular; eksplorasi a. brakialis hanya untuk tangan pucat tanpa nadi yang menetap setelah reduksi.",en:"Closed reduction and percutaneous pinning is the standard; ORIF for rotationally unstable, open, or neurovascular-injured fractures; brachial artery exploration only for a persistently white pulseless hand after reduction."},skema:{jenis:"gartland",tipe:3}}]},qn={id:"milch",nama:{id:"Milch & Jakob — kondilus lateral humerus anak",en:"Milch & Jakob — pediatric lateral condyle"},singkat:"Milch",deskripsi:{id:"Menurut hubungan garis fraktur dengan alur troklea (capitulotrochlear groove); menentukan stabilitas siku. Tahap pergeseran dinilai dengan Jakob/Weiss.",en:"By the relation of the fracture line to the capitulotrochlear groove; determines elbow stability. Displacement is staged by Jakob/Weiss."},sumber:[{buku:"HoF",bab:"44",hlm:{awal:570,akhir:605}}],tingkat:[{id:"Tipe",en:"Type"}],akar:[{kode:"I",label:{id:"Milch I — lateral dari alur troklea",en:"Milch I — lateral to the trochlear groove"},deskripsi:{id:"Garis fraktur keluar lateral terhadap alur troklea (melalui kapitulum): cedera Salter-Harris IV; troklea utuh sehingga siku stabil. Lebih jarang.",en:"Fracture line exits lateral to the trochlear groove (through the capitellum): Salter-Harris IV; trochlea intact so the elbow is stable. Less common."},skema:{jenis:"milch",tipe:1}},{kode:"II",label:{id:"Milch II — melalui alur troklea",en:"Milch II — into the trochlear groove"},deskripsi:{id:"Garis fraktur masuk ke alur troklea (medial): cedera Salter-Harris II; dinding lateral troklea hilang sehingga siku dapat subluksasi lateral. Lebih sering.",en:"Fracture line enters the trochlear groove (medially): Salter-Harris II; lateral trochlear wall lost so the elbow may sublux laterally. More common."},skema:{jenis:"milch",tipe:2}},{kode:"J",label:{id:"Tahap pergeseran (Jakob/Weiss)",en:"Displacement stages (Jakob/Weiss)"},deskripsi:{id:"I: tidak bergeser (< 2 mm), permukaan sendi utuh → imobilisasi 3 minggu (40% kasus). II: pergeseran sedang → coba reduksi tertutup (varus, supinasi, ekstensi) + K-wire perkutan, artrogram untuk memastikan. III: bergeser total & berotasi dengan siku tidak stabil → reduksi terbuka + K-wire. Sebagian besar II–III yang tidak stabil perlu reduksi terbuka (60%).",en:"I: nondisplaced (< 2 mm), articular surface intact → immobilise 3 weeks (40% of cases). II: moderate displacement → attempt closed reduction (varus, supinatio rior / posterior)",en:"Displaced (anterior / posterior)"},kode:"15.1A",gambar:"klavikula:medial-bergeser",ringkas:"Pergeseran posterior dapat menekan mediastinum superior — pembuluh besar dan trakea; ini kegawatan.",ref:ia(584),indikasi:"medial-bergeser"},{id:"medial-artikular",nama:{id:"Intraartikular / separasi fisis",en:"Intraarticular / physeal separation"},kode:"15.1B–C",gambar:"klavikula:medial-artikular",ringkas:"Fisis medial menutup terakhir (23–25 tahun); banyak cedera medial pada remaja sebenarnya Salter-Harris I/II.",ref:ia(584),indikasi:"medial-stabil"}]}],indikasi:{"tengah-stabil":{intro:"Fraktur tanpa pergeseran berarti: tujuan terapi adalah kenyamanan, lalu gerak dini.",opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling",en:"Nonoperative — sling"},gambar:"sling",utama:["Fraktur tak bergeser / pergeseran minimal","Pasien tanpa indikasi absolut operasi"],ref:Sa(167),tatalaksana:"nonop"}]},"tengah-bergeser":{intro:"Pergeseran total, kominusi, atau pemendekan adalah wilayah kontroversi: sebagian besar tetap menyatu tanpa operasi, tetapi nonunion dan malunion simtomatik lebih sering dan fungsi bisa lebih rendah.",opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling",en:"Nonoperative — sling"},gambar:"sling",utama:["Pasien yang menerima risiko deformitas/pemendekan residual","Kontraindikasi bedah","Pergeseran tanpa indikasi absolut"],ref:[Sa(167),ia(575)],tatalaksana:"nonop"},{id:"plat",nama:{id:"Reduksi terbuka + plat (superior / anteroinferior)",en:"ORIF — plate"},gambar:"klavikula:plat-superior",utama:["Absolut: fraktur terbuka, kulit terancam tembus, gangguan neurovaskular","Relatif: pemendekan/elevasi > 2,5 cm (AO) atau > 1–2 cm (HoF), pergeseran > 100%, floating shoulder, politrauma, fraktur iga multipel","Kominusi (deformitas Z) — plat bisa dipakai sebagai proteksi/jembatan"],ref:[Sa(167),ia(575)],tatalaksana:"plat"},{id:"im",nama:{id:"Fiksasi intramedular (nail elastis titanium)",en:"Intramedullary fixation (TEN)"},gambar:"klavikula:im-nail",utama:["Pola **simpel** transversal/oblik — bukan multifragmentari (tidak bisa dikunci statis)","Menginginkan insisi kecil dan kosmesis lebih baik"],ref:ia(579),tatalaksana:"im"}]},"lateral-stabil":{intro:"Fraktur lateral yang tak bergeser dan ekstraartikular umumnya sembuh tanpa penyulit.",opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling",en:"Nonoperative — sling"},gambar:"sling",utama:["Neer I dan III tanpa pergeseran"],ref:[Sa(167),ia(575)],tatalaksana:"nonop"}]},"lateral-2":{intro:"Neer II bergeser: nonunion sekitar **30%**, tetapi nonunion radiologis tidak selalu bergejala — putuskan kasus per kasus.",ref:ia(575),opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling + gerak bertahap",en:"Nonoperative"},gambar:"sling",utama:["Ujung tulang masih berkontak","Pasien tua / tuntutan fungsi rendah"],ref:[Sa(167),ia(575)],tatalaksana:"nonop"},{id:"plat-lateral",nama:{id:"Plat lateral anatomis (locking)",en:"Precontoured lateral locking plate"},gambar:"klavikula:plat-lateral",utama:["Fragmen lateral cukup besar untuk ≥ 3 sekrup bikortikal","Ditambah lag screw bila garis fraktur oblik"],ref:ia(580),tatalaksana:"plat-lateral"},{id:"hook",nama:{id:"Hook plate",en:"Hook plate"},gambar:"klavikula:hook-plate",utama:["Fragmen lateral terlalu kecil untuk sekrup","Paling kuat mempertahankan reduksi — tetapi **wajib dilepas** setelah sembuh"],ref:ia(581),tatalaksana:"hook"},{id:"cc",nama:{id:"Fiksasi korakoklavikular (jahitan / sekrup / tightrope)",en:"Coracoclavicular fixation"},gambar:"klavikula:cc-fiksasi",utama:["Sebagai tambahan fiksasi primer atau rekonstruksi utama","Fragmen distal kecil"],ref:[Sa(167),ia(577)],tatalaksana:"cc"}]},"medial-stabil":{intro:"Cedera medial jarang; umumnya pergeseran minimal dan ekstraartikular.",opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling",en:"Nonoperative — sling"},gambar:"sling",utama:["Pergeseran minimal","Dislokasi/pergeseran anterior yang menetap (sering kambuh setelah reduksi, jarang mengganggu fungsi)"],ref:ia(584),tatalaksana:"nonop"}]},"medial-bergeser":{intro:"Pergeseran posterior ujung medial dapat mengancam mediastinum superior: cedera vaskular, obstruksi trakea.",opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup segera",en:"Emergent closed reduction"},gambar:"klavikula:reduksi-tertutup",utama:["Pergeseran posterior dengan tanda tekanan mediastinum","Retraksi bahu ipsilateral → bila gagal, klem tulang runcing perkutan / towel clip"],ref:ia(584),tatalaksana:"reduksi-medial"},{id:"orif-medial",nama:{id:"Reduksi terbuka + plat (bersama bedah vaskular)",en:"Open reduction + plate (with vascular surgeon)"},gambar:"klavikula:plat-superior",utama:["Reduksi tertutup gagal","Fragmen medial besar → plat 3.5 konvensional/locking; fragmen kecil → plat menjembatani ke sternum"],ref:ia(584),tatalaksana:"orif-medial"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif dengan sling",en:"Nonoperative treatment with a sling"},bab:[{judul:"Tujuan",isi:"Kenyamanan dan pengurangan nyeri adalah tujuan utama; sling terbukti memberi hasil yang sama dengan perban angka-delapan dengan kenyamanan lebih baik dan masalah kulit lebih sedikit.",ref:Sa(167)},{judul:"Prinsip imobilisasi",isi:"Sling menopang gelang bahu sehingga fragmen lateral terangkat ke atas-luar-belakang; perban angka-delapan menekan fragmen medial. Keduanya hanya mempertahankan sebagian reduksi dan membiarkan tangan serta siku tetap dipakai. AO menganjurkan **meninggalkan** perban angka-delapan: tanpa manfaat tambahan, berisiko luka tekan aksila dan nonunion lebih tinggi.",ref:[Sa(167),ia(573)]},{judul:"Durasi & latihan",isi:"Imobilisasi umumnya **4–6 minggu** (HoF); AO memulai latihan rentang gerak dan penguatan begitu nyeri mereda, biasanya setelah **2–6 minggu**. Selama imobilisasi, gerak aktif siku, pergelangan tangan, dan tangan tetap dilakukan.",ref:[Sa(167),ia(573)]},{judul:"Ekspektasi",isi:"Apa pun metodenya, derajat pemendekan dan deformitas tertentu biasanya tersisa. Semua fraktur bergeser yang dirawat nonoperatif sembuh dengan malunion berbagai derajat; pemendekan gelang bahu plus malrotasi fragmen distal dapat mengurangi kekuatan abduksi.",ref:[Sa(167),ia(585)]},{judul:"Komplikasi",isi:"Nonunion **0,1–13%** (85% di sepertiga tengah); untuk fraktur tengah yang bergeser total, nonunion **15%** nonoperatif vs **2%** operatif. Faktor risiko: pergeseran total, pemendekan > 2 cm, merokok, usia, energi tinggi, refraktur. Malunion dapat menurunkan skor DASH pada 1 tahun; penyempitan thoracic outlet dapat menjepit pleksus brakialis.",ref:[Sa(168),ia(585)]}]},plat:{nama:{id:"Reduksi terbuka dan fiksasi plat",en:"Open reduction and plate fixation"},bab:[{judul:"Waktu operasi",isi:"Indikasi absolut dioperasi tanpa menunda. Untuk indikasi relatif, penundaan > 2–3 minggu mempersulit reduksi, terutama bila direncanakan teknik perkutan.",ref:ia(576)},{judul:"Posisi & pendekatan",isi:"Beach chair / setengah duduk, bantalan di bawah bahu untuk mengangkat klavikula; lengan boleh dibebaskan. Insisi transversal sepanjang sumbu klavikula (lebih ekstensibel) atau *saber-cut* sejajar garis Langer (lebih aman untuk n. supraklavikular, kosmetik lebih baik). Kulit–subkutis dimobilisasi sebagai satu lapisan dan lapisan miofasial diinsisi satu lapisan agar penutupan berlapis di atas plat.",ref:ia(578)},{judul:"Reduksi",isi:"Hindari pengupasan periosteum agresif terutama posterior dan inferior; pertahankan perlekatan jaringan lunak fragmen vertikal. Fragmen intermediet difiksasi sekrup mini/small sebagai **lag screw** sehingga fraktur menjadi simpel, lalu klem reduksi menyejajarkan fragmen proksimal–distal.",ref:ia(578)},{judul:"Implan & posisi plat",isi:"Plat kompresi 3.5, plat rekonstruksi, atau LCP prakontur anatomis. Posisi **superior** lebih kuat secara biomekanik (terutama bila ada kominusi inferior) dan lebih sederhana, tetapi berisiko menonjol dan membutuhkan bor hati-hati karena struktur neurovaskular di bawahnya (terutama sepertiga proksimal; sebagian memakai bor osilasi/retraktor tumpul). Posisi **anterior/anteroinferior**: lintasan bor lebih aman, kurang menonjol, mudah dikontur, sekrup lebih panjang. Dalam mode kompresi/proteksi: stabilitas absolut dengan **3 sekrup bikortikal** tiap sisi. Bila stabilitas absolut tak tercapai, pakai prinsip plat jembatan dengan panjang plat memadai — plat rekonstruksi tidak cukup kuat sebagai jembatan.",ref:[Sa(167),ia(576),ia(578)]},{judul:"Penutupan",isi:"Cangkok tulang tidak diperlukan pada operasi primer. Tutup lapisan miofasial dengan baik di atas plat untuk menutupi implan dan melindungi dari infeksi.",ref:ia(578)},{judul:"Pascaoperasi",isi:"Sling dan latihan pendulum bahu dimulai; kontrol **2 minggu** untuk luka dan foto, lalu sling dilepas dan gerak bebas tanpa mengangkat beban. Bila ada tanda union pada **6 minggu**, mulai penguatan. Hindari olahraga kontak/ekstrem **3 bulan** pertama.",ref:ia(584)},{judul:"Komplikasi",isi:"Infeksi luka hingga **4,8%**; baal infraklavikular hingga **83%** (berkurang seiring waktu, tanpa kehilangan fungsi bermakna); implan menonjol/iritasi (lebih sedikit dengan plat anterior atau prakontur rendah); refraktur setelah pelepasan implan; nonunion **2%**; pembuluh subklavia berisiko pada plat superior. Pelepasan plat rutin dan dini tidak dianjurkan.",ref:[Sa(168),ia(585)]}]},im:{nama:{id:"Fiksasi intramedular dengan nail elastis titanium",en:"Intramedullary fixation with a titanium elastic nail"},bab:[{judul:"Kelebihan & kekurangan",isi:"Insisi kecil, kosmesis lebih baik, diseksi jaringan lunak minimal, implan tidak menonjol. Kekurangan: iritasi/kerusakan kulit di titik masuk (sering perlu pelepasan), migrasi implan, dan tanpa penguncian statis sehingga panjang–rotasi tidak terkontrol → pemendekan sekunder pada multifragmentari. Karena itu **hanya untuk pola simpel** transversal/oblik. Pin berulir kaku generasi lama pernah bermigrasi ke rongga toraks; HoF mencatat komplikasi hingga **50%** pada implan intramedular lama.",ref:[Sa(167),ia(576),ia(579)]},{judul:"Teknik",isi:"Antegrade dari titik masuk anteromedial fragmen medial, **1–2 cm** lateral sendi sternoklavikular: lubang bor 2,5 mm pada korteks anterior diperbesar dengan awl; nail elastis **2,0–3,5 mm** dimasukkan ke kanal medula dan dilewatkan menyeberangi fraktur di bawah pencitraan. Bila reduksi tertutup gagal atau kanal sempit, coba reduksi perkutan dengan klem runcing; bila masih gagal, insisi di atas fraktur untuk reduksi langsung — diperlukan pada sekitar **50%** kasus. Ujung nail dimajukan ke korteks distal fragmen lateral; ujung medial dipotong dan ditutup end cap.",ref:ia(579)},{judul:"Catatan keselamatan",isi:"Reduksi tertutup klavikula tidak selalu mudah; waspadai paparan radiasi berlebihan pada tangan operator.",ref:ia(579)}]},"plat-lateral":{nama:{id:"Plat lateral anatomis untuk fraktur ujung lateral",en:"Anatomical lateral plate for lateral-end fractures"},bab:[{judul:"Pendekatan",isi:"Beach chair; insisi berpusat pada ujung distal klavikula, diperpanjang 1 cm melewati sendi AC. Sendi AC dikenali dengan bantuan jarum setelah diseksi lapisan dalam.",ref:ia(580)},{judul:"Fiksasi",isi:"Fragmen lateral memerlukan minimal **3 sekrup bikortikal**; lag screw pada fraktur oblik. Plat locking lateral prakontur memungkinkan lebih banyak sekrup locking ke fragmen distal dan menghindari komplikasi hook plate. Jahitan/sling substitusi ligamen CC dapat ditambahkan bila area sekrup terbatas.",ref:[Sa(167),ia(577),ia(581)]},{judul:"Pascaoperasi",isi:"Sama dengan plat diafisis: sling + pendulum, kontrol 2 minggu, penguatan setelah tanda union (6 minggu), tanpa olahraga kontak 3 bulan.",ref:ia(584)}]},hook:{nama:{id:"Hook plate",en:"Hook plate"},bab:[{judul:"Prinsip",isi:"Dipilih bila fragmen lateral terlalu kecil untuk sekrup. Ruang subakromial ditembus dengan gunting lengkung/klem, kait dimasukkan ke ruang subakromial **posterior** sendi AC, lalu plat direduksi ke permukaan superior klavikula; sekrup korteks dapat dipasang berurutan memakai plat sebagai pengungkit.",ref:ia(580)},{judul:"Konsekuensi",isi:"Implan paling efektif mempertahankan reduksi, tetapi **selalu** menimbulkan impingement subakromial yang nyeri dan membatasi gerak — pasien harus diberi tahu bahwa operasi kedua untuk melepas plat diperlukan setelah fraktur sembuh; fungsi bahu umumnya pulih baik setelah pelepasan.",ref:ia(581)}]},cc:{nama:{id:"Fiksasi korakoklavikular",en:"Coracoclavicular fixation"},bab:[{judul:"Pilihan teknik",isi:"Diturunkan dari terapi dislokasi AC: sekrup korakoklavikular (Bosworth), jahitan/tightrope, atau sling tendon/sintetik mengelilingi korakoid dan klavikula. Dapat menjadi tambahan fiksasi primer atau rekonstruksi utama. Hasil memuaskan tanpa konsensus metode terbaik; sebagian kehilangan reduksi dapat diharapkan.",ref:[Sa(167),ia(577),ia(583)]}]},"reduksi-medial":{nama:{id:"Reduksi tertutup pergeseran posterior ujung medial",en:"Closed reduction of posterior medial-end displacement"},bab:[{judul:"Langkah",isi:"Reduksi tertutup **segera** dicoba dengan retraksi bahu ipsilateral. Bila gagal, klem tulang runcing perkutan atau towel clip untuk menarik ujung medial ke anterior. Bila tetap gagal: reduksi terbuka dan stabilisasi bersama bedah vaskular; bila tersedia radiologi intervensi, kateter balon dapat dipasang sebelum operasi untuk kontrol vaskular proksimal.",ref:ia(584)},{judul:"Mengapa gawat",isi:"Pergeseran posterior dapat menekan mediastinum superior: cedera vaskular, bahkan obstruksi trakea. Dislokasi/pergeseran anterior sebaliknya sering tidak stabil setelah reduksi dan dapat dibiarkan karena jarang mengganggu fungsi.",ref:ia(584)}]},"orif-medial":{nama:{id:"Stabilisasi terbuka fraktur ujung medial",en:"Open stabilization of medial-end fractures"},bab:[{judul:"Implan",isi:"Plat 3.5 konvensional atau locking bila fragmen medial cukup besar; plat klavikula lateral anatomis memungkinkan lebih banyak sekrup. Bila fragmen medial terlalu kecil atau pada dislokasi, plat difiksasi ke sternum menjembatani sendi.",ref:ia(584)},{judul:"Pencitraan",isi:"Diagnosis dengan foto polos sulit; tilt sefalad 40° (*serendipity view*) membandingkan dengan sisi normal; CT memberi gambaran terbaik.",ref:ia(584)}]}}}});var xs={};Oa(xs,{default:()=>Mt});var T,ye,Mt,As=ga(()=>{T=a=>({buku:"HoF",bab:"12",hlm:a}),ye=a=>({buku:"AO",bab:"6.1.2",hlm:a}),Mt={id:"sendi-ac-sc",nama:{id:"Sendi akromioklavikular & sternoklavikular",en:"Acromioclavicular & sternoclavicular joints"},sumber:[{buku:"HoF",bab:"12",hlm:{awal:170,akhir:180}},{buku:"AO",bab:"6.1.2",hlm:{awal:581,akhir:583}}],gambar:"sendi-ac:utuh",intro:{id:"Dua sendi di ujung klavikula: AC dinilai dari arah dan derajat pergeseran klavikula distal (Rockwood I–VI); SC jarang, tetapi dislokasi posterior mengancam mediastinum.",en:"Two joints at the ends of the clavicle: AC injuries are graded by the direction and degree of distal clavicle displacement (Rockwood I–VI); SC injuries are rare, but posterior dislocation threatens the mediastinum."},pemeriksaan:{klinis:[{teks:"Sendi AC: periksa pasien berdiri/duduk dengan lengan menggantung agar deformitas tampak — bahu dan lengan turun, *step-off* di AC, kulit dapat *tenting* di atas klavikula distal; nyeri tekan di sendi.",ref:[T(171),T(172)]},{teks:"Sendi SC: pasien menopang lengan dengan tangan sebelahnya, kepala miring ke sisi cedera; bengkak dan nyeri tekan di medial klavikula.",ref:T(177)},{teks:"Dislokasi SC posterior: bendungan vena lengan, sesak, nyeri saat inspirasi, sulit menelan, rasa tercekik — auskultasi kedua paru; pleksus brakialis dan pembuluh besar tepat di belakang klavikula medial.",ref:T(177)}],radiologis:[{teks:"AC: seri trauma bahu (AP, skapular-Y, aksilar) biasanya cukup; **Zanca** (tilt sefalad 10–15°) memperjelas klavikula distal; foto stres dengan beban 10–15 lb di pergelangan membandingkan jarak korakoklavikular kedua sisi (sulit dalam keadaan akut).",ref:T(172)},{teks:"SC: asimetri klavikula pada foto toraks AP; **Hobbs** (lateral sefalokaudal 90°); **Serendipity** (tilt sefalad 40° ke manubrium): dislokasi anterior — klavikula medial di atas garis interklavikular, posterior — di bawahnya.",ref:[T(177),T(178)]},{teks:"CT adalah pemeriksaan terbaik untuk SC: membedakan fraktur klavikula medial dari dislokasi dan menangkap subluksasi ringan.",ref:T(178)}],mekanisme:[{teks:"AC — langsung (tersering): jatuh pada bahu dengan lengan aduksi, akromion terdorong ke medial-inferior. Tidak langsung: jatuh pada tangan terentang, gaya naik lewat kaput humerus ke AC — ligamen CC tidak teregang.",ref:T(171)},{teks:"Stabilitas horizontal AC oleh ligamen AC; stabilitas vertikal oleh ligamen korakoklavikular (konoid medial, trapezoid lateral); jarak CC normal 1,1–1,3 cm.",ref:T(170)},{teks:"SC — langsung: gaya pada klavikula anteromedial mendorongnya ke posterior (mediastinum). Tidak langsung: tekanan bahu dari anterolateral → dislokasi anterior; dari posterolateral → posterior (tumpukan pemain football).",ref:T(176)},{teks:"Fisis klavikula medial adalah fisis yang paling akhir menutup (osifikasi 20 tahun, fusi 25–30 tahun) — banyak 'dislokasi SC' pada pasien muda sebenarnya cedera fisis.",ref:T(175)}],epidemiologi:[{teks:"Dislokasi AC: **9–10%** cedera akut gelang bahu (AO: 12%); puncak dekade kedua, olahraga kontak; laki-laki ≈ 5:1.",ref:[T(170),ye(581)]},{teks:"SC jarang: dari 1.603 dislokasi gelang bahu hanya **3%** SC (85% glenohumeral, 12% AC); ≈ 80% akibat kecelakaan kendaraan (47%) atau olahraga (31%).",ref:T(175)},{teks:"Cedera penyerta AC: fraktur klavikula, akromion, korakoid; pneumotoraks/kontusio paru pada tipe VI.",ref:T(171)}]},klasifikasi:[{nama:"Rockwood (AC)",teks:"I sprain ligamen AC; II ligamen AC putus, CC teregang (klavikula sedikit naik, celah CC normal pada foto stres); III AC + CC putus, celah CC 25–100% lebih lebar; IV klavikula distal ke posterior ke dalam/menembus trapezius; V pergeseran superior > 100% (celah CC 100–300%); VI klavikula di bawah akromion atau korakoid.",ref:[T(172),T(173)]},{nama:"SC — anatomis",teks:"Anterior (lebih sering) dan posterior.",ref:T(178)},{nama:"SC — etiologis",teks:"Sprain/subluksasi (ringan: stabil; sedang: subluksasi, ligamen sebagian putus; berat: tidak stabil), dislokasi akut, rekuren (jarang), tak tereduksi, atraumatik (spontan, kongenital, osteoartritis, osteitis kondensans, hiperostosis, infeksi).",ref:T(178)}],kelompok:[{id:"ac",nama:{id:"Sendi akromioklavikular",en:"Acromioclavicular joint"},kode:"Rockwood",jenis:[{id:"ac-1",nama:{id:"Tipe I — sprain AC",en:"Type I — AC sprain"},kode:"I",gambar:"sendi-ac:tipe-1",ringkas:"Nyeri tekan sendi AC, nyeri minimal saat gerak, celah CC tak nyeri; foto normal.",ref:T(172),indikasi:"ac-12"},{id:"ac-2",nama:{id:"Tipe II — AC putus, CC teregang",en:"Type II — AC torn, CC sprained"},kode:"II",gambar:"sendi-ac:tipe-2",ringkas:"Klavikula distal sedikit di atas akromion dan dapat digoyang; sendi melebar, jarak CC pada foto stres sama dengan sisi sehat.",ref:T(172),indikasi:"ac-12"},{id:"ac-3",nama:{id:"Tipe III — AC + CC putus",en:"Type III — AC and CC torn"},kode:"III",gambar:"sendi-ac:tipe-3",ringkas:"Lengan turun, ujung klavikula dapat menegangkan kulit; klavikula distal di atas tepi medial akromion, celah CC 25–100% lebih lebar.",ref:T(172),indikasi:"ac-3"},{id:"ac-4",nama:{id:"Tipe IV — posterior",en:"Type IV — posterior"},kode:"IV",gambar:"sendi-ac:tipe-4",ringkas:"Klavikula distal menembus trapezius ke posterior; lebih nyeri daripada tipe III; dipastikan dengan foto aksilar atau CT.",ref:T(173),indikasi:"ac-456"},{id:"ac-5",nama:{id:"Tipe V — superior berat",en:"Type V — grossly superior"},kode:"V",gambar:"sendi-ac:tipe-5",ringkas:"Pergeseran superior > 100% dengan deltoid–trapezius terlepas; kulit *tenting*; celah CC 100–300%.",ref:T(173),indikasi:"ac-456"},{id:"ac-6",nama:{id:"Tipe VI — inferior",en:"Type VI — inferior"},kode:"VI",gambar:"sendi-ac:tipe-6",ringkas:"Klavikula di bawah akromion (subakromial) atau korakoid (subkorakoid), bahu tampak datar; trauma energi tinggi — fraktur klavikula/iga atas dan cedera pleksus sering menyertai.",ref:T(173),indikasi:"ac-456"}]},{id:"sc",nama:{id:"Sendi sternoklavikular",en:"Sternoclavicular joint"},kode:"",jenis:[{id:"sc-sprain",nama:{id:"Sprain / subluksasi SC",en:"SC sprain / subluxation"},kode:"",gambar:"sendi-sc:sprain",ringkas:"Ringan: sendi stabil; sedang: subluksasi dengan ligamen sebagian putus.",ref:T(178),indikasi:"sc-sprain"},{id:"sc-anterior",nama:{id:"Dislokasi SC anterior",en:"Anterior SC dislocation"},kode:"",gambar:"sendi-sc:anterior",ringkas:"Lebih sering; tonjolan klavikula medial; pada Serendipity klavikula berada di atas garis interklavikular.",ref:[T(178)],indikasi:"sc-anterior"},{id:"sc-posterior",nama:{id:"Dislokasi SC posterior",en:"Posterior SC dislocation"},kode:"",gambar:"sendi-sc:posterior",ringkas:"Klavikula medial di belakang manubrium menekan trakea, esofagus, dan pembuluh besar — keluhan napas/menelan harus dicari; komplikasi hingga **25%**.",ref:[T(177),T(180)],indikasi:"sc-posterior"},{id:"sc-fisis",nama:{id:"Cedera fisis klavikula medial",en:"Medial clavicular physeal injury"},kode:"< 25 tahun",gambar:"sendi-sc:fisis",ringkas:"Pada pasien muda, 'dislokasi' sering adalah separasi fisis karena fisis medial baru menyatu pada usia 25–30 tahun; CT membedakannya.",ref:[T(175),T(178)],indikasi:"sc-fisis"}]}],indikasi:{"ac-12":{intro:"Tipe I–II: nonoperatif. Lebih dari separuh pasien tipe I–II masih bergejala pada tindak lanjut jangka panjang.",ref:T(174),opsi:[{id:"sling",nama:{id:"Istirahat, es, sling → gerak dini",en:"Rest, ice, sling → early motion"},gambar:"sling",utama:["Tipe I: istirahat 7–10 hari, aktivitas penuh setelah gerak bebas nyeri (± 2 minggu)","Tipe II: sling 1–2 minggu, gerak lembut secepatnya, tanpa aktivitas berat 6 minggu"],ref:T(174),tatalaksana:"ac-nonop"}]},"ac-3":{intro:"Tipe III adalah wilayah kontroversi: nonoperatif untuk sebagian besar — literatur terkini (AO) bahkan mengunggulkan nonoperatif pada dewasa muda aktif, yang menyisakan deformitas kosmetik tetapi fungsi baik; stabilisasi operatif dipertimbangkan pada pergeseran berat atau pekerja di atas kepala.",ref:[T(175),ye(581),ye(583)],opsi:[{id:"nonop",nama:{id:"Nonoperatif — sling, gerak dini, penguatan",en:"Nonoperative — sling, early motion, strengthening"},gambar:"sling",utama:["Pasien tidak aktif, bukan pekerja berat, atlet rekreasional — terutama lengan nondominan","Menerima deformitas","Atlet kontak: perbaikan umumnya dihindari (risiko cedera ulang)"],ref:T(175),tatalaksana:"ac-nonop"},{id:"cc",nama:{id:"Stabilisasi operatif (rekonstruksi CC)",en:"Operative stabilization (CC reconstruction)"},gambar:"sendi-ac:cc-rekonstruksi",utama:["Muda, aktif, pergeseran lebih berat","Pekerja yang memakai lengan di atas bidang horizontal"],ref:T(175),tatalaksana:"ac-op"}]},"ac-456":{intro:"Tipe IV–VI umumnya direduksi terbuka dan ligamen korakoklavikular diperbaiki/direkonstruksi untuk stabilitas vertikal — meski tanpa bukti level 1.",ref:T(175),opsi:[{id:"orif",nama:{id:"Reduksi terbuka + perbaikan/rekonstruksi CC",en:"Open reduction + CC repair/reconstruction"},gambar:"sendi-ac:orif",utama:["Tipe IV (posterior), V (superior berat), VI (inferior)","Sekrup CC Bosworth ± perbaikan ligamen; tightrope/anchor artroskopik; sling tendon/sintetik mengitari korakoid"],ref:[T(175),ye(583)],tatalaksana:"ac-op"},{id:"hook",nama:{id:"Hook plate",en:"Hook plate"},gambar:"sendi-ac:hook-plate",utama:["Seperti pada fraktur klavikula lateral: menahan reduksi vertikal sampai ligamen sembuh","Perlu dilepas kemudian"],ref:ye(583),tatalaksana:"ac-op"}]},"sc-sprain":{intro:"Sprain dan subluksasi SC ditangani nonoperatif dengan es, imobilisasi singkat, dan kembali bertahap ke aktivitas.",ref:T(178),opsi:[{id:"nonop",nama:{id:"Es + sling (ringan) / strap klavikula (sedang)",en:"Ice + sling (mild) / clavicle strap (moderate)"},gambar:"angka-delapan",utama:["Ringan: es 24 jam, sling 3–4 hari","Sedang: strap klavikula, sling-and-swathe, atau perban angka-delapan 1 minggu, lalu sling 4–6 minggu"],ref:[T(178),T(179)],tatalaksana:"sc-nonop"}]},"sc-anterior":{intro:"Dislokasi anterior biasanya tidak stabil setelah direduksi, sehingga upaya reduksi tertutup pun kontroversial; sling untuk kenyamanan diterima.",ref:T(179),opsi:[{id:"sling",nama:{id:"Sling untuk kenyamanan (menerima deformitas)",en:"Sling for comfort (accept deformity)"},gambar:"sling",utama:["Reduksi umumnya tidak stabil","Tonjolan medial yang tersisa adalah keluhan kosmetik tersering"],ref:[T(179),T(180)],tatalaksana:"sc-nonop"},{id:"reduksi",nama:{id:"Reduksi tertutup (tekanan posterior)",en:"Closed reduction (posterior pressure)"},gambar:"sendi-sc:reduksi-anterior",utama:["Anestesi umum atau narkotik + relaksan","Telentang, gulungan di antara skapula; tekan klavikula medial ke posterior","Lalu strap/sling-and-swathe/angka-delapan 4–6 minggu"],ref:T(179),tatalaksana:"sc-reduksi"}]},"sc-posterior":{intro:"Dislokasi posterior memerlukan reduksi segera — tertutup atau terbuka — di bawah anestesi umum, setelah masalah paru dan neurovaskular disingkirkan, dengan ahli bedah toraks siaga.",ref:[T(179),T(180)],opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup — traksi abduksi-ekstensi ± towel clip",en:"Closed reduction — abduction-extension traction ± towel clip"},gambar:"sendi-sc:reduksi-posterior",utama:["Sering berhasil dan tetap stabil","Telentang, gulungan di antara skapula; traksi lengan abduksi-ekstensi; towel clip menarik klavikula ke anterior bila perlu"],ref:[T(179),T(180)],tatalaksana:"sc-reduksi"},{id:"op",nama:{id:"Reduksi terbuka / fiksasi jaringan lunak",en:"Open reduction / soft-tissue fixation"},gambar:"sendi-sc:fiksasi-jahit",utama:["Gagal reduksi tertutup atau tidak stabil","Fiksasi ke sternum dengan fasia lata, tendon subklavius, atau jahitan; osteotomi atau reseksi klavikula medial","K-wire/pin Steinmann dihindari — migrasi"],ref:T(180),tatalaksana:"sc-op"}]},"sc-fisis":{intro:"Cedera fisis medial biasanya berhasil direduksi tertutup dan sembuh dengan imobilisasi 4–6 minggu.",ref:T(180),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup + strap 4–6 minggu",en:"Closed reduction + strap 4–6 weeks"},gambar:"sendi-sc:reduksi-anterior",utama:["Strap klavikula, sling-and-swathe, atau perban angka-delapan setelah reduksi"],ref:T(180),tatalaksana:"sc-reduksi"}]}},tatalaksana:{"ac-nonop":{nama:{id:"Nonoperatif sendi AC",en:"Nonoperative AC treatment"},bab:[{judul:"Tipe I",isi:"Istirahat 7–10 hari, kompres es, sling. Aktivitas penuh ditunda sampai gerak penuh tanpa nyeri (sekitar 2 minggu).",ref:T(174)},{judul:"Tipe II",isi:"Sling 1–2 minggu, gerak lembut secepat mungkin; hindari aktivitas berat 6 minggu. Lebih dari 50% pasien tipe I–II masih bergejala pada tindak lanjut jangka panjang.",ref:T(174)},{judul:"Tipe III nonoperatif",isi:"Sling, gerak dini, penguatan, dan menerima deformitas — pilihan untuk pasien tidak aktif, bukan pekerja berat, atlet rekreasional, terutama lengan nondominan.",ref:T(175)},{judul:"Komplikasi",isi:"Osifikasi korakoklavikular (tanpa tambahan disabilitas), osteolisis klavikula distal (nyeri tumpul kronis dan lemah), artritis AC.",ref:T(175)}]},"ac-op":{nama:{id:"Stabilisasi operatif sendi AC",en:"Operative AC stabilization"},bab:[{judul:"Siapa",isi:"Tipe III pada pasien muda-aktif dengan pergeseran berat dan pekerja di atas kepala; tipe IV–VI pada umumnya. Perbaikan dihindari pada atlet kontak karena risiko cedera ulang.",ref:T(175)},{judul:"Apa yang dilakukan",isi:"Reduksi terbuka, lalu perbaikan atau rekonstruksi ligamen korakoklavikular untuk mengembalikan stabilitas vertikal; perlekatan deltoid–trapezius yang terlepas dijahit kembali. Belum ada bukti level 1 untuk pilihan ini.",ref:T(175)},{judul:"Teknik (AO)",isi:"Sekrup korakoklavikular Bosworth ± perbaikan ligamen primer; hook plate seperti pada fraktur klavikula lateral; stabilisasi artroskopik/mini-open dengan *tightrope* atau *suture anchor*; augmentasi ligamen CC dengan sling sintetik atau tendon (hamstring) yang dilingkarkan pada korakoid dan klavikula. Hasil memuaskan tanpa konsensus metode terbaik; sebagian kehilangan reduksi lazim.",ref:ye(583)}]},"sc-nonop":{nama:{id:"Nonoperatif sendi SC",en:"Nonoperative SC treatment"},bab:[{judul:"Sprain ringan",isi:"Es pada 24 jam pertama, sling 3–4 hari, kembali ke aktivitas bertahap sesuai toleransi.",ref:T(178)},{judul:"Sprain sedang / subluksasi",isi:"Es 24 jam pertama; strap klavikula, sling-and-swathe, atau perban angka-delapan selama 1 minggu, lalu sling 4–6 minggu.",ref:[T(178),T(179)]},{judul:"Dislokasi anterior tanpa reduksi",isi:"Karena reduksi umumnya tidak stabil, sling untuk kenyamanan dapat diterima; keluhan tersisa biasanya kosmetik (tonjolan medial).",ref:[T(179),T(180)]}]},"sc-reduksi":{nama:{id:"Reduksi tertutup sendi SC",en:"Closed reduction of the SC joint"},bab:[{judul:"Persiapan",isi:"Anestesi umum (atau narkotik + relaksan otot pada pasien tabah). Pasien telentang dengan gulungan di antara kedua skapula. Pada dislokasi posterior, singkirkan dulu masalah paru dan neurovaskular dan pastikan ahli bedah umum/toraks tersedia.",ref:[T(179),T(180)]},{judul:"Anterior",isi:"Tekanan langsung ke posterior pada klavikula medial biasanya mereduksi, tetapi sering tidak stabil. Pascareduksi: strap klavikula, sling-and-swathe, atau perban angka-delapan 4–6 minggu; sebagian memakai balutan anterior tebal dengan plester elastis.",ref:T(179)},{judul:"Posterior",isi:"Traksi lengan dalam abduksi dan ekstensi; bila perlu klavikula ditarik ke anterior dengan towel clip (ujung medial disiapkan steril). Reduksi tertutup sering berhasil dan tetap stabil; imobilisasi 4–6 minggu.",ref:[T(179),T(180)]},{judul:"Cedera fisis medial",isi:"Reduksi tertutup biasanya berhasil; strap klavikula, sling-and-swathe, atau perban angka-delapan 4–6 minggu.",ref:T(180)},{judul:"Komplikasi dislokasi posterior",isi:"Hingga 25%: pneumotoraks, laserasi vena kava superior, bendungan vena leher, ruptur esofagus, kompresi arteri subklavia atau karotis, perubahan suara.",ref:T(180)}]},"sc-op":{nama:{id:"Tatalaksana operatif sendi SC",en:"Operative SC treatment"},bab:[{judul:"Pilihan",isi:"Fiksasi klavikula medial ke sternum dengan fasia lata, tendon subklavius, atau jahitan; osteotomi klavikula medial; atau reseksi klavikula medial.",ref:T(180)},{judul:"Yang dihindari",isi:"K-wire atau pin Steinmann tidak dianjurkan karena implan dapat bermigrasi ke mediastinum.",ref:T(180)}]}}}});var Ss={};Oa(Ss,{default:()=>wt});var S,G,wt,Ps=ga(()=>{S=a=>({buku:"HoF",bab:"13",hlm:a}),G=a=>({buku:"AO",bab:"6.1.1",hlm:a}),wt={id:"skapula",nama:{id:"Skapula",en:"Scapula"},sumber:[{buku:"HoF",bab:"13",hlm:{awal:181,akhir:190}},{buku:"AO",bab:"6.1.1",hlm:{awal:565,akhir:572}}],gambar:"skapula:utuh",intro:{id:"Tulang pipih yang terlindung otot: patah berarti energi tinggi — cari cedera dada, pleksus, dan tulang belakang dulu. Sebagian besar ekstraartikular dan sembuh dengan sling; operasi untuk glenoid yang bergeser, leher yang miring, dan cincin suspensori yang putus dua kali.",en:"A flat bone shielded by muscle: a fracture means high energy — look for chest, plexus and spine injuries first. Most are extra-articular and heal in a sling; surgery is for displaced glenoid, angulated neck and a doubly disrupted suspensory ring."},pemeriksaan:{klinis:[{teks:"Evaluasi trauma lengkap (ABCDE) lebih dulu; pasien menopang lengan dalam aduksi dengan tangan sebelahnya, nyeri terutama pada abduksi bahu.",ref:S(182)},{teks:"Sindrom kompartemen di atas skapula jarang tetapi harus disingkirkan bila nyeri tak sebanding; **tanda Comolli** — bengkak segitiga di toraks posterior — menandakan hematoma dengan tekanan meningkat.",ref:S(182)},{teks:"Gejala klinis tidak spesifik dan sering tertutup cedera lain; fraktur leher mengancam **n. supraskapular** di takik skapula — curiga lesi n. supraskapular atau aksilaris dibuktikan dengan EMG.",ref:G(565)}],radiologis:[{teks:"Sering pertama kali terlihat pada foto toraks. Seri trauma bahu: AP sejati, aksilar, skapular-Y (lateral sejati) — menampilkan sebagian besar fraktur glenoid, leher, badan, dan akromion; aksilar memperjelas akromion dan tepi glenoid.",ref:S(182)},{teks:"Jangan keliru dengan **os acromiale** (apofisis tak menyatu, bulat; ≈ 3% populasi, bilateral 60%). **Stryker notch** (tilt sefalad 45°) untuk korakoid; CT untuk glenoid intraartikular; foto toraks wajib karena cedera toraks sering.",ref:S(182)},{teks:"AO: keterlibatan glenoid memerlukan CT (jumlah/ukuran fragmen, pergeseran artikular); rekonstruksi 3-D kian dipakai untuk perencanaan; klavikula selalu dinilai karena fraktur penyerta sering.",ref:G(565)}],mekanisme:[{teks:"Hampir selalu energi tinggi: kecelakaan mobil ≈ 50%, sepeda motor 11–25%. Tidak langsung (beban aksial lengan terentang) → leher/glenoid; langsung (pukulan/jatuh) → badan; benturan ujung bahu → akromion/korakoid; dislokasi bahu → glenoid; tarikan otot/ligamen → avulsi.",ref:S(181)},{teks:"Fraktur terisolasi biasanya pukulan langsung ke punggung dengan pola stelata; fraktur tepi glenoid anterior/posterior umumnya akibat dislokasi/subluksasi glenohumeral (*bony Bankart*) — fokus terapinya stabilitas sendi.",ref:G(565)}],epidemiologi:[{teks:"**3–5%** fraktur bahu dan 0,4–1% semua fraktur; usia rerata 35–45 tahun.",ref:S(181)},{teks:"Cedera penyerta pada 35–98%: iga/klavikula/sternum ipsilateral; pneumotoraks **11–55%**; kontusio paru 11–54%; pleksus brakialis dan avulsi vaskular; tulang belakang (servikal bawah 20%, torakal 76%, lumbal 4%). Fraktur klavikula menyertai 25% (AO).",ref:[S(181),G(565)]}]},klasifikasi:[{nama:"Zdravkovic–Damholt (anatomis)",teks:"I badan; II apofisis (akromion, korakoid); III sudut superolateral (leher dan glenoid).",ref:S(182)},{nama:"Ideberg (glenoid intraartikular)",teks:"I avulsi tepi anterior; IIA transversal / IIB oblik keluar inferior; III oblik keluar superior (sering dengan cedera AC); IV transversal keluar tepi medial; V kombinasi II + IV; VI kominutif (Goss). Bersifat historis — keputusan berdasarkan pergeseran komponen artikular.",ref:S(183)},{nama:"Akromion",teks:"I pergeseran minimal (IA avulsi, IB fraktur komplet); II bergeser tanpa menyempitkan ruang subakromial; III bergeser dengan penyempitan ruang subakromial.",ref:S(184)},{nama:"Korakoid",teks:"I proksimal terhadap ligamen korakoklavikular; II distal terhadapnya.",ref:S(185)},{nama:"AO/OTA 14",teks:"Tulang 14: prosesus (14A), badan (14B), fossa glenoid (14F).",ref:G(566)},{nama:"Disosiasi skapulotorakal",teks:"I muskuloskeletal saja; IIA + vaskular; IIB + neurologis; III + keduanya.",ref:S(189)}],kelompok:[{id:"badan-leher",nama:{id:"Badan & leher",en:"Body and neck"},kode:"Zdravkovic I & III",jenis:[{id:"badan",nama:{id:"Badan skapula",en:"Scapular body"},kode:"14B",gambar:"skapula:badan",ringkas:"Pola stelata akibat pukulan langsung; hampir selalu menyatu tanpa operasi, malunion umumnya ditoleransi.",ref:[S(188),G(565)],indikasi:"badan"},{id:"leher",nama:{id:"Leher skapula (glenoid)",en:"Scapular neck"},kode:"",gambar:"skapula:leher",ringkas:"Fragmen glenoid bergeser ke medial dan berotasi (permukaan sendi menghadap kaudal) — memperpendek lengan kerja rotator cuff.",ref:G(569),indikasi:"leher"},{id:"floating",nama:{id:"Floating shoulder (leher + klavikula)",en:"Floating shoulder"},kode:"SSSC ×2",gambar:"skapula:floating",ringkas:"Dua putusan pada cincin suspensori bahu superior (glenoid–korakoid–lig. CC–klavikula distal–AC–akromion); glenoid dapat jatuh ke kaudal.",ref:[S(187),G(570)],indikasi:"floating"}]},{id:"glenoid",nama:{id:"Glenoid (Ideberg)",en:"Glenoid (Ideberg)"},kode:"14F",jenis:[{id:"glenoid-1",nama:{id:"I — avulsi tepi anterior",en:"I — anterior rim avulsion"},kode:"Ideberg I",gambar:"skapula:glenoid-1",ringkas:"Bony Bankart: fragmen tepi dengan labrum; penting untuk stabilitas sendi meski kecil.",ref:[S(183),G(569)],indikasi:"glenoid-1"},{id:"glenoid-2",nama:{id:"II — keluar inferior",en:"II — exiting inferiorly"},kode:"Ideberg IIA/IIB",gambar:"skapula:glenoid-2",ringkas:"Transversal (A) atau oblik (B) melalui fossa keluar di inferior; dapat menyebabkan subluksasi inferior kaput humerus.",ref:[S(183),S(186)],indikasi:"glenoid-2"},{id:"glenoid-3",nama:{id:"III — keluar superior",en:"III — exiting superiorly"},kode:"Ideberg III",gambar:"skapula:glenoid-3",ringkas:"Oblik keluar di superior, sering disertai cedera sendi AC; reduksinya sulit.",ref:[S(183),S(186)],indikasi:"glenoid-3"},{id:"glenoid-4",nama:{id:"IV — keluar tepi medial",en:"IV — exiting medial border"},kode:"Ideberg IV",gambar:"skapula:glenoid-4",ringkas:"Transversal menembus badan sampai tepi medial.",ref:S(183),indikasi:"glenoid-4"},{id:"glenoid-56",nama:{id:"V–VI — kombinasi / kominutif",en:"V–VI — combined / comminuted"},kode:"Ideberg V, VI",gambar:"skapula:glenoid-6",ringkas:"V: pola II + IV; VI: glenoid kominutif.",ref:S(183),indikasi:"glenoid-56"}]},{id:"apofisis",nama:{id:"Akromion & korakoid",en:"Acromion and coracoid"},kode:"14A",jenis:[{id:"akromion",nama:{id:"Akromion",en:"Acromion"},kode:"I–III",gambar:"skapula:akromion",ringkas:"Tipe III menyempitkan ruang subakromial → impingement; singkirkan os acromiale dan robekan rotator cuff penyerta.",ref:[S(184),S(186)],indikasi:"akromion"},{id:"korakoid",nama:{id:"Korakoid",en:"Coracoid"},kode:"I–II",gambar:"skapula:korakoid-1",ringkas:"Tipe I proksimal ligamen CC (fragmen ikut klavikula bila AC terdislokasi), tipe II distal (ligamen tetap utuh).",ref:[S(185),G(568)],indikasi:"korakoid"}]},{id:"khusus",nama:{id:"Situasi khusus",en:"Special situations"},kode:"",jenis:[{id:"skapulotorakal",nama:{id:"Disosiasi skapulotorakal",en:"Scapulothoracic dissociation"},kode:"",gambar:"skapula:skapulotorakal",ringkas:"Amputasi forequarter subkutan: skapula lepas dari dinding dada; pleksopati komplet 80%, cedera a. subklavia/aksilaris 88%; lengan tak berdenyut dengan bengkak masif.",ref:S(189),indikasi:"skapulotorakal"},{id:"intratorakal",nama:{id:"Dislokasi intratorakal skapula",en:"Intrathoracic scapular dislocation"},kode:"sangat jarang",gambar:"skapula:intratorakal",ringkas:"Sudut inferior terkunci di ruang interkostal; dipastikan dengan CT toraks.",ref:S(190),indikasi:"intratorakal"}]}],indikasi:{badan:{intro:"Fiksasi badan skapula jarang diindikasikan; nonoperatif hampir selalu efektif. AO menyebut pergeseran 100% atau angulasi > 45° sebagai indikasi relatif.",ref:[S(186),G(566)],opsi:[{id:"nonop",nama:{id:"Sling + gerak dini",en:"Sling + early motion"},gambar:"sling",utama:["Hampir semua fraktur badan","Pasien tua/sedenter dengan komorbiditas (AO)"],ref:[S(186),G(566)],tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF badan (plat rekonstruksi via Judet)",en:"Body ORIF (reconstruction plate via Judet)"},gambar:"skapula:plat-leher",utama:["Eksplorasi neurovaskular diperlukan (HoF)","Pergeseran 100% atau angulasi > 45° pada pasien muda-aktif (AO)"],ref:[S(186),G(566)],tatalaksana:"orif-badan-leher"}]},leher:{intro:"Leher biasanya simtomatik dengan gerak dini; operasi bila angulasi > 40°, translasi medial > 1 cm (HoF) / > 2 cm (AO), sudut glenopolar < 22°, atau bersama fraktur klavikula bergeser.",ref:[S(186),G(566)],opsi:[{id:"nonop",nama:{id:"Simtomatik + gerak dini",en:"Symptomatic + early range of motion"},gambar:"sling",utama:["Pergeseran dan angulasi di bawah ambang","Sudut glenopolar masih > 20–30°"],ref:[S(186),S(187)],tatalaksana:"nonop"},{id:"plat",nama:{id:"ORIF plat rekonstruksi 3.5 di tepi lateral",en:"ORIF reconstruction plate 3.5 on the lateral margin"},gambar:"skapula:plat-leher",utama:["Pemendekan > 1 cm / rotasi > 40° (AO) · angulasi > 40° / translasi medial 1 cm (HoF)","Pendekatan posterior"],ref:[S(186),G(569)],tatalaksana:"orif-badan-leher"}]},floating:{intro:"Secara historis dioperasi karena glenoid dapat miring dan memendek; seri nonoperatif terbaru memberi hasil baik — sudut glenopolar < 30° (HoF) dan pergeseran medial > 2 cm (AO) mengarah ke operasi.",ref:[S(187),G(570)],opsi:[{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Pergeseran minimal (< 5 mm) — Edwards dkk.","Tanpa dislokasi kaudal glenoid: cedera ini tidak inheren tidak stabil (van Noort dkk.)"],ref:G(570),tatalaksana:"nonop"},{id:"klavikula",nama:{id:"Fiksasi klavikula (± leher glenoid)",en:"Clavicle fixation (± glenoid neck)"},gambar:"skapula:fiksasi-klavikula",utama:["Fiksasi klavikula umumnya cukup menstabilkan leher glenoid (HoF)","Pergeseran medial dengan pemendekan > 2 cm (AO)"],ref:[S(186),G(570)],tatalaksana:"orif-badan-leher"}]},"glenoid-1":{intro:"Fragmen tepi anteroinferior yang bergeser harus dioperasi untuk memulihkan permukaan sendi dan mencegah instabilitas berulang — bahkan bila kecil (AO).",ref:G(569),opsi:[{id:"orif",nama:{id:"ORIF sekrup lag via deltopektoral",en:"Lag-screw ORIF via deltopectoral"},gambar:"skapula:orif-glenoid",utama:["Instabilitas sendi atau fragmen > ¼ fossa (HoF)","Sekrup lag 3.5/2.7 dari luar kapsul, cukup panjang ke korteks posterior leher"],ref:[S(186),G(569)],tatalaksana:"orif-glenoid"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Fragmen kecil tanpa instabilitas","Kaput humerus tetap di tengah glenoid"],ref:[S(186),G(569)],tatalaksana:"nonop"}]},"glenoid-2":{intro:"Subluksasi inferior kaput humerus dapat terjadi — reduksi terbuka terutama bila *step-off* artikular > 5 mm.",ref:S(186),opsi:[{id:"orif",nama:{id:"Reduksi terbuka (anterior) + sekrup lag",en:"Open reduction (anterior) + lag screws"},gambar:"skapula:orif-glenoid",utama:["Step-off > 5 mm atau subluksasi inferior","Pendekatan anterior umumnya cukup"],ref:[S(186),G(569)],tatalaksana:"orif-glenoid"},{id:"nonop",nama:{id:"Nonoperatif + gerak dini",en:"Nonoperative + early motion"},gambar:"sling",utama:["Kaput tetap terpusat di fossa (Ideberg)"],ref:G(569),tatalaksana:"nonop"}]},"glenoid-3":{intro:"Reduksi sering sulit: perlu paparan superior untuk sekrup superior→inferior, pengangkatan sebagian klavikula atau reseksi klavikula distal selain pendekatan anterior; cincin suspensori mungkin perlu distabilkan.",ref:S(186),opsi:[{id:"orif",nama:{id:"ORIF via pendekatan superior ± anterior",en:"ORIF via superior ± anterior approach"},gambar:"skapula:orif-glenoid",utama:["Pergeseran artikular bermakna","Stabilisasi SSSC tambahan bila perlu"],ref:[S(186),G(567)],tatalaksana:"orif-glenoid"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Pergeseran minimal, kaput terpusat"],ref:G(569),tatalaksana:"nonop"}]},"glenoid-4":{intro:"Pertimbangkan reduksi terbuka untuk fraktur bergeser, terutama bila fragmen glenoid superior bergeser ke lateral.",ref:S(186),opsi:[{id:"orif",nama:{id:"Reduksi terbuka (posterior/superior)",en:"Open reduction (posterior/superior)"},gambar:"skapula:orif-glenoid",utama:["Fragmen superior bergeser lateral","Pergeseran artikular ≥ 5 mm (AO)"],ref:[S(186),G(566)],tatalaksana:"orif-glenoid"},{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Tidak bergeser"],ref:S(186),tatalaksana:"nonop"}]},"glenoid-56":{intro:"Operasi belum tentu memberi fungsi lebih baik daripada nonoperatif dengan gerak dini — dipertimbangkan bila step-off artikular > 5 mm.",ref:S(186),opsi:[{id:"nonop",nama:{id:"Nonoperatif + gerak dini",en:"Nonoperative + early motion"},gambar:"sling",utama:["Step-off < 5 mm","Pasien tua/sedenter"],ref:[S(186),G(566)],tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF — pulihkan permukaan sendi saja",en:"ORIF — restore the joint surface only"},gambar:"skapula:orif-glenoid",utama:["Step-off > 5 mm","Pada kominusi badan + glenoid: cukup rekonstruksi artikular dan sejajarkan ke tepi lateral; fragmen badan dibiarkan (AO)"],ref:[S(186),G(569)],tatalaksana:"orif-glenoid"}]},akromion:{intro:"Singkirkan dulu os acromiale dan robekan rotator cuff. Fraktur bergeser yang menyempitkan ruang subakromial difiksasi agar tidak impingement.",ref:[S(186),G(569)],opsi:[{id:"nonop",nama:{id:"Sling + gerak dini",en:"Sling + early motion"},gambar:"sling",utama:["Tipe I–II (ruang subakromial tidak menyempit)"],ref:[S(184),G(568)],tatalaksana:"nonop"},{id:"tb",nama:{id:"Tension band dorsal / sekrup lag 2.7",en:"Dorsal tension band / 2.7 lag screws"},gambar:"skapula:tension-band-akromion",utama:["Tipe III — impingement subakromial","Pendekatan superior"],ref:[S(186),G(569)],tatalaksana:"orif-prosesus"}]},korakoid:{intro:"Fraktur korakoid sentral (ligamen CC utuh) ikut bergeser bersama klavikula bila AC terdislokasi — maka kedua cedera difiksasi; perifer nonoperatif kecuali fragmen kehilangan kontak.",ref:[S(186),G(568),G(569)],opsi:[{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"sling",utama:["Tidak bergeser","Perifer tanpa kehilangan kontak (tarikan korakobrakialis)"],ref:[G(568),G(569)],tatalaksana:"nonop"},{id:"orif",nama:{id:"Sekrup lag 3.5 + stabilisasi AC",en:"3.5 lag screw + AC stabilization"},gambar:"skapula:orif-korakoid",utama:["Separasi AC derajat III + korakoid bergeser nyata (HoF)","Fraktur sentral dengan dislokasi AC (AO)"],ref:[S(186),S(187),G(568)],tatalaksana:"orif-prosesus"}]},skapulotorakal:{intro:"Cedera mengancam nyawa: pasien sering politrauma — ATLS, angiografi dan perbaikan vaskular, eksplorasi pleksus, stabilisasi tulang.",ref:S(189),opsi:[{id:"awal",nama:{id:"Tatalaksana awal & lanjutan",en:"Initial and later management"},gambar:"skapula:skapulotorakal",utama:["Angiografi → perbaikan vaskular; eksplorasi pleksus brakialis","EMG 3 minggu, mielografi/MRI 6 minggu; amputasi atas siku primer bila pleksus hancur"],ref:[S(189),S(190)],tatalaksana:"skapulotorakal"}]},intratorakal:{intro:"Reduksi tertutup lalu sling-and-swathe 2 minggu, dilanjutkan pemakaian fungsional bertahap.",ref:S(190),opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup + sling-and-swathe",en:"Closed reduction + sling and swathe"},gambar:"skapula:intratorakal",utama:["Dipastikan dengan CT toraks","Imobilisasi 2 minggu"],ref:S(190),tatalaksana:"nonop"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif",en:"Nonoperative treatment"},bab:[{judul:"Siapa",isi:"Sebagian besar fraktur skapula ekstraartikular: sling dan gerak bahu dini. Pasien tua, sedenter, atau dengan komorbiditas sebaiknya nonoperatif — indikasi operasi relatif dan diputuskan per pasien.",ref:[S(186),G(566)]},{judul:"Khusus",isi:"Leher glenoid: simtomatik dengan latihan gerak dini. Glenoid bergeser: Ideberg masih menganjurkan nonoperatif selama kaput humerus tetap terpusat di fossa. Dislokasi intratorakal: reduksi tertutup, sling-and-swathe 2 minggu, lalu pemakaian fungsional bertahap.",ref:[S(186),S(190),G(569)]},{judul:"Prognosis",isi:"Hasil Constant baik tetapi menurun pada sudut glenopolar rendah (terutama < 20°); hasil buruk 6–15% pada fraktur bergeser berat; ISS tinggi dan fraktur iga memperburuk fungsi. Malunion badan umumnya ditoleransi (krepitus skapulotorakal); nonunion sangat jarang.",ref:[S(188),G(572)]}]},"orif-glenoid":{nama:{id:"ORIF glenoid",en:"Glenoid ORIF"},bab:[{judul:"Indikasi",isi:"Fragmen tepi (anterior, inferior, posterior) dengan instabilitas sendi; pergeseran intraartikular ≥ 5 mm yang melibatkan > 25% permukaan sendi; HoF: > 25% permukaan ± subluksasi. Fraktur Bankart yang bergeser dioperasi walau kecil demi stabilitas.",ref:[S(186),G(566),G(569)]},{judul:"Pendekatan",isi:"Deltopektoral untuk tepi anterior/inferior dan korakoid — subskapularis direfleksi, artrotomi anterior, kaput disubluksasi ke posterior; kapsul ditutup anatomis dan tendon dijahit cermat. Superior untuk fragmen glenoid superior (insisi koronal antara klavikula dan spina, trapezius dibelah, takik skapula dikenali untuk melindungi n. supraskapular). Posterior (Judet atau versi sederhana lewat interval infraspinatus–teres minor) untuk tepi posterior, leher, dan badan.",ref:[S(188),G(567),G(568)]},{judul:"Fiksasi",isi:"Sekrup lag 3.5 atau 2.7 dari luar kapsul (tepi: sekrup kanselus 4.0 berulir sebagian), ditambah washer jaringan lunak; tulang lunak → sekrup cukup panjang ke korteks posterior leher. Pada kominusi badan + glenoid, cukup pulihkan permukaan sendi dan sejajarkan glenoid ke tepi lateral; fragmen badan tidak disentuh.",ref:[G(566),G(569)]},{judul:"Pascaoperasi",isi:"Tepi anterior: sling rotasi internal 2 minggu lalu gerak bertahap, rotasi eksternal penuh setelah union (6–8 minggu). Tepi posterior: bidai rotasi eksternal (*gunslinger*) 2–4 minggu. Penguatan setelah union, ± 6 minggu.",ref:G(570)},{judul:"Komplikasi",isi:"Kekakuan (terutama rotasi internal) tersering — 9 dari 234 kasus operatif; infeksi dalam jarang (0/84, 0/234); hematoma ruang periskapular; palsi n. supraskapular (terjepit fraktur atau cedera saat pendekatan) → atrofi supraspinatus/infraspinatus.",ref:G(570)}]},"orif-badan-leher":{nama:{id:"ORIF badan, leher, dan floating shoulder",en:"ORIF of body, neck and floating shoulder"},bab:[{judul:"Leher",isi:"Fragmen glenoid bergeser medial dan berotasi (sendi menghadap kaudal) memendekkan lengan kerja rotator cuff; pemendekan > 1 cm dan rotasi > 40° menjadi indikasi ORIF — plat rekonstruksi 3.5 di tepi lateral lewat pendekatan posterior.",ref:G(569)},{judul:"Badan",isi:"Jarang: eksplorasi neurovaskular (HoF) atau pergeseran 100%/angulasi > 45° (AO). Plat 1/3 tubular atau rekonstruksi 3.5 — plat kompresi terlalu tebal; di luar tepi, badan hanya menerima sekrup 12–14 mm. Posisi lateral; pendekatan Judet (insisi dari sudut posterior akromion sepanjang spina ke tepi medial sampai sudut inferior; deltoid dilepas dari spina dengan sisa jaringan untuk dijahit kembali).",ref:[S(186),S(188),G(566),G(567)]},{judul:"Floating shoulder",isi:"Fiksasi klavikula (plat rekonstruksi/LC-DCP/LCP 3.5) biasanya cukup mengembalikan stabilitas; leher glenoid difiksasi bila perlu — terutama pergeseran medial dengan pemendekan > 2 cm. Deformitas residual bersifat aditif bila beberapa fraktur bergeser sedang.",ref:[S(186),G(570),G(571)]},{judul:"Hasil",isi:"Seri 84 pasien dengan Judet ekstensil: tanpa nonunion, 3 malunion, tanpa infeksi. Mobilisasi cepat dalam sling begitu nyeri reda; penguatan setelah union.",ref:[G(570),G(572)]}]},"orif-prosesus":{nama:{id:"Fiksasi akromion dan korakoid",en:"Acromion and coracoid fixation"},bab:[{judul:"Akromion",isi:"Fraktur bergeser direduksi dan difiksasi karena malunion menimbulkan impingement rotator cuff: tension band dorsal (HoF) atau sekrup lag 2.7 / plat mini-fragmen (AO) lewat pendekatan superior. Singkirkan os acromiale dan robekan cuff lebih dulu.",ref:[S(186),G(566),G(569)]},{judul:"Spina skapula",isi:"Fraktur spina yang bergeser sering perlu operasi (risiko nonunion dan gangguan fungsi setelah malunion): plat rekonstruksi 2.7 di sisi posterior.",ref:G(568)},{judul:"Korakoid",isi:"Fraktur sentral dengan dislokasi AC: sekrup lag 3.5 pada korakoid dan sendi AC juga distabilkan; HoF: separasi AC derajat III + korakoid bergeser → ORIF keduanya. Fraktur perifer nonoperatif kecuali fragmen kehilangan kontak karena tarikan korakobrakialis. Hasil fiksasi prosesus (13 akromion, 14 korakoid): semua sembuh dengan gerak penuh tanpa nyeri.",ref:[S(186),S(187),G(568),G(569),G(572)]}]},skapulotorakal:{nama:{id:"Disosiasi skapulotorakal",en:"Scapulothoracic dissociation"},bab:[{judul:"Diagnosis",isi:"Bengkak masif bahu, lengan tak berdenyut, defisit neurologis komplet/parsial, dan pergeseran lateral skapula pada foto toraks tanpa rotasi (diagnostik). Cedera neurovaskular lazim: pleksopati komplet 80%, parsial 15%, a. subklavia/aksilaris 88%.",ref:S(189)},{judul:"Awal",isi:"Protokol ATLS; angiografi dengan perbaikan vaskular dan eksplorasi pleksus brakialis sesuai indikasi; stabilisasi cedera tulang/sendi penyerta. Bila eksplorasi awal menunjukkan pleksus hancur, pertimbangkan amputasi atas siku primer.",ref:[S(189),S(190)]},{judul:"Lanjutan",isi:"EMG pada 3 minggu; mielografi servikal atau MRI pada 6 minggu (tanda *empty sleeve*); ≥ 3 pseudomeningokel berarti prognosis buruk. Artrodesis bahu dan/atau amputasi atas siku bila lengan *flail*; avulsi radiks dan defisit komplet berprognosis buruk, cedera parsial sering pulih fungsional.",ref:S(190)},{judul:"Prognosis",isi:"Lengan flail 52%, amputasi dini 21%, kematian 10%.",ref:S(190)}]}}}});var Ts={};Oa(Ts,{default:()=>Ct});var I,Ct,Fs=ga(()=>{I=a=>({buku:"HoF",bab:"14",hlm:a}),Ct={id:"dislokasi-bahu",nama:{id:"Dislokasi glenohumeral",en:"Glenohumeral dislocation"},sumber:[{buku:"HoF",bab:"14",hlm:{awal:194,akhir:211}}],gambar:"dislokasi-bahu:anterior",intro:{id:"Sendi besar yang paling sering terdislokasi — 96% ke anterior. Yang menentukan nasib bahu adalah usia saat dislokasi pertama: rekurensi hampir 90% pada remaja, 10–15% pada usia 40.",en:"The most commonly dislocated major joint — 96% anterior. Age at first dislocation decides the shoulder's fate: recurrence is nearly 90% in teenagers and 10–15% at 40."},introRef:[I(194),I(205)],pemeriksaan:{klinis:[{teks:"Anterior: bahu ditahan sedikit abduksi–rotasi eksternal, nyeri dan spasme; bahu 'persegi' karena akromion menonjol, cekung di bawah akromion posterior, massa teraba di anterior.",ref:I(197)},{teks:"Periksa **n. aksilaris** (sensasi kulit deltoid; kontraksi deltoid sering tak dapat diuji — atoni deltoid jangan dikira cedera saraf) dan **n. muskulokutaneus** (sensasi lengan bawah anterolateral).",ref:I(197)},{teks:"Pasien yang sudah tereduksi spontan: uji apprehension — abduksi, ekstensi, rotasi eksternal memunculkan rasa akan lepas; Feagin: tekanan ke bawah pada humerus proksimal dengan siku bertumpu.",ref:[I(198),I(199)]},{teks:"Posterior: tanpa deformitas mencolok — lengan dalam posisi 'sling' (aduksi–rotasi internal); rotasi eksternal terbatas (sering < 0°), elevasi < 90°, massa posterior, bahu anterior mendatar, korakoid menonjol; **60–80%** terlewat pada pemeriksaan awal.",ref:[I(206),I(207)]},{teks:"Luxatio erecta: lengan terkunci 'memberi hormat' (abduksi 110–160°), kaput teraba di dinding dada lateral/aksila; gangguan neurovaskular hampir selalu ada.",ref:I(209)},{teks:"Pasien > 40 tahun yang tidak dapat mengangkat lengan setelah dislokasi: curigai robekan rotator cuff (35–40% pada > 40 tahun, hingga 80% pada > 60 tahun) — USG dapat dipertimbangkan pada dislokasi pertama > 40 tahun.",ref:I(196)}],radiologis:[{teks:"Seri trauma dalam bidang skapula: AP, skapular-Y, aksilar. Foto **sebelum reduksi** untuk dislokasi pertama, usia > 40 tahun, dan trauma energi tinggi (risiko fraktur penyerta).",ref:I(199)},{teks:"Tidak bisa aksilar standar → **Velpeau axillary** (tetap dalam sling, condong ke belakang 45°). **West Point** (tengkurap, 25°/25°) untuk tepi glenoid anteroinferior; **Hill-Sachs view** (AP rotasi internal maksimal); **Stryker notch** (telapak di puncak kepala, berkas 10° sefalad ke korakoid) menampilkan 90% defek posterolateral.",ref:[I(201),I(202)]},{teks:"Tanda dislokasi posterior pada AP: hilangnya tumpang tindih elips kaput–glenoid, **vacant glenoid** (celah > 6 mm), **trough sign** (reverse Hill-Sachs, 75%), hilangnya profil kolum (rotasi internal penuh), kaput 'kosong' di fossa. Aksilar paling jelas; CT mengukur persentase kaput yang terimpaksi.",ref:I(207)},{teks:"CT untuk impaksi kaput/glenoid, benda lepas, bony Bankart; artrografi untuk rotator cuff; MRI untuk cuff, kapsul, labrum.",ref:I(203)}],mekanisme:[{teks:"Anterior: tidak langsung pada abduksi–ekstensi–rotasi eksternal (tersering); benturan langsung dari posterior; kejang/sengatan listrik (biasanya posterior); laksitas → dislokasi dengan trauma minimal.",ref:[I(196),I(197)]},{teks:"Patoanatomi: kapsul robek dari glenoid (atau dari humerus — HAGL); **Bankart** = avulsi labrum anteroinferior (± fragmen tepi glenoid = bony Bankart) pada 40% bahu yang dioperasi; **Hill-Sachs** = impaksi posterolateral kaput oleh tepi glenoid — 27% dislokasi akut, 74% rekuren.",ref:I(196)},{teks:"Stabilisator pasif: konformitas, efek vakum, adhesi cairan sinovial, inklinasi skapula (0–30°), kapsul-ligamen — pita superior IGHL adalah penahan utama dislokasi anterior (rotasi eksternal pada abduksi 45–90°); aktif: biseps kaput longum, rotator cuff, stabilisator skapula.",ref:I(195)},{teks:"Posterior: aduksi–fleksi–rotasi internal (tidak langsung) atau kejang/listrik karena rotator internal (latisimus, pektoralis, subskapularis) lebih kuat; langsung dari anterior.",ref:I(206)},{teks:"Inferior: hiperabduksi — kolum humerus membentur akromion dan mengungkit kaput ke inferior; sering avulsi rotator cuff, cedera pektoralis, fraktur humerus proksimal, a. aksilaris/pleksus. Superior: gaya anterior-superior ekstrem pada lengan aduksi (jatuh dari ketinggian).",ref:[I(209),I(210)]}],epidemiologi:[{teks:"Hingga **45%** dari semua dislokasi; anterior 96%, posterior 2–4%, inferior/superior ≈ 0,5%; insiden 17/100.000/tahun; puncak laki-laki 21–30 tahun dan perempuan 61–80 tahun.",ref:I(194)},{teks:"Rekurensi 50% semua usia — hampir **89%** pada 14–20 tahun.",ref:I(194)}]},klasifikasi:[{nama:"Derajat & kronologi",teks:"Dislokasi vs subluksasi; kongenital; akut vs kronis; terkunci; rekuren; didapat (mikrotrauma berulang — renang, senam, angkat beban; labrum utuh dengan laksitas kapsul).",ref:I(203)},{nama:"Gaya & arah",teks:"Atraumatik (laksitas, tereduksi sendiri) vs traumatik (satu cedera besar, Bankart, unidireksional, perlu bantuan reduksi); volunter vs involunter; subkorakoid, subglenoid, intratorakal.",ref:I(203)},{nama:"Posterior",teks:"Etiologis: traumatik (sprain, subluksasi, dislokasi, rekuren, terkunci) vs atraumatik (volunter, kongenital, didapat). Anatomis: subakromial 98%, subglenoid, subspinous.",ref:I(207)}],kelompok:[{id:"anterior",nama:{id:"Anterior",en:"Anterior"},kode:"96%",jenis:[{id:"anterior",nama:{id:"Dislokasi anterior akut",en:"Acute anterior dislocation"},kode:"subkorakoid",gambar:"dislokasi-bahu:anterior",ringkas:"Kaput di anterior-inferior glenoid; reduksi tertutup setelah analgesia/blok/sedasi, lalu imobilisasi 2–5 minggu.",ref:[I(203),I(205)],indikasi:"anterior"},{id:"rekuren",nama:{id:"Instabilitas anterior rekuren (Bankart)",en:"Recurrent anterior instability (Bankart)"},kode:"",gambar:"dislokasi-bahu:bankart",ringkas:"Labrum anteroinferior lepas dari glenoid; rekurensi 80–92% pada usia 20 tahun, 60% pada 30, 10–15% pada 40.",ref:[I(196),I(205)],indikasi:"rekuren"},{id:"lesi-tulang",nama:{id:"Hill-Sachs & bony Bankart",en:"Hill-Sachs and bony Bankart"},kode:"",gambar:"dislokasi-bahu:hill-sachs",ringkas:"Impaksi posterolateral kaput (27% akut, 74% rekuren) dan fragmen tepi glenoid; fragmen glenoid > 5 mm adalah indikasi operasi.",ref:[I(196),I(205)],indikasi:"lesi-tulang"},{id:"cuff",nama:{id:"Dislokasi pada > 40 tahun: rotator cuff",en:"Dislocation over 40: rotator cuff"},kode:"",gambar:"dislokasi-bahu:rotator-cuff",ringkas:"Robekan cuff 35–40% pada > 40 tahun, hingga 80% pada > 60; waspada lengan yang tak bisa diangkat; imobilisasi lebih singkat karena kekakuan.",ref:[I(196),I(205)],indikasi:"anterior"}]},{id:"posterior",nama:{id:"Posterior",en:"Posterior"},kode:"2–4%",jenis:[{id:"posterior",nama:{id:"Dislokasi posterior (subakromial)",en:"Posterior dislocation (subacromial)"},kode:"98%",gambar:"dislokasi-bahu:posterior",ringkas:"Permukaan sendi menghadap posterior tanpa pergeseran kasar; tuberositas minor menempati fossa; sering disertai impaksi kaput anterior.",ref:I(207),indikasi:"posterior"},{id:"reverse-hs",nama:{id:"Reverse Hill-Sachs (impaksi anteromedial)",en:"Reverse Hill-Sachs (anteromedial impaction)"},kode:"trough sign",gambar:"dislokasi-bahu:mclaughlin",ringkas:"Defek anteromedial kaput oleh tepi glenoid posterior; persentase keterlibatan kaput (CT) menentukan: 20–40% vs > 40%.",ref:[I(207),I(208)],indikasi:"reverse-hs"}]},{id:"jarang",nama:{id:"Inferior & superior",en:"Inferior and superior"},kode:"≈ 0,5%",jenis:[{id:"inferior",nama:{id:"Luxatio erecta (inferior)",en:"Luxatio erecta (inferior)"},kode:"",gambar:"dislokasi-bahu:inferior",ringkas:"Batang humerus mengarah superior, kaput di bawah glenoid; lebih sering pada lansia; cedera neurovaskular hampir selalu menyertai.",ref:I(209),indikasi:"inferior"},{id:"superior",nama:{id:"Dislokasi superior",en:"Superior dislocation"},kode:"",gambar:"dislokasi-bahu:superior",ringkas:"Kaput di atas akromion, lengan memendek dalam aduksi; fraktur akromion/klavikula/korakoid/tuberositas dan cedera AC sering menyertai.",ref:I(210),indikasi:"superior"}]}],indikasi:{anterior:{intro:"Reduksi tertutup setelah evaluasi klinis dan analgesia, blok intraartikular, dan/atau sedasi; lalu imobilisasi 2–5 minggu — lebih singkat pada > 40 tahun (kekakuan), lebih lama pada pasien muda dengan riwayat rekurensi.",ref:[I(203),I(205)],opsi:[{id:"traksi",nama:{id:"Traksi–kontratraksi / Hippocrates",en:"Traction–countertraction / Hippocratic"},gambar:"dislokasi-bahu:traksi-kontratraksi",utama:["Metode dasar dengan asisten (kain kontratraksi)","Hippocrates: satu operator, kaki di lipatan aksila, traksi aksial + rotasi lembut"],ref:[I(203),I(204)],tatalaksana:"reduksi-anterior"},{id:"stimson",nama:{id:"Stimson / manipulasi skapula (tengkurap)",en:"Stimson / scapular manipulation (prone)"},gambar:"dislokasi-bahu:stimson",utama:["Tengkurap, lengan menggantung dengan beban 5 lb selama 15–20 menit","Manipulasi skapula: ujung inferior didorong medial-inferior"],ref:[I(204),I(205)],tatalaksana:"reduksi-anterior"},{id:"milch",nama:{id:"Milch (abduksi–rotasi eksternal)",en:"Milch (abduction–external rotation)"},gambar:"dislokasi-bahu:milch",utama:["Telentang, lengan abduksi dan rotasi eksternal, ibu jari mendorong kaput ke tempatnya","Kocher (pengungkit) tidak dianjurkan — risiko fraktur"],ref:I(205),tatalaksana:"reduksi-anterior"},{id:"op",nama:{id:"Stabilisasi operatif (Bankart artroskopik)",en:"Operative stabilization (arthroscopic Bankart)"},gambar:"dislokasi-bahu:bankart-repair",utama:["Dislokasi pertama pada laki-laki muda aktif","Interposisi jaringan lunak (tak tereduksi)","Tuberositas mayor tetap > 5 mm ke superior setelah reduksi; fragmen tepi glenoid > 5 mm"],ref:I(205),tatalaksana:"stabilisasi"}]},rekuren:{intro:"Prognosis paling ditentukan usia saat dislokasi pertama dan aktivitas pasien — bukan jenis atau lama imobilisasi. Sebagian besar rekurensi terjadi dalam 2 tahun pertama, lebih sering pada laki-laki.",ref:[I(205),I(206)],opsi:[{id:"op",nama:{id:"Perbaikan Bankart artroskopik",en:"Arthroscopic Bankart repair"},gambar:"dislokasi-bahu:bankart-repair",utama:["Perbaikan ligamen/labr
