g tinggi dan angulasi ditoleransi. Satu pengecualian penting — fraktur transversal pada anak < 3 tahun harus dicurigai sebagai kekerasan pada anak.",en:"More common in older children and almost always nonoperative: remodeling is high and angulation tolerated. One important exception — a transverse humeral fracture in a child under 3 must raise suspicion of child abuse."},introRef:[$i(394),Da(544)],pemeriksaan:{klinis:[{teks:"Evaluasi neurovaskular wajib sebelum dan sesudah manipulasi; periksa n. radialis. Pada anak yang belum bisa bicara dan rewel, evaluasi berkala untuk sindrom kompartemen.",ref:Da(544)},{teks:"Curigai **kekerasan pada anak**: fraktur humerus transversal pada anak < 3 tahun, fraktur sudut metafisis (tarikan/rotasi), riwayat tidak sesuai pola fraktur, cedera tanpa saksi, fraktur multipel dalam berbagai tahap penyembuhan, stigmata kulit (memar berbagai usia, luka bakar rokok).",ref:[Da(544),Da(545)]},{teks:"Bila ada keraguan kekerasan, anak dirawat inap dan layanan sosial dihubungi — kewajiban dokter memastikan anak berada di lingkungan aman.",ref:Da(545)}],radiologis:[{teks:"Dua proyeksi tegak lurus termasuk sendi proksimal dan distal; foto pembanding sisi sehat hanya bila ada keraguan, bukan rutin.",ref:Da(545)},{teks:"Survei skeletal pada kecurigaan kekerasan atau trauma multipel.",ref:Da(545)}],mekanisme:[{teks:"Anak sangat kecil dengan periosteum tebal: gaya torsi mematahkan diafisis sebelum fisis → fraktur spiral panjang; pada anak lebih besar torsi yang sama menghasilkan fraktur fisis.",ref:Da(544)},{teks:"Gaya bending pada anak besar → transversal atau oblik pendek, kadang fragmen kupu-kupu kecil; pada anak kecil → greenstick atau deformasi plastik.",ref:Da(544)},{teks:"Tulang anak lebih banyak air dan lebih sedikit mineral: modulus elastisitas lebih rendah, regangan sampai patah lebih besar; periosteum tebal menjadi engsel yang membantu reduksi dan mencegah over-reduksi.",ref:[Da(542),Da(543),Da(547)]}],epidemiologi:[{teks:"Fraktur diafisis humerus lebih sering pada anak yang lebih besar; sebagian besar nonoperatif karena potensi remodeling tinggi.",ref:$i(394)},{teks:"Makin dekat fraktur ke fisis, makin besar deformitas yang ditoleransi (humerus proksimal anak kecil 45–60°); deformitas rotasi tidak remodeling dan harus dihindari.",ref:Da(547)}]},klasifikasi:[{nama:"Pola",teks:"Spiral (torsi, anak kecil), transversal/oblik pendek (bending, anak besar), greenstick/deformasi plastik (bending, anak kecil).",ref:Da(544)},{nama:"Stabilitas (AO)",teks:"Stabil tak bergeser; stabil dengan angulasi < 30°; stabil dengan pergeseran yang dapat diterima — vs tak stabil bergeser yang memerlukan reduksi dalam anestesi.",ref:$i(394)}],kelompok:[{id:"pola",nama:{id:"Pola fraktur",en:"Fracture pattern"},kode:"",jenis:[{id:"spiral",nama:{id:"Spiral",en:"Spiral"},kode:"torsi",gambar:"humerus-diafisis-anak:spiral",ringkas:"Anak kecil dengan periosteum tebal: diafisis patah spiral panjang sebelum fisis.",ref:Da(544),indikasi:"umum"},{id:"transversal",nama:{id:"Transversal / oblik pendek",en:"Transverse / short oblique"},kode:"bending",gambar:"humerus-diafisis-anak:transversal",ringkas:"Anak lebih besar; kadang fragmen kupu-kupu kecil atau hanya *buckle* korteks.",ref:Da(544),indikasi:"umum"},{id:"abuse",nama:{id:"Transversal pada anak < 3 tahun",en:"Transverse in a child under 3"},kode:"tanda bahaya",gambar:"humerus-diafisis-anak:abuse",ringkas:"Kecurigaan kekerasan pada anak sampai terbukti sebaliknya — rawat inap, survei skeletal, layanan sosial.",ref:[Da(544),Da(545)],indikasi:"abuse"}]}],indikasi:{umum:{intro:"Nonoperatif (collar-and-cuff 3–4 minggu) untuk fraktur stabil tak bergeser, stabil dengan angulasi < 30°, atau pergeseran yang dapat diterima. Bila reduksi memerlukan anestesi, AO menganjurkan fiksasi definitif — ESIN.",ref:$i(394),opsi:[{id:"nonop",nama:{id:"Collar-and-cuff 3–4 minggu",en:"Collar-and-cuff 3–4 weeks"},gambar:"collar-cuff",utama:["Stabil, tak bergeser — semua usia","Stabil dengan angulasi < 30° atau pergeseran yang dapat diterima"],ref:$i(394),tatalaksana:"nonop"},{id:"esin",nama:{id:"ESIN (TEN)",en:"ESIN (TEN)"},gambar:"humerus-diafisis-anak:esin",utama:["Politrauma (termasuk anak kecil)","Anak > 10–12 tahun","Tak stabil bergeser yang memerlukan reduksi dalam anestesi"],ref:$i(394),tatalaksana:"esin"}]},abuse:{intro:"Fraktur humerus transversal pada anak < 3 tahun adalah salah satu skenario yang mewajibkan kecurigaan kekerasan; penanganan fraktur mengikuti prinsip umum, tetapi keamanan anak didahulukan.",ref:[Da(544),Da(545)],opsi:[{id:"lindungi",nama:{id:"Rawat inap + survei skeletal + layanan sosial",en:"Admit + skeletal survey + social services"},gambar:"humerus-diafisis-anak:abuse",utama:["Bila ada keraguan kekerasan: rawat inap, hubungi layanan sosial","Survei skeletal mencari fraktur lain dalam berbagai tahap penyembuhan"],ref:Da(545),tatalaksana:"abuse"},{id:"nonop",nama:{id:"Collar-and-cuff / balut ke badan",en:"Collar-and-cuff / bind to body"},gambar:"collar-cuff",utama:["Fraktur itu sendiri umumnya stabil dan sembuh cepat dengan remodeling tinggi"],ref:$i(394),tatalaksana:"nonop"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif",en:"Nonoperative treatment"},bab:[{judul:"Imobilisasi",isi:"Collar-and-cuff 3–4 minggu untuk fraktur stabil tak bergeser (semua usia), stabil dengan angulasi < 30°, atau pergeseran yang dapat diterima. Indikasi TEN pada anak besar makin meningkat karena alasan sosial-ekonomi: kenyamanan, mobilitas dini, kembali sekolah.",ref:$i(394)},{judul:"N. radialis",isi:"Cedera n. radialis bukan indikasi operasi; seperti pada dewasa, eksplorasi diperlukan bila gangguan saraf muncul setelah tindakan yang mungkin menjepit saraf.",ref:$i(394)},{judul:"Prinsip reduksi anak",isi:"Periosteum pada sisi cekung biasanya utuh dan menjadi engsel — traksi longitudinal saja tidak melepaskan fragmen; menciptakan ulang dan melebihkan deformitas secara terkontrol membebaskan fragmen. Reduksi dalam sedasi; bidai atau gips bivalve; elevasi, es, pantau kehangatan, warna, pengisian kapiler, sensasi. Deformitas rotasi tidak remodeling.",ref:Da(547)}]},esin:{nama:{id:"Elastic stable intramedullary nailing",en:"Elastic stable intramedullary nailing"},bab:[{judul:"Indikasi",isi:"Politrauma (bahkan anak kecil); anak > 10–12 tahun; fraktur tak stabil bergeser bila reduksi memerlukan anestesi — bila sudah perlu anestesi, lakukan fiksasi definitif.",ref:$i(394)},{judul:"Teknik & pascaoperasi",isi:"Metode pilihan penulis AO adalah ESIN: tanpa imobilisasi tambahan; nail intramedular dilepas setelah 3–4 bulan. Nail dimasukkan dari humerus distal lateral dengan melindungi n. radialis (seperti pada humerus proksimal).",ref:$i(394)}]},abuse:{nama:{id:"Kecurigaan kekerasan pada anak",en:"Suspected child abuse"},bab:[{judul:"Skenario yang mewajibkan kecurigaan",isi:"Fraktur femur transversal < 1 tahun atau humerus transversal < 3 tahun; fraktur sudut metafisis; riwayat tidak sesuai pola fraktur; cedera tanpa saksi; fraktur multipel berbagai tahap penyembuhan; stigmata kulit (memar berbagai usia, luka bakar rokok).",ref:[Da(544),Da(545)]},{judul:"Kewajiban",isi:"Dokter wajib memastikan anak berada di lingkungan aman: bila ada keraguan, rawat inap dan hubungi layanan sosial; survei skeletal membantu mencari fraktur lain.",ref:Da(545)}]}}}});var ar={};Oa(ar,{default:()=>Et});var da,Et,ir=ga(()=>{da=a=>({buku:"HoF",bab:"44",hlm:a}),Et={id:"suprakondiler",nama:{id:"Fraktur suprakondiler humerus",en:"Supracondylar humerus fracture"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:570,akhir:575}}],gambar:"siku-lateral:utuh",intro:{id:"Fraktur siku anak tersering (55–75%); tipe ekstensi hampir semuanya. Yang menentukan hasil: status neurovaskular dan reduksi yang stabil.",en:"The most common pediatric elbow fracture (55–75%); almost all are extension type. Outcome hinges on neurovascular status and a stable reduction."},introRef:da(574),pemeriksaan:{klinis:[{teks:"Deformitas **S** pada tipe ekstensi; **pucker sign** (lesung kulit antekubital) berarti fragmen proksimal menembus m. brakialis — reduksi tertutup mungkin sulit.",ref:da(574)},{teks:"Dokumentasikan n. medianus/interoseus anterior (OK sign), n. radialis (ekstensi ibu jari), n. ulnaris (abduksi jari), nadi radialis, capillary refill dan kehangatan tangan **sebelum dan sesudah** setiap manipulasi.",ref:da(575)},{teks:"Nadi yang hilang tetapi tangan hangat dan perfusi baik dapat diobservasi; yang menentukan adalah perfusi tangan, bukan nadi.",ref:[da(575),da(600)]},{teks:"Cari bengkak antekubital masif (sindrom kompartemen < 1%) dan laserasi (uji injeksi salin intraartikular bila ragu fraktur terbuka).",ref:da(575)}],radiologis:[{teks:"Lateral: **garis humerus anterior** harus memotong sepertiga tengah pusat osifikasi kapitulum; bentuk *teardrop*; sudut diafisis–kondilus 30–45°.",ref:da(572)},{teks:"**Fat pad posterior** hanya terangkat oleh efusi sedang–besar → sangat spesifik untuk fraktur intraartikular (kemungkinan fraktur > 70%); fat pad anterior sensitif tetapi tidak spesifik.",ref:da(572)},{teks:"AP: sudut **Baumann** (fisis kondilus lateral vs sumbu humerus; HoF 15–20°, bandingkan sisi sehat) untuk menilai varus.",ref:da(572)},{teks:"Urutan pusat osifikasi **CRITOE**: kapitulum 6 bulan–2 th, kaput radius 4 th, epikondilus medial 6–7 th, troklea 8 th, olekranon 8–10 th, epikondilus lateral 12 th.",ref:da(570)}],mekanisme:[{teks:"Jatuh pada tangan terentang dengan siku hiperekstensi; tangan pronasi → fragmen distal bergeser posteromedial (lebih sering), supinasi → posterolateral.",ref:da(574)}],epidemiologi:[{teks:"**55–75%** fraktur siku anak; tipe ekstensi **98%**, fleksi 2%; puncak usia 5–8 tahun; sisi kiri/nondominan lebih sering.",ref:da(574)},{teks:"Cedera saraf **7–10%** (medianus/AIN tersering); cedera vaskular 0,5%.",ref:da(575)}]},klasifikasi:[{nama:"Gartland (tipe ekstensi)",teks:"I tak bergeser; II bergeser dengan korteks posterior utuh (boleh berangulasi/berotasi); III bergeser total (posteromedial atau posterolateral).",ref:da(574)},{nama:"Tipe fleksi",teks:"Analog I–III dengan korteks **anterior** sebagai engsel; tipe III biasanya anterolateral dan sering perlu reduksi terbuka; n. ulnaris lebih berisiko.",ref:da(574)}],kelompok:[{id:"ekstensi",nama:{id:"Tipe ekstensi (98%)",en:"Extension type (98%)"},kode:"Gartland",jenis:[{id:"g1",nama:{id:"Gartland I — tak bergeser",en:"Gartland I — undisplaced"},kode:"Gartland I",gambar:"siku-lateral:gartland-1",ringkas:"Garis humerus anterior masih memotong kapitulum; sering hanya fat pad posterior yang terlihat.",ref:da(574),indikasi:"g1"},{id:"g2",nama:{id:"Gartland II — bergeser, korteks posterior utuh",en:"Gartland II — displaced, posterior cortex intact"},kode:"Gartland II",gambar:"siku-lateral:gartland-2",ringkas:"Fragmen distal berangulasi ke posterior dengan engsel korteks posterior; garis humerus anterior lewat di depan kapitulum.",ref:da(574),indikasi:"g2"},{id:"g3",nama:{id:"Gartland III — bergeser total",en:"Gartland III — completely displaced"},kode:"Gartland III",gambar:"siku-lateral:gartland-3",ringkas:"Tanpa kontak korteks; posteromedial lebih sering daripada posterolateral; risiko neurovaskular tertinggi.",ref:da(574),indikasi:"g3"}]},{id:"fleksi",nama:{id:"Tipe fleksi (2%)",en:"Flexion type (2%)"},kode:"Gartland (fleksi)",jenis:[{id:"fleksi",nama:{id:"Tipe fleksi — fragmen distal ke anterior",en:"Flexion type — distal fragment anterior"},kode:"I–III (fleksi)",gambar:"siku-lateral:fleksi",ringkas:"Jatuh pada siku yang fleksi; korteks anterior sebagai engsel; tipe III sering ireduksibel tertutup.",ref:da(574),indikasi:"fleksi"}]}],indikasi:{g1:{intro:"Tidak bergeser: cukup imobilisasi, tetapi periksa ulang neurovaskular setelah lengan difleksikan.",opsi:[{id:"gips",nama:{id:"Gips/splint lengan panjang",en:"Long-arm cast/splint"},gambar:"gips-lengan-panjang",utama:["Gartland I","Fleksi siku 60–90°, 2–3 minggu"],ref:da(574),tatalaksana:"gips"}]},g2:{intro:"Bergeser dengan engsel posterior: reduksi tertutup, lalu nilai apakah reduksi stabil tanpa fleksi berlebihan.",opsi:[{id:"reduksi-gips",nama:{id:"Reduksi tertutup + gips",en:"Closed reduction + cast"},gambar:"gips-lengan-panjang",utama:["Reduksi stabil pada fleksi ≤ 90°","Tanpa bengkak berat"],ref:da(574),tatalaksana:"reduksi-gips"},{id:"crpp",nama:{id:"Reduksi tertutup + pinning perkutan",en:"Closed reduction + percutaneous pinning"},gambar:"siku-ap:crpp",utama:["Reduksi tidak stabil","Reduksi hanya bertahan dengan fleksi berlebihan (risiko vaskular/kompartemen)"],ref:da(574),tatalaksana:"crpp"}]},g3:{intro:"Bergeser total: standar terapi adalah reduksi tertutup dan pinning perkutan; reduksi terbuka untuk yang ireduksibel atau dengan cedera neurovaskular.",opsi:[{id:"crpp",nama:{id:"Reduksi tertutup + pinning perkutan (standar)",en:"Closed reduction + percutaneous pinning (standard)"},gambar:"siku-ap:crpp",utama:["Gartland III yang dapat direduksi tertutup","Pin lateral divergen; pin medial hanya bila perlu, dengan proteksi n. ulnaris"],ref:[da(574),da(575)],tatalaksana:"crpp"},{id:"orif",nama:{id:"Reduksi terbuka + pin",en:"Open reduction + pinning"},gambar:"siku-ap:orif",utama:["Tidak stabil rotasi / ireduksibel (pucker sign, interposisi brakialis)","Fraktur terbuka","Cedera neurovaskular yang memerlukan eksplorasi"],ref:da(574),tatalaksana:"orif"}]},fleksi:{intro:"Tipe fleksi lebih jarang dan lebih sering ireduksibel tertutup.",opsi:[{id:"crpp",nama:{id:"Reduksi tertutup + pinning",en:"Closed reduction + pinning"},gambar:"siku-ap:crpp",utama:["Tipe I–II yang stabil setelah reduksi dalam ekstensi"],ref:da(574),tatalaksana:"crpp"},{id:"orif",nama:{id:"Reduksi terbuka + pin",en:"Open reduction + pinning"},gambar:"siku-ap:orif",utama:["Tipe III anterolateral yang ireduksibel"],ref:da(574),tatalaksana:"orif"}]}},tatalaksana:{gips:{nama:{id:"Gips/splint lengan panjang",en:"Long-arm cast/splint"},bab:[{judul:"Teknik",isi:"Siku difleksikan **60–90°** dalam gips/splint lengan panjang selama **2–3 minggu**. Setelah difleksikan, periksa ulang nadi dan perfusi: fleksi berlebihan pada siku yang bengkak dapat menekan a. brakialis.",ref:da(574)},{judul:"Tindak lanjut",isi:"Foto ulang untuk memastikan tidak ada pergeseran lanjut; setelah gips dilepas, gerak aktif; hilang gerak > 5° terjadi pada sekitar 5%.",ref:da(575)}]},"reduksi-gips":{nama:{id:"Reduksi tertutup lalu gips",en:"Closed reduction then casting"},bab:[{judul:"Urutan reduksi",isi:"Traksi longitudinal → koreksi pergeseran koronal dan rotasi → koreksi sagital dengan fleksi siku sambil mendorong olekranon ke anterior; pronasi lengan bawah untuk pergeseran posteromedial. Nilai stabilitas dengan pencitraan.",ref:da(574)},{judul:"Kapan beralih ke pin",isi:"Bila reduksi hanya bertahan dengan fleksi > 90° atau tidak stabil, pasang pin perkutan — mempertahankan fleksi berlebihan pada siku bengkak berisiko gangguan vaskular dan sindrom kompartemen. Deformitas angular (cubitus varus) **14%** dengan reduksi + gips vs **3%** dengan pin.",ref:da(575)}]},crpp:{nama:{id:"Reduksi tertutup dan pinning perkutan",en:"Closed reduction and percutaneous pinning"},bab:[{judul:"Reduksi",isi:"Traksi → koreksi koronal/rotasi → fleksi dengan dorongan anterior pada olekranon; konfirmasi AP (sudut Baumann) dan lateral (garis humerus anterior memotong kapitulum).",ref:[da(572),da(574)]},{judul:"Konfigurasi pin",isi:"Stabilisasi harus mengendalikan pergeseran koronal, sagital, dan horizontal. **Pin lateral dipasang lebih dulu** untuk stabilisasi sementara; bila pin medial diperlukan, siku diekstensikan sebelum pemasangan untuk melindungi n. ulnaris — cedera ulnaris iatrogenik terutama terjadi setelah fiksasi masuk medial.",ref:[da(574),da(575)]},{judul:"Pascaoperasi",isi:"Gips lengan panjang (atau splint posterior bila bengkak) dengan siku fleksi < 90° sesuai bengkak dan lengan bawah netral selama **3 minggu**; saat itu gips dilepas dan pin dicabut, lalu sling bila berisiko jatuh dan latihan gerak aktif. Olahraga dibatasi **3 minggu** tambahan. Periksa neurovaskular ulang setelah setiap manipulasi/splint.",ref:[da(574),da(575)]},{judul:"Komplikasi",isi:"Neurapraksia 7–10% (medianus/AIN tersering; ulnaris pada tipe fleksi atau iatrogenik pin medial) — umumnya pulih; cedera vaskular 0,5%; cubitus varus **10–20%** keseluruhan (3% dengan pin); miositis osifikans setelah manipulasi kasar/berulang.",ref:da(575)}]},orif:{nama:{id:"Reduksi terbuka dan pinning",en:"Open reduction and pinning"},bab:[{judul:"Indikasi",isi:"Fraktur yang tidak stabil rotasi, fraktur terbuka, dan fraktur dengan cedera neurovaskular. *Pucker sign* (fragmen proksimal menembus m. brakialis) memperingatkan bahwa reduksi dengan manipulasi sederhana mungkin sulit. Traksi skeletal olekranon jarang dibutuhkan — hanya untuk kominusi dengan bengkak/kerusakan jaringan lunak berat.",ref:[da(574),da(575)]},{judul:"Setelah reduksi terbuka",isi:"Fiksasi dengan pin perkutan seperti teknik tertutup; imobilisasi gips lengan panjang 3 minggu lalu pin dicabut dan gerak aktif dimulai.",ref:da(574)}]}}}});var er={};Oa(er,{default:()=>Kt});var oa,Le,Kt,nr=ga(()=>{oa=a=>({buku:"HoF",bab:"44",hlm:a}),Le=a=>({buku:"AO",bab:"4.4",hlm:a}),Kt={id:"kondilus-lateral",nama:{id:"Fraktur kondilus lateral (fisis)",en:"Lateral condylar physeal fracture"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:576,akhir:579}},{buku:"AO",bab:"4.4",hlm:{awal:398,akhir:398}}],gambar:"humerus-distal-anak:utuh",intro:{id:"Fraktur siku anak nomor dua setelah suprakondiler, tetapi hasilnya lebih sering mengecewakan: garis fraktur melewati fisis **dan** permukaan sendi, mudah terlewat bila kondilus belum terosifikasi, dan fragmen ditarik terus oleh origo ekstensor.",en:"Second only to supracondylar fractures, yet outcomes are worse more often: the line crosses the physis **and** the joint surface, it is easily missed before the condyle ossifies, and the extensor origin keeps pulling the fragment."},introRef:oa(576),pemeriksaan:{klinis:[{teks:"Berbeda dengan suprakondiler, deformitas siku biasanya **minimal**; yang menonjol adalah bengkak hematoma di sisi **lateral** humerus distal.",ref:oa(577)},{teks:"Nyeri tekan lateral, gerak nyeri, dan nyeri pada **ekstensi pergelangan melawan tahanan** (origo ekstensor melekat pada fragmen). Krepitus dapat muncul saat supinasi–pronasi, tetapi jangan dicari dengan sengaja.",ref:oa(577)}],radiologis:[{teks:"AP, lateral, dan **oblik**; foto dengan **stres varus** dapat memperjelas pergeseran.",ref:oa(577)},{teks:"Pada anak kecil yang kondilusnya belum terosifikasi, sulit membedakan fraktur kondilus lateral dari separasi seluruh fisis distal → **artrogram**. Kuncinya hubungan kondilus lateral–radius proksimal: pada fraktur kondilus lateral radius proksimal bergeser **lateral**; pada separasi transfiseal hubungan itu **tetap**, dengan radius–ulna bergeser posteromedial.",ref:oa(577)},{teks:"MRI membantu melihat arah garis fraktur dan polanya (Milch I atau II) bila foto polos meragukan.",ref:oa(577)},{teks:"Tanda tidak langsung cedera intraartikular pada siku anak: **fat pad sign**/lipohemartrosis; AO menyarankan **tidak** mengandalkan foto pembanding sisi sehat sebagai pengganti pengetahuan anatomi, dan USG makin dipakai untuk fraktur intraartikular anak kecil.",ref:Le(394)}],mekanisme:[{teks:"Teori **pull-off**: avulsi oleh origo ekstensor bersama akibat stres varus pada siku ekstensi. Teori **push-off**: jatuh pada lengan terentang, beban aksial lewat lengan bawah membuat kaput radius menghantam kondilus lateral.",ref:oa(577)},{teks:"Jaringan lunak robek di antara origo ECRL dan brakioradialis; keduanya tetap melekat pada fragmen distal yang bebas → sumber pergeseran awal dan pergeseran lanjut. Bila krista lateral troklea ikut putus (Milch II), radius–ulna tersubluksasi posterolateral → cubitus valgus; translokasi berat dapat disangka dislokasi siku primer.",ref:oa(576)}],epidemiologi:[{teks:"**17%** fraktur humerus distal anak; puncak usia **6 tahun**.",ref:oa(576)},{teks:"Tiga alasan hasil lebih buruk daripada suprakondiler: diagnosis kurang jelas dan dapat terlewat; hilang gerak lebih berat karena intraartikular; gangguan pertumbuhan lebih sering.",ref:oa(576)}]},klasifikasi:[{nama:"Milch",teks:"**I** — garis fraktur lateral dari troklea, masuk ke alur kapitulotroklea (Salter-Harris IV); troklea utuh → siku **stabil**; lebih jarang. **II** — garis masuk ke puncak troklea (Salter-Harris II); troklea rusak → siku **tidak stabil**; lebih sering.",ref:oa(577)},{nama:"Jakob (pergeseran)",teks:"**I** tak bergeser, permukaan sendi utuh. **II** bergeser sedang. **III** bergeser total dan berotasi dengan siku tidak stabil.",ref:oa(578)},{nama:"AO",teks:"Fraktur kondilus lateral humerus adalah cedera Salter-Harris **IV**; diagnosis sulit bila garis medial hanya mencapai rawan tebal, tetapi yang bergeser total biasanya mudah dikenali.",ref:Le(398)}],kelompok:[{id:"jakob",nama:{id:"Stadium pergeseran (Jakob) — menentukan terapi",en:"Displacement stage (Jakob) — decides treatment"},kode:"Jakob I–III",jenis:[{id:"j1",nama:{id:"Jakob I — tak bergeser (< 2 mm)",en:"Jakob I — undisplaced (< 2 mm)"},kode:"Jakob I",gambar:"humerus-distal-anak:jakob-1",ringkas:"Garis fraktur dari metafisis lateral melewati fisis; permukaan sendi utuh. Sekitar 40% kasus.",ref:oa(578),indikasi:"j1"},{id:"j2",nama:{id:"Jakob II — bergeser sedang",en:"Jakob II — moderately displaced"},kode:"Jakob II",gambar:"humerus-distal-anak:jakob-2",ringkas:"Fragmen bergeser tetapi belum berotasi; reduksi tertutup dapat dicoba, lalu dinilai dengan artrogram.",ref:oa(578),indikasi:"j2"},{id:"j3",nama:{id:"Jakob III — bergeser total & berotasi",en:"Jakob III — completely displaced & rotated"},kode:"Jakob III",gambar:"humerus-distal-anak:jakob-3",ringkas:"Fragmen berputar karena tarikan ekstensor; siku tidak stabil. Umumnya perlu reduksi terbuka.",ref:oa(578),indikasi:"j3"}]},{id:"milch",nama:{id:"Arah garis fraktur (Milch) — stabilitas sendi",en:"Fracture line (Milch) — joint stability"},kode:"Milch I–II",jenis:[{id:"milch-1",nama:{id:"Milch I — ke alur kapitulotroklea (SH IV)",en:"Milch I — into the capitulotrochlear groove (SH IV)"},kode:"Milch I",gambar:"humerus-distal-anak:milch-1",ringkas:"Troklea utuh → siku stabil; lebih jarang. Tatalaksana tetap mengikuti derajat pergeseran.",ref:oa(577),indikasi:"milch"},{id:"milch-2",nama:{id:"Milch II — ke puncak troklea (SH II)",en:"Milch II — into the trochlear apex (SH II)"},kode:"Milch II",gambar:"humerus-distal-anak:milch-2",ringkas:"Krista lateral troklea putus → radius–ulna dapat tersubluksasi posterolateral; lebih sering dan tidak stabil.",ref:[oa(576),oa(577)],indikasi:"milch"}]}],indikasi:{j1:{intro:"Tak bergeser atau pergeseran < 2 mm (sekitar 40% kasus): imobilisasi saja sampai menyatu, lalu gerak.",ref:oa(578),opsi:[{id:"gips",nama:{id:"Splint posterior / gips lengan panjang",en:"Posterior splint / long-arm cast"},gambar:"humerus-distal-anak:gips-lengan-panjang",utama:["Jakob I, pergeseran < 2 mm","Siku 90°, lengan bawah netral, 3 minggu"],ref:oa(578),tatalaksana:"gips"}]},j2:{intro:"Bergeser sedang: coba reduksi tertutup; bila permukaan sendi tereduksi, tahan dengan pin perkutan dan pastikan dengan artrogram. Kebanyakan Jakob II yang tidak stabil akhirnya butuh reduksi terbuka.",ref:oa(578),opsi:[{id:"crpp",nama:{id:"Reduksi tertutup + pin perkutan (artrogram)",en:"Closed reduction + percutaneous pins (arthrogram)"},gambar:"humerus-distal-anak:artrogram",utama:["Reduksi artikular tercapai dengan varus + supinasi + ekstensi","Artrogram membuktikan reduksi"],ref:oa(578),tatalaksana:"crpp"},{id:"orif",nama:{id:"Reduksi terbuka + K-wire silang divergen",en:"Open reduction + divergent crossed K-wires"},gambar:"humerus-distal-anak:pin-lateral-divergen",utama:["Reduksi artikular tertutup gagal / tidak stabil","Sekitar 60% Jakob II–III"],ref:oa(578),tatalaksana:"orif"}]},j3:{intro:"Bergeser total dan berotasi: reduksi terbuka dan fiksasi. Kecuali bila datang terlambat (> 3–6 minggu) — saat itu terapi tertutup justru lebih aman.",ref:[oa(578),oa(579)],opsi:[{id:"orif",nama:{id:"Reduksi terbuka + K-wire silang divergen",en:"Open reduction + divergent crossed K-wires"},gambar:"humerus-distal-anak:pin-lateral-divergen",utama:["Jakob III akut","Hindari diseksi posterior fragmen (satu-satunya suplai darah)"],ref:oa(578),tatalaksana:"orif"},{id:"sekrup",nama:{id:"Sekrup lag metafisis (AO)",en:"Metaphyseal lag screw (AO)"},gambar:"humerus-distal-anak:sekrup-metafisis",utama:["Fragmen metafisis cukup besar","Pendekatan lateral/posterolateral"],ref:Le(398),tatalaksana:"sekrup"},{id:"terlambat",nama:{id:"Datang terlambat (> 3–6 minggu): tertutup",en:"Late presentation (> 3–6 weeks): closed"},gambar:"humerus-distal-anak:gips-lengan-panjang",utama:["Apa pun pergeserannya","Risiko osteonekrosis & kaku bila dibuka terlambat"],ref:oa(579),tatalaksana:"terlambat"}]},milch:{intro:"Pola Milch menjelaskan stabilitas siku (troklea utuh atau tidak), tetapi pilihan terapi ditentukan oleh pergeseran (Jakob): < 2 mm imobilisasi; bergeser → reduksi + pin, kebanyakan terbuka.",ref:[oa(577),oa(578)],opsi:[{id:"gips",nama:{id:"Imobilisasi (bila < 2 mm)",en:"Immobilization (if < 2 mm)"},gambar:"humerus-distal-anak:gips-lengan-panjang",utama:["Jakob I"],ref:oa(578),tatalaksana:"gips"},{id:"orif",nama:{id:"Reduksi (tertutup/terbuka) + pin",en:"Reduction (closed/open) + pins"},gambar:"humerus-distal-anak:pin-lateral-divergen",utama:["Jakob II–III"],ref:oa(578),tatalaksana:"orif"}]}},tatalaksana:{gips:{nama:{id:"Splint posterior / gips lengan panjang",en:"Posterior splint / long-arm cast"},bab:[{judul:"Teknik",isi:"Siku fleksi **90°**, lengan bawah **netral**, dalam splint posterior atau gips lengan panjang selama **3 minggu** sampai fraktur menyatu; setelah itu latihan lingkup gerak.",ref:oa(578)},{judul:"Yang harus diwaspadai",isi:"Fragmen dapat bergeser belakangan karena tarikan ekstensor; **delayed union/nonunion** (> 12 minggu) paling sering justru pada yang dirawat nonoperatif — akibat tarikan ekstensor dan sirkulasi metafisis yang buruk — dan dapat berakhir cubitus valgus dengan **tardy ulnar nerve palsy**.",ref:[oa(576),oa(579)]}]},crpp:{nama:{id:"Reduksi tertutup + pin perkutan dengan artrogram",en:"Closed reduction + percutaneous pinning with arthrogram"},bab:[{judul:"Reduksi",isi:"Pada Jakob II, reduksi tertutup dicoba dengan **gaya varus** disertai **supinasi dan ekstensi**. Bila reduksi artikular tercapai, tahan dengan **pin perkutan** agar tidak bergeser lagi; **artrogram** dikerjakan untuk memastikan permukaan sendi benar-benar tereduksi.",ref:oa(578)},{judul:"Mengapa artrogram",isi:"Sebagian besar fragmen adalah rawan yang tidak tampak pada foto polos; artrogram menampilkan kontur rawan sendi dan membedakan fraktur kondilus lateral dari separasi transfiseal pada anak yang kondilusnya belum terosifikasi.",ref:oa(577)},{judul:"Pascaoperasi",isi:"Gips lengan panjang dengan siku fleksi 60–90°, lengan bawah netral; gips dan pin dilepas **3–6 minggu** pascaoperasi, lalu latihan gerak aktif.",ref:oa(578)}]},orif:{nama:{id:"Reduksi terbuka + dua K-wire silang divergen",en:"Open reduction + two divergent crossed K-wires"},bab:[{judul:"Indikasi",isi:"Sebagian besar Jakob II dan III yang tidak stabil (**60%**) memerlukan reduksi terbuka.",ref:oa(578)},{judul:"Teknik",isi:"Fragmen difiksasi dengan **dua K-wire halus menyilang yang divergen di metafisis**. Pin halus yang melewati fisis umumnya **tidak** menimbulkan gangguan pertumbuhan. **Jangan mendiseksi sisi posterior fragmen** — satu-satunya suplai darahnya lewat jaringan lunak di situ.",ref:oa(578)},{judul:"Pascaoperasi",isi:"Gips lengan panjang, siku fleksi **60–90°**, lengan bawah netral; gips dihentikan **3–6 minggu** pascaoperasi bersamaan dengan pencabutan pin, lalu gerak aktif.",ref:oa(578)},{judul:"Komplikasi",isi:"**Overgrowth kondilus lateral dengan spur** (cubitus pseudovarus, kosmetik) dari flap periosteum yang terosifikasi; **nonunion** → cubitus valgus → tardy ulnar palsy; **deformitas angular** (valgus lebih sering daripada varus karena arrest fisis lateral); **osteonekrosis** — terutama iatrogenik bila operasi terlambat — dapat memberi deformitas *fishtail*, biasanya tanpa sekuele klinis jangka panjang. Menurut AO, fraktur bergeser yang terlewat hampir pasti menjadi pseudartrosis → cubitus valgus dan gangguan n. ulnaris, atau cubitus varus lewat instabilitas dan overgrowth kondilus lateral.",ref:[oa(579),Le(398)]}]},sekrup:{nama:{id:"Sekrup lag metafisis atau K-wire divergen (AO)",en:"Metaphyseal lag screw or divergent K-wires (AO)"},bab:[{judul:"Pilihan implan",isi:"Fraktur yang bergeser total diterapi dengan reduksi terbuka dan fiksasi interna: **sekrup lag metafisis** bila fragmen metafisis cukup besar, atau **dua K-wire divergen** pada anak yang lebih kecil. Pendekatan lateral atau posterolateral; stabilitas sendi diperiksa setelah fiksasi.",ref:Le(398)},{judul:"Lindungi vaskularisasi",isi:"Fragmen sebagian besar berselubung rawan; suplai darahnya harus dijaga agar tidak hancur saat diseksi.",ref:Le(398)}]},terlambat:{nama:{id:"Kasus terlambat: terapi tertutup",en:"Late presentation: closed treatment"},bab:[{judul:"Alasan",isi:"Bila terapi tertunda **> 3–6 minggu**, pertimbangkan kuat terapi tertutup apa pun pergeserannya: reduksi terbuka yang terlambat membawa insidens tinggi **osteonekrosis fragmen kondilus**, kekakuan sendi berat, dan komplikasi lain.",ref:oa(579)},{judul:"Nonunion yang sudah terbentuk",isi:"Spektrum terapi nonunion kondilus lateral berkisar dari observasi (*benign neglect*) sampai osteotomi dengan fiksasi kompresi tertunda; transposisi n. ulnaris bila timbul tardy ulnar palsy akibat cubitus valgus.",ref:oa(579)}]}}}});var sr={};Oa(sr,{default:()=>Dt});var N,Fe,Dt,rr=ga(()=>{N=a=>({buku:"HoF",bab:"44",hlm:a}),Fe=a=>({buku:"AO",bab:"4.4",hlm:a}),Dt={id:"epikondilus-medial",nama:{id:"Epikondilus medial & kondilus medial",en:"Medial epicondyle & medial condyle"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:579,akhir:587}},{buku:"AO",bab:"4.4",hlm:{awal:398,akhir:398}}],gambar:"humerus-distal-anak:epikondilus-medial",intro:{id:"Dua cedera sisi medial yang sering tertukar: **apofisis epikondilus medial** (ekstraartikular, tarikan ligamen kolateral medial–fleksor, separuhnya menyertai dislokasi siku) dan **fisis kondilus medial** (intraartikular, Salter-Harris IV, jarang). Pada anak kecil yang pusat osifikasi kondilusnya belum muncul, fraktur kondilus dapat tampak seperti fraktur epikondilus saja.",en:"Two medial injuries that are often confused: the **medial epicondylar apophysis** (extra-articular, pulled by the MCL and flexors, half with elbow dislocation) and the **medial condylar physis** (intra-articular Salter-Harris IV, rare). In a young child without a condylar ossification center, a condylar fracture can masquerade as an epicondylar one."},introRef:[N(580),N(585)],pemeriksaan:{klinis:[{teks:"Nyeri, bengkak, dan nyeri tekan **medial**; diperberat oleh **fleksi pergelangan melawan tahanan**. Periksa **n. ulnaris** dengan saksama — cedera saat trauma atau akibat bengkak.",ref:N(585)},{teks:"Gerak berkurang karena nyeri; **blok mekanik** gerak menandakan fragmen epikondilus terjepit di dalam sendi. Uji instabilitas valgus dengan siku fleksi **15°** agar olekranon tidak menstabilkan.",ref:N(586)},{teks:"Kesalahan yang sering: fraktur fisis kondilus medial didiagnosis sebagai fraktur epikondilus saja. Petunjuk: dislokasi siku **sangat jarang sebelum** epifisis kondilus medial mulai terosifikasi; pada fraktur kondilus medial sering ada subluksasi **posteromedial**; **fat pad sign positif** berarti intraartikular (kondilus), sedangkan fraktur epikondilus biasanya ekstraartikular tanpa fat pad.",ref:N(580)}],radiologis:[{teks:"AP, lateral, oblik. Apofisis epikondilus medial terletak **posteromedial**, sehingga sulit terlihat pada AP yang sedikit oblik; lateral yang sedikit dioblikkan menampilkannya lebih baik.",ref:N(586)},{teks:"Apofisis yang tampak terfragmentasi dan bertumpuk pada metafisis sering disangka fraktur. **Hilangnya apofisis** pada foto standar harus memicu pencarian fragmen yang bergeser — khususnya **terjepit di sendi** — setelah foto pembanding sisi sehat.",ref:N(586)},{teks:"Foto **stres gravitasi** menunjukkan celah medial. Fat pad sign tidak andal pada fraktur epikondilus (ekstrakapsular pada anak besar; kapsul robek pada dislokasi).",ref:N(586)},{teks:"Untuk membedakan dengan fraktur fisis kondilus medial: **artrogram** atau **MRI**, terutama bila pusat osifikasi kondilus medial belum ada. Foto stres: epikondilus → laksitas **valgus** saja; kondilus → laksitas varus **dan** valgus.",ref:[N(580),N(586)]}],mekanisme:[{teks:"Epikondilus medial — **tidak langsung**: avulsi oleh ligamen kolateral ulnaris saat dislokasi siku, atau avulsi oleh fleksor karena gaya valgus–ekstensi saat jatuh, melempar bola, atau panco. **Langsung** (jarang): trauma posteromedial → fragmentasi. **Kronis**: overuse pelempar bisbol belum matang (*Little League elbow*).",ref:N(585)},{teks:"Kondilus medial — **langsung**: jatuh pada siku fleksi, takik semilunaris olekranon membelah troklea, garis menjalar ke metafisis. **Tidak langsung**: jatuh pada tangan terentang dengan valgus → avulsi dari metafisis menjalar ke permukaan sendi. Setelah lepas, fleksor lengan bawah memutar fragmen ke anterior (sagital).",ref:[N(579),N(580)]}],epidemiologi:[{teks:"Epikondilus medial: **14%** fraktur humerus distal; **50%** menyertai dislokasi siku; puncak **11–12 tahun**; laki-laki : perempuan **4 : 1**; fragmen terjepit di sendi **15–18%**.",ref:N(585)},{teks:"Kondilus medial: **< 1%** fraktur humerus distal; usia **8–14 tahun**. Menurut AO, cedera kondilus medial sangat jarang dan troklea yang terosifikasi lambat mudah disangka fraktur epikondilus.",ref:[N(579),Fe(398)]},{teks:"Epikondilus medial adalah apofisis traksi untuk ligamen kolateral medial dan fleksor pergelangan; **tidak** menyumbang panjang humerus; osifikasi mulai **4–6 tahun**, pusat terakhir yang menyatu (**15 tahun**).",ref:N(585)}]},klasifikasi:[{nama:"Epikondilus medial — akut",teks:"Tak bergeser · bergeser minimal · bergeser bermakna (**> 5 mm**) dengan fragmen proksimal dari sendi · **terjepit** di antara olekranon–troklea · fraktur melalui/fragmentasi apofisis (trauma langsung).",ref:N(586)},{nama:"Epikondilus medial — kronis",teks:"Cedera stres tarikan (*Little League elbow*).",ref:N(586)},{nama:"Kondilus medial — Milch",teks:"**I** garis melewati puncak troklea (SH II; lebih sering). **II** garis melewati alur kapitulotroklea (SH IV; jarang).",ref:N(580)},{nama:"Kondilus medial — Kilfoyle",teks:"**I** tak bergeser, permukaan sendi utuh. **II** garis lengkap dengan pergeseran minimal. **III** bergeser total dengan rotasi fragmen oleh tarikan fleksor.",ref:N(581)}],kelompok:[{id:"epikondilus",nama:{id:"Apofisis epikondilus medial (ekstraartikular)",en:"Medial epicondylar apophysis (extra-articular)"},kode:"14% · 50% dengan dislokasi",jenis:[{id:"em-minimal",nama:{id:"Tak bergeser / bergeser minimal",en:"Undisplaced / minimally displaced"},kode:"< 5 mm",gambar:"humerus-distal-anak:epikondilus-minimal",ringkas:"Apofisis masih di tempat atau bergeser sedikit; nyeri medial dan nyeri fleksi pergelangan melawan tahanan.",ref:N(586),indikasi:"em-minimal"},{id:"em-bergeser",nama:{id:"Bergeser bermakna (> 5 mm)",en:"Significantly displaced (> 5 mm)"},kode:"> 5 mm",gambar:"humerus-distal-anak:epikondilus-medial",ringkas:"Fragmen ditarik ke distal oleh fleksor/ligamen kolateral, masih di luar sendi. Keputusan operasi bergantung usia, tuntutan aktivitas, dan instabilitas valgus.",ref:[N(586),N(587)],indikasi:"em-bergeser"},{id:"em-inkarserata",nama:{id:"Fragmen terjepit dalam sendi",en:"Fragment incarcerated in the joint"},kode:"15–18%",gambar:"humerus-distal-anak:epikondilus-inkarserata",ringkas:"Fragmen tersangkut di antara olekranon dan troklea — blok mekanik gerak; sering setelah dislokasi yang tereduksi. Indikasi operasi absolut bila tak bisa dikeluarkan tertutup.",ref:[N(585),N(587)],indikasi:"em-inkarserata"}]},{id:"kondilus",nama:{id:"Fisis kondilus medial (intraartikular, SH IV)",en:"Medial condylar physis (intra-articular, SH IV)"},kode:"Kilfoyle I–III",jenis:[{id:"km-1",nama:{id:"Kilfoyle I — tak bergeser",en:"Kilfoyle I — undisplaced"},kode:"Kilfoyle I",gambar:"humerus-distal-anak:kilfoyle-1",ringkas:"Garis dari metafisis medial lewat fisis ke troklea tanpa pergeseran; permukaan sendi utuh.",ref:N(581),indikasi:"km-1"},{id:"km-2",nama:{id:"Kilfoyle II — garis lengkap, pergeseran minimal",en:"Kilfoyle II — complete, minimally displaced"},kode:"Kilfoyle II",gambar:"humerus-distal-anak:kondilus-medial",ringkas:"Fragmen troklea + metafisis medial + epikondilus bergeser sedikit; bengkak medial menyulitkan reduksi tertutup.",ref:N(581),indikasi:"km-23"},{id:"km-3",nama:{id:"Kilfoyle III — bergeser total & berotasi",en:"Kilfoyle III — displaced & rotated"},kode:"Kilfoyle III",gambar:"humerus-distal-anak:kilfoyle-3",ringkas:"Fragmen diputar oleh massa fleksor; rotasi ini menggagalkan terapi tertutup.",ref:N(581),indikasi:"km-23"}]}],indikasi:{"em-minimal":{intro:"Sebagian besar fraktur epikondilus medial dirawat tanpa operasi: meskipun 60% hanya menyatu secara fibrosa, 96% hasil fungsinya baik–sangat baik. Kuncinya gerak aktif dini.",ref:N(586),opsi:[{id:"splint-dini",nama:{id:"Splint posterior singkat → gerak aktif dini",en:"Brief posterior splint → early active motion"},gambar:"humerus-distal-anak:mobilisasi-dini",utama:["Tak bergeser / minimal","Splint 3–4 hari, lalu sling untuk kenyamanan"],ref:[N(586),N(587)],tatalaksana:"nonop"}]},"em-bergeser":{intro:"Bergeser > 5 mm: nonoperatif pada pasien lebih tua atau tuntutan rendah; operasi relatif pada pasien muda/tuntutan tinggi, atlet dengan instabilitas valgus, atau gangguan n. ulnaris. AO: pergeseran < 0,5 cm dapat diterima, > 1 cm tidak karena siku bisa menjadi tidak stabil.",ref:[N(586),N(587),Fe(398)],opsi:[{id:"nonop",nama:{id:"Nonoperatif",en:"Nonoperative"},gambar:"humerus-distal-anak:mobilisasi-dini",utama:["Pasien lebih tua / tuntutan rendah","Terima union fibrosa; fungsi tetap baik"],ref:N(586),tatalaksana:"nonop"},{id:"orif",nama:{id:"ORIF sekrup lag (± washer)",en:"ORIF lag screw (± washer)"},gambar:"humerus-distal-anak:sekrup-epikondilus",utama:["Muda / tuntutan tinggi","Instabilitas valgus pada atlet","Disfungsi n. ulnaris","AO: pergeseran > 1 cm"],ref:[N(587),Fe(398)],tatalaksana:"orif-epikondilus"}]},"em-inkarserata":{intro:"Fragmen di dalam sendi yang tidak dapat dikeluarkan adalah indikasi operasi absolut. Manuver tertutup (Roberts) boleh dicoba lebih dulu — berhasil sekitar 40%.",ref:N(587),opsi:[{id:"roberts",nama:{id:"Manuver Roberts (ekstraksi tertutup)",en:"Roberts maneuver (closed extraction)"},gambar:"humerus-distal-anak:epikondilus-inkarserata",utama:["Supinasi + stres valgus + dorsofleksi pergelangan dan jari","Berhasil ± 40%"],ref:N(587),tatalaksana:"roberts"},{id:"orif",nama:{id:"Reduksi terbuka + sekrup lag",en:"Open reduction + lag screw"},gambar:"humerus-distal-anak:sekrup-epikondilus",utama:["Fragmen tetap terjepit","Fragmen yang tak dikenali melekat ke koronoid → kaku berat"],ref:N(587),tatalaksana:"orif-epikondilus"}]},"km-1":{intro:"Kondilus medial tak bergeser: imobilisasi, lalu latihan gerak dan penguatan.",ref:N(581),opsi:[{id:"gips",nama:{id:"Gips lengan panjang / splint posterior",en:"Long-arm cast / posterior splint"},gambar:"humerus-distal-anak:gips-lengan-panjang",utama:["Kilfoyle I","Siku 90°, lengan bawah netral, 3–4 minggu"],ref:N(581),tatalaksana:"gips-kondilus"}]},"km-23":{intro:"Kilfoyle II–III: reduksi tertutup sering gagal karena bengkak medial dan rotasi fragmen; umumnya perlu reduksi terbuka dengan perlindungan n. ulnaris. Bila terlambat > 3–6 minggu, pilih terapi tertutup.",ref:[N(581),N(582)],opsi:[{id:"crpp",nama:{id:"Reduksi tertutup (ekstensi + pronasi) ± pin paralel",en:"Closed reduction (extension + pronation) ± parallel pins"},gambar:"humerus-distal-anak:pin-medial-paralel",utama:["Reduksi tercapai","Dua pin metafisis paralel bila tidak stabil"],ref:N(581),tatalaksana:"crpp-kondilus"},{id:"orif",nama:{id:"Reduksi terbuka medial + K-wire paralel / sekrup",en:"Medial open reduction + parallel K-wires / screw"},gambar:"humerus-distal-anak:pin-medial-paralel",utama:["Ireduksibel / tidak stabil (kebanyakan stadium II–III)","Sekrup cancellous pada remaja menjelang matur"],ref:N(581),tatalaksana:"orif-kondilus"},{id:"terlambat",nama:{id:"Terlambat > 3–6 minggu: tertutup",en:"Late > 3–6 weeks: closed"},gambar:"humerus-distal-anak:gips-lengan-panjang",utama:["Apa pun pergeserannya","Risiko osteonekrosis troklea & kaku bila dibuka terlambat"],ref:N(582),tatalaksana:"gips-kondilus"}]}},tatalaksana:{nonop:{nama:{id:"Nonoperatif: splint singkat lalu gerak aktif dini",en:"Nonoperative: brief splint then early active motion"},bab:[{judul:"Protokol",isi:"Splint posterior dengan siku **90°**, lengan bawah netral atau pronasi; splint dilepas **3–4 hari** setelah cedera dan gerak aktif dini dimulai; sling untuk kenyamanan. Fisioterapi agresif umumnya tidak perlu kecuali pasien tidak mampu bergerak aktif sendiri.",ref:[N(586),N(587)]},{judul:"Hasil",isi:"Walau **60%** hanya mencapai union fibrosa, **96%** hasil fungsinya baik atau sangat baik. Nonunion (hingga 60% pada pergeseran bermakna yang dirawat nonoperatif) jarang menjadi masalah fungsional.",ref:[N(586),N(587)]},{judul:"Komplikasi",isi:"**Hilang ekstensi 5–10°** pada sampai 20% kasus — alasan gerak aktif dini; **disfungsi n. ulnaris 10–16%** (hingga 50% bila fragmen terjepit); **miositis osifikans** jarang, terkait manipulasi berulang/kasar — bedakan dari kalsifikasi ektopik ligamen kolateral yang tidak membatasi gerak.",ref:N(587)}]},roberts:{nama:{id:"Manuver Roberts untuk fragmen terjepit",en:"Roberts maneuver for the incarcerated fragment"},bab:[{judul:"Teknik",isi:"Lengan bawah **disupinasi**, siku diberi **stres valgus**, lalu pergelangan dan jari **didorsofleksikan** agar fleksor teregang dan menarik fragmen keluar dari sendi. Berhasil **± 40%**.",ref:N(587)},{judul:"Bila gagal",isi:"Fragmen yang tetap terjepit melekat dan membentuk union fibrosa ke prosesus koronoid dengan kehilangan gerak bermakna; rekomendasi terkini: eksplorasi sendi dengan fiksasi/eksisi fragmen.",ref:N(587)}]},"orif-epikondilus":{nama:{id:"ORIF epikondilus medial: sekrup lag",en:"ORIF of the medial epicondyle: lag screw"},bab:[{judul:"Pendekatan",isi:"Insisi longitudinal tepat **anterior** dari epikondilus medial. **Identifikasi n. ulnaris** penting, tetapi diseksi luas atau transposisi umumnya tidak perlu. Reduksi, fiksasi sementara K-wire, lalu **sekrup lag**; **washer** bila tulang buruk atau terfragmentasi. AO: K-wire pada anak kecil, sekrup pada anak hampir matur; pastikan permukaan di atas lintasan n. ulnaris **halus**.",ref:[N(587),Fe(399)]},{judul:"Pascaoperasi",isi:"Splint posterior/gips lengan panjang, siku 90°, lengan bawah pronasi; ubah ke splint lepas-pasang atau sling pada **7–10 hari** dan mulai gerak aktif. Fisioterapi formal biasanya tidak perlu.",ref:N(587)},{judul:"Indikasi relatif (ringkasan)",isi:"Disfungsi n. ulnaris karena parut/kalus, instabilitas valgus pada atlet, pergeseran bermakna pada pasien muda/tuntutan tinggi; absolut: fragmen terjepit yang ireduksibel.",ref:N(587)}]},"gips-kondilus":{nama:{id:"Gips lengan panjang untuk kondilus medial",en:"Long-arm cast for the medial condyle"},bab:[{judul:"Protokol",isi:"Gips lengan panjang atau splint posterior, lengan bawah netral, siku **90°**, **3–4 minggu**, lalu latihan gerak dan penguatan.",ref:N(581)},{judul:"Kasus terlambat",isi:"Bila > 3–6 minggu, terapi tertutup apa pun pergeserannya: reduksi terbuka terlambat berisiko osteonekrosis troklea dan kaku berat akibat diseksi luas. Diagnosis terlambat fraktur fisis kondilus medial diterapi nonoperatif.",ref:N(582)}]},"crpp-kondilus":{nama:{id:"Reduksi tertutup kondilus medial ± pin",en:"Closed reduction of the medial condyle ± pins"},bab:[{judul:"Teknik",isi:"Reduksi dengan siku **ekstensi** dan lengan bawah **pronasi** untuk melemaskan origo fleksor, lalu splint posterior atau gips lengan panjang. Reduksi yang tidak stabil memerlukan **dua pin metafisis paralel** perkutan.",ref:N(581)},{judul:"Keterbatasan",isi:"Reduksi tertutup sering sulit karena bengkak jaringan lunak medial; stadium II–III biasanya memerlukan reduksi terbuka.",ref:N(581)}]},"orif-kondilus":{nama:{id:"Reduksi terbuka kondilus medial",en:"Open reduction of the medial condyle"},bab:[{judul:"Teknik",isi:"Pendekatan **medial** dengan identifikasi dan proteksi **n. ulnaris**. Hindari diseksi permukaan posterior fragmen dan sisi medial krista medialis troklea — jalur vaskular troklea. Fiksasi: **K-wire halus paralel** sampai metafisis, atau **sekrup cancellous** pada remaja menjelang matur. AO: terapi sama dengan kondilus lateral.",ref:[N(581),Fe(398)]},{judul:"Pascaoperasi",isi:"Gips lengan panjang, lengan bawah netral, siku 90°, **3–4 minggu**; pin dan gips dilepas, lalu gerak aktif.",ref:N(581)},{judul:"Komplikasi",isi:"**Diagnosis terlewat** (disangka fraktur epikondilus) paling sering; **nonunion** dengan deformitas varus pada fraktur bergeser yang tidak dirawat; **deformitas angular** (biasanya varus; valgus bila overgrowth); **osteonekrosis** setelah diseksi luas; **neuropati ulnaris** dini atau lambat — transposisi bila menetap.",ref:N(582)}]}}}});var lr={};Oa(lr,{default:()=>Nt});var z,tr,Nt,ur=ga(()=>{z=a=>({buku:"HoF",bab:"44",hlm:a}),tr=a=>({buku:"AO",bab:"4.4",hlm:a}),Nt={id:"transfiseal",nama:{id:"Separasi transfiseal & fraktur T-kondiler",en:"Transphyseal separation & T-condylar fracture"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:582,akhir:585}},{buku:"HoF",bab:"44",hlm:{awal:590,akhir:593}},{buku:"AO",bab:"4.4",hlm:{awal:398,akhir:398}}],gambar:"humerus-distal-anak:transfiseal-b",intro:{id:"Dua cedera 'seluruh ujung distal humerus' di dua ujung usia: **separasi transfiseal** pada bayi–balita (< 6–7 tahun; seluruh epifisis rawan bergeser posteromedial bersama radius–ulna, sering disangka dislokasi siku, dan pada bayi harus dicurigai **kekerasan pada anak**), dan **fraktur T-kondiler** pada remaja (12–13 tahun; suprakondiler + garis vertikal interkondiler yang sering hanya melewati rawan).",en:"Two 'whole distal humerus' injuries at opposite ends of childhood: **transphyseal separation** in infants and toddlers (< 6–7 years; the cartilaginous epiphysis shifts posteromedially with the radius and ulna, is often mistaken for dislocation, and in infants raises concern for **child abuse**) and the **T-condylar fracture** of adolescents (12–13 years; supracondylar plus a vertical intercondylar split often through cartilage only)."},introRef:[z(582),z(583),z(590)],pemeriksaan:{klinis:[{teks:"Transfiseal — bayi/neonatus: **pseudoparalisis** lengan, bengkak minimal, dan *muffled crepitus* karena yang patah adalah rawan lunak. Anak lebih besar: bengkak jelas, menolak memakai lengan; deformitas **lebih ringan** daripada suprakondiler karena bidang fraktur lebar; hubungan epikondilus–olekranon **tetap**.",ref:z(583)},{teks:"Periksa neurovaskular saksama — bengkak fosa kubiti dapat menekan pembuluh/saraf. Pada bayi dan anak kecil, pikirkan **kekerasan pada anak**: fisis paling sering gagal karena **gaya geser**, dan insidens transfiseal tinggi pada kasus abuse; orang tua sering **menunda** mencari pertolongan.",ref:[z(583),z(584)]},{teks:"T-kondiler: paling sering dikira suprakondiler tipe ekstensi — siku ekstensi, nyeri, gerak terbatas, deformitas bervariasi, **bengkak masif**. Bengkak antekubital masif → waspadai **sindrom kompartemen** lengan bawah; periksa medianus/radialis/ulnaris, nadi, dan isi kapiler, ulangi setelah setiap manipulasi; cari luka terbuka (uji salin intraartikular).",ref:z(591)}],radiologis:[{teks:"Transfiseal: radius dan ulna proksimal **tetap** dalam hubungan normal satu sama lain, tetapi bergeser **posteromedial** terhadap humerus distal — ini dianggap **diagnostik**. Foto pembanding sisi sehat membantu melihat pergeseran posteromedial.",ref:z(583)},{teks:"Bila kapitulum sudah terosifikasi, diagnosis lebih mudah: hubungan **kapitulum–kaput radius tetap**, sedangkan epifisis bergeser posteromedial terhadap batang. Transfiseal dengan fragmen metafisis besar dapat disangka suprakondiler rendah atau fraktur kondilus lateral — bedakan dari **garis metafisis distal yang halus** (vs tepi ireguler pada suprakondiler).",ref:z(583)},{teks:"Dislokasi siku anak jarang, dan dibedakan dari transfiseal oleh pergeseran yang terutama **posterolateral** dan hubungan kapitulum–radius yang **terputus**. **Artrogram** untuk memperjelas pola dan membedakan dari fraktur intraartikular; **MRI** untuk arah garis fraktur; **USG** pada neonatus/bayi yang belum berosifikasi.",ref:[z(583),z(584)]},{teks:"T-kondiler: AP–lateral; pembanding sisi sehat bila ragu; oblik membantu. Pada anak lebih muda komponen vertikal dapat hanya melewati rawan sehingga tampak 'murni suprakondiler' — **artrogram** bila dicurigai perluasan intraartikular; CT/MRI nilainya terbatas dan butuh sedasi, sehingga artrogram di kamar operasi lebih disukai.",ref:[z(591),z(592)]}],mekanisme:[{teks:"Transfiseal: **cedera lahir** (rotasi + hiperekstensi saat persalinan), **kekerasan pada anak** (gaya geser), dan **trauma** hiperekstensi dengan pergeseran posterior + momen rotasi. Pada anak kecil garis fisis lebih proksimal sehingga hiperekstensi menghasilkan separasi fisis, bukan fraktur suprakondiler melalui tulang.",ref:[z(582),z(583)]},{teks:"T-kondiler — **fleksi** (tersering): jatuh pada sisi posterior siku yang fleksi > 90°, tepi anterior takik semilunaris menancap ke troklea sebagai baji; fragmen kondilus bergeser **anterior**. **Ekstensi** (jarang): jatuh pada lengan terentang, prosesus koronoid menancap ke troklea; fragmen bergeser **posterior**. Pergeseran dipengaruhi tarikan origo fleksor dan ekstensor (rotasi sagital & koronal).",ref:z(591)}],epidemiologi:[{teks:"Transfiseal: sebagian besar **< 6–7 tahun**; dulu dianggap sangat jarang, dengan MRI ternyata cukup sering — insidens pasti tidak diketahui karena salah diagnosis.",ref:z(582)},{teks:"Epifisis mencakup epikondilus medial sampai usia 6–7 tahun (perempuan) / 8–9 tahun (laki-laki); makin muda, makin besar porsi humerus distal yang berupa epifisis. Celah berbentuk V antara fisis kondilus medial dan lateral melindungi epifisis pada anak lebih besar. Permukaan sendi **tidak** terlibat; suplai darah krista medialis troklea melewati fisis → risiko perubahan avaskular.",ref:z(582)},{teks:"T-kondiler: jarang, puncak **12–13 tahun**; kelangkaan pada anak kecil mungkin salah diagnosis karena fraktur rawan murni tak terlihat pada foto polos. Pada anak muda permukaan sendi dapat relatif utuh walau fragmen kondilus bergeser (rawan elastis).",ref:[z(590),z(591)]}]},klasifikasi:[{nama:"DeLee (transfiseal) — berdasarkan osifikasi kondilus lateral",teks:"**A** bayi sebelum pusat osifikasi kondilus lateral muncul (lahir–7 bulan); mudah terlewat; Salter-Harris I. **B** kondilus lateral terosifikasi (7 bulan–3 tahun); SH I atau II (serpih metafisis). **C** fragmen metafisis besar, biasanya keluar lateral (3–7 tahun).",ref:z(584)},{nama:"T-kondiler",teks:"**I** tak bergeser/bergeser minimal. **II** bergeser tanpa kominusi metafisis. **III** bergeser dengan kominusi metafisis.",ref:z(592)},{nama:"AO",teks:"Kombinasi fraktur kondilus lateral dan medial memberi fraktur **Y**, biasanya pada anak lebih besar; berbeda dengan dewasa, jarang ada kominusi intraartikular.",ref:tr(398)}],kelompok:[{id:"delee",nama:{id:"Separasi transfiseal (DeLee)",en:"Transphyseal separation (DeLee)"},kode:"DeLee A–C",jenis:[{id:"delee-a",nama:{id:"DeLee A — bayi, kapitulum belum terosifikasi",en:"DeLee A — infant, capitellum not ossified"},kode:"SH I · lahir–7 bulan",gambar:"humerus-distal-anak:transfiseal-a",ringkas:"Seluruh epifisis rawan bergeser posteromedial bersama radius–ulna; pada foto hanya tampak 'dislokasi' — mudah terlewat. Pikirkan cedera lahir atau kekerasan pada anak; USG membantu.",ref:[z(583),z(584)],indikasi:"delee-ab"},{id:"delee-b",nama:{id:"DeLee B — kapitulum terosifikasi ± serpih metafisis",en:"DeLee B — ossified capitellum ± metaphyseal fleck"},kode:"SH I/II · 7 bulan–3 tahun",gambar:"humerus-distal-anak:transfiseal-b",ringkas:"Kapitulum tetap segaris dengan kaput radius, tetapi bergeser posteromedial terhadap batang humerus.",ref:[z(583),z(584)],indikasi:"delee-ab"},{id:"delee-c",nama:{id:"DeLee C — fragmen metafisis besar",en:"DeLee C — large metaphyseal fragment"},kode:"3–7 tahun",gambar:"humerus-distal-anak:transfiseal-c",ringkas:"Fragmen metafisis lateral besar ikut epifisis; dapat disangka suprakondiler rendah atau kondilus lateral. Biasanya perlu pin perkutan.",ref:[z(583),z(584)],indikasi:"delee-c"}]},{id:"t",nama:{id:"Fraktur T-kondiler (remaja)",en:"T-condylar fracture (adolescent)"},kode:"Tipe I–III",jenis:[{id:"t1",nama:{id:"Tipe I — tak bergeser / minimal",en:"Type I — undisplaced / minimal"},kode:"Tipe I",gambar:"humerus-distal-anak:t-kondiler-1",ringkas:"Garis suprakondiler + interkondiler tanpa pergeseran; kerusakan rawan sendi bisa lebih berat daripada yang tampak.",ref:z(592),indikasi:"t1"},{id:"t2",nama:{id:"Tipe II — bergeser, metafisis tanpa kominusi",en:"Type II — displaced, no metaphyseal comminution"},kode:"Tipe II",gambar:"humerus-distal-anak:t-kondiler",ringkas:"Kedua kolom terpisah dan berotasi oleh tarikan fleksor–ekstensor.",ref:z(592),indikasi:"t23"},{id:"t3",nama:{id:"Tipe III — bergeser dengan kominusi metafisis",en:"Type III — displaced with metaphyseal comminution"},kode:"Tipe III",gambar:"humerus-distal-anak:t-kondiler",ringkas:"Kominusi metafisis menambah kesulitan rekonstruksi kolom.",ref:z(592),indikasi:"t23"}]}],indikasi:{"delee-ab":{intro:"Dikenali dini (≤ 4–5 hari): reduksi tertutup dan imobilisasi. Lewat 6–7 hari: jangan dimanipulasi — epifisis sudah tidak mobil dan manipulasi dapat mencetuskan cedera lain; splint untuk kenyamanan, sebagian besar remodel sempurna.",ref:z(584),opsi:[{id:"reduksi-gips",nama:{id:"Reduksi tertutup + imobilisasi (≤ 4–5 hari)",en:"Closed reduction + immobilization (≤ 4–5 days)"},gambar:"humerus-distal-anak:gips-lengan-panjang",utama:["Dikenali dini","Lengan bawah pronasi, siku 90°, 3 minggu"],ref:z(584),tatalaksana:"reduksi-gips"},{id:"splint-terlambat",nama:{id:"Terlambat > 6–7 hari: splint saja",en:"Late > 6–7 days: splint only"},gambar:"humerus-distal-anak:splint-posterior",utama:["Jangan dimanipulasi","Remodeling hampir selalu lengkap"],ref:z(584),tatalaksana:"splint-terlambat"},{id:"pin",nama:{id:"Pin perkutan bila tidak stabil",en:"Percutaneous pins if unstable"},gambar:"humerus-distal-anak:pin-transfiseal",utama:["Reduksi tidak stabil","Artrogram menilai reduksi"],ref:z(584),tatalaksana:"pin"}]},"delee-c":{intro:"Pola DeLee C atau cedera yang tidak stabil memerlukan pin perkutan; artrogram biasanya dikerjakan untuk menilai kecukupan reduksi.",ref:z(584),opsi:[{id:"pin",nama:{id:"Reduksi tertutup + pin perkutan + artrogram",en:"Closed reduction + percutaneous pins + arthrogram"},gambar:"humerus-distal-anak:pin-transfiseal",utama:["DeLee C","Tidak stabil setelah reduksi"],ref:z(584),tatalaksana:"pin"},{id:"orif",nama:{id:"Reduksi terbuka + pin",en:"Open reduction + pins"},gambar:"humerus-distal-anak:pin-transfiseal",utama:["Angulasi/rotasi yang tidak dapat direduksi tertutup"],ref:z(584),tatalaksana:"pin"}]},t1:{intro:"Hanya tipe I yang benar-benar tak bergeser yang boleh dirawat tertutup; periosteum tebal memberi stabilitas intrinsik. CRPP makin sering dipakai bahkan untuk tipe I karena kerusakan sendi bisa lebih berat daripada yang tampak pada foto.",ref:z(592),opsi:[{id:"splint",nama:{id:"Splint posterior dalam fleksi",en:"Posterior splint in flexion"},gambar:"humerus-distal-anak:splint-posterior",utama:["Benar-benar tak bergeser","Mobilisasi 1–4 minggu setelah cedera"],ref:z(592),tatalaksana:"splint-t"},{id:"crpp",nama:{id:"Reduksi tertutup + pin perkutan (joystick)",en:"Closed reduction + percutaneous pins (joystick)"},gambar:"humerus-distal-anak:pin-transfiseal",utama:["Tipe I bergeser minimal","Koreksi rotasi dengan joystick perkutan"],ref:z(592),tatalaksana:"crpp-t"}]},t23:{intro:"Tipe II–III: reduksi terbuka dan fiksasi interna — permukaan sendi direduksi anatomis lebih dulu, lalu metafisis direkonstruksi; osteotomi olekranon umumnya tidak perlu dan sebaiknya dihindari. Traksi skeletal olekranon hanya untuk bengkak ekstrem/jaringan lunak buruk.",ref:z(592),opsi:[{id:"orif",nama:{id:"ORIF: K-wire + sekrup kompresi + plat kolom",en:"ORIF: K-wires + compression screws + column plates"},gambar:"humerus-distal:plat-ortogonal",utama:["Tipe II–III","Posterior triceps-splitting atau triceps-sparing (Bryan–Morrey)","Plat precontoured 2,4 / 2,7 / 3,5 mm; dua plat 90°"],ref:z(592),tatalaksana:"orif-t"},{id:"traksi",nama:{id:"Traksi skeletal olekranon (sementara/definitif)",en:"Olecranon skeletal traction (temporary/definitive)"},gambar:"humerus-distal-anak:traksi-olekranon",utama:["Bengkak ekstrem / kulit rusak / kasus terlambat","2–3 minggu lalu brace engsel 2–3 minggu"],ref:z(592),tatalaksana:"traksi-t"}]}},tatalaksana:{"reduksi-gips":{nama:{id:"Reduksi tertutup dan imobilisasi (transfiseal)",en:"Closed reduction and immobilization (transphyseal)"},bab:[{judul:"Teknik",isi:"Reduksi tertutup dengan lengan bawah **pronasi** dan siku fleksi **90°** bila dikenali dini (**≤ 4–5 hari**); imobilisasi **3 minggu**, lalu gerak aktif.",ref:z(584)},{judul:"Mengapa jangan ditunda-tunda manipulasinya",isi:"Lewat **6–7 hari** fragmen epifisis tidak lagi mobil; manipulasi dapat mencetuskan cedera lain, jadi cukup splint. Sebagian besar remodel sempurna sampai matur.",ref:z(584)},{judul:"Komplikasi",isi:"**Malunion**: cubitus varus tersering, tetapi lebih jarang daripada suprakondiler karena bidang fraktur lebar membatasi angulasi. Cedera neurovaskular sangat jarang (permukaan fraktur berselubung rawan) — tetap periksa ulang setelah reduksi karena bengkak antekubital. Nonunion sangat jarang (vaskularisasi baik); osteonekrosis pada pergeseran berat atau eksplorasi terlambat.",ref:[z(584),z(585)]}]},"splint-terlambat":{nama:{id:"Kasus terlambat: splint untuk kenyamanan",en:"Late case: splint for comfort"},bab:[{judul:"Prinsip",isi:"Bila > 6–7 hari sejak cedera, **jangan manipulasi** apa pun pergeserannya; splint untuk kenyamanan. Sebagian besar fraktur **remodel sempurna** saat matur.",ref:z(584)},{judul:"Konteks sosial",isi:"Karena banyak cedera ini pada bayi/balita merupakan kekerasan pada anak, keterlambatan orang tua mencari pertolongan tidak jarang — dokumentasikan dan tangani sesuai protokol perlindungan anak.",ref:z(584)}]},pin:{nama:{id:"Pin perkutan ± reduksi terbuka (transfiseal)",en:"Percutaneous pins ± open reduction (transphyseal)"},bab:[{judul:"Indikasi",isi:"Pola **DeLee C** atau cedera yang **tidak stabil**; **artrogram** biasanya dikerjakan untuk menilai kecukupan reduksi. Angulasi/rotasi yang tidak dapat direduksi tertutup → reduksi terbuka dengan fiksasi pin.",ref:z(584)},{judul:"Pascaoperasi",isi:"Imobilisasi dengan lengan bawah **pronasi** dan siku **90°**; pin dan gips dilepas pada **3 minggu**, lalu gerak aktif.",ref:z(584)}]},"splint-t":{nama:{id:"Splint posterior (T-kondiler tipe I)",en:"Posterior splint (T-condylar type I)"},bab:[{judul:"Protokol",isi:"Hanya untuk tipe I yang **benar-benar tak bergeser**: siku difleksikan dalam splint posterior — periosteum tebal memberi stabilitas intrinsik; mobilisasi dilanjutkan **1–4 minggu** setelah cedera.",ref:z(592)}]},"crpp-t":{nama:{id:"Reduksi tertutup + pin perkutan (T-kondiler)",en:"Closed reduction + percutaneous pins (T-condylar)"},bab:[{judul:"Teknik",isi:"Dipakai makin sering untuk tipe I bergeser minimal — kerusakan sendi yang tak terlihat pada foto dapat lebih berat daripada yang tampak. Rotasi dikoreksi dengan **joystick perkutan** di fragmen, lalu beberapa **K-wire oblik** untuk fiksasi definitif; splint posterior; pin dicabut **3–4 minggu**.",ref:z(592)}]},"orif-t":{nama:{id:"ORIF T-kondiler",en:"ORIF of the T-condylar fracture"},bab:[{judul:"Pendekatan",isi:"Posterior **triceps-splitting** atau **triceps-sparing** (Bryan–Morrey). **Osteotomi olekranon** umumnya tidak diperlukan dan sebaiknya **dihindari**.",ref:z(592)},{judul:"Urutan fiksasi",isi:"Permukaan sendi direduksi anatomis dan distabilkan sementara dengan K-wire → rekonstruksi metafisis dengan kombinasi K-wire, sekrup kompresi, dan plat. Pada anak, plat precontoured kecil **2,4 / 2,7 / 3,5 mm** sesuai anatomi; tiap kolom ditopang plat, sering dua plat **90°** satu sama lain. AO: T-fraktur tidak stabil dibuka dari posterior; pada anak lebih muda, setelah kedua fragmen artikular difiksasi, K-wire sudah cukup — sendi dan fisis harus difiksasi tepat.",ref:[z(592),tr(398)]},{judul:"Pascaoperasi",isi:"Siku fleksi **5–7 hari**, lalu gerak aktif dengan cast-brace lepas-pasang.",ref:z(592)},{judul:"Komplikasi",isi:"**Kaku** (terutama ekstensi) hampir selalu ada — minimalkan dengan reduksi anatomis permukaan sendi (artrogram bila perlu) dan fiksasi stabil; cedera neurovaskular jarang (umumnya neurapraksia yang pulih); **growth arrest** parsial/total jarang bermakna karena pasien hampir matur — remodeling terbatas, reduksi anatomis harus dicapai sejak awal; **osteonekrosis troklea** pada pola kominutif.",ref:[z(592),z(593)]}]},"traksi-t":{nama:{id:"Traksi skeletal olekranon",en:"Olecranon skeletal traction"},bab:[{judul:"Indikasi & protokol",isi:"Siku fleksi **90°** untuk bengkak ekstrem, jaringan lunak terancam, atau kasus terlambat dengan cedera kulit luas yang menghalangi operasi segera. Bila definitif: traksi **2–3 minggu** sampai cukup stabil, lalu **brace engsel 2–3 minggu**.",ref:z(592)}]}}}});var kr={};Oa(kr,{default:()=>Zt});var U,ci,Zt,or=ga(()=>{U=a=>({buku:"HoF",bab:"44",hlm:a}),ci=a=>({buku:"AO",bab:"4.4",hlm:a}),Zt={id:"kaput-radius-anak",nama:{id:"Fraktur kaput & kolum radius anak",en:"Pediatric radial head & neck fracture"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:593,akhir:597}},{buku:"AO",bab:"4.4",hlm:{awal:399,akhir:400}}],gambar:"kaput-radius-anak:utuh",intro:{id:"Pada anak yang patah hampir selalu **kolum atau fisis** (90%), bukan kaput — topi rawannya tebal. Kolum radius **menoleransi angulasi, tetapi tidak menoleransi translasi**: kaput yang bergeser sedikit saja memperbesar jari-jari putarnya di dalam ligamen anular dan mengunci rotasi lengan bawah. Hasil buruk 15–23% apa pun terapinya, dan reduksi terbuka tidak lebih baik daripada tertutup — jadi tertutup dulu.",en:"In children the fracture is almost always through the **neck or physis** (90%), not the head, which wears a thick cartilage cap. The neck **tolerates angulation but not translation**: a slightly displaced head enlarges its radius of curvature inside the annular ligament and blocks forearm rotation. Poor results occur in 15–23% whatever the treatment, and open reduction is no better than closed — so closed first."},introRef:[U(593),U(596),U(597),ci(399)],pemeriksaan:{klinis:[{teks:"Bengkak **lateral** siku, nyeri bertambah saat gerak terutama **supinasi–pronasi**; krepitus dapat teraba saat rotasi.",ref:U(594)},{teks:"Pada anak kecil keluhan utama bisa **nyeri pergelangan tangan** (nyeri alih) — tekanan pada radius proksimal memperberatnya.",ref:U(594)},{teks:"Cari fraktur penyerta yang sering: **olekranon, koronoid, epikondilus medial**; sebagian terjadi bersama dislokasi siku (cedera saat dislokasi atau saat reduksi).",ref:[U(593),U(595)]}],radiologis:[{teks:"AP dan lateral siku; oblik membantu. Pada siku fleksi yang nyeri: **dua foto tegak lurus** — satu tegak lurus batang humerus, satu tegak lurus radius proksimal. **Radiocapitellar (Greenspan) view**: lateral oblik dengan sinar 45° ke proksimal memproyeksikan kaput radius di depan koronoid.",ref:U(594)},{teks:"**Supinator fat pad** positif menandai cedera radius proksimal, tetapi sebagian besar kolum **ekstrakapsular**, sehingga efusi/fat pad sering **negatif**. Foto pembanding membantu; **artrogram** bila garis fraktur dicurigai melewati bagian yang belum terosifikasi; MRI untuk pola garis fraktur.",ref:[U(593),U(594)]},{teks:"Epifisis radius proksimal mulai terosifikasi **4–6 tahun** sebagai inti pipih kecil; bisa sferis atau **bipartit** — varian normal dikenali dari tepi halus membulat tanpa diskontinuitas korteks. Angulasi normal kaput terhadap kolum **0–15° lateral**, 10° anterior sampai 5° posterior.",ref:U(593)},{teks:"AO: diagnosis hanya sulit sebelum osifikasi; tanda tidak langsung pada foto dan **USG** membantu. Suplai darah kaput radius menyerupai kaput femur dan terancam pada fraktur bergeser → gangguan pertumbuhan, bahkan nekrosis avaskular.",ref:ci(399)}],mekanisme:[{teks:"**Tidak langsung** (tersering): jatuh pada tangan terentang, beban aksial lewat radius proksimal menghantam kapitulum (cedera **valgus**). **Langsung** jarang karena tertutup massa jaringan lunak.",ref:U(593)},{teks:"**Kronis**: stres berulang lempar atas kepala — kebanyakan *Little League elbow* adalah cedera tarikan epikondilus medial, tetapi kompresi valgus dapat menimbulkan gangguan osteokondrotik kaput radius atau deformitas angular kolum.",ref:U(593)},{teks:"Tidak ada ligamen yang melekat langsung ke kaput/kolum radius; ligamen kolateral radialis melekat ke **ligamen orbikular (anular)** yang berasal dari ulna.",ref:U(593)}],epidemiologi:[{teks:"**5–8,5%** fraktur siku anak; **90%** mengenai fisis atau kolum; puncak **9–10 tahun**. AO: radius proksimal ± **10–15%** fraktur siku anak; fraktur kaput sejati (SH III/IV) jarang dan harus dikoreksi operatif karena berisiko gangguan pertumbuhan bermakna.",ref:[U(593),ci(399)]},{teks:"Prognosis: **15–23%** hasil buruk apa pun terapinya. Prediktor hasil baik: usia **< 10 tahun**, cedera terisolasi, jaringan lunak minimal, reduksi baik, angulasi awal **< 30°**, pergeseran awal **< 3 mm**, terapi tertutup, dan terapi dini.",ref:U(597)}]},klasifikasi:[{nama:"O'Brien (angulasi)",teks:"**I** < 30°. **II** 30–60°. **III** > 60°.",ref:U(594)},{nama:"Wilkins (mekanisme)",teks:"Cedera **valgus** (jatuh pada tangan, kompresi; deformitas angular kaput): **A** fisis Salter-Harris I/II; **B** intraartikular SH III/IV; **C** garis seluruhnya di metafisis. Fraktur bersama **dislokasi siku**: cedera saat reduksi atau saat dislokasi.",ref:[U(594),U(595)]},{nama:"Batas AO",teks:"Kolum menoleransi angulasi dengan baik tetapi pergeseran buruk: < 10 tahun angulasi **40–50°** dapat diterima; > 10 tahun pertimbangkan koreksi bila > **30°**.",ref:ci(399)}],kelompok:[{id:"obrien",nama:{id:"Derajat angulasi (O'Brien) — penentu terapi",en:"Angulation (O'Brien) — decides treatment"},kode:"O'Brien I–III",jenis:[{id:"ob1",nama:{id:"O'Brien I — angulasi < 30°",en:"O'Brien I — angulation < 30°"},kode:"< 30°",gambar:"kaput-radius-anak:obrien-1",ringkas:"Kaput sedikit miring pada kolum; rotasi biasanya tetap bebas setelah sembuh.",ref:U(594),indikasi:"ob1"},{id:"ob2",nama:{id:"O'Brien II — angulasi 30–60°",en:"O'Brien II — angulation 30–60°"},kode:"30–60°",gambar:"kaput-radius-anak:obrien-2",ringkas:"Perlu reduksi manipulatif tertutup (Patterson, Israeli, atau Esmarch); pin bila tidak stabil.",ref:[U(594),U(595)],indikasi:"ob2"},{id:"ob3",nama:{id:"O'Brien III — angulasi > 60°",en:"O'Brien III — angulation > 60°"},kode:"> 60°",gambar:"kaput-radius-anak:obrien-3",ringkas:"Indikasi reduksi terbuka bila tertutup gagal; coba dulu reduksi perkutan/intrameduler (Métaizeau).",ref:[U(594),U(596)],indikasi:"ob3"},{id:"translasi",nama:{id:"Translasi > 4 mm / pergeseran medial",en:"Translation > 4 mm / medial displacement"},kode:"> 4 mm",gambar:"kaput-radius-anak:translasi",ringkas:"Translasi mengganggu putaran kaput di dalam ligamen anular; pergeseran medial terkenal sulit direduksi tertutup.",ref:[U(596),ci(399)],indikasi:"ob3"}]},{id:"wilkins",nama:{id:"Pola anatomi (Wilkins)",en:"Anatomic pattern (Wilkins)"},kode:"Wilkins A–C",jenis:[{id:"wa",nama:{id:"Wilkins A — fisis (SH I/II)",en:"Wilkins A — physeal (SH I/II)"},kode:"SH I/II",gambar:"kaput-radius-anak:wilkins-a",ringkas:"Separasi fisis dengan atau tanpa serpih metafisis; kaput miring pada fisis.",ref:U(594),indikasi:"wilkins"},{id:"wb",nama:{id:"Wilkins B — intraartikular (SH III/IV)",en:"Wilkins B — intra-articular (SH III/IV)"},kode:"SH III/IV",gambar:"kaput-radius-anak:wilkins-b",ringkas:"Garis masuk ke permukaan sendi kaput; AO: fraktur kaput sejati jarang dan harus dikoreksi operatif.",ref:[U(594),ci(399)],indikasi:"wilkins-b"},{id:"wc",nama:{id:"Wilkins C — metafisis (kolum)",en:"Wilkins C — metaphyseal (neck)"},kode:"metafisis",gambar:"kaput-radius-anak:wilkins-c",ringkas:"Garis fraktur seluruhnya di metafisis kolum; terapi mengikuti derajat angulasi.",ref:U(594),indikasi:"wilkins"}]}],indikasi:{ob1:{intro:"Angulasi < 30°: imobilisasi singkat saja, lalu gerak dini.",ref:U(595),opsi:[{id:"imobilisasi",nama:{id:"Collar-and-cuff / splint / gips 7–10 hari",en:"Collar-and-cuff / splint / cast 7–10 days"},gambar:"kaput-radius-anak:collar-cuff",utama:["O'Brien I (< 30°)","Gerak dini setelah 7–10 hari"],ref:U(595),tatalaksana:"imobilisasi"}]},ob2:{intro:"Angulasi 30–60°: reduksi tertutup manipulatif; bila tidak stabil setelah reduksi, fiksasi K-wire perkutan.",ref:[U(595),U(596)],opsi:[{id:"reduksi",nama:{id:"Reduksi tertutup (Patterson / Israeli / Esmarch)",en:"Closed reduction (Patterson / Israeli / Esmarch)"},gambar:"kaput-radius-anak:reduksi-patterson",utama:["O'Brien II","Gips lengan panjang pronasi 90°, 10–14 hari"],ref:[U(595),U(596)],tatalaksana:"reduksi"},{id:"pin",nama:{id:"Pin perkutan (joystick + K-wire oblik)",en:"Percutaneous pins (joystick + oblique K-wire)"},gambar:"kaput-radius-anak:pin-oblik",utama:["Tidak stabil setelah reduksi tertutup","Gips 3 minggu lalu pin dicabut"],ref:U(596),tatalaksana:"pin"},{id:"metaizeau",nama:{id:"Reduksi intrameduler Métaizeau (ESIN)",en:"Métaizeau intramedullary reduction (ESIN)"},gambar:"kaput-radius-anak:metaizeau",utama:["Alternatif ekstrakapsular sebelum membuka sendi","AO: reduksi terbuka jarang perlu bila cara ini dipakai"],ref:[U(596),ci(400)],tatalaksana:"metaizeau"}]},ob3:{intro:"Angulasi > 60°, ireduksibel tertutup, translasi > 4 mm, atau pergeseran medial: indikasi reduksi terbuka — tetapi hasil terbuka tidak lebih baik daripada tertutup, jadi coba reduksi tertutup/perkutan/Métaizeau lebih dulu. Jangan eksisi kaput pada anak.",ref:[U(596),ci(400)],opsi:[{id:"metaizeau",nama:{id:"Métaizeau (ESIN dari metafisis distal)",en:"Métaizeau (ESIN from the distal metaphysis)"},gambar:"kaput-radius-anak:metaizeau",utama:["Coba sebelum reduksi terbuka","Fraktur bergeser total: tambah joystick K-wire tebal/Steinmann"],ref:[U(596),ci(400)],tatalaksana:"metaizeau"},{id:"orif",nama:{id:"Reduksi terbuka + K-wire oblik",en:"Open reduction + oblique K-wire"},gambar:"kaput-radius-anak:reduksi-terbuka",utama:["Ireduksibel tertutup","> 60°, translasi > 4 mm, pergeseran medial","Pin transkapitelar dikontraindikasikan"],ref:U(596),tatalaksana:"orif"}]},wilkins:{intro:"Pola Wilkins A dan C diterapi menurut derajat angulasi dan translasi (O'Brien): < 30° imobilisasi; 30–60° reduksi tertutup ± pin; > 60° atau translasi > 4 mm → Métaizeau/terbuka.",ref:[U(595),U(596)],opsi:[{id:"imobilisasi",nama:{id:"Imobilisasi singkat (< 30°)",en:"Brief immobilization (< 30°)"},gambar:"kaput-radius-anak:collar-cuff",utama:["Angulasi < 30°"],ref:U(595),tatalaksana:"imobilisasi"},{id:"reduksi",nama:{id:"Reduksi tertutup ± pin (30–60°)",en:"Closed reduction ± pins (30–60°)"},gambar:"kaput-radius-anak:reduksi-israeli",utama:["Angulasi 30–60°"],ref:[U(595),U(596)],tatalaksana:"reduksi"},{id:"metaizeau",nama:{id:"Métaizeau / terbuka (> 60°, translasi)",en:"Métaizeau / open (> 60°, translation)"},gambar:"kaput-radius-anak:metaizeau",utama:["Angulasi > 60° atau translasi > 4 mm"],ref:[U(596),ci(400)],tatalaksana:"metaizeau"}]},"wilkins-b":{intro:"Fraktur intraartikular kaput (SH III/IV) jarang; menurut AO harus dikoreksi operatif karena risiko gangguan pertumbuhan yang bermakna — reduksi anatomis permukaan sendi dengan fiksasi pin oblik yang menghindari kapitulum.",ref:ci(399),opsi:[{id:"orif",nama:{id:"Reduksi (tertutup bila mungkin, bila tidak terbuka) + K-wire oblik",en:"Reduction (closed if possible, else open) + oblique K-wire"},gambar:"kaput-radius-anak:pin-oblik",utama:["SH III/IV bergeser","Lindungi suplai darah kaput"],ref:[U(596),ci(399)],tatalaksana:"orif"}]}},tatalaksana:{imobilisasi:{nama:{id:"Imobilisasi singkat lalu gerak dini",en:"Brief immobilization then early motion"},bab:[{judul:"Protokol",isi:"O'Brien I (< 30°): **collar-and-cuff**, splint posterior, atau gips lengan panjang **7–10 hari**, lalu latihan gerak dini.",ref:U(595)},{judul:"Komplikasi yang tetap mungkin",isi:"Hilang gerak (urutan tersering: **pronasi, supinasi, ekstensi, fleksi**) karena inkongruensi dan perlekatan fibrosa; **overgrowth kaput radius 20–40%** akibat hiperemia; penutupan fisis dini jarang memendekkan > 5 mm tetapi dapat menambah cubitus valgus.",ref:U(597)}]},reduksi:{nama:{id:"Reduksi tertutup manipulatif",en:"Closed manipulative reduction"},bab:[{judul:"Patterson",isi:"Asisten memegang lengan atas dengan satu tangan menahan sisi **medial** humerus distal. Operator menarik ke distal dengan siku **ekstensi** dan lengan bawah **supinasi**, memberi gaya **varus** untuk membuka sisi lateral sendi dan melepaskan fragmen, lalu **tekanan jari langsung pada kaput** yang miring menyelesaikan reduksi.",ref:U(595)},{judul:"Israeli (fleksi–pronasi)",isi:"Siku fleksi **90°**; ibu jari operator menekan kaput radius yang bergeser (radius distal biasanya dalam supinasi), lalu lengan bawah **dipronasi** penuh sehingga batang 'berayun' ke bawah kolum untuk reduksi.",ref:U(596)},{judul:"Chambers (Esmarch)",isi:"Balut Esmarch dari distal ke proksimal; tekanan sirkumferensial mereduksi radius.",ref:U(596)},{judul:"Setelah reduksi",isi:"Gips lengan panjang dalam **pronasi** dengan fleksi **90°** selama **10–14 hari**, lalu latihan gerak. Bila tidak stabil → pin perkutan.",ref:U(596)}]},pin:{nama:{id:"Pin perkutan: joystick + K-wire oblik",en:"Percutaneous pinning: joystick + oblique K-wire"},bab:[{judul:"Teknik",isi:"O'Brien II yang tidak stabil setelah reduksi: **Steinmann pin** ditancapkan ke fragmen di bawah fluoroskopi sebagai *joystick* untuk manipulasi, lalu **K-wire oblik** untuk fiksasi. Gips lengan panjang pronasi 90° selama **3 minggu**; pin dan gips dilepas, gerak aktif dimulai.",ref:U(596)},{judul:"Larangan",isi:"**Pin transkapitelar dikontraindikasikan** — sering patah dan merusak permukaan sendi bahkan dengan gerak pascaoperasi yang kecil.",ref:U(596)}]},metaizeau:{nama:{id:"Reduksi intrameduler Métaizeau",en:"Métaizeau intramedullary reduction"},bab:[{judul:"Prinsip",isi:"Reduksi **ekstrakapsular**: K-wire atau paku elastis fleksibel dimasukkan ke kanal meduler lewat **metafisis distal** radius, lalu ujungnya yang bengkok diputar untuk 'mengangkat' dan mereduksi kaput. AO: reduksi terbuka **jarang** diperlukan bila cara ini dipakai; pada fraktur bergeser total, tambahkan K-wire tebal/Steinmann perkutan sebagai joystick untuk reduksi parsial lebih dulu.",ref:[U(596),ci(400)]},{judul:"Pascaoperasi",isi:"AO: tidak perlu gips; latihan rotasi lengan bawah dimulai **segera**.",ref:ci(400)}]},orif:{nama:{id:"Reduksi terbuka + K-wire oblik",en:"Open reduction + oblique K-wire"},bab:[{judul:"Indikasi",isi:"Ireduksibel tertutup, tipe III (> 60°), translasi **> 4 mm**, dan pergeseran medial. Reduksi terbuka dengan fiksasi **K-wire oblik**; hasil terbuka tidak berbeda bermakna dari tertutup, maka tertutup bila memungkinkan.",ref:U(596)},{judul:"Jangan eksisi kaput",isi:"Eksisi kaput radius pada anak memberi hasil buruk: **cubitus valgus** dan deviasi radial pergelangan karena pertumbuhan berlanjut.",ref:U(596)},{judul:"Komplikasi",isi:"**Osteonekrosis kaput 10–20%** (70% di antaranya setelah reduksi terbuka); **sinostosis radioulnar** — komplikasi paling serius, biasanya setelah diseksi luas, juga dilaporkan setelah manipulasi tertutup dan terkait penundaan > 5 hari; neurapraksia **n. interoseus posterior** — saat eksposur, pronasi memindahkan PIN ke ulnar menjauhi lapangan; **miositis osifikans** sampai 32% (terutama supinator).",ref:U(597)}]}}}});var dr={};Oa(dr,{default:()=>Gt});var la,Gt,pr=ga(()=>{la=a=>({buku:"HoF",bab:"44",hlm:a}),Gt={id:"olekranon-anak",nama:{id:"Fraktur olekranon anak",en:"Pediatric olecranon fracture"},sumber:[{buku:"HoF",bab:"44",hlm:{awal:603,akhir:605}}],gambar:"olekranon-anak:utuh",intro:{id:"Olekranon anak bersifat metafisis dengan korteks tipis (cenderung **greenstick**), periosteum tebal yang menahan pemisahan fragmen, dan rawan epifisis yang menjadi bantalan. Kuncinya: tentukan **mekanisme** (fleksi, ekstensi, geser) dan apakah **periosteum posterior utuh** — itu yang menentukan stabil atau tidak.",en:"The pediatric olecranon is metaphyseal with a thin cortex (prone to **greenstick** failure), a thick periosteum that limits separation, and cushioning epiphyseal cartilage. Decide the **mechanism** (flexion, extension, shear) and whether the **posterior periosteum is intact** — that decides stability."},introRef:[la(603),la(604)],pemeriksaan:{klinis:[{teks:"Bengkak di atas olekranon; **abrasi/kontusio** tepat di atasnya menunjukkan cedera tipe fleksi.",ref:la(604)},{teks:"Ekstensi aktif dapat hilang, tetapi sulit dinilai pada anak cemas dengan siku bengkak.",ref:la(604)},{teks:"Nilai apakah **periosteum posterior utuh**: defek yang teraba atau fragmen yang memisah saat siku difleksikan berarti tidak stabil → pertimbangkan fiksasi.",ref:la(604)}],radiologis:[{teks:"AP dan lateral siku. Garis fraktur tipe fleksi **tegak lurus** sumbu panjang olekranon — membedakannya dari sisa garis fisis yang **oblik** mengarah proksimal-anterior.",ref:la(604)},{teks:"Garis fraktur longitudinal pada cedera ekstensi sulit terlihat. Teliti fraktur penyerta, terutama **radius proksimal** (20% kasus disertai fraktur/dislokasi lain).",ref:[la(603),la(604)]}],mekanisme:[{teks:"**Fleksi**: siku semifleksi, tarikan triseps dan brakialis menegangkan korteks posterior — sendiri atau bersama pukulan langsung → fraktur **transversal**.",ref:la(603)},{teks:"**Ekstensi**: lengan ekstensi, olekranon terkunci di fosa; gaya **varus/valgus** memusatkan tegangan di bagian distal olekranon → fraktur **greenstick ekstraartikular** yang dapat meluas ke proksimal koronoid.",ref:la(603)},{teks:"**Geser (shear)**: gaya langsung pada olekranon posterior → korteks **anterior** gagal karena tegangan; fragmen distal ditarik ke **anterior** oleh brakialis dan biseps. Berbeda dengan tipe fleksi karena periosteum posterior **utuh**.",ref:[la(603),la(604)]}],epidemiologi:[{teks:"**5%** fraktur siku anak; puncak **5–10 tahun**; **20%** disertai fraktur/dislokasi lain, tersering radius proksimal.",ref:la(603)},{teks:"Korteks tipis (greenstick), periosteum tebal (membatasi pemisahan dibandingkan dewasa), rawan epifisis banyak (meredam pukulan langsung).",ref:la(603)}]},klasifikasi:[{nama:"Berdasarkan mekanisme",teks:"**Grup A** cedera fleksi. **Grup B** cedera ekstensi: B1 pola valgus, B2 pola varus. **Grup C** cedera geser.",ref:la(604)}],kelompok:[{id:"fleksi",nama:{id:"Grup A — fleksi (transversal)",en:"Group A — flexion (transverse)"},kode:"A",jenis:[{id:"a-tak",nama:{id:"Fleksi, tak bergeser",en:"Flexion, undisplaced"},kode:"A",gambar:"olekranon-anak:fleksi-tak-bergeser",ringkas:"Garis transversal tegak lurus sumbu olekranon; periosteum menahan fragmen.",ref:la(604),indikasi:"a-tak"},{id:"a-geser",nama:{id:"Fleksi, bergeser / kominutif",en:"Flexion, displaced / comminuted"},kode:"A",gambar:"olekranon-anak:fleksi",ringkas:"Fragmen proksimal ditarik triseps; defek teraba atau fragmen memisah saat fleksi → tidak stabil.",ref:[la(604),la(605)],indikasi:"a-geser"}]},{id:"ekstensi",nama:{id:"Grup B — ekstensi (greenstick varus/valgus)",en:"Group B — extension (greenstick varus/valgus)"},kode:"B1–B2",jenis:[{id:"b1",nama:{id:"B1 — pola valgus",en:"B1 — valgus pattern"},kode:"B1",gambar:"olekranon-anak:ekstensi-valgus",ringkas:"Greenstick ekstraarti
